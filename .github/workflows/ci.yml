name: Normal command report and original resource gates
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: normal-report-resource-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'hashgraph-online/hol-guard' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-normal-report-resource'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: a3f01e2553d96fe20aaedf4657528d5ba7b13f0d
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install locked dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python '3.12'
      - name: Secure managed interpreter permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Generate and check the normal report
        working-directory: source
        run: uv run --no-sync python ../diagnostic/scripts/guard-normal-report-resource-diagnostic.py generate 3.12
      - name: Retain verified generated report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-normal-generated-report
          path: ${{ runner.temp }}/guard-normal-report-resource/export/
          if-no-files-found: error
          retention-days: 1
      - name: Retain closed generator receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-normal-generator-receipt
          path: ${{ runner.temp }}/guard-normal-report-resource/summary.json
          if-no-files-found: error
          retention-days: 1

  resource:
    needs: generate
    if: github.repository == 'hashgraph-online/hol-guard' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-normal-report-resource'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout immutable product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: a3f01e2553d96fe20aaedf4657528d5ba7b13f0d
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install locked dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure managed interpreter permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Download this run's verified report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: guard-normal-generated-report
          path: ${{ runner.temp }}/guard-normal-report-resource/input/
      - name: Run the original two-environment resource test
        working-directory: source
        run: uv run --no-sync python ../diagnostic/scripts/guard-normal-report-resource-diagnostic.py resource ${{ matrix.python }}
      - name: Retain closed resource receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-original-resource-${{ matrix.python }}
          path: ${{ runner.temp }}/guard-normal-report-resource/summary.json
          if-no-files-found: error
          retention-days: 1
