name: Context selection epoch baseline
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    if: github.ref == 'refs/heads/hgp/diagnostic-context-selection-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.13"]
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable diagnostic source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = 9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12
          test "$(git rev-parse HEAD:tests/test_native_policy_context_epoch.py)" = d74a7813d478d69eb627d21dcbd3acdb8e40be7b
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_authority_read.py)" = 9dac9c06033f2c354a3fd0c174760006fa926a73
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scoped.py)" = 9b59002f683443f190e6535bbdd66cddf525a1d0
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot.py)" = b3ae0ad5c7f458c824032cbd08d28b9ba1ae111c
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py)" = a43d4d06fcfe41ffc23379ee747e72251b776fd2
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py)" = 02ced2e1d4ada9e6c7520563abb02c518ca01355
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_v3_renewal.py)" = a389271a7c52ea51ec119fb94251b9c58344f03d
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py)" = 186102bbe8f52f8a4fd2ae50ba36235c7b628fde
          test "$(git hash-object tests/native_policy_snapshot_test_fixtures.py)" = e6809fc5e6b09590a63698e8d8bfef597252b9f4
          test "$(git hash-object tests/test_native_policy_snapshot_v3_publisher.py)" = b73e7f4ed86dd69d0f2ffc0924dbb493fe0c123f
          test "$(git hash-object tests/test_native_policy_snapshot_publisher.py)" = c4ad2122cc3aa021ee9ae836f119e2c24bc12ad6
          test "$(git hash-object tests/test_native_policy_snapshot_persistence.py)" = f4a82792fa049724f2fd1133d43aa20aa59cbefb
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object pyproject.toml)" = 64a0281ee6b4f57a74cab68ac992fec3d782a6bb
          test "$(git hash-object uv.lock)" = 10e18a310e63ba3c5940e25b44269d48dfc7f2da
          git diff --exit-code
          git diff --cached --exit-code
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/context-epoch-changed.txt"
          printf '%s\n' .github/workflows/ci.yml tests/test_native_policy_context_epoch.py > "$RUNNER_TEMP/context-epoch-expected.txt"
          cmp "$RUNNER_TEMP/context-epoch-changed.txt" "$RUNNER_TEMP/context-epoch-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install frozen test dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        id: interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check formatting and imports
        run: |
          test "$(uv run --no-sync ruff --version)" = "ruff 0.15.17"
          uv run --no-sync ruff check tests/test_native_policy_context_epoch.py
          uv run --no-sync ruff format --check tests/test_native_policy_context_epoch.py
      - name: Run current and superseded context selection controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
            tests/test_native_policy_context_epoch.py \
            --tb=short
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git hash-object tests/test_native_policy_context_epoch.py)" = d74a7813d478d69eb627d21dcbd3acdb8e40be7b
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_authority_read.py)" = 9dac9c06033f2c354a3fd0c174760006fa926a73
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scoped.py)" = 9b59002f683443f190e6535bbdd66cddf525a1d0
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot.py)" = b3ae0ad5c7f458c824032cbd08d28b9ba1ae111c
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py)" = a43d4d06fcfe41ffc23379ee747e72251b776fd2
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py)" = 02ced2e1d4ada9e6c7520563abb02c518ca01355
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_v3_renewal.py)" = a389271a7c52ea51ec119fb94251b9c58344f03d
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py)" = 186102bbe8f52f8a4fd2ae50ba36235c7b628fde
          test "$(git hash-object tests/native_policy_snapshot_test_fixtures.py)" = e6809fc5e6b09590a63698e8d8bfef597252b9f4
          test "$(git hash-object tests/test_native_policy_snapshot_v3_publisher.py)" = b73e7f4ed86dd69d0f2ffc0924dbb493fe0c123f
          test "$(git hash-object tests/test_native_policy_snapshot_publisher.py)" = c4ad2122cc3aa021ee9ae836f119e2c24bc12ad6
          test "$(git hash-object tests/test_native_policy_snapshot_persistence.py)" = f4a82792fa049724f2fd1133d43aa20aa59cbefb
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object pyproject.toml)" = 64a0281ee6b4f57a74cab68ac992fec3d782a6bb
          test "$(git hash-object uv.lock)" = 10e18a310e63ba3c5940e25b44269d48dfc7f2da
          git diff --exit-code
          git diff --cached --exit-code
          echo 'CONTEXT_EPOCH_BASELINE_TRACKED_SOURCE_UNCHANGED=true'
