name: Signed receipt redaction baseline

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-redaction-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-redaction-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-signed-redaction-baseline-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the unchanged product and thirteen-case overlay
        id: source_before
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          diagnostic_commit = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          diagnostic_tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (diagnostic_commit, diagnostic_tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-signed-redaction-baseline-20260919"
          assert os.environ["GITHUB_SHA"] == diagnostic_commit
          assert git("rev-parse", "HEAD") == diagnostic_commit
          assert git("rev-parse", "HEAD^{tree}") == diagnostic_tree
          source = "5c86e419ce2666dfc0551411541058f27669374c"
          baseline = "edf02c6321d957e25251e59b2c22e0f5326a7466"
          identity = git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "51d5684be15c03b979e145663e110ec5bfdc94ee")
          assert git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", source) == identity
          assert git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "HEAD") == identity
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [diagnostic_commit, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, baseline]
          assert git("rev-list", "--parents", "-n", "1", baseline).split() == [baseline, "51d5684be15c03b979e145663e110ec5bfdc94ee"]
          assert git("rev-parse", source + "^{tree}") == "4425ef91a0c0c7ba0975047e5495fef358281ec4"
          assert git("rev-parse", baseline + "^{tree}") == "3d5cb7f7b8c23f6f6eaabcb98b6f9b32ba0336a0"
          assert git("rev-parse", "51d5684be15c03b979e145663e110ec5bfdc94ee^{tree}") == "1ea5b49cc1439b76e3a6048c899952602c7258f9"
          assert git("diff", "--name-status", baseline, source).splitlines() == [
              "A\ttests/test_receipt_signed_redaction_default.py",
          ]
          assert git("diff", "--name-status", source, "HEAD").splitlines() == ["M\t.github/workflows/ci.yml"]
          pins = [
              ["pyproject.toml","100644","64a0281ee6b4f57a74cab68ac992fec3d782a6bb"],
              ["uv.lock","100644","10e18a310e63ba3c5940e25b44269d48dfc7f2da"],
              ["conftest.py","100644","9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"],
              ["tests/conftest.py","100644","61e6d98609309fac99c9baae50fab5f47229fcde"],
              ["tests/test_workspace_preference_authority.py","100644","38482e9ce6e96c409066a0e62d92d56aeaf4a62a"],
              ["tests/test_oauth_connection_authority.py","100644","0441f694d5ac0710e24b36f838e0eeb849c09278"],
              ["tests/test_guard_receipt_redaction_cursor.py","100644","c24a240a09818fc06e81a79f47ae587d194891d8"],
              ["tests/policy_bundle_signing_helpers.py","100644","8b62bc0531da09c6ad3f4205c03fa839f19ebe3a"],
              ["src/codex_plugin_scanner/guard/runtime/workspace_preferences.py","100644","a6f2e6c0b4c3f8984a5eea938aa9f13172c7c447"],
              ["src/codex_plugin_scanner/guard/workspace_preference_authority.py","100644","59e2cb9db4de87bfbcd4d1b6379c71c21a92ccd6"],
              ["src/codex_plugin_scanner/guard/config.py","100644","f75aaa1214e6018a07fd9ae55ec8c5612085a552"],
              ["src/codex_plugin_scanner/guard/config_payload.py","100644","53851a4d558130274fd115bfee843c980cdbd7f7"],
              ["src/codex_plugin_scanner/guard/mdm/contracts.py","100644","97a2b4329dcb3ff8b79fe5fa4e325817b21bc000"],
              ["src/codex_plugin_scanner/guard/mdm/policy.py","100644","4a7a72bb5441ce510521116406da4e14074f1928"],
              ["src/codex_plugin_scanner/guard/mdm/policy_composition.py","100644","436bfd11cb84e689ae617d79b7ede6b7c6b9aca1"],
              ["src/codex_plugin_scanner/guard/synced_policy.py","100644","053c5f60ff34116bef773fa16eea787b4768938c"],
              ["src/codex_plugin_scanner/guard/oauth_connection_authority.py","100644","09b71c5a50fb7234347935d3d22421b29b809c96"],
              ["src/codex_plugin_scanner/guard/store_oauth.py","100644","5c3fac2a8f9ad284b1e4723eb127d026edf4fe12"],
              ["src/codex_plugin_scanner/guard/store_sync_payload_mutations.py","100644","4cba562fb67a2fe20ee741cd0ec8b903efef02d8"],
              ["src/codex_plugin_scanner/guard/policy_bundle_parser.py","100644","d95527d4c0cd1aaa3e613d3c3a1c2f330822f659"],
              ["src/codex_plugin_scanner/guard/policy_bundle_trusted_keys.py","100644","684ac75b053130297e03dc41d76f19d51f521b32"],
              ["tests/test_receipt_signed_redaction_default.py","100644","c0036d857b2e029b210cbb66c9d9847f18ec81bf"],
              ["src/codex_plugin_scanner/guard/runtime/receipt_upload.py","100644","c6bb4578bdc36da5ada2deb8533e9d290dcb5b7c"],
          ]
          for path, mode, sha in pins:
              assert git("ls-tree", "HEAD", "--", path) == f"{mode} blob {sha}\t{path}"
              assert git("hash-object", "--", path) == sha
          assert not git("status", "--porcelain", "--untracked-files=no")
          print(json.dumps({"sourceGuard": "passed", "pins": len(pins), "testOnly": True}, sort_keys=True))
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Exercise all thirteen signed-redaction cases
        id: redaction_cases
        run: |
          uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/signed-redaction-baseline-${{ matrix.python }}.xml" tests/test_receipt_signed_redaction_default.py
      - name: Report the actual thirteen-case outcomes
        if: ${{ always() && (steps.redaction_cases.outcome == 'success' || steps.redaction_cases.outcome == 'failure') }}
        run: |
          python -I - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          
          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("signed-redaction-baseline-" + os.environ["MATRIX_PYTHON"] + ".xml")
          cases = ET.parse(report).getroot().findall(".//testcase")
          expected = [
              "test_verified_signed_level_can_replace_absent_local_default[none]",
              "test_verified_signed_level_can_replace_absent_local_default[partial]",
              "test_explicit_local_privacy_floor_survives_signed_relaxation[full-none-full]",
              "test_explicit_local_privacy_floor_survives_signed_relaxation[partial-none-partial]",
              "test_explicit_local_privacy_floor_survives_signed_relaxation[none-partial-partial]",
              "test_confirmed_workspace_privacy_floor_survives_signed_relaxation[full]",
              "test_confirmed_workspace_privacy_floor_survives_signed_relaxation[partial]",
              "test_signed_clear_restores_default_and_later_revision_can_relax",
              "test_unaccepted_signed_level_cannot_replace_default[tampered]",
              "test_unaccepted_signed_level_cannot_replace_default[expired]",
              "test_unaccepted_signed_level_cannot_replace_default[foreign]",
              "test_managed_privacy_floor_survives_signed_relaxation[full]",
              "test_managed_privacy_floor_survives_signed_relaxation[partial]",
          ]
          expected = [("tests.test_receipt_signed_redaction_default", name) for name in expected]
          names = [(case.attrib.get("classname"), case.attrib["name"]) for case in cases]
          assert collections.Counter(names) == collections.Counter(expected), names
          results = []
          for case in cases:
              tags = [tag for tag in ("failure", "error", "skipped") if case.find(tag) is not None]
              results.append({"class": case.attrib.get("classname"), "case": case.attrib["name"], "statuses": tags or ["passed"]})
          print(json.dumps({"python": os.environ["MATRIX_PYTHON"], "collected": len(cases), "results": results}, sort_keys=True))
          assert all(case.find("skipped") is None for case in cases)
          PY
      - name: Check focused test lint
        if: ${{ always() && (steps.redaction_cases.outcome == 'success' || steps.redaction_cases.outcome == 'failure') }}
        run: uv run --no-sync ruff check tests/test_receipt_signed_redaction_default.py
      - name: Check focused test formatting
        if: ${{ always() && (steps.redaction_cases.outcome == 'success' || steps.redaction_cases.outcome == 'failure') }}
        run: uv run --no-sync ruff format --check tests/test_receipt_signed_redaction_default.py
      - name: Verify the exact source after all checks
