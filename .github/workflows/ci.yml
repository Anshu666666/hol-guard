            tests/test_inventory_request_authority.py \
            tests/test_inventory_consumer_authority.py \
            --tb=short
      - name: Verify connection locks and daemon storage
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
            tests/test_aibom_sync_admission.py \
            tests/test_aibom_operation_authority.py \
            tests/test_aibom_daemon_authority.py \
            tests/test_guard_daemon_storage_liveness.py \
            --tb=short
      - name: Verify managed authority and coherent captures
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
            tests/test_native_policy_authority_coherent_capture.py \
            tests/test_native_policy_authority_managed_read.py \
            tests/test_guard_extension_control_api.py \
            --tb=short
      - name: Verify native selection and control boundaries
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
            tests/test_guard_native_runtime.py \
            tests/test_native_runtime_admission.py \
            tests/test_native_policy_control_runtime.py \
            tests/test_native_policy_control_transport.py \
            tests/test_native_policy_snapshot_control.py \
