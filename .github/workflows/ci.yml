name: Native post-ACK readiness baseline

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-post-ack-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post-ack-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-post-ack-baseline-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the unchanged product and fourteen-case overlay
        id: source_before
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          diagnostic_commit = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          diagnostic_tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (diagnostic_commit, diagnostic_tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-post-ack-baseline-20260919"
          assert os.environ["GITHUB_SHA"] == diagnostic_commit
          assert git("rev-parse", "HEAD") == diagnostic_commit
          assert git("rev-parse", "HEAD^{tree}") == diagnostic_tree
          assert git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "HEAD") == git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "f2b977859ceb8e867d06c1550f9df055e1437dc8")
          assert git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "f2b977859ceb8e867d06c1550f9df055e1437dc8") == git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "e814138f3246d79f57c45c8fc6224102cc8fbf0a")
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [
