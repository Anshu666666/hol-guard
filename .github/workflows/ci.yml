name: Focused combined source acceptance
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
permissions:
  contents: read
env:
  EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
  EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
jobs:
  focused_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = b1efb0e6af1c66d8fdfcbd2424a0c25977c00e8b
          test "$(git rev-parse 'HEAD^1^{tree}')" = a61c91d82afd612b7fccc944dfe67fe59a2d06c3
          test "$(git ls-tree HEAD -- '.github/workflows/rust-pretool-authority-acceptance.yml' | awk '{print $1,$2,$3}')" = '100644 blob 1cf89a6529a19edf997df531ec0d1fd389a26c69'
          test "$(git ls-tree HEAD -- '.github/workflows/security-gates.yml' | awk '{print $1,$2,$3}')" = '100644 blob 05ab5c35f6124784e0fd1f6f73f5bed1f0bef19c'
          test "$(git ls-tree HEAD -- 'basedpyright.native-managed-source.json' | awk '{print $1,$2,$3}')" = '100644 blob b59fe4080a5f36f52b09145de81ed7e3a130bdeb'
          test "$(git ls-tree HEAD -- 'ci/native_runtime/test_command_model_resident.py' | awk '{print $1,$2,$3}')" = '100644 blob 124dd3ca61d3832f7285624bb8a2e42d935e55fb'
          test "$(git ls-tree HEAD -- 'ci/native_runtime/test_guard_native_runtime_binary.py' | awk '{print $1,$2,$3}')" = '100644 blob 98cdbcffa4f3a5ec5bce36a2727256fd1237210d'
          test "$(git ls-tree HEAD -- 'pyproject.toml' | awk '{print $1,$2,$3}')" = '100644 blob 64a0281ee6b4f57a74cab68ac992fec3d782a6bb'
          test "$(git ls-tree HEAD -- 'rust/crates/guard-runtime/src/policy_store_migration.rs' | awk '{print $1,$2,$3}')" = '100644 blob 25eda85bb121f0a862e95c6f78d0df86b98a0ad3'
          test "$(git ls-tree HEAD -- 'rust/crates/guard-runtime/src/policy_store.rs' | awk '{print $1,$2,$3}')" = '100644 blob fd58d6d890065677f1e5c52fe82c6376b56fea3e'
          test "$(git ls-tree HEAD -- 'scripts/bench_guard_native_release_gate.py' | awk '{print $1,$2,$3}')" = '100755 blob 9dea514d9f1732045b1c671ec86c9394071e1e15'
          test "$(git ls-tree HEAD -- 'scripts/ci/native_approval_contract_gate.py' | awk '{print $1,$2,$3}')" = '100644 blob b241db2e730340cddc35fb8ee4243b6ab712ce2e'
          test "$(git ls-tree HEAD -- 'scripts/ci/rust_io_ownership_gate.py' | awk '{print $1,$2,$3}')" = '100644 blob 004e7379ba3eeca4af53209136fab3dc44a52da8'
          test "$(git ls-tree HEAD -- 'scripts/native_publication_diagnostic.py' | awk '{print $1,$2,$3}')" = '100644 blob e4b6774ff34da7a0607659545afd2f762cc0580e'
          test "$(git ls-tree HEAD -- 'src/codex_plugin_scanner/guard/native_policy_test_support.py' | awk '{print $1,$2,$3}')" = '100644 blob 8fa46ea70359f8073f355c47e7d6e8bdf6fe94b7'
          test "$(git ls-tree HEAD -- 'src/codex_plugin_scanner/guard/native_runtime.py' | awk '{print $1,$2,$3}')" = '100644 blob 2f178f054924e49e55446d3428d8ee3bf36dde8b'
          test "$(git ls-tree HEAD -- 'src/codex_plugin_scanner/guard/policy_bundle_staging.py' | awk '{print $1,$2,$3}')" = '100644 blob aaa2204b5cdbbe946348084f0367ed8435b2320c'
          test "$(git ls-tree HEAD -- 'src/codex_plugin_scanner/guard/store_base.py' | awk '{print $1,$2,$3}')" = '100644 blob 3b8663163bb029dd4539b0dc9f64730afa65c5a8'
          test "$(git ls-tree HEAD -- 'src/codex_plugin_scanner/guard/store_extension_control_authority_support.py' | awk '{print $1,$2,$3}')" = '100644 blob 4b797f545b7741dcb1b8c5a3a5276d6e8101e096'
          test "$(git ls-tree HEAD -- 'src/codex_plugin_scanner/guard/store_extension_control_authority.py' | awk '{print $1,$2,$3}')" = '100644 blob 203e611d04439864849c719c195c506e43015dbd'
          test "$(git ls-tree HEAD -- 'src/codex_plugin_scanner/guard/store_private_mode.py' | awk '{print $1,$2,$3}')" = '100644 blob 67d39e449497d4ce35697b66f5f60932dde1a151'
          test "$(git ls-tree HEAD -- 'tests/fixtures/guard-command-corpus/decision-diff-report.json' | awk '{print $1,$2,$3}')" = '100644 blob c4d4d851118821bff7266a6e0b4bd32a7363f032'
          test "$(git ls-tree HEAD -- 'tests/guard_command_decision_diff.py' | awk '{print $1,$2,$3}')" = '100644 blob 2150c9eb1da9371966b26cbfd1a8737fbf7e2e64'
          test "$(git ls-tree HEAD -- 'tests/guard_review_authority_fixtures.py' | awk '{print $1,$2,$3}')" = '100644 blob da1b4f00fff8b70120b3cbdb76010451422f0a9d'
          test "$(git ls-tree HEAD -- 'tests/test_guard_command_corpus.py' | awk '{print $1,$2,$3}')" = '100644 blob f84c3b50ea50b73c280deda354112080e943f5b5'
          test "$(git ls-tree HEAD -- 'tests/test_guard_command_decision_diff.py' | awk '{print $1,$2,$3}')" = '100644 blob 8d5fa7b75cb70bfb607075834adc97e1fd46a717'
          test "$(git ls-tree HEAD -- 'tests/test_guard_extension_control_api.py' | awk '{print $1,$2,$3}')" = '100644 blob 90b08c512c5f9c7f2f4bff461d59e47a5a7c7f66'
          test "$(git ls-tree HEAD -- 'tests/test_guard_extension_control_recovery.py' | awk '{print $1,$2,$3}')" = '100644 blob f749ba99d91c5d9a2e0a20cdc3a3107c208035f0'
          test "$(git ls-tree HEAD -- 'tests/test_guard_kubernetes_runtime.py' | awk '{print $1,$2,$3}')" = '100644 blob 58beb90140c5512678ab19f0980e7698996faadd'
          test "$(git ls-tree HEAD -- 'tests/test_guard_review_authority_setup.py' | awk '{print $1,$2,$3}')" = '100644 blob b50cf04bd0e243e28498aa4551bfd44f153f98d3'
          test "$(git ls-tree HEAD -- 'tests/test_native_authority_fixture_lifecycle.py' | awk '{print $1,$2,$3}')" = '100644 blob 4f308e300c7594ce38d797232d73f37599437a6f'
          test "$(git ls-tree HEAD -- 'tests/test_native_policy_test_support.py' | awk '{print $1,$2,$3}')" = '100644 blob dfd380c7eb8cc065f214796adec80e824b1db16a'
          test "$(git ls-tree HEAD -- 'tests/test_native_publication_diagnostic.py' | awk '{print $1,$2,$3}')" = '100644 blob 48bd36f6c4d30a601fc524250dcff62a5cffaad1'
          test "$(git ls-tree HEAD -- 'tests/test_rust_pretool_authority_worker.py' | awk '{print $1,$2,$3}')" = '100644 blob c055f9e2decdfd6a0cff1663a14ec4accea1c345'
          test "$(git ls-tree HEAD -- 'tests/test_rust_pretool_authority.py' | awk '{print $1,$2,$3}')" = '100644 blob 05209122bd1c8ecce227473170de93a947de574a'
          test "$(git ls-tree HEAD -- 'tests/test_store_private_mode_compatibility.py' | awk '{print $1,$2,$3}')" = '100644 blob fc1f815442935dbd20d552dad7baddf50fa1141a'
          test "$(git ls-tree HEAD -- 'tests/test_store_private_mode_observation.py' | awk '{print $1,$2,$3}')" = '100644 blob cd84d8929511cb8076a9eab85b684a0ec5c5b766'
          test "$(git ls-tree HEAD -- 'uv.lock' | awk '{print $1,$2,$3}')" = '100644 blob 10e18a310e63ba3c5940e25b44269d48dfc7f2da'
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci.yml
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install frozen development dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        id: interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check focused Python imports and lint
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/store_base.py \
            src/codex_plugin_scanner/guard/store_private_mode.py \
            tests/test_store_private_mode_compatibility.py \
            tests/test_store_private_mode_observation.py \
            tests/test_rust_pretool_authority.py \
            tests/test_rust_pretool_authority_worker.py \
            tests/test_native_authority_fixture_lifecycle.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority_support.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_extension_control_recovery.py \
            tests/test_guard_command_corpus.py \
            src/codex_plugin_scanner/guard/policy_bundle_staging.py \
            tests/test_guard_kubernetes_runtime.py \
            src/codex_plugin_scanner/guard/native_policy_test_support.py \
            scripts/native_publication_diagnostic.py \
            tests/test_native_policy_test_support.py \
            tests/test_native_publication_diagnostic.py
      - name: Check focused Python formatting
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/store_base.py \
            src/codex_plugin_scanner/guard/store_private_mode.py \
            tests/test_store_private_mode_compatibility.py \
            tests/test_store_private_mode_observation.py \
            tests/test_rust_pretool_authority.py \
            tests/test_rust_pretool_authority_worker.py \
            tests/test_native_authority_fixture_lifecycle.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority.py \
            src/codex_plugin_scanner/guard/store_extension_control_authority_support.py \
            tests/test_guard_extension_control_api.py \
            tests/test_guard_extension_control_recovery.py \
            tests/test_guard_command_corpus.py \
            src/codex_plugin_scanner/guard/policy_bundle_staging.py \
            tests/test_guard_kubernetes_runtime.py \
            src/codex_plugin_scanner/guard/native_policy_test_support.py \
            scripts/native_publication_diagnostic.py \
            tests/test_native_policy_test_support.py \
            tests/test_native_publication_diagnostic.py
      - name: Verify original permission and integrity regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q --tb=short \
            tests/test_store_private_mode_observation.py \
            tests/test_store_private_mode_compatibility.py \
            tests/test_guard_store_migrations.py::test_guard_store_constructor_uses_facade_patched_helpers \
            tests/test_guard_store_migrations.py::test_guard_store_secures_guard_home_and_database_permissions \
            tests/test_guard_store_migrations.py::test_guard_store_repairs_existing_guard_home_and_database_permissions \
            tests/test_guard_policy_integrity.py::test_backup_policy_database_sets_private_mode_when_backup_fails \
            tests/test_guard_policy_integrity.py::test_symlinked_guard_home_forces_degraded_local_policy_authority
      - name: Verify original worker lifecycle regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_native_authority_fixture_lifecycle.py tests/test_rust_pretool_authority.py tests/test_rust_pretool_authority_worker.py --tb=short
      - name: Verify frozen AnyIO dependency
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync python -c 'from importlib.metadata import version; assert version("anyio") == "4.14.2"; print("ANYIO_LOCKED_VERSION=4.14.2")'
      - name: Verify existing native managed source typing
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync basedpyright --project basedpyright.native-managed-source.json
      - name: Verify extension authority and recovery regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_extension_control_first_run_authority.py tests/test_extension_control_recovery_composition.py tests/test_guard_extension_control_authority.py tests/test_guard_extension_control_recovery.py tests/test_guard_extension_control_api.py tests/test_guard_review_authority_setup.py --tb=short
      - name: Verify MCP dependency regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_guard_mcp_contract.py tests/test_mcp_security.py::test_scan_runs_safely_inside_running_event_loop --tb=short
      - name: Verify original source-bound decision report
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Verify original corpus and report privacy controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_guard_command_corpus.py::test_all_corpus_artifacts_and_generated_records_are_secret_and_pii_free tests/test_guard_command_decision_diff.py::test_report_contains_only_privacy_safe_deterministic_evidence --tb=short
      - name: Verify existing policy staging regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_policy_bundle_staging.py --tb=short
      - name: Verify unchanged Kubernetes runtime regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_guard_kubernetes_runtime.py
      - name: Verify existing publication diagnostic controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_native_policy_test_support.py tests/test_native_publication_diagnostic.py --tb=short
      - name: Verify current native approval contract gate
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync python scripts/ci/native_approval_contract_gate.py --root .
      - name: Verify unchanged I/O ownership gate
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync python scripts/ci/rust_io_ownership_gate.py --root .
      - name: Install pinned Rust toolchain
        id: rust
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
      - name: Verify unchanged Rust formatting
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Verify policy store and migration regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime policy_store::
      - name: Verify ordinary edge regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime edge::tests::
      - name: Verify scoped edge regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.rust.outcome == 'success' }}
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime edge_v4::
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = b1efb0e6af1c66d8fdfcbd2424a0c25977c00e8b
          test "$(git rev-parse 'HEAD^1^{tree}')" = a61c91d82afd612b7fccc944dfe67fe59a2d06c3
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci.yml
