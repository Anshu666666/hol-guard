name: Focused Core policy verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable Core commit to verify
        required: true
        type: string
      source_tree:
        description: Expected tree of the Core commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
    steps:
      - name: Require immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/hol-guard
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify the complete source tree before installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'FOCUSED_CORE_SOURCE stage=before commit=%s tree=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Install the existing locked development dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Collect both exact-review modules
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest --collect-only -q \
            tests/test_guard_exact_cloud_review.py \
            tests/test_guard_exact_cloud_review_consent.py
      - name: Run the consent, extraction and fixture regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pytest -q --tb=short -rA \
            tests/test_guard_cloud_review_retry_consent_expiry.py \
            tests/test_guard_cloud_review_settings_idempotent.py \
            tests/test_cloud_review_consent_recovery_identity.py \
            tests/test_guard_exact_cloud_review.py \
            tests/test_guard_exact_cloud_review_consent.py \
            tests/test_guard_runtime.py::test_codex_read_only_source_inspection_allows_cd_then_bounded_secret_term_search \
            tests/test_guard_runtime.py::test_codex_read_only_source_inspection_rejects_cd_parent_escape \
            tests/test_guard_runtime.py::test_codex_read_only_source_inspection_allows_tilde_worktree_targets
      - name: Check the changed Python modules with Ruff
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/daemon/cloud_review_settings.py \
            tests/test_guard_cloud_review_retry_consent_expiry.py \
            tests/test_guard_exact_cloud_review.py \
            tests/test_guard_exact_cloud_review_consent.py
      - name: Check settings formatting
        run: uv run --no-sync ruff format --check src/codex_plugin_scanner/guard/daemon/cloud_review_settings.py
      - name: Verify the source tree after all checks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'FOCUSED_CORE_SOURCE stage=after commit=%s tree=%s\n' "$SOURCE_SHA" "$SOURCE_TREE"
