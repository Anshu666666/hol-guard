              [".github/workflows/native-managed-source-contract.yml","100644","ae8180cb4e6710902c6a5d699cd636c3988fcee2"],
              ["basedpyright.native-managed-source.json","100644","6b889e5409ffe4e4a9c562e23b8c16dfc0381701"],
              ["conftest.py","100644","9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"],
              ["docs/guard/contracts/hook-data-plane-ownership.v2.json","100644","a73156839953a3f2febb0b723a289076a0e77b41"],
              ["docs/guard/contracts/python-capability-ownership.v1.json","100644","95c440ac60c1714f226b258f2ba61ae536990635"],
              ["docs/guard/runtime-lane-capabilities.md","100644","b36be5df87c034287c2d8514d6ac0d3aac2a32d9"],
              ["pyproject.toml","100644","64a0281ee6b4f57a74cab68ac992fec3d782a6bb"],
              ["rust/crates/guard-runtime/src/resident_protocol.rs","100644","8f9fd6b945fb34be55c226de73b9b1f39fbd40d2"],
              ["scripts/ci/python_hook_semantic_callgraph_gate.py","100644","bb50c30fff2c404a95b59e64879a999d4bdba0db"],
              ["scripts/ci/rust_io_ownership_contract.py","100644","72ff99af196daf61e35f04fbf776c2da15569d9f"],
              ["scripts/ci/rust_io_ownership_gate.py","100644","004e7379ba3eeca4af53209136fab3dc44a52da8"],
              ["scripts/ci/rust_io_ownership_resolver.py","100644","cd08a07d6ed43308ae1c0626d02a168151e9fb9f"],
              ["src/codex_plugin_scanner/guard/daemon/server.py","100644","2792f7cf919da55d02435b8fb3295ae2d514a6f5"],
              ["src/codex_plugin_scanner/guard/native_policy_authority_read.py","100644","9dac9c06033f2c354a3fd0c174760006fa926a73"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py","100644","93f0d9c6be38ce9ae46abbe402b3097bb1efe618"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_generation.py","100644","f9b698c7c5fa22e4819613bce45d07932957042a"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","100644","cb1d92fde143161811dc5c7d9b61099f913bcc78"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_attempt.py","100644","bdc9b2b15dd27f6034fce45c5c8fc3eea4f8ba2c"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py","100644","cd0749d72df7ab9a5328f57129ca1bf44c769e60"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_inputs.py","100644","5f88a6ecdacc7fb426d5d6306a8faa44602de3a4"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scheduling.py","100644","0a500224add718d93aa989258125a35790746400"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scoped.py","100644","9b59002f683443f190e6535bbdd66cddf525a1d0"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_transport.py","100644","26b091171d6d9f377411e3f51543c1089ea2da56"],
              ["src/codex_plugin_scanner/guard/oauth_connection_authority.py","100644","09b71c5a50fb7234347935d3d22421b29b809c96"],
              ["src/codex_plugin_scanner/guard/policy_lane_capabilities.py","100644","89253e79d259ce4cb6adda7ba6e3daffbd58e72f"],
              ["src/codex_plugin_scanner/guard/runtime/receipt_sync_steps.py","100644","fdf973a7b6c80fab7b2007fb850d91de9f63713a"],
              ["src/codex_plugin_scanner/guard/runtime/runner.py","100644","62d1fd83e34dafaa1a05189da0b80a5249bf7b43"],
              ["src/codex_plugin_scanner/guard/runtime/sync_request_attempts.py","100644","98a3182f51e7b5730feffab5bf7dd833f41cb966"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority.py","100644","39c5ff235685f3f2869155d1cf2d4d9097370967"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority_support.py","100644","c6177516cbb6150bff636ee7e2f3685e9b95f8b9"],
              ["src/codex_plugin_scanner/guard/store_sync_payload_mutations.py","100644","4cba562fb67a2fe20ee741cd0ec8b903efef02d8"],
              ["tests/conftest.py","100644","61e6d98609309fac99c9baae50fab5f47229fcde"],
              ["tests/native_policy_snapshot_test_fixtures.py","100644","e6809fc5e6b09590a63698e8d8bfef597252b9f4"],
              ["tests/native_policy_snapshot_windows_handles.py","100644","23dac63bb6631785a4e316d28fde2ff5273ab18c"],
              ["tests/native_policy_snapshot_windows_storage.py","100644","0622a7f2d469dddd88ae1e4ecff5b6d42db7b6cc"],
              ["tests/test_canonical_policy_row_authority.py","100644","f4d5ef43a27a48bfa152f2934a255418df023774"],
              ["tests/test_hook_data_plane_ownership_gate.py","100644","456811f0f581defedc00c8f63f61cf724342489f"],
              ["tests/test_native_generic_sync_unstaged.py","100644","bb7bc3ec887ec188f8eb7ab8797c72ab0d598446"],
              ["tests/test_native_policy_snapshot_capture_retry.py","100644","915b648d205aa205b7e6b303f37e504bd6b6f193"],
              ["tests/test_native_policy_snapshot_contract.py","100644","abd5956fe0dc3cfc17db34404e6915ce23452fd9"],
              ["tests/test_native_policy_snapshot_persistence.py","100644","f4a82792fa049724f2fd1133d43aa20aa59cbefb"],
              ["tests/test_native_policy_snapshot_post_ack_retry.py","100644","241ed665d8b85ca554055a50ef44671a8b2f310e"],
              ["tests/test_native_policy_snapshot_post_ack_retry_commit.py","100644","29280d37f563f3f2996fc2027ddd3a2de50ad6ff"],
              ["tests/test_native_policy_snapshot_post_ack_retry_guards.py","100644","6512ccb8fd9432883c365ea159dc9bede82f46e7"],
              ["tests/test_native_policy_snapshot_publisher.py","100644","c4ad2122cc3aa021ee9ae836f119e2c24bc12ad6"],
              ["tests/test_native_policy_snapshot_reservation_capture.py","100644","a663d5014bc62822c0c86d970b0ce056f4e97cd3"],
              ["tests/test_native_policy_snapshot_resident_retry.py","100644","ac80c25fc582ecab7e77b48696b7a58a7e09a7ad"],
              ["tests/test_native_policy_snapshot_v3_publisher.py","100644","b73e7f4ed86dd69d0f2ffc0924dbb493fe0c123f"],
              ["tests/test_native_policy_snapshot_v4_barrier.py","100644","255359a8e7d239fc5c907c331414ef5f10d750f6"],
              ["tests/test_native_policy_snapshot_v4_publication.py","100644","82214f98c06c9c43d854156b9cf6612cd4d7538a"],
              ["tests/test_native_policy_snapshot_windows.py","100644","591822b3833b16f2bd287b19e4b2549018fafbd5"],
              ["tests/test_native_source_free_renewal.py","100644","433d59d0a74d0d04be3cf4659df858a2ddd513ff"],
              ["tests/test_policy_lane_cli.py","100644","5edc3668a27e47f7131ba72c2535fa55131399ab"],
              ["tests/test_python_hook_semantic_callgraph_gate.py","100644","ee076f1048776e4160aff5e5737f4df95aa2fd4e"],
              ["tests/test_rust_io_ownership_gate.py","100644","122441797c7439cb8184512a351a9e2e0e26e0b0"],
              ["uv.lock","100644","10e18a310e63ba3c5940e25b44269d48dfc7f2da"],
          ]
          for path, mode, sha in pins:
              expected = f"{mode} blob {sha}\t{path}"
              assert git("ls-tree", source, "--", path) == expected
              assert git("ls-tree", "HEAD", "--", path) == expected
              assert git("hash-object", "--", path) == sha
          assert not git("status", "--porcelain", "--untracked-files=no")
          print(json.dumps({"sourceGuard":"passed","pins":len(pins)}, sort_keys=True))
