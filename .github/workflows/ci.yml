name: Installation rotation verification
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = 04bed715f38b04cb75651fafdf566e86e1112da1
          test "$(git rev-parse HEAD:tests/test_policy_installation_rotation_binding.py)" = 67330a183424da4c6e0e592d4de2205d9fcc2623
          test "$(git rev-parse HEAD:src/codex_plugin_scanner/guard/store_inventory.py)" = 844c0f3c4de9940a1eb638c7c6e362bad21836f5
          test "$(git rev-parse HEAD:tests/claude_hook_diagnostics.py)" = db37b49cd94e3abc5cfdca163baa5543b0cb10e1
          git diff --exit-code
          git diff --cached --exit-code
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/rotation-changed.txt"
          printf '%s\n' .github/workflows/ci.yml src/codex_plugin_scanner/guard/store_inventory.py tests/claude_hook_diagnostics.py tests/test_policy_installation_rotation_binding.py > "$RUNNER_TEMP/rotation-expected.txt"
          cmp "$RUNNER_TEMP/rotation-changed.txt" "$RUNNER_TEMP/rotation-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check formatting and imports
        run: |
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/store_inventory.py \
            tests/test_policy_installation_rotation_binding.py tests/claude_hook_diagnostics.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/store_inventory.py \
            tests/test_policy_installation_rotation_binding.py tests/claude_hook_diagnostics.py
      - name: Run real rotation and source-binding regressions
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync pytest -q --tb=short \
            tests/test_policy_installation_rotation_binding.py \
            tests/test_policy_bundle_source_materialization.py \
            tests/test_policy_installation_selectors.py \
            tests/test_claude_hook_failure_privacy.py
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git hash-object tests/test_policy_installation_rotation_binding.py)" = 67330a183424da4c6e0e592d4de2205d9fcc2623
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git hash-object src/codex_plugin_scanner/guard/store_inventory.py)" = 844c0f3c4de9940a1eb638c7c6e362bad21836f5
          test "$(git hash-object tests/claude_hook_diagnostics.py)" = db37b49cd94e3abc5cfdca163baa5543b0cb10e1
          echo 'ROTATION_VERIFICATION_TRACKED_SOURCE_UNCHANGED=true'
