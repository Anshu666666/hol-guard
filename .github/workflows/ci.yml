name: Rust transition lock release acceptance

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed one-file production fix commit
        required: true
        type: string
      source_tree:
        description: Reviewed fixed source tree
        required: true
        type: string
      diagnostic_commit:
        description: Immutable diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Reviewed diagnostic tree
        required: true
        type: string
      workflow_blob:
        description: Reviewed workflow Git blob
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-transition-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-transition-lock-fixed-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify exact source before checks
        id: source_before
        shell: python
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_BLOB: ${{ inputs.workflow_blob }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
          DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
          GUARD_PHASE: before
        run: |
          import hashlib, json, os, re, stat, subprocess
          from pathlib import Path
          
          if not __debug__:
              raise RuntimeError('source guards require Python assertions')
          
          def git(*args):
              return subprocess.check_output(['git', *args]).decode('utf-8').strip()
          
          def tree(ref):
              data = subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', ref])
              result = {}
              for entry in data.split(b'\0'):
                  if entry:
                      metadata, path = entry.split(b'\t', 1)
                      result[path.decode('utf-8')] = tuple(metadata.decode('ascii').split())
              return result
          
          base = 'a15235dcb09e38f68708d217339cfce5d0f74e0a'
          prior = '6266504356fa884bdddbf68e03109df109b53446'
          external = '9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12'
          source = os.environ['SOURCE_COMMIT']
          workflow = os.environ['WORKFLOW_BLOB']
          head_input = os.environ['DIAGNOSTIC_COMMIT']
          head_tree = os.environ['DIAGNOSTIC_TREE']
          source_tree = os.environ['SOURCE_TREE']
          for value in (source, workflow, head_input, head_tree, source_tree):
              assert re.fullmatch(r'[0-9a-f]{40}', value), 'invalid immutable Git identity'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/hgp/diagnostic-transition-lock-fixed-20260919'
          head = git('rev-parse', 'HEAD')
          assert head == head_input == os.environ['GITHUB_SHA'], 'dispatch commit mismatch'
          assert git('show', '-s', '--format=%P', head) == source
          assert git('show', '-s', '--format=%P', source) == base
          assert git('show', '-s', '--format=%P', base) == prior
          assert git('show', '-s', '--format=%P', prior) == external
          assert git('show', '-s', '--format=%P', external) == '69f4acf83fcd71ffa7c78e4bbda257d78ce1ca70'
          assert git('show', '-s', '--format=%T', external) == '8ca9c2df12566dc340a59f37f6e14ece267622fe'
          assert git('show', '-s', '--format=%T', prior) == '73fc359aa9613b995bea93feccad90ac46686da8'
          assert git('show', '-s', '--format=%T', base) == 'beeb1d3e2ea33e5e294c04080d846ebb2f586903'
          assert source_tree == '0031bd63e04c7f2c65dd56aea5060f0438204aba'
          assert git('show', '-s', '--format=%T', source) == source_tree
          assert git('show', '-s', '--format=%T', head) == head_tree
          identity = ['kantorcodes', '6068672+kantorcodes@users.noreply.github.com'] * 2
          for commit in (prior, base, source, head):
              assert git('show', '-s', '--format=%an%n%ae%n%cn%n%ce', commit).splitlines() == identity
          source_path = 'rust/crates/guard-runtime/src/approval_enrollment.rs'
          test_path = 'rust/crates/guard-runtime/src/approval_enrollment_lock_tests.rs'
          baseline = tree(base)
          assert len(baseline) == 4301
          assert baseline[source_path] == ('100644', 'blob', '0b3dbd212160c1cf1fd42aae30935c51c7ddb6c9')
          assert baseline[test_path] == ('100644', 'blob', 'c0a4fc67223cf598fee369eae239feab88347382')
          expected = dict(baseline)
          expected[source_path] = ('100644', 'blob', '78568c99c385c3502dcf91f1684063f612317694')
          assert tree(source) == expected, 'source contains an unreviewed delta'
          expected['.github/workflows/ci.yml'] = ('100644', 'blob', workflow)
          actual = tree(head)
          assert len(actual) == 4301 and actual == expected, 'diagnostic contains an unreviewed delta'
          for relative, (mode, kind, expected_blob) in actual.items():
              path = Path(relative)
              metadata = path.lstat()
              assert kind == 'blob' and mode in {'100644', '100755'} and stat.S_ISREG(metadata.st_mode)
              assert bool(metadata.st_mode & 0o111) == (mode == '100755'), 'tracked executable mode changed'
              data = path.read_bytes()
              observed = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data, usedforsecurity=False).hexdigest()
              assert observed == expected_blob, 'tracked source bytes changed'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked checkout changed'
          print(json.dumps({'schema': 'guard-transition-lock-fixed-proof.v1',
              'phase': os.environ['GUARD_PHASE'], 'head': head, 'tree': head_tree,
              'source': source, 'source_tree': source_tree, 'leaves': len(actual),
              'workflow_blob': workflow, 'source_pins': {source_path: expected[source_path], test_path: expected[test_path]}},
              sort_keys=True))
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install the frozen project environment
        id: dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        id: toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust
          shared-key: authority
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Enforce permanent source ownership
        env:
          OWNERSHIP_BASE_REF: 6266504356fa884bdddbf68e03109df109b53446
        run: |
          args=(--root . --json rust-authority-ownership.json)
          if [[ -n "$OWNERSHIP_BASE_REF" ]]; then
            args+=(--base-ref "$OWNERSHIP_BASE_REF")
          fi
          uv run --no-sync python scripts/ci/rust_authority_ownership_gate.py "${args[@]}"
      - name: Enforce native approval contract ownership
        run: uv run --no-sync python scripts/ci/native_approval_contract_gate.py --root .
      - name: Reject production Python semantic hook reachability
        run: uv run --no-sync python scripts/ci/python_hook_semantic_callgraph_gate.py --root .
      - name: Enforce native receipt persistence contract at exact HEAD
        run: uv run --no-sync python scripts/ci/native_receipt_persistence_gate.py --root . --json native-receipt-persistence.json
      - name: Enforce Python capability cleanup ownership
        run: |
          uv run --no-sync python scripts/ci/python_capability_cleanup_gate.py \
            --root . --json python-capability-cleanup.json
      - name: Prove excluded Python module is absent from the built wheel
        run: |
          PACKAGE_ARTIFACT_DIR=$(mktemp -d)
          uv build --wheel --sdist --out-dir "$PACKAGE_ARTIFACT_DIR"
          BUILT_WHEEL=$(find "$PACKAGE_ARTIFACT_DIR" -maxdepth 1 -name '*.whl' -print -quit)
          BUILT_SDIST=$(find "$PACKAGE_ARTIFACT_DIR" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$BUILT_WHEEL"
          test -n "$BUILT_SDIST"
          uv run --no-sync python scripts/ci/python_capability_cleanup_gate.py \
            --root . --artifact "$BUILT_WHEEL" --json python-capability-cleanup-wheel.json
           uv run --no-sync python scripts/ci/python_capability_cleanup_gate.py \
             --root . --artifact "$BUILT_SDIST" --json python-capability-cleanup-sdist.json
      - name: Check Rust source and all test targets
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - name: Verify both exact tests are selected
        id: selectors
        shell: python
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          import json, subprocess, sys
          if not __debug__:
              raise RuntimeError('selection guard requires Python assertions')
          names = (
              'policy_store::approval_enrollment::tests::transition_lock_rejects_concurrent_owner_and_recovers_on_release',
              'policy_store::approval_enrollment::descriptor_tests::operation_release_is_not_extended_by_a_duplicate_descriptor',
          )
          for name in names:
              completed = subprocess.run([
                  'cargo', 'test', '--manifest-path', 'rust/Cargo.toml', '--locked',
                  '-p', 'hol-guard-runtime', '--bin', 'hol-guard-runtime', name, '--', '--exact', '--list',
              ], capture_output=True, text=True, check=False)
              print(completed.stdout, end='')
              print(completed.stderr, end='', file=sys.stderr)
              if completed.returncode:
                  raise SystemExit(completed.returncode)
              selected = [line for line in completed.stdout.splitlines() if line.endswith(': test')]
              assert selected == [name + ': test'], 'exact test selection mismatch'
          print(json.dumps({'schema': 'guard-transition-lock-test-selection.v1',
              'test_count': len(names), 'tests': names}, sort_keys=True))
      - name: Preserve nonblocking contention and ordinary release
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.selectors.outcome == 'success' }}
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: >
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime
          policy_store::approval_enrollment::tests::transition_lock_rejects_concurrent_owner_and_recovers_on_release
          -- --exact --nocapture
      - name: Verify operation release with a retained duplicate
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.selectors.outcome == 'success' }}
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: >
          cargo test --manifest-path rust/Cargo.toml --locked -p hol-guard-runtime --bin hol-guard-runtime
          policy_store::approval_enrollment::descriptor_tests::operation_release_is_not_extended_by_a_duplicate_descriptor
          -- --exact --nocapture
      - name: Verify the complete original Linux Rust workspace
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.toolchain.outcome == 'success' && steps.selectors.outcome == 'success' }}
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
      - name: Verify exact source after checks
        if: always()
        shell: python
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_BLOB: ${{ inputs.workflow_blob }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
          DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
          GUARD_PHASE: after
        run: |
          import hashlib, json, os, re, stat, subprocess
          from pathlib import Path
          
          if not __debug__:
              raise RuntimeError('source guards require Python assertions')
          
          def git(*args):
              return subprocess.check_output(['git', *args]).decode('utf-8').strip()
          
          def tree(ref):
              data = subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', ref])
              result = {}
              for entry in data.split(b'\0'):
                  if entry:
                      metadata, path = entry.split(b'\t', 1)
                      result[path.decode('utf-8')] = tuple(metadata.decode('ascii').split())
              return result
          
          base = 'a15235dcb09e38f68708d217339cfce5d0f74e0a'
          prior = '6266504356fa884bdddbf68e03109df109b53446'
          external = '9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12'
          source = os.environ['SOURCE_COMMIT']
          workflow = os.environ['WORKFLOW_BLOB']
          head_input = os.environ['DIAGNOSTIC_COMMIT']
          head_tree = os.environ['DIAGNOSTIC_TREE']
          source_tree = os.environ['SOURCE_TREE']
          for value in (source, workflow, head_input, head_tree, source_tree):
              assert re.fullmatch(r'[0-9a-f]{40}', value), 'invalid immutable Git identity'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/hgp/diagnostic-transition-lock-fixed-20260919'
          head = git('rev-parse', 'HEAD')
          assert head == head_input == os.environ['GITHUB_SHA'], 'dispatch commit mismatch'
          assert git('show', '-s', '--format=%P', head) == source
          assert git('show', '-s', '--format=%P', source) == base
          assert git('show', '-s', '--format=%P', base) == prior
          assert git('show', '-s', '--format=%P', prior) == external
          assert git('show', '-s', '--format=%P', external) == '69f4acf83fcd71ffa7c78e4bbda257d78ce1ca70'
          assert git('show', '-s', '--format=%T', external) == '8ca9c2df12566dc340a59f37f6e14ece267622fe'
          assert git('show', '-s', '--format=%T', prior) == '73fc359aa9613b995bea93feccad90ac46686da8'
          assert git('show', '-s', '--format=%T', base) == 'beeb1d3e2ea33e5e294c04080d846ebb2f586903'
          assert source_tree == '0031bd63e04c7f2c65dd56aea5060f0438204aba'
          assert git('show', '-s', '--format=%T', source) == source_tree
          assert git('show', '-s', '--format=%T', head) == head_tree
          identity = ['kantorcodes', '6068672+kantorcodes@users.noreply.github.com'] * 2
          for commit in (prior, base, source, head):
              assert git('show', '-s', '--format=%an%n%ae%n%cn%n%ce', commit).splitlines() == identity
          source_path = 'rust/crates/guard-runtime/src/approval_enrollment.rs'
          test_path = 'rust/crates/guard-runtime/src/approval_enrollment_lock_tests.rs'
          baseline = tree(base)
          assert len(baseline) == 4301
          assert baseline[source_path] == ('100644', 'blob', '0b3dbd212160c1cf1fd42aae30935c51c7ddb6c9')
          assert baseline[test_path] == ('100644', 'blob', 'c0a4fc67223cf598fee369eae239feab88347382')
          expected = dict(baseline)
          expected[source_path] = ('100644', 'blob', '78568c99c385c3502dcf91f1684063f612317694')
          assert tree(source) == expected, 'source contains an unreviewed delta'
          expected['.github/workflows/ci.yml'] = ('100644', 'blob', workflow)
          actual = tree(head)
          assert len(actual) == 4301 and actual == expected, 'diagnostic contains an unreviewed delta'
          for relative, (mode, kind, expected_blob) in actual.items():
              path = Path(relative)
              metadata = path.lstat()
              assert kind == 'blob' and mode in {'100644', '100755'} and stat.S_ISREG(metadata.st_mode)
              assert bool(metadata.st_mode & 0o111) == (mode == '100755'), 'tracked executable mode changed'
              data = path.read_bytes()
              observed = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data, usedforsecurity=False).hexdigest()
              assert observed == expected_blob, 'tracked source bytes changed'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked checkout changed'
          print(json.dumps({'schema': 'guard-transition-lock-fixed-proof.v1',
              'phase': os.environ['GUARD_PHASE'], 'head': head, 'tree': head_tree,
              'source': source, 'source_tree': source_tree, 'leaves': len(actual),
              'workflow_blob': workflow, 'source_pins': {source_path: expected[source_path], test_path: expected[test_path]}},
              sort_keys=True))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transition-lock-release-evidence
          path: |
            rust-authority-ownership.json
            native-receipt-persistence.json
            python-capability-cleanup.json
            python-capability-cleanup-wheel.json
            python-capability-cleanup-sdist.json
          if-no-files-found: error
          retention-days: 30
