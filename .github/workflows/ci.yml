name: Desktop source-bound report verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify isolated report correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = 04bed715f38b04cb75651fafdf566e86e1112da1
          test "$(git rev-parse 04bed715f38b04cb75651fafdf566e86e1112da1^{tree})" = ba3b461422e79e18c8b051a4beaf5d02ef690f31
          test "$(git hash-object tests/fixtures/guard-command-corpus/decision-diff-report.json)" = 82df2b145386459477af85277eb514254e5339f1
          python - <<'PY'
          import subprocess
          expected = {".github/workflows/ci.yml", "tests/fixtures/guard-command-corpus/decision-diff-report.json"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True).splitlines())
          assert actual == expected, "unexpected diagnostic source delta"
          PY
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Validate formatting and lint
        run: |
          uv run --no-sync python -m ruff format --check \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser.py \
            src/codex_plugin_scanner/guard/store_approvals.py \
            src/codex_plugin_scanner/guard/store_approval_facade.py \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py
          uv run --no-sync python -m ruff check \
            src/codex_plugin_scanner/guard/cli/commands_dispatch_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser_desktop.py \
            src/codex_plugin_scanner/guard/cli/commands_parser.py \
            src/codex_plugin_scanner/guard/store_approvals.py \
            src/codex_plugin_scanner/guard/store_approval_facade.py \
            src/codex_plugin_scanner/guard/store_receipts.py \
            tests/test_guard_desktop_contract.py

      - name: Run Desktop contract tests
        run: uv run --no-sync pytest tests/test_guard_desktop_contract.py --tb=short

      - name: Validate source-bound decision evidence
        run: uv run --no-sync python tests/guard_command_decision_diff.py --check

      - name: Verify all original report contracts
        run: uv run --no-sync pytest -q tests/test_guard_command_decision_diff.py --tb=short

      - name: Smoke test CLI projection
        run: |
          export HOL_GUARD_HOME="$RUNNER_TEMP/guard-home"
          mkdir -p "$HOL_GUARD_HOME"
          uv run --no-sync hol-guard desktop bootstrap --json > "$RUNNER_TEMP/desktop-bootstrap.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "desktop-bootstrap.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == "guard-desktop-bootstrap.v1"
          assert payload["status"] in {
              "ready",
              "attention_required",
              "setup_required",
              "runtime_unavailable",
              "incompatible",
          }
          PY

      - name: Verify unchanged tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = 04bed715f38b04cb75651fafdf566e86e1112da1
          test "$(git hash-object tests/fixtures/guard-command-corpus/decision-diff-report.json)" = 82df2b145386459477af85277eb514254e5339f1
          git diff --exit-code
          git diff --cached --exit-code
