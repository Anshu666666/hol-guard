name: Guard fixed fixture diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-af9-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixtures:
    if: github.ref == 'refs/heads/hgp/diagnostic-af9-fixtures-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: ['wheel-red', 'timestamps', 'ownership']
    steps:
      - name: Checkout diagnostic tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false

      - name: Checkout frozen source and ownership base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: af9b738c4e10f832e955a34db17c7abe6d150e29
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install frozen dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python 3.12

      - name: Secure managed interpreter permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Check closed diagnostic output
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: uv run --no-sync python ../diagnostic/scripts/ci/prove_af9_fixtures.py --self-test

      - name: Run original configured fixture phase
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HGP_FIXTURE_OUTPUT: ${{ runner.temp }}/guard-af9-${{ matrix.phase }}
        run: uv run --no-sync python ../diagnostic/scripts/ci/prove_af9_fixtures.py ${{ matrix.phase }}

      - name: Retain closed phase receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-af9-fixtures-${{ matrix.phase }}
          path: ${{ runner.temp }}/guard-af9-${{ matrix.phase }}/summary.json
          if-no-files-found: error
          retention-days: 1
