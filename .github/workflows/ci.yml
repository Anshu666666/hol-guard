name: Guard corpus worker profiling diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-corpus-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    if: github.ref == 'refs/heads/hgp/diagnostic-corpus-profile-75413'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false

      - name: Checkout frozen corpus source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 75413dfc16cc63f4d9e298ae4ecf099b9419572c
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install frozen dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python 3.10

      - name: Secure managed interpreter permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Check diagnostic output controls
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: uv run --no-sync python ../diagnostic/scripts/ci/profile_command_corpus.py --self-test

      - name: Profile all corpus workers
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HGP_PROFILE_OUTPUT: ${{ runner.temp }}/guard-corpus-profile
        run: uv run --no-sync python ../diagnostic/scripts/ci/profile_command_corpus.py

      - name: Retain closed diagnostic summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-corpus-worker-profile
          path: ${{ runner.temp }}/guard-corpus-profile/summary.json
          if-no-files-found: error
          retention-days: 1
