name: Guard command adapter ownership regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-command-ownership-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ownership-red:
    if: github.ref == 'refs/heads/hgp/diagnostic-command-ownership-074'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false

      - name: Checkout frozen source and ownership base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 074c0f6d4be5f9bcbdc8353933b847f24bfe5692
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install frozen dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python 3.12

      - name: Secure managed interpreter permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Reproduce current ownership mapping failures
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HGP_OWNERSHIP_RECEIPT: ${{ runner.temp }}/guard-command-ownership/summary.json
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from xml.etree import ElementTree
          
          BASE = "074c0f6d4be5f9bcbdc8353933b847f24bfe5692"
          TREE = "b9ff6529a7fa12344809cc9dcd924eba656a24b9"
          TEST = "tests/test_native_command_adapter_ownership.py"
          TEST_BLOB = "cd0cbf91257e00711543aaa3ce89967c4f44aeab"
          root = Path.cwd().resolve()
          destination = Path(os.environ["HGP_OWNERSHIP_RECEIPT"])
          summary = {"schema": "guard.command-adapter-ownership-red.v1", "baseCommit": BASE,
                     "baseTree": TREE, "testBlob": TEST_BLOB, "evidenceTier": "E2",
                     "installedRuntimeVerified": False, "sourceObservation": "Whole tracked-file hashes before and after; no import, child, or OS attestation.",
                     "rawOutputPublished": False}
          stage = "preflight"
          
          def blob(payload):
              return hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload, usedforsecurity=False).hexdigest()
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], cwd=root, stderr=subprocess.PIPE, timeout=20)
          
          def contents(path):
              return os.readlink(path).encode() if path.is_symlink() else path.read_bytes()
          
          def verify(expected):
              if any(blob(contents(root / path)) != digest for path, digest in expected.items()):
                  raise ValueError("tracked_source_changed")
          
          def run():
              global stage
              if tuple(sys.version_info[:2]) != (3, 12):
                  raise ValueError("interpreter_mismatch")
              if git("rev-parse", "HEAD").decode().strip() != BASE or git("rev-parse", "HEAD^{tree}").decode().strip() != TREE:
                  raise ValueError("base_mismatch")
              expected = {}
              for row in git("ls-tree", "-rz", "HEAD").split(b"\0"):
                  if not row:
                      continue
                  metadata, path = row.split(b"\t", 1)
                  mode, kind, digest = metadata.decode().split()
                  if kind != "blob" or mode not in {"100644", "100755", "120000"}:
                      raise ValueError("source_entry_mismatch")
                  expected[path.decode()] = digest
              if len(expected) != 4073 or TEST in expected or (root / TEST).exists():
                  raise ValueError("inventory_mismatch")
              verify(expected)
              payload = (root.parent / "diagnostic" / TEST).read_bytes()
              if blob(payload) != TEST_BLOB:
                  raise ValueError("test_blob_mismatch")
              (root / TEST).write_bytes(payload)
              expected[TEST] = TEST_BLOB
              verify(expected)
              with tempfile.TemporaryDirectory(prefix="guard-ownership-", dir=os.environ["RUNNER_TEMP"]) as temporary:
                  junit = Path(temporary) / "private.xml"
                  capture = Path(temporary) / "private.log"
                  stage = "pytest"
                  with capture.open("wb") as output:
                      result = subprocess.run(
                          [sys.executable, "-m", "pytest", "-q", "--tb=no", "--junitxml=" + str(junit), TEST],
                          cwd=root, stdout=output, stderr=subprocess.STDOUT, timeout=180,
                      )
                  summary["pytestExit"] = result.returncode
                  summary["privateOutputSha256"] = hashlib.sha256(capture.read_bytes()).hexdigest()
                  stage = "postcheck"
                  verify(expected)
                  if git("rev-parse", "HEAD").decode().strip() != BASE or git("rev-parse", "HEAD^{tree}").decode().strip() != TREE:
                      raise ValueError("base_changed")
                  summary["trackedSourceCount"] = len(expected)
                  summary["sourcePrePostPassed"] = True
                  stage = "junit"
                  cases = list(ElementTree.parse(junit).getroot().iter("testcase"))
                  names = {
                      "command-expression": "native_command_expression.py",
                      "row-association": "native_command_row_association.py",
                      "mapped-control": "native_policy_authority_compile.py",
                  }
                  wanted = {"test_command_adapter_has_policy_control_owner[" + key + "]": value for key, value in names.items()}
                  actual = [case.get("name") for case in cases]
                  selected = len(actual) == 3 and len(set(actual)) == 3 and set(actual) == set(wanted)
                  records = []
                  for case in cases:
                      name = case.get("name")
                      if name not in wanted:
                          raise ValueError("unexpected_case")
                      failures, errors, skipped = case.findall("failure"), case.findall("error"), case.findall("skipped")
                      module = wanted[name]
                      expected_failure = (
                          module != "native_policy_authority_compile.py" and len(failures) == 1
                          and failures[0].get("message") == (
                              "RuntimeError: protected hook data-plane path has no ownership mapping: "
                              "src/codex_plugin_scanner/guard/" + module
                          )
                      )
                      records.append({"module": module, "failures": len(failures), "errors": len(errors),
                                      "skipped": len(skipped), "expectedMissingMapping": expected_failure})
                  counts = {"collected": len(cases), "failed": sum(row["failures"] for row in records),
                            "errors": sum(row["errors"] for row in records), "skipped": sum(row["skipped"] for row in records)}
                  counts["passed"] = sum(not(row["failures"] or row["errors"] or row["skipped"]) for row in records)
                  expected_red = (
                      selected and result.returncode == 1
                      and counts == {"collected": 3, "failed": 2, "errors": 0, "skipped": 0, "passed": 1}
                      and all(row["expectedMissingMapping"] for row in records if row["failures"])
                      and all(not(row["errors"] or row["skipped"]) for row in records)
                  )
                  summary.update({"counts": counts, "cases": records, "selectionValid": selected,
                                  "junitSha256": hashlib.sha256(junit.read_bytes()).hexdigest(),
                                  "expectedRedObserved": expected_red, "evidenceComplete": expected_red})
                  return result.returncode if result.returncode else 2
          
          try:
              os.umask(0o077)
              exit_code = run()
          except BaseException as error:
              name = type(error).__name__
              summary.update({"status": "diagnostic_error", "stage": stage,
                              "exceptionClass": name if name in {"ValueError", "OSError", "FileNotFoundError", "TimeoutExpired", "CalledProcessError", "ParseError"} else "OtherException",
                              "evidenceComplete": False})
              exit_code = 124 if isinstance(error, subprocess.TimeoutExpired) else 2
          summary["diagnosticExit"] = exit_code
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(summary, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, sort_keys=True))
          raise SystemExit(exit_code)
          PY

      - name: Retain closed regression receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-command-adapter-ownership-red
          path: ${{ runner.temp }}/guard-command-ownership/summary.json
          if-no-files-found: error
          retention-days: 1
