name: Prewarm failure-boundary observation

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact reviewed diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oracle-ready-imports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        proof: [prewarm]
    if: github.repository == 'hashgraph-online/hol-guard' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-prewarm-boundary-155cc5e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_DIAGNOSTIC_SHA: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      PYTHONDONTWRITEBYTECODE: '1'
      ORACLE_READY_MODE: ${{ matrix.proof }}
    steps:
      - name: Checkout exact diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify diagnostic identity and driver before setup
        run: |
          python3 <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], stderr=subprocess.PIPE).decode().strip()
          if os.environ["EXPECTED_DIAGNOSTIC_SHA"] != os.environ["GITHUB_SHA"] or git("rev-parse", "HEAD") != os.environ["GITHUB_SHA"]:
              raise SystemExit("Diagnostic commit mismatch.")
          if git("rev-parse", "HEAD^{tree}") != os.environ["EXPECTED_DIAGNOSTIC_TREE"]:
              raise SystemExit("Diagnostic tree mismatch.")
          if git("show", "-s", "--format=%P", "HEAD") != "155cc5e001cd03b96f5003f9ae2f66ac8d5d4468":
              raise SystemExit("Diagnostic parent mismatch.")
          expected = {
              "scripts/ci/prove_oracle_ready_imports.py": "e79bc5239dd64c983a3e68a1b5a33e0f0d302d6e",
              "pyproject.toml": "dd7ea7046ebb399bde94d1532dce9149437cab43",
              "uv.lock": "87a7e665302f34c6ae1100387425572bab6e7c51",
              "conftest.py": "9e1408c12fe951ad2f1541b1c2c0508f3c35b41a",
              "tests/conftest.py": "61e6d98609309fac99c9baae50fab5f47229fcde",
          }
          for path, expected_sha in expected.items():
              data = Path(path).read_bytes()
              if hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() != expected_sha:
                  raise SystemExit("Diagnostic source pin mismatch.")
          print("ORACLE_READY_SOURCE_PINS_VERIFIED")
          PY
      - name: Set up supported native Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install locked dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python 3.13
      - name: Secure managed interpreter permissions
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; assert sys.version_info[:2] == (3, 13); print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="$interpreter.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Validate selected candidate proof
        run: uv run --no-sync python -m scripts.ci.prove_oracle_ready_imports
      - name: Retain closed failure-boundary observations only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oracle-ready-${{ matrix.proof }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/guard-oracle-ready-${{ matrix.proof }}/summary.json
          if-no-files-found: error
          retention-days: 7
