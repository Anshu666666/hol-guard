      - name: Prove preservation and emit complete generated bytes
        run: |
          uv run --no-sync python -I - <<'PY'
          import ast
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          
          SOURCE = "5102c8dac95edb18d15ef9054fdf15bad15bdfc6"
          PARENT = "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py"
          HELPER = "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_attempt.py"
          EXPECTED = {
              PARENT: "cb1d92fde143161811dc5c7d9b61099f913bcc78",
              HELPER: "bdc9b2b15dd27f6034fce45c5c8fc3eea4f8ba2c",
          }
          
          def git_bytes(*arguments):
              return subprocess.check_output(["git", *arguments])
          
          def blob_sha(raw):
              return hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()
          
          def parse(raw, path):
              text = raw.decode("utf-8")
              tree = ast.parse(text, filename=path, type_comments=True, feature_version=(3, 10))
              compile(tree, path, "exec")
              return tree
          
          def parent_structure(tree):
              body = list(tree.body)
              assert isinstance(body[0], ast.Expr) and isinstance(body[0].value, ast.Constant)
              assert isinstance(body[0].value.value, str)
              stop = 1
              while stop < len(body) and isinstance(body[stop], (ast.Import, ast.ImportFrom)):
                  stop += 1
              assert stop > 1
              futures = []
              imports = []
              for node in body[1:stop]:
                  if isinstance(node, ast.ImportFrom) and node.module == "__future__":
                      futures.append(ast.dump(node, include_attributes=False))
                  elif isinstance(node, ast.Import):
                      imports.extend(("import", "", 0, alias.name, alias.asname or "") for alias in node.names)
                  else:
                      imports.extend(("from", node.module or "", node.level, alias.name, alias.asname or "") for alias in node.names)
              remainder = ast.Module(body=[body[0], *body[stop:]], type_ignores=tree.type_ignores)
              return futures, sorted(imports), ast.dump(remainder, include_attributes=False)
          
          version = subprocess.check_output(["uv", "run", "--no-sync", "ruff", "--version"], text=True).strip()
          assert version == "ruff 0.15.17", version
          records = []
          for path in (PARENT, HELPER):
              original = git_bytes("show", SOURCE + ":" + path)
              assert blob_sha(original) == EXPECTED[path]
              metadata = Path(path).lstat()
              assert stat.S_ISREG(metadata.st_mode) and not Path(path).is_symlink()
              assert metadata.st_mode & 0o111 == 0
              generated = Path(path).read_bytes()
              assert 0 < len(generated) <= 65536
              before, after = parse(original, path), parse(generated, path)
              if path == PARENT:
                  assert parent_structure(before) == parent_structure(after)
              else:
                  assert ast.dump(before, include_attributes=False) == ast.dump(after, include_attributes=False)
              assert generated != original, path
              nonblank = sum(bool(line.strip()) for line in generated.decode("utf-8").splitlines())
              assert nonblank <= 500
              encoded = base64.b64encode(generated).decode("ascii")
              chunks = [encoded[offset:offset + 4096] for offset in range(0, len(encoded), 4096)]
              records.append({
                  "path": path,
                  "before": EXPECTED[path],
                  "after": blob_sha(generated),
                  "sha256": hashlib.sha256(generated).hexdigest(),
                  "bytes": len(generated),
                  "mode": "100644",
                  "nonblank": nonblank,
                  "chunks": chunks,
              })
          assert git_bytes("diff", "--name-status", "--no-renames", "HEAD").decode().splitlines() == [
              "M\t" + path for path in sorted(EXPECTED)
          ]
          subprocess.run(["git", "diff", "--cached", "--exit-code"], check=True)
          for record in records:
              chunks = record.pop("chunks")
              print(json.dumps({"record": "formatted-file", **record, "chunkCount": len(chunks)}, sort_keys=True))
              for index, chunk in enumerate(chunks):
                  print(json.dumps({
                      "record": "formatted-file-chunk",
                      "path": record["path"],
                      "after": record["after"],
                      "index": index,
                      "count": len(chunks),
                      "base64": chunk,
                  }, sort_keys=True))
          print(json.dumps({
              "record": "formatting-preservation",
              "source": SOURCE,
              "files": len(records),
              "ruff": version,
              "helperAstExact": True,
              "parentNonImportAstExact": True,
              "parentFutureImportsExact": True,
              "parentImportAliasesExact": True,
              "allOtherTrackedBytesUnchanged": True,
              "totalGeneratedBytes": sum(record["bytes"] for record in records),
          }, sort_keys=True))
          PY
