name: Publication barrier JSON diagnostics
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    if: github.ref == 'refs/heads/hgp/diagnostic-publication-barrier-state-v2-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
      SOURCE_SHA: aea0347c6c58fae61d653162339cdba003704582
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify immutable diagnostic source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$SOURCE_SHA" = aea0347c6c58fae61d653162339cdba003704582
          test "$(git show -s --format=%P HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = 0bd4b587e0e422d0cf8be79e38e14de7fea70909
          test "$(git show -s --format=%P "$SOURCE_SHA")" = 9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12
          for revision in HEAD "$SOURCE_SHA"; do
            test "$(git show -s --format=%an "$revision")" = kantorcodes
            test "$(git show -s --format=%cn "$revision")" = kantorcodes
            test "$(git show -s --format=%ae "$revision")" = 6068672+kantorcodes@users.noreply.github.com
            test "$(git show -s --format=%ce "$revision")" = 6068672+kantorcodes@users.noreply.github.com
          done
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py)" = a331ffb3e6275864618452e1adc57c01aaab5fa6
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py)" = 0c741eff8d1dda464cf808e75e3efc36dc913a41
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scheduling.py)" = 0a500224add718d93aa989258125a35790746400
          test "$(git hash-object tests/test_native_policy_snapshot_resident_retry.py)" = 3391082592bdc47aabee11af68ede3f33dfd7346
          test "$(git hash-object tests/test_native_policy_snapshot_reservation_capture.py)" = a663d5014bc62822c0c86d970b0ce056f4e97cd3
          test "$(git hash-object tests/test_native_policy_publication_superseded_error.py)" = 248a4cbdd4689327077f4db9e1ae93b35cd3abe9
          test "$(git hash-object tests/test_native_policy_publication_late_error.py)" = df5f50464fd57e9f76d8fd44b09450031d80a114
          test "$(git hash-object tests/test_native_policy_context_epoch.py)" = d74a7813d478d69eb627d21dcbd3acdb8e40be7b
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot.py)" = b3ae0ad5c7f458c824032cbd08d28b9ba1ae111c
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_v3_renewal.py)" = a389271a7c52ea51ec119fb94251b9c58344f03d
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_authority_read.py)" = 9dac9c06033f2c354a3fd0c174760006fa926a73
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_transport.py)" = ab1c0572c0a6b8cbd3e22822388dce6df2fdb196
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scoped.py)" = 9b59002f683443f190e6535bbdd66cddf525a1d0
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py)" = 186102bbe8f52f8a4fd2ae50ba36235c7b628fde
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_source_requirement.py)" = 417c3066e8e413eecab52d9e989b01e37854baaa
          test "$(git hash-object tests/native_policy_snapshot_test_fixtures.py)" = e6809fc5e6b09590a63698e8d8bfef597252b9f4
          test "$(git hash-object tests/test_native_policy_snapshot_v3_publisher.py)" = b73e7f4ed86dd69d0f2ffc0924dbb493fe0c123f
          test "$(git hash-object tests/test_native_policy_snapshot_publisher.py)" = c997ff48fb87e47e26ddd63e34ae994c7058933f
          test "$(git hash-object tests/test_native_policy_snapshot_persistence.py)" = f4a82792fa049724f2fd1133d43aa20aa59cbefb
          test "$(git hash-object tests/test_native_source_free_renewal.py)" = 433d59d0a74d0d04be3cf4659df858a2ddd513ff
          test "$(git hash-object tests/test_native_policy_snapshot_v4_barrier.py)" = 255359a8e7d239fc5c907c331414ef5f10d750f6
          test "$(git hash-object tests/test_native_policy_source_selection.py)" = b6c63d74776ee75055b6b0b061d3205e6b55aa84
          test "$(git hash-object tests/test_native_policy_snapshot_retirement.py)" = 99645a55bef0eebf115d21806b3bee82b612f1e2
          test "$(git hash-object tests/test_native_policy_snapshot_control.py)" = edc5f686be49b69251287a5153d6e58986705e31
          test "$(git hash-object tests/test_native_policy_control_transport.py)" = 91749138413d5819ddff4321d46bfe71509c4b1e
          test "$(git hash-object tests/test_native_source_authority_fence.py)" = 7e94e7625a5c8e76eaf2bc20453f44f2e9b23535
          test "$(git hash-object tests/test_native_policy_snapshot_v4_publication.py)" = 82214f98c06c9c43d854156b9cf6612cd4d7538a
          test "$(git hash-object tests/test_native_managed_cache_publication.py)" = 9a9f9868863a8d5095a5c10d5bece2b28495a5be
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object pyproject.toml)" = 64a0281ee6b4f57a74cab68ac992fec3d782a6bb
          test "$(git hash-object uv.lock)" = 10e18a310e63ba3c5940e25b44269d48dfc7f2da
          test "$(git hash-object basedpyright.native-managed-source.json)" = 4b56aeeb41fa2af0129511bcd3f7da2f37669d39
          test "$(git hash-object scripts/ci/rust_authority_ownership_gate.py)" = 1094b90b51ee11e746018151bd8f91066b981ff6
          test "$(git hash-object scripts/ci/rust_io_ownership_gate.py)" = 004e7379ba3eeca4af53209136fab3dc44a52da8
          test "$(git hash-object tests/test_native_publication_diagnostic.py)" = 48bd36f6c4d30a601fc524250dcff62a5cffaad1
          git diff --exit-code
          git diff --cached --exit-code
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/barrier-diagnostic-changed.txt"
          printf '%s\n' .github/workflows/ci.yml tests/test_native_policy_snapshot_publisher.py > "$RUNNER_TEMP/barrier-diagnostic-expected.txt"
          cmp "$RUNNER_TEMP/barrier-diagnostic-changed.txt" "$RUNNER_TEMP/barrier-diagnostic-expected.txt"
          git diff --name-only "$SOURCE_SHA^" "$SOURCE_SHA" | sort > "$RUNNER_TEMP/barrier-source-changed.txt"
          printf '%s\n' src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scheduling.py tests/test_native_policy_context_epoch.py tests/test_native_policy_publication_late_error.py tests/test_native_policy_publication_superseded_error.py tests/test_native_policy_snapshot_reservation_capture.py tests/test_native_policy_snapshot_resident_retry.py > "$RUNNER_TEMP/barrier-source-expected.txt"
          cmp "$RUNNER_TEMP/barrier-source-changed.txt" "$RUNNER_TEMP/barrier-source-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install frozen test dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        id: interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check diagnostic formatting and imports
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          test "$(uv run --no-sync ruff --version)" = "ruff 0.15.17"
          uv run --no-sync ruff check tests/test_native_policy_snapshot_publisher.py
          uv run --no-sync ruff format --check tests/test_native_policy_snapshot_publisher.py
      - name: Diagnose original renewal and V3 publication
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
            tests/test_native_source_free_renewal.py \
            tests/test_native_policy_snapshot_v3_publisher.py \
            --tb=short
      - name: Verify tracked source after diagnostics
