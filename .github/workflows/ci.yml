name: Native publication formatting capture

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-publication-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formatting:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-post-ack-format-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before formatting
        id: source_guard
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == "5102c8dac95edb18d15ef9054fdf15bad15bdfc6"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-post-ack-format-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, "edf02c6321d957e25251e59b2c22e0f5326a7466"]
          assert git("rev-parse", source + "^{tree}") == "f3d7585ffbfab7aff3920cc50f2c55daa1b5e98a"
          assert git("rev-parse", "edf02c6321d957e25251e59b2c22e0f5326a7466^{tree}") == "3d5cb7f7b8c23f6f6eaabcb98b6f9b32ba0336a0"
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, "HEAD") == git("show", "-s", identity, source)
          assert git("show", "-s", identity, source) == git("show", "-s", identity, "51d5684be15c03b979e145663e110ec5bfdc94ee")
          assert git("diff", "--name-status", "edf02c6321d957e25251e59b2c22e0f5326a7466", source).splitlines() == ["M\tbasedpyright.native-managed-source.json","M\tdocs/guard/runtime-lane-capabilities.md","M\trust/crates/guard-runtime/src/resident_protocol.rs","M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_constants.py","M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","A\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher_attempt.py","M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py","M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher_transport.py","M\tsrc/codex_plugin_scanner/guard/policy_lane_capabilities.py","A\tsrc/codex_plugin_scanner/guard/runtime/receipt_sync_steps.py","M\tsrc/codex_plugin_scanner/guard/runtime/runner.py","A\tsrc/codex_plugin_scanner/guard/runtime/sync_request_attempts.py","A\ttests/test_native_generic_sync_unstaged.py","A\ttests/test_native_policy_snapshot_post_ack_retry.py","A\ttests/test_native_policy_snapshot_post_ack_retry_commit.py","A\ttests/test_native_policy_snapshot_post_ack_retry_guards.py","M\ttests/test_native_policy_snapshot_resident_retry.py","M\ttests/test_policy_lane_cli.py"]
