name: Policy fixture import quality

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact reviewed diagnostic tree
        required: true
        type: string
      workflow_blob:
        description: Exact reviewed workflow blob
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixture-import-quality:
    if: github.ref == 'refs/heads/hgp/diagnostic-policy-fixture-imports-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
      EXPECTED_WORKFLOW: ${{ inputs.workflow_blob }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and bounded change
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-fixture-import-source.py" <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          for key in ("EXPECTED_COMMIT", "EXPECTED_TREE", "EXPECTED_WORKFLOW"):
              assert re.fullmatch(r"[0-9a-f]{40}", os.environ[key]), key
          assert git("rev-parse", "HEAD") == os.environ["EXPECTED_COMMIT"]
          assert git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD^{tree}") == os.environ["EXPECTED_TREE"]
          assert git("show", "-s", "--format=%P", "HEAD") == "04bed715f38b04cb75651fafdf566e86e1112da1"
          expected = {
              ".github/workflows/ci.yml": os.environ["EXPECTED_WORKFLOW"],
              "tests/test_policy_signer_rotation_runtime.py": "2eb6da547f2644041a30857d8b31396c9acd7174",
              "tests/test_policy_telemetry_review_failures.py": "78f65c4de40c2640d003036a205c4729ff08c0a8",
          }
          assert set(git("diff", "--name-only", "HEAD^", "HEAD").splitlines()) == set(expected)
          for path, sha in expected.items():
              entry = git("ls-tree", "HEAD", "--", path).split()
              assert entry[:3] == ["100644", "blob", sha], path
              assert git("hash-object", path) == sha, path
          assert git("hash-object", "pyproject.toml") == "dd7ea7046ebb399bde94d1532dce9149437cab43"
          assert git("hash-object", "uv.lock") == "87a7e665302f34c6ae1100387425572bab6e7c51"
          assert not git("status", "--porcelain", "--untracked-files=no")
          print("Exact source, modes and three-path boundary verified")
          PY
          python "$RUNNER_TEMP/verify-fixture-import-source.py"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install the unchanged locked quality toolchain
        run: uv sync --frozen --extra dev --python 3.12
      - name: Verify the locked Ruff version
        run: |
          set -euo pipefail
          test "$(uv run --no-sync python -m ruff --version)" = "ruff 0.15.17"
          uv run --no-sync python -m ruff --version
      - name: Check the two repaired import groups
        run: |
          uv run --no-sync python -m ruff check \
            tests/test_policy_signer_rotation_runtime.py \
            tests/test_policy_telemetry_review_failures.py
      - name: Check formatting of the same two files
        if: ${{ always() && !cancelled() }}
        run: |
          uv run --no-sync python -m ruff format --check \
            tests/test_policy_signer_rotation_runtime.py \
            tests/test_policy_telemetry_review_failures.py
      - name: Verify source remained exact
        if: ${{ always() && !cancelled() }}
        run: python "$RUNNER_TEMP/verify-fixture-import-source.py"
