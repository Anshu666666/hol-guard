name: Worker fixture lifecycle repair verification
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    if: github.ref == 'refs/heads/hgp/diagnostic-worker-lifecycle-repair-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.13"]
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable diagnostic source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = 1ca2f9662da160623545e5a11501d9f3234a9170
          test "$(git rev-parse HEAD:tests/test_native_authority_fixture_lifecycle.py)" = 4f308e300c7594ce38d797232d73f37599437a6f
          test "$(git hash-object tests/test_rust_pretool_authority.py)" = 05209122bd1c8ecce227473170de93a947de574a
          test "$(git hash-object tests/test_rust_pretool_authority_worker.py)" = c055f9e2decdfd6a0cff1663a14ec4accea1c345
          test "$(git hash-object src/codex_plugin_scanner/guard/daemon/hook_worker.py)" = ed969bba5cacff2bb80491a871bf82d645e4c042
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot.py)" = b3ae0ad5c7f458c824032cbd08d28b9ba1ae111c
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py)" = 5b36aca18120f759bd63b3ed0420863438f2c917
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object tests/bundle_first_cloud.py)" = 6fb49e098b3c6973cf5017e8688fc9e61113ec50
          test "$(git hash-object tests/guard_test_invariants.py)" = 2aa54c626525881c7b1ecdab1077e029560f1f0d
          git diff --exit-code
          git diff --cached --exit-code
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/lifecycle-changed.txt"
          printf '%s\n' .github/workflows/ci.yml tests/test_native_authority_fixture_lifecycle.py tests/test_rust_pretool_authority.py tests/test_rust_pretool_authority_worker.py > "$RUNNER_TEMP/lifecycle-expected.txt"
          cmp "$RUNNER_TEMP/lifecycle-changed.txt" "$RUNNER_TEMP/lifecycle-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check formatting and imports
        run: |
          test "$(uv run --no-sync ruff --version)" = "ruff 0.15.17"
          uv run --no-sync ruff check tests/test_native_authority_fixture_lifecycle.py tests/test_rust_pretool_authority.py tests/test_rust_pretool_authority_worker.py
          uv run --no-sync ruff format --check tests/test_native_authority_fixture_lifecycle.py tests/test_rust_pretool_authority.py tests/test_rust_pretool_authority_worker.py
      - name: Run original-test lifecycle observations
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q tests/test_native_authority_fixture_lifecycle.py tests/test_rust_pretool_authority.py tests/test_rust_pretool_authority_worker.py --tb=short
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git hash-object tests/test_native_authority_fixture_lifecycle.py)" = 4f308e300c7594ce38d797232d73f37599437a6f
          test "$(git hash-object tests/test_rust_pretool_authority.py)" = 05209122bd1c8ecce227473170de93a947de574a
          test "$(git hash-object tests/test_rust_pretool_authority_worker.py)" = c055f9e2decdfd6a0cff1663a14ec4accea1c345
          test "$(git hash-object src/codex_plugin_scanner/guard/daemon/hook_worker.py)" = ed969bba5cacff2bb80491a871bf82d645e4c042
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot.py)" = b3ae0ad5c7f458c824032cbd08d28b9ba1ae111c
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py)" = 5b36aca18120f759bd63b3ed0420863438f2c917
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object tests/bundle_first_cloud.py)" = 6fb49e098b3c6973cf5017e8688fc9e61113ec50
          test "$(git hash-object tests/guard_test_invariants.py)" = 2aa54c626525881c7b1ecdab1077e029560f1f0d
          git diff --exit-code
          git diff --cached --exit-code
          echo 'LIFECYCLE_REPAIR_TRACKED_SOURCE_UNCHANGED=true'
