name: Cloud Review consent expiry diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consent-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: proof
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/hol-guard
          ref: 155cc5e001cd03b96f5003f9ae2f66ac8d5d4468
          path: core
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - name: Verify immutable sources before dependency installation
        shell: bash
        env:
          PROOF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C proof rev-parse HEAD)" = "$PROOF_SHA"
          test -z "$(git -C proof status --porcelain)"
          test "$(git -C core rev-parse HEAD)" = "155cc5e001cd03b96f5003f9ae2f66ac8d5d4468"
          test "$(git -C core rev-parse HEAD^{tree})" = "7fad36a6f5c02f11d6e47d60c7c0f27e611afb31"
          test -z "$(git -C core status --porcelain)"
          test "$(git hash-object proof/tests/test_guard_cloud_review_retry_consent_expiry.py)" = "a7c6b79fd8f2c1b05984a8ee8a901d921cd3eea6"
          test ! -e core/tests/test_guard_cloud_review_retry_consent_expiry.py
          printf 'CONSENT_BOUNDARY_SOURCE stage=before core=155cc5e001cd03b96f5003f9ae2f66ac8d5d4468 test=a7c6b79fd8f2c1b05984a8ee8a901d921cd3eea6\n'
      - name: Install the existing locked Core development dependencies
        working-directory: core
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run the new boundary regression and existing consent controls
        working-directory: core
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          cp ../proof/tests/test_guard_cloud_review_retry_consent_expiry.py tests/test_guard_cloud_review_retry_consent_expiry.py
          test "$(git hash-object tests/test_guard_cloud_review_retry_consent_expiry.py)" = "a7c6b79fd8f2c1b05984a8ee8a901d921cd3eea6"
          uv run --no-sync pytest -q --tb=short -rA tests/test_guard_cloud_review_retry_consent_expiry.py tests/test_guard_cloud_review_settings_idempotent.py tests/test_cloud_review_consent_recovery_identity.py
      - name: Verify sources after the ordinary pytest exit
        if: always()
        shell: bash
        env:
          PROOF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C proof rev-parse HEAD)" = "$PROOF_SHA"
          test -z "$(git -C proof status --porcelain)"
          test "$(git -C core rev-parse HEAD)" = "155cc5e001cd03b96f5003f9ae2f66ac8d5d4468"
          test "$(git -C core rev-parse HEAD^{tree})" = "7fad36a6f5c02f11d6e47d60c7c0f27e611afb31"
          test -z "$(git -C core status --porcelain --untracked-files=no)"
          test "$(git hash-object proof/tests/test_guard_cloud_review_retry_consent_expiry.py)" = "a7c6b79fd8f2c1b05984a8ee8a901d921cd3eea6"
          if [ -e core/tests/test_guard_cloud_review_retry_consent_expiry.py ]; then
            test "$(git hash-object core/tests/test_guard_cloud_review_retry_consent_expiry.py)" = "a7c6b79fd8f2c1b05984a8ee8a901d921cd3eea6"
          fi
          printf 'CONSENT_BOUNDARY_SOURCE stage=after core=155cc5e001cd03b96f5003f9ae2f66ac8d5d4468 test=a7c6b79fd8f2c1b05984a8ee8a901d921cd3eea6\n'
