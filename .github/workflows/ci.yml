name: Claude assertion diagnostic
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        description: Immutable diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Immutable diagnostic tree
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CI_UV_CACHE_DEPENDENCY_GLOB: |
    pyproject.toml
    uv.lock
    requirements.txt
    docker-requirements.txt

jobs:
  original-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
      DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the unchanged product and original test source
        shell: bash
        run: |
          [[ "$DIAGNOSTIC_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTIC_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$DIAGNOSTIC_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          test "$(git rev-parse HEAD^)" = a53d471c334f4fdf32db45e5230dd980910d2c53
          git diff --exit-code a53d471c334f4fdf32db45e5230dd980910d2c53 -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)scripts/ci/claude_daemon_miss_diagnostic.py' \
            ':(exclude)scripts/ci/test_claude_daemon_miss_diagnostic.py'
          test "$(git hash-object scripts/ci/claude_daemon_miss_diagnostic.py)" = 2866b835fe9cd986cae2151fc6880fad1a59fdbe
          test "$(git hash-object scripts/ci/test_claude_daemon_miss_diagnostic.py)" = ea7e733309bc9c99a029a77e43c279f74053979b
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CLAUDE_DIAGNOSTIC_SOURCE_VERIFIED"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
          save-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Verify the terminal classifier controls
        run: |
          uv run --no-sync ruff check scripts/ci/claude_daemon_miss_diagnostic.py scripts/ci/test_claude_daemon_miss_diagnostic.py
          PYTHONPATH=scripts/ci uv run --no-sync pytest scripts/ci/test_claude_daemon_miss_diagnostic.py --tb=short
      - name: Download and verify the original immutable pytest shard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/10563401506/zip" > "$RUNNER_TEMP/claude-original-plan.zip"
          python - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          import zipfile

          archive_path = Path(os.environ["RUNNER_TEMP"]) / "claude-original-plan.zip"
          assert archive_path.stat().st_size == 483_292
          archive_bytes = archive_path.read_bytes()
          assert hashlib.sha256(archive_bytes).hexdigest() == "741ff934e7cca944bdbfd57e21a3ac144c39ae28f501b66faf6ab0e023d6da23"
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              matches = [entry for entry in archive.infolist() if entry.filename == "shard-87.txt"]
              assert len(matches) == 1
              entry = matches[0]
              assert not entry.is_dir() and not entry.flag_bits & 1
              assert 0 < entry.file_size <= 131_072
              with archive.open(entry) as member:
                  shard_bytes = member.read(131_073)
              assert len(shard_bytes) == entry.file_size
          target = (
              "tests/test_guard_claude_adapter.py::"
              "test_claude_daemon_hook_command_falls_back_to_native_ask_on_daemon_miss"
          )
          assert shard_bytes.decode("utf-8").splitlines().count(target) == 1
          destination = Path("pytest-shards") / "shard-87.txt"
          destination.parent.mkdir(exist_ok=True)
          destination.write_bytes(shard_bytes)
          print("CLAUDE_ORIGINAL_SHARD_VERIFIED", hashlib.sha256(shard_bytes).hexdigest())
          PY
      - name: Run original shard 87 with terminal-only classification
        shell: bash
        run: |
          shard_file=$(printf 'pytest-shards/shard-%02d.txt' "87")
          test -s "$shard_file"
          PYTHONPATH=scripts/ci GUARD_PYTEST_DURATION_OUTPUT=pytest-durations.json GUARD_PYTEST_UNDER_COVERAGE=1 \
            uv run --no-sync pytest -p pytest_duration_report -p claude_daemon_miss_diagnostic "@$shard_file" --tb=short \
            --deselect tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial \
            --cov --cov-branch --cov-report=
      - name: Verify source after the ordinary pytest result
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          test "$(git rev-parse HEAD^)" = a53d471c334f4fdf32db45e5230dd980910d2c53
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CLAUDE_DIAGNOSTIC_SOURCE_STILL_VERIFIED"
