name: Current decision report regeneration
run-name: Current decision report regeneration on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-report-regeneration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-report-regeneration-cc42'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout immutable current source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/hol-guard
          ref: cc42b9c70f45471869bb53c7f211ed26a063e0a1
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install locked dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Run normal generator and verify exact report delta
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '1'
          TZ: UTC
          LC_ALL: C
          HGP_REPORT_OUTPUT: ${{ runner.temp }}/guard-current-report
        run: uv run --no-sync python ../diagnostic/scripts/ci/regenerate_current_decision_report.py
      - name: Retain actual generated report and closed summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-current-generated-report
          path: |
            ${{ runner.temp }}/guard-current-report/summary.json
            ${{ runner.temp }}/guard-current-report/generated-report.json
          if-no-files-found: error
          retention-days: 1
