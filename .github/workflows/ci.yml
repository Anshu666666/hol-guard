name: Current performance semantic comparison
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-semantics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'hashgraph-online/hol-guard' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-performance-semantics-bc047'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout fixed baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: bc0479bcab1cbc925421c9ebc7a7b926bccd131d
          path: baseline
          persist-credentials: false
      - name: Checkout fixed candidate predecessor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: bc0479bcab1cbc925421c9ebc7a7b926bccd131d
          path: candidate
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install locked baseline dependencies
        working-directory: baseline
        run: uv sync --frozen --extra dev --python 3.12
      - name: Install separate locked candidate dependencies
        working-directory: candidate
        run: uv sync --frozen --extra dev --python 3.12
      - name: Secure managed interpreter permissions
        shell: bash
        run: |
          set -euo pipefail
          for source in baseline candidate; do
            (
              cd "$source"
              interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
              target="$(realpath "$interpreter")"
              mode="$(stat -c '%a' "$target")"
              if (( (8#$mode & 2) != 0 )); then
                replacement="${interpreter}.guard-ci"
                cp --dereference "$target" "$replacement"
                chmod 0755 "$replacement"
                mv "$replacement" "$target"
              fi
              secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
              (( (8#$secured_mode & 2) == 0 ))
            )
          done
      - name: Compare exact collection and semantic results
        env:
          HGP_PERF_RECEIPT: ${{ runner.temp }}/guard-performance-semantics/summary.json
        run: python diagnostic/scripts/guard-performance-semantics-diagnostic.py
      - name: Retain closed semantic receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-performance-semantic-comparison
          path: ${{ runner.temp }}/guard-performance-semantics/summary.json
          if-no-files-found: error
          retention-days: 1
