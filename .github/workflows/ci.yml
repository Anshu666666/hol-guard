name: Store extraction acceptance
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    if: github.ref == 'refs/heads/hgp/diagnostic-store-extraction-acceptance-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify immutable extraction source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = e18226860b66af2202a2f689996c6626bd4e3b7e
          test "$(git show -s --format=%P "$SOURCE_SHA")" = 9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12
          test "$(git hash-object .github/workflows/native-managed-source-contract.yml)" = cf1d3abfbcdd9250f4c99b966310c10de3cdc319
          test "$(git hash-object basedpyright.native-managed-source.json)" = 4b56aeeb41fa2af0129511bcd3f7da2f37669d39
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object pyproject.toml)" = 64a0281ee6b4f57a74cab68ac992fec3d782a6bb
          test "$(git hash-object src/codex_plugin_scanner/__init__.py)" = 1bde9899a1379c44d9bbccfd8651608e1e013101
          test "$(git hash-object src/codex_plugin_scanner/guard/__init__.py)" = 4a85303da8860d127c5e2d6ed29cd76598d12264
          test "$(git hash-object src/codex_plugin_scanner/guard/native_runtime.py)" = 84b47cffb76f7d21d6af722ae4adc70ae4698eff
          test "$(git hash-object src/codex_plugin_scanner/guard/native_runtime_selection.py)" = 301939afbe4df673d78f34ea2aeed180911b09d6
          test "$(git hash-object src/codex_plugin_scanner/guard/runtime/__init__.py)" = b438aac9453e3065584ce0eb6587f178858b73dc
          test "$(git hash-object src/codex_plugin_scanner/guard/runtime/oauth_refresh_context.py)" = da13c9a3dbd7645cac6d056da567fbfd54842b7d
          test "$(git hash-object src/codex_plugin_scanner/guard/runtime/runner.py)" = 4743967f29196a7fce91d4bca3ec02e2f674bc6e
          test "$(git hash-object src/codex_plugin_scanner/guard/store.py)" = 4edf1f65655e01fea4f634252d4242819ef92f52
          test "$(git hash-object src/codex_plugin_scanner/guard/store_cloud_events.py)" = b9330e96ae7ff68abc172b21c3f730f561602f85
          test "$(git hash-object src/codex_plugin_scanner/guard/store_connection_schema.py)" = c1630ef634b8b4ae79dbd67e1c1d0c045f58b485
          test "$(git hash-object src/codex_plugin_scanner/guard/store_extension_control_authority.py)" = cf793818bccbbba28612b26414b305ab2d6accce
          test "$(git hash-object src/codex_plugin_scanner/guard/store_extension_control_authority_support.py)" = abcbe92b9615cb3b667103e4893613d5cf5cdb32
          test "$(git hash-object src/codex_plugin_scanner/guard/store_oauth.py)" = 5c3fac2a8f9ad284b1e4723eb127d026edf4fe12
          test "$(git hash-object src/codex_plugin_scanner/guard/store_oauth_connection_authority.py)" = 907cebee5f0d3e7a0ea3e785eb397238d8e831c9
          test "$(git hash-object src/codex_plugin_scanner/guard/store_sync_locks.py)" = 8a68a6d0208890958746f8a4e336bb48c84fe5ce
          test "$(git hash-object src/codex_plugin_scanner/guard/store_sync_payload_mutations.py)" = 44319c8d3e2848456841d60933a5db64f4b9c8b3
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object tests/fixtures/guard-command-corpus/decision-diff-report.json)" = ce50852ebd4f5f65415aa28cade8703cd7ab5fad
          test "$(git hash-object tests/guard_command_decision_diff.py)" = 2150c9eb1da9371966b26cbfd1a8737fbf7e2e64
          test "$(git hash-object tests/oauth_refresh_connection_support.py)" = 0a2e9677e267d1cd40e3a88e01915a9aa69ed83b
          test "$(git hash-object tests/oauth_refresh_fixture_support.py)" = dcab0efe509dd99d543942987db3ddccdc32d62a
          test "$(git hash-object tests/test_aibom_daemon_authority.py)" = 3182b375e8eafa70a7e8d40c8759bbdce7eb2cb0
          test "$(git hash-object tests/test_aibom_operation_authority.py)" = 1ec0cb1f6116e59ffd2a76f6ae4b4ecaae7af1e8
          test "$(git hash-object tests/test_aibom_sync_admission.py)" = a0344046d3f564992611c98485329bd8687296de
          test "$(git hash-object tests/test_guard_command_queue.py)" = 0021778c8119fe28c346996cbb239381fa30b64c
          test "$(git hash-object tests/test_guard_daemon_storage_liveness.py)" = a866713f175f3011de12c4bb739519e4709ca746
          test "$(git hash-object tests/test_guard_extension_control_api.py)" = 7b5214f6bcdc4ed4012330ef54f2b5fc7b238ad5
          test "$(git hash-object tests/test_guard_native_runtime.py)" = cee42c2a77b1f4bc2afaf05e85fe6ddd0a37052a
          test "$(git hash-object tests/test_guard_oauth_cached_expiry_compatibility.py)" = b4d3f8554c99b0d45efc5e6efb3f702f41c3917d
          test "$(git hash-object tests/test_guard_oauth_reconnect.py)" = 5b1e5a0a97b22fbfcee40389ee73a468ff929f88
          test "$(git hash-object tests/test_guard_oauth_refresh_resilience.py)" = 9dd402073a05f0da18c3ce6ebce707b61ed974f8
          test "$(git hash-object tests/test_guard_runtime.py)" = 699f385b4de589deb0d3980464314dfcefc55a9d
          test "$(git hash-object tests/test_inventory_consumer_authority.py)" = 0702ad27e21ec0908d2ea86d4595d4119cb7bcb2
          test "$(git hash-object tests/test_inventory_oauth_completion_authority.py)" = 74671e83adc21a7c2547b783d3b08595e6c39b4d
          test "$(git hash-object tests/test_inventory_request_authority.py)" = 4db5bf0d023b25b15e42d0a127ba6b7098902d90
          test "$(git hash-object tests/test_native_policy_authority_coherent_capture.py)" = f77dc7e3429325b0492baf83a95e1aef1164b06d
          test "$(git hash-object tests/test_native_policy_authority_managed_read.py)" = eb56d298dda0a192f7f0e1fea8c0a17a04e94c36
          test "$(git hash-object tests/test_native_policy_control_runtime.py)" = 46047c67bcd959e2e28cc6b8700738e2292d5fc8
          test "$(git hash-object tests/test_native_policy_control_transport.py)" = 91749138413d5819ddff4321d46bfe71509c4b1e
          test "$(git hash-object tests/test_native_policy_snapshot_control.py)" = edc5f686be49b69251287a5153d6e58986705e31
          test "$(git hash-object tests/test_native_runtime_admission.py)" = 43585495a97b39f8516f1e58ead4db5d1ca00188
          test "$(git hash-object tests/test_oauth_connection_authority.py)" = 0441f694d5ac0710e24b36f838e0eeb849c09278
          test "$(git hash-object tests/test_oauth_refresh_connection_authority.py)" = a57f82c8de00851fb89222e24198feb1ba4bc32a
          test "$(git hash-object tests/test_paseo_adapter.py)" = 88b34513adf145a7ce8c5e6fc51982c732de0694
          test "$(git hash-object uv.lock)" = 10e18a310e63ba3c5940e25b44269d48dfc7f2da
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/extraction-diagnostic-changed.txt"
          printf '%s\n' .github/workflows/ci.yml > "$RUNNER_TEMP/extraction-diagnostic-expected.txt"
          cmp "$RUNNER_TEMP/extraction-diagnostic-changed.txt" "$RUNNER_TEMP/extraction-diagnostic-expected.txt"
          git diff --name-only "${SOURCE_SHA}^" "$SOURCE_SHA" | sort > "$RUNNER_TEMP/extraction-source-changed.txt"
          printf '%s\n' src/codex_plugin_scanner/guard/native_runtime.py src/codex_plugin_scanner/guard/native_runtime_selection.py src/codex_plugin_scanner/guard/runtime/oauth_refresh_context.py src/codex_plugin_scanner/guard/runtime/runner.py src/codex_plugin_scanner/guard/store_cloud_events.py src/codex_plugin_scanner/guard/store_connection_schema.py src/codex_plugin_scanner/guard/store_extension_control_authority.py src/codex_plugin_scanner/guard/store_extension_control_authority_support.py src/codex_plugin_scanner/guard/store_oauth.py src/codex_plugin_scanner/guard/store_oauth_connection_authority.py src/codex_plugin_scanner/guard/store_sync_locks.py src/codex_plugin_scanner/guard/store_sync_payload_mutations.py tests/fixtures/guard-command-corpus/decision-diff-report.json tests/oauth_refresh_connection_support.py tests/oauth_refresh_fixture_support.py tests/test_guard_command_queue.py tests/test_guard_runtime.py tests/test_oauth_refresh_connection_authority.py tests/test_paseo_adapter.py | sort > "$RUNNER_TEMP/extraction-source-expected.txt"
          cmp "$RUNNER_TEMP/extraction-source-changed.txt" "$RUNNER_TEMP/extraction-source-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install frozen test dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        id: interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check all changed Python source formatting
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          test "$(uv run --no-sync ruff --version)" = "ruff 0.15.17"
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/native_runtime.py src/codex_plugin_scanner/guard/native_runtime_selection.py src/codex_plugin_scanner/guard/runtime/oauth_refresh_context.py src/codex_plugin_scanner/guard/runtime/runner.py src/codex_plugin_scanner/guard/store_cloud_events.py src/codex_plugin_scanner/guard/store_connection_schema.py src/codex_plugin_scanner/guard/store_extension_control_authority.py src/codex_plugin_scanner/guard/store_extension_control_authority_support.py src/codex_plugin_scanner/guard/store_oauth.py src/codex_plugin_scanner/guard/store_oauth_connection_authority.py src/codex_plugin_scanner/guard/store_sync_locks.py src/codex_plugin_scanner/guard/store_sync_payload_mutations.py tests/oauth_refresh_connection_support.py tests/oauth_refresh_fixture_support.py tests/test_guard_command_queue.py tests/test_guard_runtime.py tests/test_oauth_refresh_connection_authority.py tests/test_paseo_adapter.py
          uv run --no-sync ruff format --check src/codex_plugin_scanner/guard/native_runtime.py src/codex_plugin_scanner/guard/native_runtime_selection.py src/codex_plugin_scanner/guard/runtime/oauth_refresh_context.py src/codex_plugin_scanner/guard/runtime/runner.py src/codex_plugin_scanner/guard/store_cloud_events.py src/codex_plugin_scanner/guard/store_connection_schema.py src/codex_plugin_scanner/guard/store_extension_control_authority.py src/codex_plugin_scanner/guard/store_extension_control_authority_support.py src/codex_plugin_scanner/guard/store_oauth.py src/codex_plugin_scanner/guard/store_oauth_connection_authority.py src/codex_plugin_scanner/guard/store_sync_locks.py src/codex_plugin_scanner/guard/store_sync_payload_mutations.py tests/oauth_refresh_connection_support.py tests/oauth_refresh_fixture_support.py tests/test_guard_command_queue.py tests/test_guard_runtime.py tests/test_oauth_refresh_connection_authority.py tests/test_paseo_adapter.py
      - name: Typecheck the original native source contract
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync basedpyright --pythonpath .venv/bin/python --pythonversion ${{ matrix.python }} --project basedpyright.native-managed-source.json
      - name: Typecheck every changed and added Python file
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync basedpyright --pythonpath .venv/bin/python --pythonversion ${{ matrix.python }} --project basedpyright.native-managed-source.json src/codex_plugin_scanner/guard/native_runtime.py src/codex_plugin_scanner/guard/native_runtime_selection.py src/codex_plugin_scanner/guard/runtime/oauth_refresh_context.py src/codex_plugin_scanner/guard/runtime/runner.py src/codex_plugin_scanner/guard/store_cloud_events.py src/codex_plugin_scanner/guard/store_connection_schema.py src/codex_plugin_scanner/guard/store_extension_control_authority.py src/codex_plugin_scanner/guard/store_extension_control_authority_support.py src/codex_plugin_scanner/guard/store_oauth.py src/codex_plugin_scanner/guard/store_oauth_connection_authority.py src/codex_plugin_scanner/guard/store_sync_locks.py src/codex_plugin_scanner/guard/store_sync_payload_mutations.py tests/oauth_refresh_connection_support.py tests/oauth_refresh_fixture_support.py tests/test_guard_command_queue.py tests/test_guard_runtime.py tests/test_oauth_refresh_connection_authority.py tests/test_paseo_adapter.py
      - name: Verify full repository imports and store method resolution
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          
          root = Path.cwd().resolve()
          pairs = [["codex_plugin_scanner.guard.store_oauth","codex_plugin_scanner.guard.store_oauth_connection_authority"],["codex_plugin_scanner.guard.store_cloud_events","codex_plugin_scanner.guard.store_sync_payload_mutations"],["codex_plugin_scanner.guard.store_extension_control_authority","codex_plugin_scanner.guard.store_extension_control_authority_support"],["codex_plugin_scanner.guard.native_runtime","codex_plugin_scanner.guard.native_runtime_selection"],["codex_plugin_scanner.guard.store_connection_schema","codex_plugin_scanner.guard.store_sync_locks"],["codex_plugin_scanner.guard.runtime.runner","codex_plugin_scanner.guard.runtime.oauth_refresh_context"]]
          direct_bases = ["StoreSecretPolicyIntegrityMixin","StoreWorkflowCapabilitySecretControlMixin","StoreConnectionSchemaMixin","StoreContinuationMixin","StoreManagedControlsStatusMixin","StoreExtensionControlAuthorityMixin","StoreCustomExtensionContinuityMixin","StoreLocalCliMixin","StoreLocalMcpMixin","StoreCommandActivityMixin","StoreCommandActivityApiMixin","StoreCommandActivityLifecycleMixin","StoreCommandActivityMaintenanceMixin","StoreCommandActivityPrivacyMixin","StoreStorageMaintenanceMixin","StoreCommandShadowMixin","StoreInventoryMixin","StorePortableProjectMemoryMixin","StorePolicyMixin","StoreReviewPolicyMemoryMixin","StorePolicyIntegrityAdminMixin","StoreCloudEventsMixin","StoreReceiptsRuntimeMixin","StoreApprovalQueriesMixin","StoreApprovalsMixin","StoreExactCloudReviewMixin","StoreReviewEventOutboxMixin","StoreEventReceiptsMixin","StoreNativeDecisionReceiptsMixin","StoreOAuthConnectMixin","StoreSessionsMixin","StoreEvidenceMixin","StorePolicyDocumentMixin","StoreReadStateMixin","StoreTemporaryMcpMixin","StoreWorkflowCapabilitiesMixin","StoreWorkflowCapabilityLookupMixin","StoreWorkflowCapabilityReceiptLookupMixin","StoreWorkflowCapabilityRevocationMixin"]
          method_groups = [["codex_plugin_scanner.guard.store_oauth_connection_authority","StoreOAuthConnectionAuthorityMixin",["clear_cloud_sync_state_for_reconnect","capture_oauth_connection","_capture_oauth_connection_unlocked","_clear_oauth_local_credentials_locked"]],["codex_plugin_scanner.guard.store_sync_payload_mutations","StoreSyncPayloadMutationsMixin",["reserve_sync_sequence","set_sync_payload","_set_oauth_sync_payload_unlocked","_set_sync_payload_unlocked","delete_sync_payload","delete_sync_payloads","_delete_sync_payloads_unlocked"]],["codex_plugin_scanner.guard.store_extension_control_authority_support","_ExtensionControlAuthoritySupportMixin",["_read_captured_extension_control_authority","_load_catalog_manifest"]]]
          child = r"""
          import importlib
          import json
          import sys
          from pathlib import Path
          
          root = Path(sys.argv[1]).resolve()
          first, second = sys.argv[2:4]
          importlib.import_module(first.rsplit(".", 1)[0])
          assert first not in sys.modules and second not in sys.modules
          for name in (first, second):
              module = importlib.import_module(name)
              expected = root / "src" / (name.replace(".", "/") + ".py")
              assert Path(module.__file__).resolve() == expected.resolve()
          store_module = importlib.import_module("codex_plugin_scanner.guard.store")
          assert Path(store_module.__file__).resolve() == (root / "src/codex_plugin_scanner/guard/store.py").resolve()
          store_type = store_module.GuardStore
          assert [base.__name__ for base in store_type.__bases__] == json.loads(sys.argv[4])
          mro = store_type.__mro__
          assert len(mro) == len(set(mro))
          for module_name, class_name, methods in json.loads(sys.argv[5]):
              module = importlib.import_module(module_name)
              expected = root / "src" / (module_name.replace(".", "/") + ".py")
              assert Path(module.__file__).resolve() == expected.resolve()
              owner = getattr(module, class_name)
              assert owner in mro
              for name in methods:
                  assert getattr(store_type, name) is owner.__dict__[name]
          schema = importlib.import_module("codex_plugin_scanner.guard.store_connection_schema")
          schema_type = schema.StoreConnectionSchemaMixin
          assert schema_type in mro
          for name in ("hold_oauth_refresh_lock", "hold_cloud_sync_lock", "hold_aibom_sync_lock"):
              assert getattr(store_type, name) is schema_type.__dict__[name]
          """
          for index, pair in enumerate(pairs, start=1):
              for direction, order in (("parent-first", pair), ("helper-first", list(reversed(pair)))):
                  print(f"IMPORT_MRO_CASE_START={index}:{direction}", flush=True)
                  subprocess.run(
                      [
                          sys.executable, "-c", child, str(root), *order,
                          json.dumps(direct_bases), json.dumps(method_groups),
                      ],
                      cwd=root,
                      check=True,
                      timeout=60,
                  )
                  print(f"IMPORT_MRO_CASE_OK={index}:{direction}", flush=True)
          print("FULL_REPOSITORY_IMPORT_MRO_CASES_PASSED=12")
          PY
      - name: Verify OAuth connection and refresh authority
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
            tests/test_oauth_connection_authority.py \
            tests/test_oauth_refresh_connection_authority.py \
            tests/test_guard_oauth_reconnect.py \
            tests/test_guard_oauth_refresh_resilience.py \
            tests/test_guard_oauth_cached_expiry_compatibility.py \
            --tb=short
      - name: Verify shared OAuth transports and repaired fixtures
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
            tests/test_guard_runtime.py::test_sync_runtime_session_rejects_untrusted_oauth_issuer_before_network \
            tests/test_guard_runtime.py::test_sync_runtime_session_refreshes_oauth_access_token_and_rotates_refresh_token \
            tests/test_guard_runtime.py::test_resolve_guard_sync_auth_context_serializes_refresh_token_rotation \
            tests/test_guard_runtime.py::test_sync_local_guard_cloud_proof_refreshes_oauth_once \
            tests/test_guard_runtime.py::test_sync_local_guard_cloud_proof_serializes_concurrent_oauth_refresh \
            tests/test_guard_runtime.py::test_sync_pain_signals_raises_when_oauth_refresh_is_revoked \
            tests/test_guard_command_queue.py::test_poll_once_reuses_cached_access_token_across_oauth_polls \
            tests/test_guard_command_queue.py::test_command_queue_loop_retries_revoked_oauth_auth_and_records_reconnect_state \
            tests/test_paseo_adapter.py::test_cloud_sync_preserves_native_inventories_without_sending_local_paseo_content \
            --tb=short
      - name: Verify inventory connection authority
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q \
