name: Current regression diagnostic
run-name: Current regression diagnostic on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-regression-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: ${{ matrix.phase }} (Python ${{ matrix.python }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-current-regressions-9a6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
        phase: [corpus, lifecycle, attachment]
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout immutable regression source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/hol-guard
          ref: 9a6e66718892bcbdb6b8bd98ecbdeeb1d79b1e47
          path: source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install locked dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Diagnose the selected unchanged regression
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: uv run --no-sync python ../diagnostic/scripts/ci/diagnose_current_regressions.py ${{ matrix.phase }}
