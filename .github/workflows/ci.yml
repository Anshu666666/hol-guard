name: Sensitive Read authority baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitive-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify isolated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 04bed715f38b04cb75651fafdf566e86e1112da1
          test "$(git rev-parse 04bed715f38b04cb75651fafdf566e86e1112da1^{tree})" = ba3b461422e79e18c8b051a4beaf5d02ef690f31
          test "$(git hash-object tests/test_sensitive_read_unenrolled_controls.py)" = 79b08fba19aa721d7c4873ae477b1d1dd79ef979
          python - <<'PY'
          import subprocess
          expected = {".github/workflows/ci.yml", "tests/test_sensitive_read_unenrolled_controls.py"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True).splitlines())
          assert actual == expected, "unexpected diagnostic source delta"
          parents = subprocess.check_output(["git", "show", "-s", "--format=%P", "HEAD"], text=True).split()
          assert parents == ["04bed715f38b04cb75651fafdf566e86e1112da1"], "unexpected diagnostic parent"
          PY
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            requirements.txt
          save-cache: false
      - name: Install locked test dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Run the nine authority cases
        run: uv run --no-sync pytest -q tests/test_sensitive_read_unenrolled_controls.py --tb=short
      - name: Check regression lint
        if: always() && steps.dependencies.outcome == 'success'
        run: uv run --no-sync ruff check tests/test_sensitive_read_unenrolled_controls.py
      - name: Check regression formatting
        if: always() && steps.dependencies.outcome == 'success'
        run: uv run --no-sync ruff format --check tests/test_sensitive_read_unenrolled_controls.py
      - name: Verify source remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/test_sensitive_read_unenrolled_controls.py)" = 79b08fba19aa721d7c4873ae477b1d1dd79ef979
          git diff --exit-code
          git diff --cached --exit-code
