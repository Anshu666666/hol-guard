name: Claude assertion diagnostic
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        description: Immutable diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Immutable diagnostic tree
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CI_UV_CACHE_DEPENDENCY_GLOB: |
    pyproject.toml
    uv.lock
    requirements.txt
    docker-requirements.txt

jobs:
  original-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
      DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the unchanged product and original test source
        shell: bash
        run: |
          [[ "$DIAGNOSTIC_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTIC_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$DIAGNOSTIC_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          test "$(git rev-parse HEAD^)" = a53d471c334f4fdf32db45e5230dd980910d2c53
          git diff --exit-code a53d471c334f4fdf32db45e5230dd980910d2c53 -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)scripts/ci/claude_daemon_miss_diagnostic.py' \
            ':(exclude)scripts/ci/test_claude_daemon_miss_diagnostic.py'
          test "$(git hash-object scripts/ci/claude_daemon_miss_diagnostic.py)" = 2866b835fe9cd986cae2151fc6880fad1a59fdbe
          test "$(git hash-object scripts/ci/test_claude_daemon_miss_diagnostic.py)" = af1bfe4e019b760cc67c05ad653bfce98c6c6cdd
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CLAUDE_DIAGNOSTIC_SOURCE_VERIFIED"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
          save-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Verify the terminal classifier controls
        run: |
          uv run --no-sync ruff check scripts/ci/claude_daemon_miss_diagnostic.py scripts/ci/test_claude_daemon_miss_diagnostic.py
          PYTHONPATH=scripts/ci uv run --no-sync pytest scripts/ci/test_claude_daemon_miss_diagnostic.py --tb=short
      - name: Download the original immutable pytest shard plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "10563401506"
          path: pytest-shards
          merge-multiple: true
          run-id: "35384578828"
          github-token: ${{ github.token }}
      - name: Run original shard 87 with terminal-only classification
        shell: bash
        run: |
          shard_file=$(printf 'pytest-shards/shard-%02d.txt' "87")
          test -s "$shard_file"
          PYTHONPATH=scripts/ci GUARD_PYTEST_DURATION_OUTPUT=pytest-durations.json GUARD_PYTEST_UNDER_COVERAGE=1 \
            uv run --no-sync pytest -p pytest_duration_report -p claude_daemon_miss_diagnostic "@$shard_file" --tb=short \
            --deselect tests/test_guard_hook_process_runner.py::test_scheduler_and_runner_complete_48_routine_reviews_without_capacity_denial \
            --cov --cov-branch --cov-report=
      - name: Verify source after the ordinary pytest result
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          test "$(git rev-parse HEAD^)" = a53d471c334f4fdf32db45e5230dd980910d2c53
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CLAUDE_DIAGNOSTIC_SOURCE_STILL_VERIFIED"
