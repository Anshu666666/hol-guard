          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path
          
          PARENT = "9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12"
          PARENT_TREE = "8ca9c2df12566dc340a59f37f6e14ece267622fe"
          WORKFLOW = ".github/workflows/ci.yml"
          REPLACEMENTS = {
              "tests/test_guard_runtime.py": [
                  "100644",
                  "blob",
                  "699f385b4de589deb0d3980464314dfcefc55a9d"
              ],
              "tests/test_guard_command_queue.py": [
                  "100644",
                  "blob",
                  "0021778c8119fe28c346996cbb239381fa30b64c"
              ],
              "tests/test_paseo_adapter.py": [
                  "100644",
                  "blob",
                  "88b34513adf145a7ce8c5e6fc51982c732de0694"
              ],
              "tests/oauth_refresh_fixture_support.py": [
                  "100644",
                  "blob",
                  "dcab0efe509dd99d543942987db3ddccdc32d62a"
              ],
              ".github/workflows/native-managed-source-contract.yml": [
