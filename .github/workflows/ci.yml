name: Claude fallback startup observation
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        description: Immutable diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Immutable diagnostic tree
        required: true
        type: string

permissions:
  contents: read

env:
  CI_UV_CACHE_DEPENDENCY_GLOB: |
    pyproject.toml
    uv.lock
    requirements.txt
    docker-requirements.txt

jobs:
  fallback-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
      DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the unchanged product and original test source
        shell: bash
        run: |
          [[ "$DIAGNOSTIC_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTIC_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$DIAGNOSTIC_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          test "$(git rev-parse HEAD^)" = a53d471c334f4fdf32db45e5230dd980910d2c53
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          git diff --exit-code a53d471c334f4fdf32db45e5230dd980910d2c53 -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)tests/test_claude_fallback_startup_observation.py'
          test "$(git hash-object tests/test_claude_fallback_startup_observation.py)" = 6377dc68fc4e8af174f0f5e909e494156c1e926f
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CLAUDE_STARTUP_SOURCE_VERIFIED"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
          save-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Verify observation source
        run: uv run --no-sync ruff check tests/test_claude_fallback_startup_observation.py
      - name: Observe the original fallback and standard import profile
        shell: bash
        run: |
          PYTHONPATH=scripts/ci GUARD_PYTEST_DURATION_OUTPUT=pytest-durations.json GUARD_PYTEST_UNDER_COVERAGE=1 \
            uv run --no-sync pytest -p pytest_duration_report \
              tests/test_claude_fallback_startup_observation.py -s --tb=short \
              --cov --cov-branch --cov-report=
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          [[ "$DIAGNOSTIC_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTIC_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CLAUDE_STARTUP_SOURCE_UNCHANGED"
