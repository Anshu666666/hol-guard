          assert expected["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py"][2] == "cd0749d72df7ab9a5328f57129ca1bf44c769e60"
          workflow = git("rev-parse", "HEAD:.github/workflows/ci.yml")
