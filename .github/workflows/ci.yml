name: Native source-free capture acceptance

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source-only refinement commit
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-capture-fixed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-fixed:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-source-free-capture-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact source repair and diagnostic
        id: source_before
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          diagnostic_commit = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          diagnostic_tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          source_commit = os.environ["EXPECTED_SOURCE_COMMIT"]
          for value in (diagnostic_commit, diagnostic_tree, source_commit):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-source-free-capture-20260919"
          assert os.environ["GITHUB_SHA"] == diagnostic_commit
          assert git("rev-parse", "HEAD") == diagnostic_commit
          assert git("rev-parse", "HEAD^{tree}") == diagnostic_tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [diagnostic_commit, source_commit]
          assert git("rev-list", "--parents", "-n", "1", source_commit).split() == [
              source_commit,
              "51d5684be15c03b979e145663e110ec5bfdc94ee",
          ]
          assert git("rev-parse", "51d5684be15c03b979e145663e110ec5bfdc94ee^{tree}") == "1ea5b49cc1439b76e3a6048c899952602c7258f9"
          assert git("rev-parse", source_commit + "^{tree}") == "69390f1a0462e557aea7ff82e89e1dac4950ccbd"
          assert git("diff", "--name-status", "51d5684be15c03b979e145663e110ec5bfdc94ee", source_commit).splitlines() == [
              "M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py",
          ]
          assert git("diff", "--name-status", source_commit, "HEAD").splitlines() == ["M\t.github/workflows/ci.yml"]
          pins = [
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","100644","a331ffb3e6275864618452e1adc57c01aaab5fa6"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py","100644","cd0749d72df7ab9a5328f57129ca1bf44c769e60"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scheduling.py","100644","0a500224add718d93aa989258125a35790746400"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_transport.py","100644","ab1c0572c0a6b8cbd3e22822388dce6df2fdb196"],
              ["src/codex_plugin_scanner/guard/native_policy_authority_read.py","100644","9dac9c06033f2c354a3fd0c174760006fa926a73"],
              ["src/codex_plugin_scanner/guard/store_sync_payload_mutations.py","100644","44319c8d3e2848456841d60933a5db64f4b9c8b3"],
              ["src/codex_plugin_scanner/guard/daemon/server.py","100644","2792f7cf919da55d02435b8fb3295ae2d514a6f5"],
              ["tests/test_native_policy_snapshot_reservation_capture.py","100644","a663d5014bc62822c0c86d970b0ce056f4e97cd3"],
              ["tests/native_policy_snapshot_test_fixtures.py","100644","e6809fc5e6b09590a63698e8d8bfef597252b9f4"],
              [".github/workflows/native-managed-source-contract.yml","100644","ae8180cb4e6710902c6a5d699cd636c3988fcee2"],
              ["pyproject.toml","100644","64a0281ee6b4f57a74cab68ac992fec3d782a6bb"],
              ["uv.lock","100644","10e18a310e63ba3c5940e25b44269d48dfc7f2da"],
              ["conftest.py","100644","9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"],
              ["tests/conftest.py","100644","61e6d98609309fac99c9baae50fab5f47229fcde"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority.py","100644","39c5ff235685f3f2869155d1cf2d4d9097370967"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority_support.py","100644","c6177516cbb6150bff636ee7e2f3685e9b95f8b9"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scoped.py","100644","9b59002f683443f190e6535bbdd66cddf525a1d0"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_inputs.py","100644","5f88a6ecdacc7fb426d5d6306a8faa44602de3a4"],
              ["tests/test_native_policy_snapshot_capture_retry.py","100644","915b648d205aa205b7e6b303f37e504bd6b6f193"],
              ["tests/test_native_source_free_renewal.py","100644","433d59d0a74d0d04be3cf4659df858a2ddd513ff"],
              ["tests/test_native_policy_snapshot_v3_publisher.py","100644","b73e7f4ed86dd69d0f2ffc0924dbb493fe0c123f"],
              ["tests/test_native_policy_snapshot_contract.py","100644","abd5956fe0dc3cfc17db34404e6915ce23452fd9"],
              ["tests/test_native_policy_snapshot_persistence.py","100644","f4a82792fa049724f2fd1133d43aa20aa59cbefb"],
              ["tests/test_native_policy_snapshot_publisher.py","100644","c4ad2122cc3aa021ee9ae836f119e2c24bc12ad6"],
              ["tests/test_native_policy_snapshot_windows.py","100644","591822b3833b16f2bd287b19e4b2549018fafbd5"],
              ["tests/native_policy_snapshot_windows_handles.py","100644","23dac63bb6631785a4e316d28fde2ff5273ab18c"],
              ["tests/native_policy_snapshot_windows_storage.py","100644","0622a7f2d469dddd88ae1e4ecff5b6d42db7b6cc"],
              ["tests/test_native_policy_snapshot_v4_barrier.py","100644","255359a8e7d239fc5c907c331414ef5f10d750f6"],
              ["basedpyright.native-managed-source.json","100644","47324cc8bab28f639118220dbbd8a08e14b1a779"],
          ]
          for path, mode, sha in pins:
              expected = f"{mode} blob {sha}\t{path}"
              assert git("ls-tree", source_commit, "--", path) == expected
              assert git("ls-tree", "HEAD", "--", path) == expected
              assert git("hash-object", "--", path) == sha
          assert not git("status", "--porcelain", "--untracked-files=no")
          print(json.dumps({"sourceGuard": "passed", "pins": len(pins), "productionPathsChanged": 1}, sort_keys=True))
          PY

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Require the five unchanged capture cases to pass
        id: capture_cases
        run: |
          uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/native-capture-fixed-${{ matrix.python }}.xml" tests/test_native_policy_snapshot_capture_retry.py
      - name: Verify all five actual capture outcomes
        id: capture_report
        if: ${{ always() && (steps.capture_cases.outcome == 'success' || steps.capture_cases.outcome == 'failure') }}
        run: |
          python -I - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          
          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("native-capture-fixed-" + os.environ["MATRIX_PYTHON"] + ".xml")
          cases = ET.parse(report).getroot().findall(".//testcase")
          expected = [
              "test_startup_status_commit_requires_a_fresh_stable_capture[one-startup-write]",
              "test_startup_status_commit_requires_a_fresh_stable_capture[repeated-startup-writes]",
              "test_startup_capture_retry_cannot_outlive_its_epoch[request]",
              "test_startup_capture_retry_cannot_outlive_its_epoch[close]",
              "test_capture_retry_never_replays_an_exception_after_yield"
          ]
          names = [case.attrib["name"] for case in cases]
          assert collections.Counter(names) == collections.Counter(expected), names
          results = []
          for case in cases:
              status = "passed"
              for tag in ("failure", "error", "skipped"):
                  if case.find(tag) is not None:
                      status = tag
                      break
              results.append({"case": case.attrib["name"], "status": status})
          print(json.dumps({"python": os.environ["MATRIX_PYTHON"], "collected": len(cases), "results": results}, sort_keys=True))
          assert all(result["status"] == "passed" for result in results)
          PY
      - name: Preserve the 34 existing warm renewal cases
        id: renewal_cases
        if: ${{ always() && steps.capture_cases.outcome == 'success' && steps.capture_report.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/native-capture-renewal-${{ matrix.python }}.xml" tests/test_native_source_free_renewal.py
      - name: Preserve reservation rotation and deadline controls
        id: reservation_cases
        if: ${{ always() && steps.capture_cases.outcome == 'success' && steps.capture_report.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/native-capture-reservation-${{ matrix.python }}.xml" tests/test_native_policy_snapshot_reservation_capture.py
      - name: Preserve existing V3 publisher controls
        id: publisher_cases
        if: ${{ always() && steps.capture_cases.outcome == 'success' && steps.capture_report.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/native-capture-publisher-${{ matrix.python }}.xml" tests/test_native_policy_snapshot_v3_publisher.py
      - name: Preserve the unchanged V4 publication barrier controls
        id: barrier_cases
        if: ${{ always() && steps.capture_cases.outcome == 'success' && steps.capture_report.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/native-capture-barrier-${{ matrix.python }}.xml" tests/test_native_policy_snapshot_v4_barrier.py
      - name: Report every existing control outcome
        if: ${{ always() && steps.capture_cases.outcome == 'success' && steps.capture_report.outcome == 'success' }}
        run: |
          python -I - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          
          expected = {
              "renewal": {
                  "test_failed_renewal_keeps_exact_prior_generation_only_until_expiry": 4,
                  "test_failed_renewal_cannot_retain_changed_authority": 30,
              },
              "reservation": {
                  "test_unchanged_actual_signed_source_publishes": 1,
                  "test_rotated_source_is_not_reserved_after_capture": 1,
                  "test_retry_recaptures_source_before_reserving_after_rotation": 1,
                  "test_source_free_v3_recovers_above_reserved_retirement": 1,
                  "test_existing_retry_recaptures_actual_changed_configuration": 2,
                  "test_complete_capture_is_serialized_and_transport_releases_mutation_lock": 2,
                  "test_v3_superseded_cache_recovery_keeps_default_strict_and_refuses_bad_state": 1,
                  "test_fresh_v3_capture_never_repairs_corrupt_missing_or_conflicting_state": 8,
                  "test_recovery_retry_refuses_changed_runtime_or_closed_publisher": 8,
                  "test_fresh_capture_preserves_existing_publication_lock_wait_ceiling": 2,
              },
              "publisher": {
                  "test_policy_merge_never_downgrades_enforcing_posture_to_watch": 1,
                  "test_v3_builder_derives_and_provisions_verifier_before_snapshot_push": 1,
                  "test_windows_scope_aliases_share_one_digest_identity": 1,
                  "test_floor_only_ack_materializes_strictly_new_generation": 1,
                  "test_floor_recovery_requires_exact_typed_ack": 3,
                  "test_publisher_surfaces_resident_start_timeout": 1,
                  "test_lost_ack_retries_identical_payload": 1,
                  "test_publisher_process_restart_reuses_cached_payload": 1,
                  "test_renewal_failure_keeps_barrier_closed_at_expiry": 1,
                  "test_renewal_materializes_higher_generation_before_expiry": 1,
                  "test_renewal_retry_reuses_candidate_with_bounded_backoff": 1,
                  "test_snapshot_transaction_recovers_each_persistence_boundary": 3,
                  "test_auto_hook_uses_barrier_without_loading_config_per_request": 1,
                  "test_prepare_workspace_policy_uses_bounded_first_workspace_handshake": 1,
                  "test_prepare_workspace_policy_skips_wait_after_publisher_error": 1,
                  "test_prepare_workspace_policy_waits_publish_budget_without_caller_deadline": 1,
                  "test_publisher_does_not_ack_snapshot_after_concurrent_mutation": 1,
                  "test_publisher_rejects_mutated_ack_without_opening_barrier": 1,
                  "test_publisher_repushes_after_resident_generation_change": 1,
                  "test_publisher_does_not_republish_for_generation_created_by_own_ack": 1,
                  "test_publisher_rejects_ack_after_resident_restart_before_barrier": 1,
                  "test_publisher_startup_ack_and_mutation_push": 1,
                  "test_same_generation_retries_reuse_exact_signed_snapshot_bytes": 1,
                  "test_windows_cache_read_rejects_ancestor_reparse_before_open": 1,
                  "test_windows_snapshot_write_holds_parent_binding_across_commit": 1,
                  "test_windows_directory_binding_fails_closed_on_reparse_parent": 1,
                  "test_windows_commit_rejects_foreign_owner_before_acl_or_rename": 1,
                  "test_windows_storage_writer_has_no_path_replace_in_native_branch": 1,
                  "test_windows_atomic_writer_cleans_temp_on_precommit_failure": 1,
                  "test_windows_verifier_key_provisioning_holds_state_binding": 1,
                  "test_windows_private_state_binding_closes_replaced_state_handle": 1,
                  "test_windows_cache_reader_closes_handle_on_all_failures": 4,
                  "test_windows_cache_reader_verifies_and_reads_one_handle": 1,
                  "test_windows_create_new_validation_failure_deletes_before_close": 1,
                  "test_windows_open_handle_uses_disk_nonreparse_read_contract": 1,
                  "test_windows_existing_directory_reapplies_owner_and_dacl_on_same_handle": 1,
                  "test_windows_existing_directory_reapplies_private_dacl_on_same_handle": 1,
                  "test_windows_private_descriptor_deduplicates_system_owner_ace": 1,
                  "test_windows_snapshot_cache_read_holds_state_binding": 1,
                  "test_windows_generation_read_holds_state_binding": 1,
                  "test_windows_pending_cleanup_uses_bound_file_handle": 1,
              },
              "barrier": {
                  "test_exact_publication_opens_barrier_and_only_frozen_provenance_is_used": 1,
                  "test_substituted_result_cannot_expose_a_decision_or_provenance": 10,
                  "test_result_binding_is_exact_not_a_partial_comparison": 2,
                  "test_results_are_fenced_after_evaluation_even_without_selected_row": 3,
                  "test_inflight_publication_cannot_overwrite_newer_authority": 6,
                  "test_no_resident_metadata_is_not_positive_ready_evidence": 1,
                  "test_noncanonical_resident_generation_name_cannot_open_readiness": 1,
                  "test_source_mutation_during_fresh_capture_is_rejected": 1,
                  "test_resident_restart_after_fresh_capture_is_rejected": 1,
                  "test_capture_unavailable_during_renewal_revokes_previous_ready_publication": 1,
                  "test_partial_v4_features_never_downgrade_or_publish": 3,
                  "test_losing_runtime_support_revokes_an_accepted_scoped_publication": 4,
                  "test_observer_ignores_unchanged_source_but_invalidates_changed_source": 1,
                  "test_real_concurrent_epoch_mutation_fences_blocked_ack": 1,
                  "test_actual_signed_source_and_post_ack_revocation_use_real_authority": 2,
                  "test_refused_scoped_negotiation_is_sticky_before_first_accepted_snapshot": 1,
                  "test_post_ack_same_digest_with_elapsed_source_lease_is_rejected": 1,
                  "test_database_change_and_revert_during_capture_is_fenced_even_with_restored_mtime": 1,
                  "test_missing_legacy_required_feature_cannot_be_hidden_by_an_unrelated_feature": 1,
              },
          }
          allowed_skip = "test_windows_scope_aliases_share_one_digest_identity"
          all_valid = True
          for group, expected_counts in expected.items():
              report = pathlib.Path(os.environ["RUNNER_TEMP"]) / (
                  "native-capture-" + group + "-" + os.environ["MATRIX_PYTHON"] + ".xml"
              )
              cases = ET.parse(report).getroot().findall(".//testcase")
              names = [case.attrib["name"] for case in cases]
              observed = collections.Counter(name.split("[", 1)[0] for name in names)
              valid = observed == collections.Counter(expected_counts)
              results = []
              for case in cases:
                  name = case.attrib["name"]
                  status = "passed"
                  for tag in ("failure", "error", "skipped"):
                      if case.find(tag) is not None:
                          status = tag
                          break
                  valid = valid and (status == "passed" or (group == "publisher" and name == allowed_skip and status == "skipped"))
                  results.append({"case": name, "status": status})
              print(json.dumps({"python": os.environ["MATRIX_PYTHON"], "group": group, "collected": len(cases), "results": results}, sort_keys=True))
              all_valid = all_valid and valid
          assert all_valid
          PY
      - name: Check repair and regression lint
        if: ${{ always() && (steps.capture_cases.outcome == 'success' || steps.capture_cases.outcome == 'failure') }}
        run: uv run --no-sync ruff check src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py tests/test_native_policy_snapshot_capture_retry.py tests/test_native_policy_snapshot_v4_barrier.py
      - name: Check repair and regression formatting
        if: ${{ always() && (steps.capture_cases.outcome == 'success' || steps.capture_cases.outcome == 'failure') }}
        run: uv run --no-sync ruff format --check src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py tests/test_native_policy_snapshot_capture_retry.py tests/test_native_policy_snapshot_v4_barrier.py
      - name: Check the existing native production type project
        if: ${{ always() && (steps.capture_cases.outcome == 'success' || steps.capture_cases.outcome == 'failure') }}
        run: uv run --no-sync basedpyright --pythonpath .venv/bin/python --pythonversion ${{ matrix.python }} --project basedpyright.native-managed-source.json
      - name: Verify the exact source after all checks
        id: source_after
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          diagnostic_commit = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          diagnostic_tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          source_commit = os.environ["EXPECTED_SOURCE_COMMIT"]
          for value in (diagnostic_commit, diagnostic_tree, source_commit):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-source-free-capture-20260919"
          assert os.environ["GITHUB_SHA"] == diagnostic_commit
          assert git("rev-parse", "HEAD") == diagnostic_commit
          assert git("rev-parse", "HEAD^{tree}") == diagnostic_tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [diagnostic_commit, source_commit]
          assert git("rev-list", "--parents", "-n", "1", source_commit).split() == [
              source_commit,
              "51d5684be15c03b979e145663e110ec5bfdc94ee",
          ]
          assert git("rev-parse", "51d5684be15c03b979e145663e110ec5bfdc94ee^{tree}") == "1ea5b49cc1439b76e3a6048c899952602c7258f9"
          assert git("rev-parse", source_commit + "^{tree}") == "69390f1a0462e557aea7ff82e89e1dac4950ccbd"
          assert git("diff", "--name-status", "51d5684be15c03b979e145663e110ec5bfdc94ee", source_commit).splitlines() == [
              "M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py",
          ]
          assert git("diff", "--name-status", source_commit, "HEAD").splitlines() == ["M\t.github/workflows/ci.yml"]
          pins = [
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","100644","a331ffb3e6275864618452e1adc57c01aaab5fa6"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py","100644","cd0749d72df7ab9a5328f57129ca1bf44c769e60"],
