              ["src/codex_plugin_scanner/guard/config_payload.py","100644","53851a4d558130274fd115bfee843c980cdbd7f7"],
              ["src/codex_plugin_scanner/guard/mdm/contracts.py","100644","97a2b4329dcb3ff8b79fe5fa4e325817b21bc000"],
