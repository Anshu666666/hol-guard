name: Frozen ACK formatter output
run-name: Frozen ACK formatter output on ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-ack-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'hashgraph-online/hol-guard' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-report-regeneration-cc42'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 43c9ae27228b78b28ca6ea643714934985808e9a
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Format only the pinned ACK source and emit verified bytes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import ast
          import base64
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tomllib
          
          SOURCE = "43c9ae27228b78b28ca6ea643714934985808e9a"
          TREE = "eb206d053aa2bcd90ec92e42fbe074f1baab8bd1"
          TARGET = "src/codex_plugin_scanner/guard/runtime/policy_sync_acknowledgement.py"
          BEFORE = "c76c417f0abb63994b67c71f753d6886d27a8f1c"
          PINS = {
              TARGET: BEFORE,
              "pyproject.toml": "44250c39b253343dd95a24441850940d48581f8b",
              "uv.lock": "87a7e665302f34c6ae1100387425572bab6e7c51",
              "tests/fixtures/guard-command-corpus/decision-diff-report.json":
                  "0c83c7132c748bdf36163a212c728e89b6f3d8ab",
          }
          SAFE_CODES = {
              "source_commit", "source_tree", "source_entry", "source_count",
              "critical_pin", "source_binding", "ruff_version", "ruff_exit",
              "source_ast", "source_unchanged", "source_size", "unexpected_change",
          }
          stage = "source-preflight"
          
          
          def blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          
          
          def raw(path):
              return os.readlink(path).encode() if path.is_symlink() else path.read_bytes()
          
          
          def git(*arguments):
              env = {key: value for key, value in os.environ.items() if not key.startswith("GIT_")}
              return subprocess.check_output(
                  ["git", *arguments], env=env, stderr=subprocess.PIPE, timeout=15
              )
          
          
          def audit(expected, allow_target=False):
              changed = []
              for name, (mode, digest) in expected.items():
                  path = Path(name)
                  current_mode = (
                      "120000" if path.is_symlink()
                      else "100755" if path.stat().st_mode & 0o111 else "100644"
                  )
                  if current_mode != mode:
                      raise ValueError("source_binding")
                  if blob(raw(path)) != digest:
                      changed.append(name)
              if changed != ([TARGET] if allow_target else []):
                  raise ValueError("unexpected_change")
              return len(expected)
          
          
          def run():
              global stage
              if git("rev-parse", "HEAD").decode().strip() != SOURCE:
                  raise ValueError("source_commit")
              if git("rev-parse", "HEAD^{tree}").decode().strip() != TREE:
                  raise ValueError("source_tree")
              expected = {}
              for row in git("ls-tree", "-rz", "HEAD").split(b"\0"):
                  if not row:
                      continue
                  metadata, name = row.split(b"\t", 1)
                  mode, kind, digest = metadata.decode().split()
                  if kind != "blob" or mode not in {"100644", "100755", "120000"}:
                      raise ValueError("source_entry")
                  expected[name.decode()] = (mode, digest)
              if len(expected) != 4087:
                  raise ValueError("source_count")
              if any(expected.get(name, (None, None))[1] != digest for name, digest in PINS.items()):
                  raise ValueError("critical_pin")
              audit(expected)
              before = Path(TARGET).read_bytes()
              old_ast = ast.dump(ast.parse(before), include_attributes=False)
              locked = [
                  item["version"] for item in tomllib.loads(Path("uv.lock").read_text())["package"]
                  if item["name"] == "ruff"
              ]
              version = importlib.metadata.version("ruff")
              if locked != [version] or re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
                  raise ValueError("ruff_version")
              stage = "actual-formatter"
              commands = (
                  ["format", TARGET],
                  ["format", "--check", TARGET],
                  ["check", TARGET],
              )
              results = []
              for arguments in commands:
                  result = subprocess.run(
                      [sys.executable, "-m", "ruff", *arguments],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30,
                  )
                  results.append({
                      "exitCode": result.returncode,
                      "outputBytes": len(result.stdout),
                      "outputSha256": hashlib.sha256(result.stdout).hexdigest(),
                  })
                  if result.returncode:
                      raise ValueError("ruff_exit")
              stage = "source-postflight"
              after = Path(TARGET).read_bytes()
              if ast.dump(ast.parse(after), include_attributes=False) != old_ast:
                  raise ValueError("source_ast")
              if after == before:
                  raise ValueError("source_unchanged")
              if len(after) > 16384:
                  raise ValueError("source_size")
              audit(expected, allow_target=True)
              encoded = base64.b64encode(after).decode("ascii")
              chunks = [encoded[index:index + 4096] for index in range(0, len(encoded), 4096)]
              summary = {
                  "schema": "guard.actual-ack-format.v1",
                  "sourceCommit": SOURCE, "sourceTree": TREE,
                  "path": TARGET, "previousSha": BEFORE,
                  "gitBlob": blob(after), "bytes": len(after),
                  "sha256": hashlib.sha256(after).hexdigest(),
                  "astEqual": True, "trackedFiles": 4087, "changedTrackedFiles": 1,
                  "ruffVersion": version, "commands": results,
                  "reportChanged": False, "generatorExecuted": False, "testsExecuted": False,
                  "chunks": len(chunks), "chunkChars": 4096,
              }
              print("HGP_ACK_FORMAT_BEGIN " + json.dumps(summary, sort_keys=True))
              for index, chunk in enumerate(chunks, 1):
                  print("HGP_ACK_FORMAT_BASE64 " + str(index) + "/" + str(len(chunks)) + " " + chunk)
              print("HGP_ACK_FORMAT_END " + summary["sha256"])
          
          
          try:
              run()
          except BaseException as error:
              detail = {"status": "error", "stage": stage, "rawOutputPublished": False}
              detail["class"] = (
                  type(error).__name__ if type(error).__name__ in {
                      "ValueError", "OSError", "FileNotFoundError", "TimeoutExpired",
                      "CalledProcessError", "SyntaxError", "KeyError", "TypeError",
                  } else "OtherException"
              )
              if (
                  type(error) is ValueError and len(error.args) == 1
                  and type(error.args[0]) is str and error.args[0] in SAFE_CODES
              ):
                  detail["code"] = error.args[0]
              print(json.dumps(detail, sort_keys=True))
              raise SystemExit(2) from None
          PY
