        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Require all fourteen unchanged readiness cases
        id: post_ack_cases
        run: uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/native-post-ack-fixed-${{ matrix.python }}.xml" tests/test_native_policy_snapshot_post_ack_retry.py
      - name: Account for and require all fourteen actual passes
        id: post_ack_report
        if: ${{ always() && (steps.post_ack_cases.outcome == 'success' || steps.post_ack_cases.outcome == 'failure') }}
        run: |
          python -I - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / f"native-post-ack-fixed-{os.environ['MATRIX_PYTHON']}.xml"
          root = ET.parse(path).getroot()
          cases = root.findall(".//testcase")
          expected = [["tests.test_native_policy_snapshot_post_ack_retry","test_one_startup_commit_recovers_within_the_original_caller_deadline[unchanged-control]"],["tests.test_native_policy_snapshot_post_ack_retry","test_one_startup_commit_recovers_within_the_original_caller_deadline[during-compile]"],["tests.test_native_policy_snapshot_post_ack_retry","test_one_startup_commit_recovers_within_the_original_caller_deadline[after-confirmation]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[repeated-during-compile]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[repeated-after-confirmation]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[credential-change]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[credential-aba]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[config-change]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[config-aba]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[required-source]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[request]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[close]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[ack-mismatch]"],["tests.test_native_policy_snapshot_post_ack_retry","test_post_ack_recovery_retains_authority_and_budget_refusals[transport-deadline]"]]
          observed = collections.Counter((case.get("classname"), case.get("name")) for case in cases)
          assert observed == collections.Counter(map(tuple, expected)), dict(observed)
          assert not root.findall(".//skipped")
          statuses = []
          for case in cases:
              tags = [tag for tag in ("failure", "error", "skipped") if case.findall(tag)]
              status = {"classname": case.get("classname"), "name": case.get("name"), "results": tags or ["passed"], "pytestSeconds": case.get("time")}
              statuses.append(status)
              print(json.dumps(status, sort_keys=True))
          assert all(row["results"] == ["passed"] for row in statuses)
          print(json.dumps({"readinessCases": len(cases), "allPassed": True}, sort_keys=True))
          PY
      - name: Preserve 4 guards cases
