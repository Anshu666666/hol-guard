name: Receipt fixture union acceptance

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact composed fixture acceptance source
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: receipt-fixture-union-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixture-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-receipt-fixtures-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the composed fixture source and diagnostic
        id: source_before
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == "ea924506494786e6c66ade7d71aa51e4e1a768ca"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-receipt-fixtures-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [
              source, "5102c8dac95edb18d15ef9054fdf15bad15bdfc6"
          ]
          assert git("rev-parse", source + "^{tree}") == "06beab45a68faa3087de8b4e8ef6b376aee611f2"
          assert git("rev-parse", "5102c8dac95edb18d15ef9054fdf15bad15bdfc6^{tree}") == "f3d7585ffbfab7aff3920cc50f2c55daa1b5e98a"
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, "HEAD") == git("show", "-s", identity, source)
          assert git("show", "-s", identity, source) == git("show", "-s", identity, "5102c8dac95edb18d15ef9054fdf15bad15bdfc6")
          assert git("diff", "--name-status", "5102c8dac95edb18d15ef9054fdf15bad15bdfc6", source).splitlines() == ["M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","M\tsrc/codex_plugin_scanner/guard/native_policy_snapshot_publisher_attempt.py","A\ttests/support/guard_cli_upload_case.py","A\ttests/support/guard_event_upload_cases.py","A\ttests/support/inventory_receipt_fixture.py","A\ttests/support/optional_uploads.py","A\ttests/support/receipt_transport.py","M\ttests/test_guard_cli.py","M\ttests/test_guard_cloud_local_sync.py","M\ttests/test_guard_event_schema_v1.py","M\ttests/test_guard_events.py","M\ttests/test_guard_receipt_command_detail_backfill.py","M\ttests/test_guard_receipt_redaction_cursor.py","M\ttests/test_guard_runtime.py","M\ttests/test_inventory_daemon_scheduling.py","M\ttests/test_policy_bundle_v2.py","M\ttests/test_policy_telemetry_isolation.py","M\ttests/test_policy_telemetry_review_failures.py","M\ttests/test_policy_telemetry_transport.py"]
