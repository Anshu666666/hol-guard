name: Bounded native source acceptance
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed source commit
        required: true
        type: string
      diagnostic_commit:
        description: Reviewed diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Reviewed diagnostic tree
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bounded-native-activation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-bounded-native-activation-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      HOL_GUARD_BUILD_SHA: ${{ github.sha }}
    steps:
      - id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before execution
        id: source
        env:
          GUARD_PHASE: before
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          
          def tree(ref):
              result = {}
              for entry in subprocess.check_output(["git", "ls-tree", "-rz", "--full-tree", ref]).split(b"\0"):
                  if entry:
                      metadata, path = entry.split(b"\t", 1)
                      result[path.decode()] = tuple(metadata.decode().split())
              return result
          
          source = os.environ["SOURCE_COMMIT"]
          head = os.environ["DIAGNOSTIC_COMMIT"]
          diagnostic_tree = os.environ["DIAGNOSTIC_TREE"]
          assert all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (source, head, diagnostic_tree))
          assert source == "db4d8834f79c3101e870a736b42ce27ffb255b86"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-bounded-native-activation-20260919"
          assert git("rev-parse", "HEAD") == head == os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD^{tree}") == diagnostic_tree
          assert git("show", "-s", "--format=%P", head) == source
          assert git("show", "-s", "--format=%P", source) == "e814138f3246d79f57c45c8fc6224102cc8fbf0a"
          assert git("show", "-s", "--format=%P", "e814138f3246d79f57c45c8fc6224102cc8fbf0a") == "51d5684be15c03b979e145663e110ec5bfdc94ee"
          approved_identity = git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "e814138f3246d79f57c45c8fc6224102cc8fbf0a").splitlines()
          assert len(approved_identity) == 4 and approved_identity[:2] == approved_identity[2:]
          for commit in (source, head):
              assert git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", commit).splitlines() == approved_identity
          assert git("rev-parse", "e814138f3246d79f57c45c8fc6224102cc8fbf0a^{tree}") == "69390f1a0462e557aea7ff82e89e1dac4950ccbd"
          assert git("rev-parse", source + "^{tree}") == "ef86a4934abc24737743332c0d96fedcfd05b1fd"
          expected = tree("e814138f3246d79f57c45c8fc6224102cc8fbf0a")
          assert len(expected) == 4313
          changes = [["rust/crates/guard-runtime/src/resident_protocol.rs","f60b31b4e62f8e317364126491a004e31055f891","8f9fd6b945fb34be55c226de73b9b1f39fbd40d2"],["src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py","186102bbe8f52f8a4fd2ae50ba36235c7b628fde","93f0d9c6be38ce9ae46abbe402b3097bb1efe618"],["src/codex_plugin_scanner/guard/policy_lane_capabilities.py","601d541568575f0d470422e0f00268981fa42ec7","89253e79d259ce4cb6adda7ba6e3daffbd58e72f"],["tests/test_policy_lane_cli.py","17d4f81464cdd663e57affdbf25af5e0e93625e9","5edc3668a27e47f7131ba72c2535fa55131399ab"],["docs/guard/runtime-lane-capabilities.md","2659804aba6d2c42b15f781c29b2f849719b29a4","b36be5df87c034287c2d8514d6ac0d3aac2a32d9"],["tests/test_native_generic_sync_unstaged.py",None,"bb7bc3ec887ec188f8eb7ab8797c72ab0d598446"]]
          for path, before, after in changes:
              assert expected.get(path) == (("100644", "blob", before) if before else None)
              expected[path] = ("100644", "blob", after)
          assert len(expected) == 4314 and tree(source) == expected
          assert expected["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py"][2] == "cd0749d72df7ab9a5328f57129ca1bf44c769e60"
          workflow = git("rev-parse", "HEAD:.github/workflows/ci.yml")
          expected[".github/workflows/ci.yml"] = ("100644", "blob", workflow)
          assert tree(head) == expected
          watched = ["rust/crates/guard-runtime/src/resident_protocol.rs","src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py","src/codex_plugin_scanner/guard/policy_lane_capabilities.py","tests/test_policy_lane_cli.py","docs/guard/runtime-lane-capabilities.md","tests/test_native_generic_sync_unstaged.py","tests/test_native_defaults_edge.py","tests/test_native_scoped_result.py","tests/test_native_scoped_worker_fence.py","tests/test_native_source_authority_fence.py","tests/test_native_cloud_policy_capabilities.py","tests/test_policy_bundle_generic_ack_contract.py","tests/test_policy_bundle_generic_acknowledgement.py","scripts/ci/rust_authority_ownership_gate.py","scripts/ci/rust_io_ownership_gate.py","scripts/ci/native_approval_contract_gate.py","scripts/ci/python_hook_semantic_callgraph_gate.py","scripts/ci/native_receipt_persistence_gate.py","scripts/ci/python_capability_cleanup_gate.py","scripts/ci/test_inventory.py","scripts/sync_repo_version.py","scripts/build_native_hol_guard_wheel.py","tests/native_source_bundle.py","basedpyright.native-managed-source.json","pyproject.toml","uv.lock","rust/Cargo.toml","rust/Cargo.lock","conftest.py","tests/conftest.py","tests/test_guard_durable_io.py","tests/test_guard_managed_install_context.py","tests/test_guard_node_semver.py","tests/test_guard_private_file_io.py","src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py","src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scoped.py","src/codex_plugin_scanner/guard/native_policy_bundle_acceptance.py","src/codex_plugin_scanner/guard/native_policy_bundle_ack.py","src/codex_plugin_scanner/guard/native_hook_edge.py","src/codex_plugin_scanner/guard/daemon/hook_worker.py","src/codex_plugin_scanner/guard/native_runtime.py","src/codex_plugin_scanner/guard/native_runtime_capabilities.py","src/codex_plugin_scanner/guard/native_runtime_selection.py"]
          for path in [*watched, ".github/workflows/ci.yml"]:
              content = Path(path).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()
              assert actual == expected[path][2], path
          assert not git("status", "--porcelain", "--untracked-files=no")
          report = {"schema": "native-activation-source-proof.v2", "source": source, "head": head,
                    "sourceTree": "ef86a4934abc24737743332c0d96fedcfd05b1fd", "diagnosticTree": diagnostic_tree,
                    "sourceLeaves": len(expected), "workingPins": len(watched) + 1, "phase": os.environ["GUARD_PHASE"]}
          directory = Path("artifacts/native-activation")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / ("source-" + os.environ["GUARD_PHASE"] + ".json")).write_text(json.dumps(report, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - id: dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Verify installation fixture interpreter provenance
        id: interpreter
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Validate protected test inventory
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python scripts/ci/test_inventory.py --output artifacts/native-activation/test-inventory.json
      - name: Check source lint
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python -m ruff check src/ tests/test_guard_durable_io.py tests/test_guard_managed_install_context.py tests/test_guard_node_semver.py tests/test_guard_private_file_io.py tests/test_policy_lane_cli.py tests/test_native_generic_sync_unstaged.py
      - name: Check source formatting
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python -m ruff format --check src/ tests/test_guard_durable_io.py tests/test_guard_managed_install_context.py tests/test_guard_node_semver.py tests/test_guard_private_file_io.py tests/test_policy_lane_cli.py tests/test_native_generic_sync_unstaged.py
      - name: Check unused production bindings
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python -m ruff check src/codex_plugin_scanner/guard/ --select=F401,F811,F841
      - name: Check normal Python types
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync basedpyright --level error
      - name: Check native source types
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync basedpyright --pythonpath .venv/bin/python --pythonversion 3.12 --project basedpyright.native-managed-source.json
      - name: Check the unchanged acceptance criterion types
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync basedpyright --pythonpath .venv/bin/python tests/test_native_generic_sync_unstaged.py
      - name: Check Rust authority ownership
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python scripts/ci/rust_authority_ownership_gate.py --root . --base-ref e814138f3246d79f57c45c8fc6224102cc8fbf0a --json artifacts/native-activation/rust-authority-ownership.json
      - name: Check Rust IO ownership
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python scripts/ci/rust_io_ownership_gate.py --root .
      - name: Check native approval contracts
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python scripts/ci/native_approval_contract_gate.py --root .
      - name: Check Python hook semantic ownership
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python scripts/ci/python_hook_semantic_callgraph_gate.py --root .
      - name: Check native receipt persistence
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python scripts/ci/native_receipt_persistence_gate.py --root . --json artifacts/native-activation/native-receipt-persistence.json
      - name: Check Python capability cleanup
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          uv run --no-sync python scripts/ci/python_capability_cleanup_gate.py --root . --json artifacts/native-activation/python-capability-cleanup.json
      - name: Prepare exact test collection and JUnit accounting
        id: observer
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          cat > "$RUNNER_TEMP/native-activation-results.py" <<'PY'
          import collections
          import json
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import pytest
          
          group = sys.argv[1]
          assert group in {"criterion", "components"}
          control_functions = {"tests/test_policy_lane_cli.py":["test_cli_reports_static_profiles_separately_from_activation","test_cli_selects_real_validator_after_trusted_loading","test_cli_does_not_normalize_invalid_selector_into_global_scope","test_cli_expression_evaluation_cannot_claim_authenticated_admission","test_advertised_evaluator_effects_match_actual_trusted_loading","test_actual_evaluator_refuses_to_drop_additional_authority","test_trusted_loader_already_refuses_unpublished_network_extension"],"tests/test_native_defaults_edge.py":["test_post_defaults_require_exact_source_and_authenticated_receipt","test_post_defaults_refuse_malformed_typed_result","test_post_defaults_refuse_unknown_fields_missing_required_fields_and_cross_event_replay","test_post_result_matrix_cannot_be_repaired_with_only_a_new_receipt_hash","test_post_worker_checks_live_binding_before_output_and_never_lowers_intrinsic_block","test_post_admission_refusal_uses_terminal_post_shape","test_observe_policy_warning_does_not_request_approval_or_lower_intrinsic_block","test_post_action_output_matrix_rejects_self_consistent_but_impossible_results","test_post_projection_and_excerpt_fields_cannot_be_repaired_by_rehashing"],"tests/test_native_scoped_result.py":["test_scoped_result_requires_exact_published_identity","test_observe_without_projection_retains_authenticated_receipt_mode","test_optional_observe_projection_still_requires_finite_action","test_malformed_scoped_identity_is_not_authority","test_scoped_result_never_infers_missing_binding_or_receipt_fields","test_recomputed_receipt_hash_does_not_replace_snapshot_binding","test_scoped_transport_requires_complete_capability_and_unambiguous_response","test_scoped_protocol_versions_require_integers","test_scoped_expected_generation_requires_integer"],"tests/test_native_scoped_worker_fence.py":["test_worker_rechecks_scoped_publication_before_receipt_or_allow","test_worker_rejects_scoped_readiness_loss_before_transport","test_scoped_preparation_never_reuses_a_legacy_fallback","test_scoped_admission_does_not_use_emergency_safe_continuation","test_scoped_native_deny_cannot_be_lowered_by_python_watch","test_scoped_authority_refusal_preserves_post_tool_response_shape"],"tests/test_native_source_authority_fence.py":["test_default_v3_refuses_unrepresented_signed_source_before_hook_admission","test_required_source_failures_never_record_or_allow","test_queue_failure_cannot_override_existing_source_with_availability_or_watch","test_v3_does_not_admit_orphaned_remote_materialization","test_supported_signed_defaults_still_publish_but_mutation_fences_returned_result","test_source_arriving_during_ipc_invalidates_source_free_allow","test_retained_memory_version_requires_source_after_registry_and_rows_removed"],"tests/test_native_cloud_policy_capabilities.py":["test_canonical_requirements_preserve_active_authority","test_empty_extension_payload_still_requires_its_authority_contract","test_legacy_exceptions_require_native_authority","test_scoped_replacement_revokes_ready_defaults_without_sending_partial_snapshot","test_authenticated_canonical_rules_never_publish_as_defaults_only"],"tests/test_policy_bundle_generic_ack_contract.py":["test_generic_ack_has_no_managed_delivery_or_extension_proof","test_matching_applied_ack_survives_later_unverified_observation","test_generic_validator_accepts_the_existing_cloud_schema","test_generic_generator_rejects_invalid_bound_identity","test_continuity_source_never_mints_a_generic_ack"],"tests/test_policy_bundle_generic_acknowledgement.py":["test_generic_v2_ack_is_unverified_until_the_chosen_lane_applies","test_empty_acknowledgement_never_counts_as_applied","test_received_generic_ack_can_become_applied_after_the_lane_commits","test_retained_generic_bundle_does_not_reuse_extension_delivery_as_proof","test_applied_generic_ack_is_not_overwritten_when_rollout_later_disables","test_generic_ack_validator_rejects_managed_delivery_fields"]}
          criterion = "tests/test_native_generic_sync_unstaged.py::test_ordinary_signed_sync_earns_unstaged_native_worker_acceptance"
          expected = control_functions if group == "components" else {criterion.split("::")[0]: [criterion.split("::")[1]]}
          paths = list(expected) if group == "components" else [criterion]
          directory = Path("artifacts/native-activation")
          directory.mkdir(parents=True, exist_ok=True)
          xml_path = directory / (group + ".xml")
          
          class Observer:
              def __init__(self):
                  self.collected = []
                  self.deselected = []
          
              def pytest_collection_finish(self, session):
                  self.collected = [item.nodeid for item in session.items]
          
              def pytest_deselected(self, items):
                  self.deselected.extend(item.nodeid for item in items)
          
          observer = Observer()
          exit_code = int(pytest.main(["-q", "--tb=short", "-m", "" if group == "components" else "slow",
                                      "--junitxml=" + str(xml_path), *paths], plugins=[observer]))
          observed_functions = collections.defaultdict(set)
          for node in observer.collected:
              path, name = node.split("::", 1)
              observed_functions[path].add(name.split("[", 1)[0])
          expected_functions = {path: set(names) for path, names in expected.items()}
          collection_ok = (dict(observed_functions) == expected_functions and not observer.deselected
                           and len(observer.collected) == len(set(observer.collected)))
          if group == "criterion":
              collection_ok = collection_ok and observer.collected == [criterion]
          xml_error = None
          cases = []
          try:
              cases = ET.parse(xml_path).getroot().findall(".//testcase")
          except (OSError, ET.ParseError) as error:
              xml_error = type(error).__name__
          collected_counts = collections.Counter((node.split("::", 1)[0][:-3].replace("/", "."),
                                                  node.split("::", 1)[1]) for node in observer.collected)
          xml_counts = collections.Counter((case.get("classname"), case.get("name")) for case in cases)
          xml_ok = (xml_error is None and bool(cases) and xml_counts == collected_counts
                    and all(not list(case.iter("failure")) and not list(case.iter("error"))
                            and not list(case.iter("skipped")) for case in cases))
          passed = exit_code == 0 and collection_ok and xml_ok
          report = {"schema": "native-activation-tests.v1", "group": group, "originalPytestExitCode": exit_code,
                    "collected": len(observer.collected), "junitCases": len(cases),
                    "modules": {path: sum(node.startswith(path + "::") for node in observer.collected) for path in expected},
                    "exactCollection": collection_ok, "junitCompleteAndAllPassed": xml_ok, "xmlError": xml_error,
                    "allAssertionsPassed": passed, "stagedFeatureNegotiation": False if group == "criterion" else "controlled-fixtures",
                    "defaultConsumerEvidence": passed and group == "criterion", "installedImageAcceptance": False,
                    "allRoutesAcceptance": False}
          (directory / (group + ".json")).write_text(json.dumps(report, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          raise SystemExit(exit_code if exit_code else (0 if passed else 1))
          PY
      - name: Run complete component and CLI controls
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.observer.outcome == 'success'
        env:
          PYTHONPATH: src
        run: |
          uv run --no-sync python "$RUNNER_TEMP/native-activation-results.py" components
      - name: Install the pinned Rust toolchain
        id: rust
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success'
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Validate the locked Rust workspace
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.rust.outcome == 'success'
        run: |
          cargo +1.88.0 metadata --manifest-path rust/Cargo.toml --locked --format-version 1 --no-deps > /dev/null
      - name: Check Rust formatting
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.rust.outcome == 'success'
        run: |
          cargo +1.88.0 fmt --manifest-path rust/Cargo.toml --all --check
      - name: Check every Rust workspace target
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.rust.outcome == 'success'
        run: |
          HOL_GUARD_PACKAGE_VERSION="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          export HOL_GUARD_PACKAGE_VERSION
          cargo +1.88.0 clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - name: Test every Rust workspace target
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.rust.outcome == 'success'
        run: |
          HOL_GUARD_PACKAGE_VERSION="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          export HOL_GUARD_PACKAGE_VERSION
          cargo +1.88.0 test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
      - name: Build and self-test the exact release runtime
        id: build
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.rust.outcome == 'success'
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          HOL_GUARD_PACKAGE_VERSION="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          export HOL_GUARD_PACKAGE_VERSION
          cargo +1.88.0 build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
      - name: Stage the verified source build for native auto discovery
        id: bundle
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          proof_pure_dir="$(mktemp -d "$RUNNER_TEMP/native-auto-pure.XXXXXX")"
          proof_native_dir="$(mktemp -d "$RUNNER_TEMP/native-auto-bundle.XXXXXX")"
          proof_runtime="$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime"
          proof_version="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          proof_rule_digest="$("$proof_runtime" capabilities --json | python -c 'import json,sys; print(json.load(sys.stdin)["rule_digest"])')"
          proof_target="$(rustc +1.88.0 -vV | sed -n 's/^host: //p')"
          test "$proof_target" = "x86_64-unknown-linux-gnu"
          uv build --wheel --out-dir "$proof_pure_dir"
          proof_wheels=("$proof_pure_dir"/*.whl)
          test "${#proof_wheels[@]}" -eq 1
          test -f "${proof_wheels[0]}"
          uv run --no-sync python -m tests.native_source_bundle \
            --wheel "${proof_wheels[0]}" \
            --runtime "$proof_runtime" \
            --output-dir "$proof_native_dir" \
            --version "$proof_version" \
            --source-sha "$GITHUB_SHA" \
            --rule-digest "$proof_rule_digest" \
            --platform-tag linux_x86_64 \
            --target "$proof_target"
      - name: Verify actual capabilities and bundled auto discovery
        id: capabilities
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.bundle.outcome == 'success'
        env:
          HOL_GUARD_NATIVE: auto
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          PYTHONPATH: src
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from codex_plugin_scanner.guard.native_runtime import native_runtime_status
          
          assert os.environ["HOL_GUARD_NATIVE"] == "auto"
          for key in ("HOL_GUARD_TEST_MODE", "HOL_GUARD_PYTHON_ORACLE", "HOL_GUARD_NATIVE_DIAGNOSTIC"):
              assert not os.environ.get(key), key
          runtime = Path("rust/target/release/hol-guard-runtime").resolve()
          bundled = Path("src/codex_plugin_scanner/_native/hol-guard-runtime").resolve()
          actual = json.loads(subprocess.check_output([str(runtime), "capabilities", "--json"], text=True))
          features = actual["features"]
          assert isinstance(features, list) and all(isinstance(value, str) for value in features)
          assert len(features) == len(set(features))
          required = {"policy-snapshot-v4", "policy-scoped-authority-v1", "hook-envelope-v3",
                      "policy-snapshot-resident-generation-v1", "native-policy-in-memory-v1",
                      "native-resident-client-v1", "pre-tool-generic-authority-v1"}
          optional = {"policy-managed-authority-v1", "policy-command-expressions-v1", "policy-managed-config-floor-v1"}
          assert required <= set(features) and not optional.intersection(features)
          version = subprocess.check_output(
              ["uv", "run", "--no-sync", "python", "scripts/sync_repo_version.py", "--check"], text=True
          ).strip()
          assert actual["build_sha"] == os.environ["GITHUB_SHA"] and actual["runtime_version"] == version
          digest = hashlib.sha256(runtime.read_bytes()).hexdigest()
          assert hashlib.sha256(bundled.read_bytes()).hexdigest() == digest
          status = native_runtime_status()
          assert status.mode == "auto" and status.available and status.compatible
          assert status.identity is not None and status.capabilities is not None
          assert status.identity.path.resolve() == bundled and status.identity.sha256 == digest
          assert status.capabilities.build_sha == actual["build_sha"]
          assert status.capabilities.runtime_version == actual["runtime_version"]
          assert status.capabilities.rule_digest == actual["rule_digest"]
          assert set(status.capabilities.features) == set(features)
          report = {"schema": "native-default-capability-proof.v1", "sourceSha": actual["build_sha"],
                    "runtimeVersion": version, "runtimeSha256": digest, "ruleDigest": actual["rule_digest"],
                    "featureCount": len(features), "scopedTrioAdvertised": True, "optionalAuthorityAdvertised": False,
                    "actualAutoDiscovery": True, "installedImageAcceptance": False, "policyApplicationAcceptance": False}
          Path("artifacts/native-activation/capabilities.json").write_text(json.dumps(report, sort_keys=True) + "\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Require complete ordinary native application and ACK acceptance
        id: criterion
        if: always() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' && steps.bundle.outcome == 'success' && steps.capabilities.outcome == 'success' && steps.observer.outcome == 'success'
        env:
          HOL_GUARD_NATIVE: auto
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          PYTHONPATH: src
        run: |
          uv run --no-sync python "$RUNNER_TEMP/native-activation-results.py" criterion
      - name: Verify exact source after execution
