name: Final Python formatting capture

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: final-python-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formatting:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-final-python-format-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      FORMAT_BINDING_JSON: '{"schema":1,"branch":"hgp/diagnostic-final-python-format-20260919","source":{"commit":"afa6049b3151422bc2f6103092c03661e40ff4f2","tree":"f31ab411a08fea835e3b4e4507814c5addda8f7b","parents":["ea924506494786e6c66ade7d71aa51e4e1a768ca"],"base_commit":"ea924506494786e6c66ade7d71aa51e4e1a768ca","base_tree":"06beab45a68faa3087de8b4e8ef6b376aee611f2","base_changes":["M\tsrc/codex_plugin_scanner/guard/receipt_sync_authority.py","A\tsrc/codex_plugin_scanner/guard/runtime/receipt_redaction.py","M\tsrc/codex_plugin_scanner/guard/runtime/receipt_upload.py","M\tsrc/codex_plugin_scanner/guard/runtime/workspace_preferences.py","A\ttests/test_receipt_redaction_local_floors.py","A\ttests/test_receipt_signed_redaction_commit.py","A\ttests/test_receipt_signed_redaction_default.py"],"leaf_count":4342},"targets":[{"path":"src/codex_plugin_scanner/guard/receipt_sync_authority.py","mode":"100644","sha":"d44f37911e3096ee627d963528f7a7f2b9a60dba","before_bytes":16135,"before_nonblank":341,"max_after_bytes":65536,"max_after_nonblank":500,"import_policy":"exact","must_change":false},{"path":"src/codex_plugin_scanner/guard/runtime/receipt_redaction.py","mode":"100644","sha":"88ef3cc43bf6a85ef062996e9c1b022647a7df0a","before_bytes":2500,"before_nonblank":54,"max_after_bytes":65536,"max_after_nonblank":500,"import_policy":"exact","must_change":false},{"path":"src/codex_plugin_scanner/guard/runtime/receipt_upload.py","mode":"100644","sha":"58e4dc9bd5f9fe363ec12165eee3d420166a91de","before_bytes":7671,"before_nonblank":165,"max_after_bytes":65536,"max_after_nonblank":500,"import_policy":"exact","must_change":false},{"path":"src/codex_plugin_scanner/guard/runtime/workspace_preferences.py","mode":"100644","sha":"a9d6c652168171dbc7a6c1ebd4ab07aea4d5dd2d","before_bytes":3014,"before_nonblank":60,"max_after_bytes":65536,"max_after_nonblank":500,"import_policy":"exact","must_change":false},{"path":"tests/test_guard_cli.py","mode":"100644","sha":"45449faa511387cb79bf9fce1968ee6bdfaff7b8","before_bytes":375029,"before_nonblank":9017,"max_after_bytes":378012,"max_after_nonblank":9092,"import_policy":"exact","must_change":true},{"path":"tests/test_receipt_redaction_local_floors.py","mode":"100644","sha":"d10b38a2c5c2fb73f6d2efa33b24fbb30ce4f416","before_bytes":5654,"before_nonblank":99,"max_after_bytes":65536,"max_after_nonblank":500,"import_policy":"exact","must_change":false},{"path":"tests/test_receipt_signed_redaction_commit.py","mode":"100644","sha":"22dfafd5ea67863227953b8a5e71554cf507f2aa","before_bytes":2962,"before_nonblank":54,"max_after_bytes":65536,"max_after_nonblank":500,"import_policy":"exact","must_change":true},{"path":"tests/test_receipt_signed_redaction_default.py","mode":"100644","sha":"c0036d857b2e029b210cbb66c9d9847f18ec81bf","before_bytes":6156,"before_nonblank":114,"max_after_bytes":65536,"max_after_nonblank":500,"import_policy":"exact","must_change":false}],"pins":[["pyproject.toml","100644","64a0281ee6b4f57a74cab68ac992fec3d782a6bb"],["src/codex_plugin_scanner/guard/receipt_sync_authority.py","100644","d44f37911e3096ee627d963528f7a7f2b9a60dba"],["src/codex_plugin_scanner/guard/runtime/receipt_redaction.py","100644","88ef3cc43bf6a85ef062996e9c1b022647a7df0a"],["src/codex_plugin_scanner/guard/runtime/receipt_upload.py","100644","58e4dc9bd5f9fe363ec12165eee3d420166a91de"],["src/codex_plugin_scanner/guard/runtime/workspace_preferences.py","100644","a9d6c652168171dbc7a6c1ebd4ab07aea4d5dd2d"],["tests/test_guard_cli.py","100644","45449faa511387cb79bf9fce1968ee6bdfaff7b8"],["tests/test_receipt_redaction_local_floors.py","100644","d10b38a2c5c2fb73f6d2efa33b24fbb30ce4f416"],["tests/test_receipt_signed_redaction_commit.py","100644","22dfafd5ea67863227953b8a5e71554cf507f2aa"],["tests/test_receipt_signed_redaction_default.py","100644","c0036d857b2e029b210cbb66c9d9847f18ec81bf"],["uv.lock","100644","10e18a310e63ba3c5940e25b44269d48dfc7f2da"]]}'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before formatting
        id: source_guard
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import PurePosixPath
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          binding = json.loads(os.environ["FORMAT_BINDING_JSON"])
          assert binding["schema"] == 1
          source = binding["source"]
          targets = binding["targets"]
          pins = binding["pins"]
          assert 1 <= len(targets) <= 32
          assert len({item["path"] for item in targets}) == len(targets)
          assert len({item[0] for item in pins}) == len(pins)
          assert len(source["parents"]) == 1
          for value in (source["commit"], source["tree"], source["base_commit"], source["base_tree"], *source["parents"]):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert re.fullmatch(r"hgp/diagnostic-[a-z0-9-]+", binding["branch"])
          pin_map = {}
          for path, mode, sha in pins:
              parsed = PurePosixPath(path)
              assert not parsed.is_absolute() and str(parsed) == path and ".." not in parsed.parts
              assert re.fullmatch(r"[A-Za-z0-9_./-]+", path)
              assert mode in ("100644", "100755") and re.fullmatch(r"[0-9a-f]{40}", sha)
              pin_map[path] = (mode, sha)
          assert {"pyproject.toml", "uv.lock"}.issubset(pin_map)
          for item in targets:
              path = item["path"]
              assert re.fullmatch(r"(?:src|tests)/[A-Za-z0-9_./-]+\.py", path)
              assert pin_map[path] == (item["mode"], item["sha"])
              assert item["import_policy"] in ("exact", "from_aliases")
              assert type(item["must_change"]) is bool
              assert 0 < item["before_bytes"] <= item["max_after_bytes"] <= 2 * 1024 * 1024
              assert 0 < item["before_nonblank"] <= item["max_after_nonblank"]
          assert sum(item["max_after_bytes"] for item in targets) <= 8 * 1024 * 1024
          assert type(source["leaf_count"]) is int and source["leaf_count"] > 0
          expected_source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (expected_source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert expected_source == source["commit"]
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/" + binding["branch"]
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [head, expected_source]
          assert git("rev-list", "--parents", "-n", "1", expected_source).split() == [expected_source, *source["parents"]]
          assert git("rev-parse", expected_source + "^{tree}") == source["tree"]
          assert git("rev-parse", source["base_commit"] + "^{tree}") == source["base_tree"]
          assert len(git("ls-tree", "-r", "--full-tree", expected_source).splitlines()) == source["leaf_count"]
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, "HEAD") == git("show", "-s", identity, expected_source)
          assert git("show", "-s", identity, expected_source) == git("show", "-s", identity, "51d5684be15c03b979e145663e110ec5bfdc94ee")
          assert git("diff", "--name-status", "--no-renames", source["base_commit"], expected_source).splitlines() == source["base_changes"]
          assert git("diff", "--name-status", "--no-renames", expected_source, "HEAD").splitlines() == ["M\t.github/workflows/ci.yml"]
          allowed = {item["path"] for item in targets} if os.environ.get("FORMAT_OUTPUTS_ALLOWED") == "1" else set()
          for path, mode, sha in pins:
              expected = f"{mode} blob {sha}\t{path}"
              assert git("ls-tree", expected_source, "--", path) == expected
              assert git("ls-tree", "HEAD", "--", path) == expected
              if path not in allowed:
                  assert git("hash-object", "--", path) == sha
          subprocess.run(["git", "diff", "--cached", "--exit-code"], check=True)
          changes = git("diff", "--name-status", "--no-renames", "HEAD").splitlines()
          assert set(changes).issubset({"M\t" + path for path in allowed}), changes
          print(json.dumps({"sourceGuard": "passed", "pins": len(pins), "targets": len(targets), "allowedFormattingChanges": len(changes)}, sort_keys=True))
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Generate and check exact repository formatting
        run: |
          uv run --no-sync python -I - <<'PY'
          import json
          import os
          import subprocess
          
          binding = json.loads(os.environ["FORMAT_BINDING_JSON"])
          targets = binding["targets"]
          paths = [item["path"] for item in targets]
          version = subprocess.check_output(["uv", "run", "--no-sync", "ruff", "--version"], text=True).strip()
          assert version == "ruff 0.15.17", version
          import_paths = [item["path"] for item in targets if item["import_policy"] == "from_aliases"]
          if import_paths:
              subprocess.run(["uv", "run", "--no-sync", "ruff", "check", "--select", "I001", "--fix", *import_paths], check=True)
          subprocess.run(["uv", "run", "--no-sync", "ruff", "format", *paths], check=True)
          subprocess.run(["uv", "run", "--no-sync", "ruff", "check", *paths], check=True)
          subprocess.run(["uv", "run", "--no-sync", "ruff", "format", "--check", *paths], check=True)
          print(json.dumps({"formatter": version, "filesChecked": len(paths), "namedImportFixes": len(import_paths), "allEnabledLint": "passed", "formatCheck": "passed"}, sort_keys=True))
          PY
      - name: Prove preservation and emit complete generated bytes
        run: |
          uv run --no-sync python -I - <<'PY'
          import ast
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          
          binding = json.loads(os.environ["FORMAT_BINDING_JSON"])
          source = binding["source"]["commit"]
          
          def git_bytes(*arguments):
              return subprocess.check_output(["git", *arguments])
          
          def blob_sha(raw):
              return hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()
          
          def parse(raw, path):
              tree = ast.parse(raw.decode("utf-8"), filename=path, type_comments=True, feature_version=(3, 10))
              compile(tree, path, "exec")
              return tree
          
          def dump(node):
              return ast.dump(node, include_attributes=False)
          
          def from_alias_structure(tree):
              body = list(tree.body)
              start = int(bool(body) and isinstance(body[0], ast.Expr)
                          and isinstance(body[0].value, ast.Constant)
                          and isinstance(body[0].value.value, str))
              stop = start
              while stop < len(body) and isinstance(body[stop], (ast.Import, ast.ImportFrom)):
                  stop += 1
              normalized = []
              aliases = []
          
              def flush():
                  if aliases:
                      normalized.append(("from-aliases", sorted(aliases)))
                      aliases.clear()
          
              for node in body[start:stop]:
                  if (isinstance(node, ast.ImportFrom) and node.module != "__future__"
                          and all(alias.name != "*" for alias in node.names)):
                      aliases.extend((node.module or "", node.level, alias.name, alias.asname or "") for alias in node.names)
                  else:
                      flush()
                      normalized.append(("exact-import", dump(node)))
              flush()
              remainder = ast.Module(body=[*body[:start], *body[stop:]], type_ignores=tree.type_ignores)
              return normalized, dump(remainder)
          
          version = subprocess.check_output(["uv", "run", "--no-sync", "ruff", "--version"], text=True).strip()
          assert version == "ruff 0.15.17", version
          records = []
          for item in binding["targets"]:
              path = item["path"]
              original = git_bytes("show", source + ":" + path)
              assert blob_sha(original) == item["sha"]
              assert len(original) == item["before_bytes"]
              before_nonblank = sum(bool(line.strip()) for line in original.decode("utf-8").splitlines())
              assert before_nonblank == item["before_nonblank"]
              metadata = Path(path).lstat()
              assert stat.S_ISREG(metadata.st_mode) and not Path(path).is_symlink()
              assert bool(metadata.st_mode & 0o111) == (item["mode"] == "100755")
              generated = Path(path).read_bytes()
              assert 0 < len(generated) <= item["max_after_bytes"]
              before, after = parse(original, path), parse(generated, path)
              ast_exact = dump(before) == dump(after)
              if item["import_policy"] == "exact":
                  assert ast_exact, path
              else:
                  assert from_alias_structure(before) == from_alias_structure(after), path
              before_asserts = [dump(node) for node in ast.walk(before) if isinstance(node, ast.Assert)]
              after_asserts = [dump(node) for node in ast.walk(after) if isinstance(node, ast.Assert)]
              assert before_asserts == after_asserts
              before_tests = [node.name for node in ast.walk(before)
                              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")]
              after_tests = [node.name for node in ast.walk(after)
                             if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")]
              assert before_tests == after_tests
              changed = generated != original
              assert not item["must_change"] or changed, path
              nonblank = sum(bool(line.strip()) for line in generated.decode("utf-8").splitlines())
              assert nonblank <= item["max_after_nonblank"], path
              encoded = base64.b64encode(generated).decode("ascii") if changed else ""
              chunks = [encoded[offset:offset + 4096] for offset in range(0, len(encoded), 4096)]
              records.append({
                  "path": path, "before": item["sha"], "after": blob_sha(generated),
                  "sha256": hashlib.sha256(generated).hexdigest(), "bytes": len(generated),
                  "mode": item["mode"], "nonblank": nonblank, "changed": changed,
                  "astExact": ast_exact, "importPolicy": item["import_policy"],
                  "assertionCount": len(before_asserts), "testFunctionCount": len(before_tests),
                  "chunks": chunks,
              })
          changed_paths = sorted(record["path"] for record in records if record["changed"])
          assert git_bytes("diff", "--name-status", "--no-renames", "HEAD").decode().splitlines() == [
              "M\t" + path for path in changed_paths
          ]
          subprocess.run(["git", "diff", "--cached", "--exit-code"], check=True)
          assert sum(record["bytes"] for record in records) <= 8 * 1024 * 1024
          for record in records:
              chunks = record.pop("chunks")
              print(json.dumps({"record": "formatted-file", **record, "chunkCount": len(chunks)}, sort_keys=True))
              for index, chunk in enumerate(chunks):
                  print(json.dumps({
                      "record": "formatted-file-chunk", "path": record["path"],
                      "after": record["after"], "index": index, "count": len(chunks), "base64": chunk,
                  }, sort_keys=True))
          print(json.dumps({
              "record": "formatting-preservation", "source": source, "files": len(records),
              "changedFiles": len(changed_paths), "ruff": version,
              "assertionsExact": True, "testFunctionNamesExact": True,
              "allOtherTrackedBytesUnchanged": True,
              "totalGeneratedBytes": sum(record["bytes"] for record in records if record["changed"]),
              "totalAssertions": sum(record["assertionCount"] for record in records),
          }, sort_keys=True))
          PY
      - name: Verify exact source after formatting
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          FORMAT_OUTPUTS_ALLOWED: "1"
        run: |
          python -I - <<'PY'
