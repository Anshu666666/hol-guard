          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [diagnostic_commit, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, baseline]
          assert git("rev-list", "--parents", "-n", "1", baseline).split() == [baseline, "51d5684be15c03b979e145663e110ec5bfdc94ee"]
          assert git("rev-parse", source + "^{tree}") == "4425ef91a0c0c7ba0975047e5495fef358281ec4"
