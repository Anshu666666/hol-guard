name: Policy fixture recovery diagnostic
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Immutable diagnostic commit
        required: true
        type: string
      expected_tree:
        description: Reviewed diagnostic tree
        required: true
        type: string
      expected_workflow_blob:
        description: Reviewed diagnostic workflow blob
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: policy-fixture-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixture-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      EXPECTED_WORKFLOW_BLOB: ${{ inputs.expected_workflow_blob }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - name: Verify immutable source before execution
        id: source_before
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path
          
          PARENT = "9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12"
          PARENT_TREE = "8ca9c2df12566dc340a59f37f6e14ece267622fe"
          WORKFLOW = ".github/workflows/ci.yml"
          REPLACEMENTS = {
              "tests/test_guard_runtime.py": [
                  "100644",
                  "blob",
                  "699f385b4de589deb0d3980464314dfcefc55a9d"
              ],
              "tests/test_guard_command_queue.py": [
                  "100644",
                  "blob",
                  "0021778c8119fe28c346996cbb239381fa30b64c"
              ],
              "tests/test_paseo_adapter.py": [
                  "100644",
                  "blob",
                  "88b34513adf145a7ce8c5e6fc51982c732de0694"
              ],
              "tests/oauth_refresh_fixture_support.py": [
                  "100644",
                  "blob",
                  "dcab0efe509dd99d543942987db3ddccdc32d62a"
              ],
              ".github/workflows/native-managed-source-contract.yml": [
                  "100644",
                  "blob",
                  "26a5e0becb9d61e439583e70efc610760acfd288"
              ]
          }
          values = {
              name: os.environ[name]
              for name in ("EXPECTED_COMMIT", "EXPECTED_TREE", "EXPECTED_WORKFLOW_BLOB")
          }
          if not all(re.fullmatch(r"[0-9a-f]{40}", value) for value in values.values()):
              raise RuntimeError("Diagnostic identities must be complete immutable Git hashes.")
          
          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout
          
          def leaves(ref):
              result = {}
              for entry in git("ls-tree", "-rz", "--full-tree", ref).split(b"\0"):
                  if entry:
                      metadata, path = entry.split(b"\t", 1)
                      result[path.decode("utf-8")] = metadata.decode("ascii").split()
              return result
          
          head = git("rev-parse", "HEAD").decode().strip()
          tree = git("rev-parse", "HEAD^{tree}").decode().strip()
          if head != values["EXPECTED_COMMIT"] or head != os.environ["GITHUB_SHA"]:
              raise RuntimeError("The diagnostic commit differs from the dispatch.")
          if tree != values["EXPECTED_TREE"]:
              raise RuntimeError("The diagnostic tree differs from the reviewed tree.")
          parents = git("rev-list", "--parents", "-n", "1", "HEAD").decode().split()
          if parents != [head, PARENT]:
              raise RuntimeError("The diagnostic must have exactly the reviewed parent.")
          identity = git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", "HEAD").decode().splitlines()
          if identity != ["kantorcodes", "6068672+kantorcodes@users.noreply.github.com"] * 2:
              raise RuntimeError("The diagnostic commit identity differs from the reviewed identity.")
          if git("rev-parse", PARENT + "^{tree}").decode().strip() != PARENT_TREE:
              raise RuntimeError("The parent source tree differs from the reviewed source.")
          expected = leaves(PARENT)
          expected.update(REPLACEMENTS)
          expected[WORKFLOW] = ["100644", "blob", values["EXPECTED_WORKFLOW_BLOB"]]
          actual = leaves("HEAD")
          if len(actual) != 4301 or actual != expected:
              raise RuntimeError("The diagnostic contains an unexpected source delta.")
          for relative, (mode, kind, expected_blob) in actual.items():
              path = Path(relative)
              metadata = path.lstat()
              if kind != "blob" or mode not in {"100644", "100755"} or not stat.S_ISREG(metadata.st_mode):
                  raise RuntimeError("An unexpected tracked file kind was found.")
              if bool(metadata.st_mode & 0o111) != (mode == "100755"):
                  raise RuntimeError("A tracked executable mode changed.")
              data = path.read_bytes()
              observed = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data, usedforsecurity=False).hexdigest()
              if observed != expected_blob:
                  raise RuntimeError("Tracked source bytes changed during the diagnostic.")
          git("diff", "--no-ext-diff", "--exit-code", "HEAD", "--")
          print(json.dumps({"source_guard": "passed", "head": head, "tree": tree, "leaves": len(actual)}, sort_keys=True))
          PY
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install the frozen project environment
        id: dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Prepare an owned Python executable for integrity checks
        id: owned_interpreter
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          import sysconfig
          from pathlib import Path

          launcher = Path(sys.executable).absolute()
          environment = Path(".venv").resolve(strict=True)
          if launcher.parent != environment / "bin":
              raise RuntimeError("Unexpected project interpreter location.")
          configuration = environment / "pyvenv.cfg"
          original_configuration = configuration.read_bytes()
          source = launcher.resolve(strict=True)
          owned = launcher.with_name(".python-owned")
          with source.open("rb") as original, owned.open("xb") as destination:
              shutil.copyfileobj(original, destination)
          owned.chmod(0o700)
          source_digest = hashlib.sha256(source.read_bytes()).hexdigest()
          if hashlib.sha256(owned.read_bytes()).hexdigest() != source_digest:
              raise RuntimeError("Project interpreter copy did not preserve its bytes.")
          owned.replace(launcher)

          from codex_plugin_scanner.guard.codex_hook_file_integrity import validate_regular_file
          from codex_plugin_scanner.guard.codex_hook_launch_runtime import (
              isolated_hook_environment,
              run_isolated_hook_process,
          )

          validate_regular_file(launcher, role="interpreter", executable_required=True)
          expected = {
              "version": list(sys.version_info[:3]),
              "prefix": sys.prefix,
              "base_prefix": sys.base_prefix,
              "purelib": sysconfig.get_path("purelib"),
              "platlib": sysconfig.get_path("platlib"),
              "sha256": source_digest,
          }
          probe_code = (
              "import hashlib,json,sys,sysconfig;from pathlib import Path;"
              "print(json.dumps({'version':list(sys.version_info[:3]),"
              "'prefix':sys.prefix,'base_prefix':sys.base_prefix,"
              "'purelib':sysconfig.get_path('purelib'),'platlib':sysconfig.get_path('platlib'),"
              "'sha256':hashlib.sha256(Path(sys.executable).read_bytes()).hexdigest()}))"
          )
          probe = run_isolated_hook_process(
              [str(launcher), "-I", "-c", probe_code],
              input_text="",
              cwd=environment,
              environment=isolated_hook_environment(),
              timeout_seconds=10,
              output_limit=4096,
          )
          if (
              probe.returncode != 0
              or probe.timed_out
              or probe.output_limit_exceeded
              or probe.containment_failed
          ):
              raise RuntimeError(
                  "The isolated project interpreter could not start: "
                  + json.dumps(
                      {
                          "returncode": probe.returncode,
                          "timed_out": probe.timed_out,
                          "output_limit_exceeded": probe.output_limit_exceeded,
                          "containment_failed": probe.containment_failed,
                          "stderr": probe.stderr[-1000:],
                      },
                      sort_keys=True,
                  )
              )
          if json.loads(probe.stdout) != expected or configuration.read_bytes() != original_configuration:
              raise RuntimeError("The isolated project interpreter changed its environment or executable identity.")
          print(json.dumps({"isolated_interpreter": "verified", "version": expected["version"], "sha256": source_digest}))
          PY
      - name: Check the repaired fixture source
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: |
          uv run --no-sync ruff check tests/test_guard_runtime.py tests/test_guard_command_queue.py tests/test_paseo_adapter.py tests/oauth_refresh_fixture_support.py
          uv run --no-sync ruff format --check tests/test_guard_runtime.py tests/test_guard_command_queue.py tests/test_paseo_adapter.py tests/oauth_refresh_fixture_support.py
      - name: Verify the five original failing fixture cases
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.owned_interpreter.outcome == 'success' }}
        run: >-
          uv run --no-sync pytest -q
          tests/test_guard_runtime.py::test_resolve_guard_sync_auth_context_serializes_refresh_token_rotation
          tests/test_guard_command_queue.py::test_poll_once_reuses_cached_access_token_across_oauth_polls
          tests/test_guard_command_queue.py::test_command_queue_loop_retries_revoked_oauth_auth_and_records_reconnect_state
          tests/test_paseo_adapter.py::test_cloud_sync_preserves_native_inventories_without_sending_local_paseo_content
      - name: Verify original fallback isolation and installation assertions
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.owned_interpreter.outcome == 'success' }}
        run: uv run --no-sync pytest -q tests/test_codex_hook_fallback_isolation.py
      - name: Verify inventory source and completed request authority
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.owned_interpreter.outcome == 'success' }}
        run: >-
          uv run --no-sync pytest -q
          tests/test_inventory_oauth_completion_authority.py
          tests/test_inventory_request_authority.py
          tests/test_inventory_consumer_authority.py
      - name: Verify immutable source after execution
        if: ${{ !cancelled() && steps.source_before.outcome == 'success' }}
        run: |
          python - <<'PY'
