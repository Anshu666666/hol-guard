name: Rust fixture acceptance

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed three-file source commit
        required: true
        type: string
      workflow_blob:
        description: Reviewed workflow Git blob
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-fixture-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-gates:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-rust-fixtures-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify exact source before checks
        shell: python
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_BLOB: ${{ inputs.workflow_blob }}
          GUARD_PHASE: before
        run: |
          import json, os, re, subprocess
          if not __debug__:
              raise RuntimeError('source guards require Python assertions')
          
          def git(*args):
              return subprocess.check_output(['git', *args]).decode('utf-8').strip()
          
          def tree(ref):
              data = subprocess.check_output(['git', 'ls-tree', '-rz', '--full-tree', ref])
              result = {}
              for entry in data.split(b'\0'):
                  if not entry:
                      continue
                  metadata, path = entry.split(b'\t', 1)
                  result[path.decode('utf-8')] = tuple(metadata.decode('ascii').split())
              return result
          
          base = '9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12'
          source = os.environ['SOURCE_COMMIT']
          workflow = os.environ['WORKFLOW_BLOB']
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'invalid source commit'
          assert re.fullmatch(r'[0-9a-f]{40}', workflow), 'invalid workflow blob'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/hgp/diagnostic-rust-fixtures-20260919'
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          assert git('show', '-s', '--format=%P', head) == source
          assert git('show', '-s', '--format=%P', source) == base
          assert git('show', '-s', '--format=%T', base) == '8ca9c2df12566dc340a59f37f6e14ece267622fe'
          assert git('show', '-s', '--format=%T', source) == '73fc359aa9613b995bea93feccad90ac46686da8'
          identity = ['kantorcodes', '6068672+kantorcodes@users.noreply.github.com'] * 2
          for commit in (source, head):
              assert git('show', '-s', '--format=%an%n%ae%n%cn%n%ce', commit).splitlines() == identity
          fixes = {path: tuple(value) for path, value in {"rust/crates/guard-runtime/src/approval_authority.rs":["100644","blob","be903f02dfed3b990ca9e41a60b1996e3e740305"],"rust/crates/guard-runtime/src/approval_authority_tests.rs":["100644","blob","07963d096ae77b334248ca6f6d2eeee4ee01b618"],"rust/crates/guard-runtime/src/policy_client_currentness_tests.rs":["100644","blob","256b79e6f778836a6f39f06f7f7bc4179860ecb5"]}.items()}
          before_pins = {path: tuple(value) for path, value in {"rust/crates/guard-runtime/src/approval_authority.rs":["100644","blob","f1cc6283b80cc37c7001e5f06bb30b1bea3f7512"],"rust/crates/guard-runtime/src/approval_authority_tests.rs":["100644","blob","1b8b5de4f2726c92f039ceacc752688c5a0fdfd8"],"rust/crates/guard-runtime/src/policy_client_currentness_tests.rs":["100644","blob","b2151e390cfe358e7590b678b01bd8a728434cf8"]}.items()}
          baseline = tree(base)
          expected = dict(baseline)
          for path, before in before_pins.items():
              assert baseline[path] == before, 'base source pin mismatch'
          expected.update(fixes)
          assert len(expected) == 4300
          assert tree(source) == expected, 'source contains an unreviewed delta'
          expected['.github/workflows/ci.yml'] = ('100644', 'blob', workflow)
          assert tree(head) == expected, 'diagnostic contains an unreviewed delta'
          assert not git('status', '--porcelain', '--untracked-files=no'), 'tracked checkout changed'
          print(json.dumps({'schema': 'guard-rust-fixture-source-proof.v1',
              'phase': os.environ['GUARD_PHASE'], 'head': head, 'source': source,
              'source_tree': '73fc359aa9613b995bea93feccad90ac46686da8', 'source_leaves': 4300,
              'workflow_blob': workflow, 'source_pins': fixes}, sort_keys=True))
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: rust
          shared-key: authority
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Enforce permanent source ownership
        env:
          OWNERSHIP_BASE_REF: 9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12
        run: |
          args=(--root . --json rust-authority-ownership.json)
          if [[ -n "$OWNERSHIP_BASE_REF" ]]; then
            args+=(--base-ref "$OWNERSHIP_BASE_REF")
          fi
          uv run --no-sync python scripts/ci/rust_authority_ownership_gate.py "${args[@]}"
      - name: Enforce native approval contract ownership
        run: uv run --no-sync python scripts/ci/native_approval_contract_gate.py --root .
      - name: Check complete Rust workspace
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          cargo metadata --manifest-path rust/Cargo.toml --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-targets
      - name: Verify exact source after checks
        if: always()
        shell: python
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_BLOB: ${{ inputs.workflow_blob }}
          GUARD_PHASE: after
        run: |
          import json, os, re, subprocess
          if not __debug__:
