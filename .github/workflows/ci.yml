name: Temporary command corpus diagnostic
run-name: Python 3.10 command corpus diagnostic on ${{ github.sha }}
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-corpus-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  command-corpus:
    name: Unchanged command corpus diagnostic (Python 3.10)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-corpus-compat-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.10
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Diagnose the unchanged native Python command corpus
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run --no-sync python scripts/ci/diagnose_command_corpus.py
