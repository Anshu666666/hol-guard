name: Permission metadata repair verification
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable diagnostic source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = 1ca2f9662da160623545e5a11501d9f3234a9170
          test "$(git rev-parse HEAD:tests/test_store_private_mode_observation.py)" = cd84d8929511cb8076a9eab85b684a0ec5c5b766
          test "$(git hash-object src/codex_plugin_scanner/guard/store_base.py)" = 3b8663163bb029dd4539b0dc9f64730afa65c5a8
          test "$(git hash-object src/codex_plugin_scanner/guard/store_secret_policy_integrity.py)" = 12fb2232111a0f113804d1a409666ca4d5f5d74b
          test "$(git hash-object src/codex_plugin_scanner/guard/store_connection_schema.py)" = 51c7e5be0c707276f2c95d87f4d1c3b0597c17b4
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py)" = 5b36aca18120f759bd63b3ed0420863438f2c917
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_inputs.py)" = 5f88a6ecdacc7fb426d5d6306a8faa44602de3a4
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_authority_read.py)" = 808ed9334b10a26dbb67f186c355d79c870fb554
          test "$(git hash-object src/codex_plugin_scanner/guard/store_policy_integrity_backend.py)" = 6de33b4d03e485648ccb8919045adbbd8c456a07
          test "$(git hash-object src/codex_plugin_scanner/guard/store_policy_integrity_runtime.py)" = 2cefe4b7abf568d6be24ddcee349c1ae7a2158b3
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object src/codex_plugin_scanner/guard/store.py)" = 4edf1f65655e01fea4f634252d4242819ef92f52
          test "$(git hash-object src/codex_plugin_scanner/guard/store_private_mode.py)" = 67d39e449497d4ce35697b66f5f60932dde1a151
          test "$(git hash-object tests/test_store_private_mode_compatibility.py)" = fc1f815442935dbd20d552dad7baddf50fa1141a
          test "$(git hash-object scripts/ci/rust_io_ownership_gate.py)" = 004e7379ba3eeca4af53209136fab3dc44a52da8
          test "$(git hash-object tests/test_rust_io_ownership_gate.py)" = 122441797c7439cb8184512a351a9e2e0e26e0b0
          test "$(git hash-object tests/test_guard_store_migrations.py)" = e516a900c4178d6f41c4174569b45a4dccf159bc
          test "$(git hash-object tests/test_guard_policy_integrity.py)" = bfc58c690c8ca1597e911cce14b1d283d97bb682
          git diff --exit-code
          git diff --cached --exit-code
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/permission-changed.txt"
          printf '%s\n' .github/workflows/ci.yml src/codex_plugin_scanner/guard/store_base.py src/codex_plugin_scanner/guard/store_private_mode.py tests/test_store_private_mode_compatibility.py tests/test_store_private_mode_observation.py > "$RUNNER_TEMP/permission-expected.txt"
          cmp "$RUNNER_TEMP/permission-changed.txt" "$RUNNER_TEMP/permission-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check formatting and imports
        run: |
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/store_base.py \
            src/codex_plugin_scanner/guard/store_private_mode.py \
            tests/test_store_private_mode_compatibility.py tests/test_store_private_mode_observation.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/store_base.py \
            src/codex_plugin_scanner/guard/store_private_mode.py \
            tests/test_store_private_mode_compatibility.py tests/test_store_private_mode_observation.py
      - name: Run real filesystem and integrity preservation regressions
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          uv run --no-sync pytest -q --tb=short \
            tests/test_store_private_mode_observation.py \
            tests/test_store_private_mode_compatibility.py \
            tests/test_guard_store_migrations.py::test_guard_store_constructor_uses_facade_patched_helpers \
            tests/test_guard_store_migrations.py::test_guard_store_secures_guard_home_and_database_permissions \
            tests/test_guard_store_migrations.py::test_guard_store_repairs_existing_guard_home_and_database_permissions \
            tests/test_guard_policy_integrity.py::test_backup_policy_database_sets_private_mode_when_backup_fails \
            tests/test_guard_policy_integrity.py::test_symlinked_guard_home_forces_degraded_local_policy_authority
      - name: Verify unchanged I/O ownership gate
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: uv run --no-sync python scripts/ci/rust_io_ownership_gate.py --root .
      - name: Verify unchanged I/O ownership controls
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: uv run --no-sync pytest -q tests/test_rust_io_ownership_gate.py --tb=short
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git hash-object tests/test_store_private_mode_observation.py)" = cd84d8929511cb8076a9eab85b684a0ec5c5b766
          test "$(git hash-object src/codex_plugin_scanner/guard/store_base.py)" = 3b8663163bb029dd4539b0dc9f64730afa65c5a8
          test "$(git hash-object src/codex_plugin_scanner/guard/store_secret_policy_integrity.py)" = 12fb2232111a0f113804d1a409666ca4d5f5d74b
          test "$(git hash-object src/codex_plugin_scanner/guard/store_connection_schema.py)" = 51c7e5be0c707276f2c95d87f4d1c3b0597c17b4
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py)" = 5b36aca18120f759bd63b3ed0420863438f2c917
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_inputs.py)" = 5f88a6ecdacc7fb426d5d6306a8faa44602de3a4
          test "$(git hash-object src/codex_plugin_scanner/guard/native_policy_authority_read.py)" = 808ed9334b10a26dbb67f186c355d79c870fb554
          test "$(git hash-object src/codex_plugin_scanner/guard/store_policy_integrity_backend.py)" = 6de33b4d03e485648ccb8919045adbbd8c456a07
          test "$(git hash-object src/codex_plugin_scanner/guard/store_policy_integrity_runtime.py)" = 2cefe4b7abf568d6be24ddcee349c1ae7a2158b3
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object src/codex_plugin_scanner/guard/store.py)" = 4edf1f65655e01fea4f634252d4242819ef92f52
          test "$(git hash-object src/codex_plugin_scanner/guard/store_private_mode.py)" = 67d39e449497d4ce35697b66f5f60932dde1a151
          test "$(git hash-object tests/test_store_private_mode_compatibility.py)" = fc1f815442935dbd20d552dad7baddf50fa1141a
          test "$(git hash-object scripts/ci/rust_io_ownership_gate.py)" = 004e7379ba3eeca4af53209136fab3dc44a52da8
          test "$(git hash-object tests/test_rust_io_ownership_gate.py)" = 122441797c7439cb8184512a351a9e2e0e26e0b0
          test "$(git hash-object tests/test_guard_store_migrations.py)" = e516a900c4178d6f41c4174569b45a4dccf159bc
          test "$(git hash-object tests/test_guard_policy_integrity.py)" = bfc58c690c8ca1597e911cce14b1d283d97bb682
          git diff --exit-code
          git diff --cached --exit-code
          echo 'PERMISSION_REPAIR_TRACKED_SOURCE_UNCHANGED=true'
