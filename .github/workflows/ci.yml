name: Workspace configuration containment repair verification
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        description: Immutable diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Immutable diagnostic tree
        required: true
        type: string

permissions:
  contents: read

env:
  CI_UV_CACHE_DEPENDENCY_GLOB: |
    pyproject.toml
    uv.lock
    requirements.txt
    docker-requirements.txt

jobs:
  containment-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIAGNOSTIC_SHA: ${{ inputs.diagnostic_sha }}
      DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact repair and unchanged regression source
        shell: bash
        run: |
          [[ "$DIAGNOSTIC_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIAGNOSTIC_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$DIAGNOSTIC_SHA" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          test "$(git show -s --format=%P HEAD)" = a53d471c334f4fdf32db45e5230dd980910d2c53
          git diff --exit-code a53d471c334f4fdf32db45e5230dd980910d2c53 -- . \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude)tests/test_guard_workspace_config_symlink_containment.py' \
            ':(exclude)src/codex_plugin_scanner/guard/workspace_config_io.py' \
            ':(exclude)src/codex_plugin_scanner/guard/config.py' \
            ':(exclude)tests/test_guard_workspace_config_read_races.py'
          test "$(git hash-object tests/test_guard_workspace_config_symlink_containment.py)" = 5fe9a37eda7a2370d427b6acd3622db3c94b752a
          test "$(git hash-object src/codex_plugin_scanner/guard/workspace_config_io.py)" = e7c2781016540ae1d071fc4769a788ad6175ada8
          test "$(git hash-object src/codex_plugin_scanner/guard/config.py)" = 7fb6c01691e7b83cace9d0e574133324756395a4
          test "$(git hash-object tests/test_guard_workspace_config_read_races.py)" = ba2d9101acf55ea4645bd03f08741017ecd664a3
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CONFIG_CONTAINMENT_SOURCE_VERIFIED"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: ${{ env.CI_UV_CACHE_DEPENDENCY_GLOB }}
          save-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Exercise the actual workspace configuration boundary
        shell: bash
        run: |
          set +e
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/workspace_config_io.py src/codex_plugin_scanner/guard/config.py tests/test_guard_workspace_config_symlink_containment.py tests/test_guard_workspace_config_read_races.py
          lint_status=$?
          uv run --no-sync ruff format --check src/codex_plugin_scanner/guard/workspace_config_io.py tests/test_guard_workspace_config_symlink_containment.py tests/test_guard_workspace_config_read_races.py
          format_status=$?
          uv run --no-sync pytest tests/test_guard_workspace_config_symlink_containment.py tests/test_guard_workspace_config_read_races.py tests/test_guard_config_paths.py tests/test_guard_windows_locked_file.py --tb=short
          test_status=$?
          printf 'CONTAINMENT_LINT_EXIT=%s\nCONTAINMENT_FORMAT_EXIT=%s\nCONTAINMENT_TEST_EXIT=%s\n' "$lint_status" "$format_status" "$test_status"
          if (( lint_status != 0 || format_status != 0 || test_status != 0 )); then
            exit 1
          fi
      - name: Verify source after the ordinary pytest result
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$DIAGNOSTIC_TREE"
          test "$(git show -s --format=%P HEAD)" = a53d471c334f4fdf32db45e5230dd980910d2c53
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CONFIG_CONTAINMENT_SOURCE_STILL_VERIFIED"
