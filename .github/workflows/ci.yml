      - name: Account for every control result and the existing platform skip
        if: ${{ always() && steps.post_ack_cases.outcome == 'success' && steps.post_ack_report.outcome == 'success' }}
        run: |
          python -I - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          
          specifications = [
              {"id":"guards","classname":"tests.test_native_policy_snapshot_post_ack_retry_guards","names":["test_original_first_client_deadline_survives_generation_recovery","test_fence_cleared_ack_does_not_turn_a_warm_attempt_into_cold_retry[acknowledged-refresh]","test_fence_cleared_ack_does_not_turn_a_warm_attempt_into_cold_retry[generation-renewal]","test_resident_error_cannot_impersonate_a_local_post_ack_refusal"]},
              {"id":"commit","classname":"tests.test_native_policy_snapshot_post_ack_retry_commit","names":["test_added_attempt_rechecks_earlier_authority_after_its_new_ack[credential-aba]","test_added_attempt_rechecks_earlier_authority_after_its_new_ack[config-aba]","test_added_attempt_cannot_commit_after_final_validation_uses_its_deadline[compile]","test_added_attempt_cannot_commit_after_final_validation_uses_its_deadline[resident-confirmation]"]},
