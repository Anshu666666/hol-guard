name: Native signed source activation baseline

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Reviewed criterion source commit
        required: true
        type: string
      workflow_blob:
        description: Reviewed workflow Git blob
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-activation-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activation-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-native-activation-bf259-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify exact source before proof
        shell: python
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_BLOB: ${{ inputs.workflow_blob }}
          GUARD_PHASE: before
        run: |
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          
          if not __debug__:
              raise RuntimeError("source guards require Python assertions")
          
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          
          def tree(ref):
              result = {}
              for entry in subprocess.check_output(["git", "ls-tree", "-rz", "--full-tree", ref]).split(b"\0"):
                  if entry:
                      metadata, path = entry.split(b"\t", 1)
                      result[path.decode("utf-8")] = tuple(metadata.decode("ascii").split())
              return result
          
          base = "bf259b90f343fe27b7dd4cf3d5c98653f4a3ee96"
          source = os.environ["SOURCE_COMMIT"]
          workflow = os.environ["WORKFLOW_BLOB"]
          assert re.fullmatch(r"[0-9a-f]{40}", source), "invalid source commit"
          assert re.fullmatch(r"[0-9a-f]{40}", workflow), "invalid workflow blob"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-native-activation-bf259-20260919"
          head = git("rev-parse", "HEAD")
          assert head == os.environ["GITHUB_SHA"]
          assert git("show", "-s", "--format=%P", head) == source
          assert git("show", "-s", "--format=%P", source) == base
          assert git("show", "-s", "--format=%P", base) == "e547e9bc601aadfe5ae71d0c53d988c14f81eb8d"
          assert git("show", "-s", "--format=%T", base) == "0da6f49e1ed9032baf5c1cd7135e6fd3587789ef"
          assert git("show", "-s", "--format=%T", source) == "8d0492afe00c903872f66aebff82241e524b40d0"
          identity = ["kantorcodes", "6068672+kantorcodes@users.noreply.github.com"] * 2
          for commit in (base, source, head):
              assert git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", commit).splitlines() == identity
          expected = tree(base)
          assert len(expected) == 4312
          criterion = "tests/test_native_generic_sync_unstaged.py"
          assert criterion not in expected
          expected[criterion] = ("100644", "blob", "bb7bc3ec887ec188f8eb7ab8797c72ab0d598446")
          assert len(expected) == 4313
          assert tree(source) == expected, "unreviewed source delta"
          expected[".github/workflows/ci.yml"] = ("100644", "blob", workflow)
          assert tree(head) == expected, "unreviewed diagnostic delta"
          content = Path(criterion).read_bytes()
          assert hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest() == expected[criterion][2]
          assert not git("status", "--porcelain", "--untracked-files=no"), "tracked source changed"
          proof = {
              "schema": "native-activation-source-proof.v1",
              "phase": os.environ["GUARD_PHASE"],
              "base": base,
              "source": source,
              "head": head,
              "source_tree": "8d0492afe00c903872f66aebff82241e524b40d0",
              "source_leaves": 4313,
              "criterion_blob": expected[criterion][2],
              "workflow_blob": workflow,
          }
          directory = Path("artifacts/native-activation")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / ("source-" + os.environ["GUARD_PHASE"] + ".json")).write_text(
              json.dumps(proof, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(proof, sort_keys=True))
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Validate unchanged activation criterion
        run: |
          uv run --no-sync ruff check tests/test_native_generic_sync_unstaged.py
          uv run --no-sync ruff format --check tests/test_native_generic_sync_unstaged.py
          uv run --no-sync basedpyright --pythonpath .venv/bin/python tests/test_native_generic_sync_unstaged.py
      - name: Build runtime from exact source
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          rustup toolchain install 1.88.0 --profile minimal
          export HOL_GUARD_PACKAGE_VERSION="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          cargo +1.88.0 build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
      - name: Stage the verified source build for native auto discovery
        run: |
          proof_pure_dir="$(mktemp -d "$RUNNER_TEMP/native-auto-pure.XXXXXX")"
          proof_native_dir="$(mktemp -d "$RUNNER_TEMP/native-auto-bundle.XXXXXX")"
          proof_runtime="$GITHUB_WORKSPACE/rust/target/release/hol-guard-runtime"
          proof_version="$(uv run --no-sync python scripts/sync_repo_version.py --check)"
          proof_rule_digest="$("$proof_runtime" capabilities --json | python -c 'import json,sys; print(json.load(sys.stdin)["rule_digest"])')"
          proof_target="$(rustc +1.88.0 -vV | sed -n 's/^host: //p')"
          test "$proof_target" = "x86_64-unknown-linux-gnu"
          uv build --wheel --out-dir "$proof_pure_dir"
          proof_wheels=("$proof_pure_dir"/*.whl)
          test "${#proof_wheels[@]}" -eq 1
          test -f "${proof_wheels[0]}"
          uv run --no-sync python -m tests.native_source_bundle \
            --wheel "${proof_wheels[0]}" \
            --runtime "$proof_runtime" \
            --output-dir "$proof_native_dir" \
            --version "$proof_version" \
            --source-sha "$GITHUB_SHA" \
            --rule-digest "$proof_rule_digest" \
            --platform-tag linux_x86_64 \
            --target "$proof_target"
      - name: Run exact ordinary native activation criterion
        env:
          HOL_GUARD_NATIVE: auto
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
          PYTHONPATH: src
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          import pytest
          
          if not __debug__:
              raise RuntimeError("activation proof requires Python assertions")
          criterion = Path("tests/test_native_generic_sync_unstaged.py").resolve()
          node = "tests/test_native_generic_sync_unstaged.py::test_ordinary_signed_sync_earns_unstaged_native_worker_acceptance"
          expected_name = "test_ordinary_signed_sync_earns_unstaged_native_worker_acceptance"
          content = criterion.read_bytes()
          criterion_blob = hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()
          assert criterion_blob == "bb7bc3ec887ec188f8eb7ab8797c72ab0d598446"
          assert content.decode("utf-8").splitlines()[145].strip() == 'assert first["policy_application_status"] == "applied", {'
          directory = Path("artifacts/native-activation")
          directory.mkdir(parents=True, exist_ok=True)
          
          class Observation:
              def __init__(self):
                  self.collected = []
                  self.phases = {}
                  self.duplicate = False
                  self.observation_error = False
                  self.applied_boundary = False
          
              def pytest_collection_finish(self, session):
                  self.collected = [item.nodeid for item in session.items]
          
              @pytest.hookimpl(hookwrapper=True)
              def pytest_runtest_makereport(self, item, call):
                  outcome = yield
                  report = outcome.get_result()
                  try:
                      if item.nodeid != node or report.when not in {"setup", "call", "teardown"}:
                          self.observation_error = True
                          return
                      if report.when in self.phases:
                          self.duplicate = True
                      self.phases[report.when] = report.outcome
                      if report.when == "call" and call.excinfo is not None:
                          error = call.excinfo.value
                          trace = error.__traceback__
                          leaf_matches = False
                          while trace is not None:
                              code = trace.tb_frame.f_code
                              leaf_matches = (
                                  code.co_name == expected_name
                                  and Path(code.co_filename).resolve() == criterion
                                  and trace.tb_lineno == 146
                              )
                              trace = trace.tb_next
                          self.applied_boundary = type(error) is AssertionError and leaf_matches
                  except Exception:
                      self.observation_error = True
          
          observer = Observation()
          exit_code = int(pytest.main([
              "-q", "--tb=short", "-m", "slow", node,
              "--junitxml=artifacts/native-activation/results.xml",
          ], plugins=[observer]))
          exact = observer.collected == [node] and not observer.duplicate and not observer.observation_error
          complete = set(observer.phases) == {"setup", "call", "teardown"}
          passed = exact and complete and exit_code == 0 and all(value == "passed" for value in observer.phases.values())
          applied_red = (
              exact and complete and exit_code == 1 and observer.applied_boundary
              and observer.phases == {"setup": "passed", "call": "failed", "teardown": "passed"}
          )
          status = "criterion_passed" if passed else (
              "blocked_at_native_applied_ack" if applied_red else "prerequisite_or_cleanup_failed"
          )
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          runtime = Path("rust/target/release/hol-guard-runtime")
          report = {
              "schema": "native-activation-baseline.v1",
              "sourceSha": head,
              "criterionBlob": criterion_blob,
              "runtimeBinarySha256": hashlib.sha256(runtime.read_bytes()).hexdigest() if runtime.is_file() else None,
              "collectedExactCriterion": observer.collected == [node],
              "collectedCount": len(observer.collected),
              "phases": {key: value for key, value in observer.phases.items() if value in {"passed", "failed", "skipped"}},
              "observationError": observer.observation_error or observer.duplicate,
              "originalPytestExitCode": exit_code,
              "status": status,
              "v3BaselineAndSignedSourceAccepted": passed or applied_red,
              "prerequisiteEvidence": "exact-criterion-prior-assertions-completed" if passed or applied_red else "not-established",
              "appliedAckAssertionLine": 146 if applied_red else None,
              "allCriterionAssertionsPassed": passed,
              "stagedFeatureNegotiation": False,
              "canonicalEnforcement": "explicit-test-only",
              "httpAndEnrollment": "synthetic",
              "workerPublisherIpcReceipt": "real",
              "installedImageAcceptance": False,
              "allV4RoutesAcceptance": False,
          }
          (directory / "proof.json").write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, sort_keys=True))
          raise SystemExit(exit_code if exit_code else (0 if passed else 1))
          PY
      - name: Verify exact source after proof
        if: always()
        shell: python
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_BLOB: ${{ inputs.workflow_blob }}
          GUARD_PHASE: after
        run: |
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          
          if not __debug__:
              raise RuntimeError("source guards require Python assertions")
          
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          
          def tree(ref):
              result = {}
              for entry in subprocess.check_output(["git", "ls-tree", "-rz", "--full-tree", ref]).split(b"\0"):
                  if entry:
                      metadata, path = entry.split(b"\t", 1)
                      result[path.decode("utf-8")] = tuple(metadata.decode("ascii").split())
              return result
          
          base = "bf259b90f343fe27b7dd4cf3d5c98653f4a3ee96"
          source = os.environ["SOURCE_COMMIT"]
          workflow = os.environ["WORKFLOW_BLOB"]
          assert re.fullmatch(r"[0-9a-f]{40}", source), "invalid source commit"
          assert re.fullmatch(r"[0-9a-f]{40}", workflow), "invalid workflow blob"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-native-activation-bf259-20260919"
          head = git("rev-parse", "HEAD")
          assert head == os.environ["GITHUB_SHA"]
          assert git("show", "-s", "--format=%P", head) == source
          assert git("show", "-s", "--format=%P", source) == base
          assert git("show", "-s", "--format=%P", base) == "e547e9bc601aadfe5ae71d0c53d988c14f81eb8d"
          assert git("show", "-s", "--format=%T", base) == "0da6f49e1ed9032baf5c1cd7135e6fd3587789ef"
          assert git("show", "-s", "--format=%T", source) == "8d0492afe00c903872f66aebff82241e524b40d0"
          identity = ["kantorcodes", "6068672+kantorcodes@users.noreply.github.com"] * 2
          for commit in (base, source, head):
              assert git("show", "-s", "--format=%an%n%ae%n%cn%n%ce", commit).splitlines() == identity
          expected = tree(base)
          assert len(expected) == 4312
          criterion = "tests/test_native_generic_sync_unstaged.py"
          assert criterion not in expected
          expected[criterion] = ("100644", "blob", "bb7bc3ec887ec188f8eb7ab8797c72ab0d598446")
          assert len(expected) == 4313
          assert tree(source) == expected, "unreviewed source delta"
          expected[".github/workflows/ci.yml"] = ("100644", "blob", workflow)
          assert tree(head) == expected, "unreviewed diagnostic delta"
          content = Path(criterion).read_bytes()
          assert hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest() == expected[criterion][2]
          assert not git("status", "--porcelain", "--untracked-files=no"), "tracked source changed"
          proof = {
              "schema": "native-activation-source-proof.v1",
              "phase": os.environ["GUARD_PHASE"],
              "base": base,
              "source": source,
              "head": head,
              "source_tree": "8d0492afe00c903872f66aebff82241e524b40d0",
              "source_leaves": 4313,
              "criterion_blob": expected[criterion][2],
              "workflow_blob": workflow,
          }
          directory = Path("artifacts/native-activation")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / ("source-" + os.environ["GUARD_PHASE"] + ".json")).write_text(
              json.dumps(proof, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(proof, sort_keys=True))
      - name: Retain exact activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native-activation/source-before.json
            artifacts/native-activation/source-after.json
            artifacts/native-activation/proof.json
            artifacts/native-activation/results.xml
          if-no-files-found: error
          retention-days: 30
