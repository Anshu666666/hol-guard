name: Corpus terminal diagnostic

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact reviewed diagnostic tree
        required: true
        type: string
      workflow_blob:
        description: Exact reviewed workflow blob
        required: true
        type: string

permissions:
  contents: read

jobs:
  corpus-terminal:
    if: github.ref == 'refs/heads/hgp/diagnostic-corpus-terminal-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
      EXPECTED_WORKFLOW: ${{ inputs.workflow_blob }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and diagnostic boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-corpus-terminal-source.py" <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          for key in ("EXPECTED_COMMIT", "EXPECTED_TREE", "EXPECTED_WORKFLOW"):
              assert re.fullmatch(r"[0-9a-f]{40}", os.environ[key]), key
          assert git("rev-parse", "HEAD") == os.environ["EXPECTED_COMMIT"]
          assert git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD^{tree}") == os.environ["EXPECTED_TREE"]
          assert git("show", "-s", "--format=%P", "HEAD") == "1ca2f9662da160623545e5a11501d9f3234a9170"
          expected = {
              ".github/workflows/ci.yml": os.environ["EXPECTED_WORKFLOW"],
              "tests/guard_command_corpus_runner.py": "bd0721c3bd3c63ad5b02f68c5000f4f49a23bf5b",
              "tests/guard_corpus_failure_diagnostic.py": "b702f88fad8add6b6169b12182d9bc96594cde3b",
              "tests/guard_corpus_diagnostic_plugin.py": "3059e73f584691dfce4c9511a641134cefb3ee0f",
              "tests/test_guard_corpus_failure_diagnostic.py": "71b680af1138c48ee0866291d6286d08ea54f0ba",
          }
          assert set(git("diff", "--name-only", "HEAD^", "HEAD").splitlines()) == set(expected)
          for path, sha in expected.items():
              entry = git("ls-tree", "HEAD", "--", path).split()
              assert entry[:3] == ["100644", "blob", sha], path
              assert git("hash-object", path) == sha, path
          assert git("hash-object", "tests/test_guard_command_corpus.py") == "4cb11d135a09527e3d477dd60118b57ee59ecf8b"
          assert git("hash-object", "pyproject.toml") == "dd7ea7046ebb399bde94d1532dce9149437cab43"
          assert git("hash-object", "uv.lock") == "87a7e665302f34c6ae1100387425572bab6e7c51"
          assert not git("status", "--porcelain", "--untracked-files=no")
          print("Exact source, modes and five-path boundary verified")
          PY
          python "$RUNNER_TEMP/verify-corpus-terminal-source.py"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install the unchanged locked toolchain
        run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Check diagnostic source quality
        run: |
          set -euo pipefail
          test "$(uv run --no-sync python -m ruff --version)" = "ruff 0.15.17"
          uv run --no-sync python -m ruff check \
            tests/guard_command_corpus_runner.py \
            tests/guard_corpus_failure_diagnostic.py \
            tests/guard_corpus_diagnostic_plugin.py \
            tests/test_guard_corpus_failure_diagnostic.py
          uv run --no-sync python -m ruff format --check \
            tests/guard_command_corpus_runner.py \
            tests/guard_corpus_failure_diagnostic.py \
            tests/guard_corpus_diagnostic_plugin.py \
            tests/test_guard_corpus_failure_diagnostic.py
      - name: Prove terminal containment and privacy controls
        run: uv run --no-sync pytest -q tests/test_guard_corpus_failure_diagnostic.py --tb=short
      - name: Run the unchanged original corpus node once
        env:
          HOL_GUARD_CORPUS_TERMINAL_PROOF: "1"
        run: |
          PYTHONPATH=scripts/ci GUARD_PYTEST_DURATION_OUTPUT=pytest-durations.json GUARD_PYTEST_UNDER_COVERAGE=1 \
            uv run --no-sync pytest -p pytest_duration_report -p tests.guard_corpus_diagnostic_plugin \
            tests/test_guard_command_corpus.py::test_full_guard_evaluation_matches_exact_non_widening_known_gap_baseline \
            --tb=short --cov --cov-branch --cov-report=
      - name: Retain finite terminal result
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: corpus-terminal-result
          path: .corpus-terminal-result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Verify source remained exact
        if: ${{ always() && !cancelled() }}
        run: python "$RUNNER_TEMP/verify-corpus-terminal-source.py"
