name: Test type baseline
on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compatibility:
    if: github.ref == 'refs/heads/hgp/diagnostic-test-type-baseline-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
      TYPECHECK_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable baseline source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = 9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12
          test "$(git rev-parse 'HEAD^1^{tree}')" = 8ca9c2df12566dc340a59f37f6e14ece267622fe
          test "$(git hash-object .github/workflows/native-managed-source-contract.yml)" = cf1d3abfbcdd9250f4c99b966310c10de3cdc319
          test "$(git hash-object basedpyright.native-managed-source.json)" = 4b56aeeb41fa2af0129511bcd3f7da2f37669d39
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object pyproject.toml)" = 64a0281ee6b4f57a74cab68ac992fec3d782a6bb
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object tests/test_guard_command_queue.py)" = eeb4b0308d46a59ed3183a699f87e43440e8190a
          test "$(git hash-object tests/test_guard_runtime.py)" = d3d1259bb7017b3dc04afd85ae2ce79f1b072077
          test "$(git hash-object tests/test_paseo_adapter.py)" = 2b29b571c147fbd46b0720a1107545c275f8c6c1
          test "$(git hash-object uv.lock)" = 10e18a310e63ba3c5940e25b44269d48dfc7f2da
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/type-baseline-changed.txt"
          printf '%s\n' .github/workflows/ci.yml > "$RUNNER_TEMP/type-baseline-expected.txt"
          cmp "$RUNNER_TEMP/type-baseline-changed.txt" "$RUNNER_TEMP/type-baseline-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install frozen test dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Secure the CI virtualenv interpreter
        id: interpreter
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Record unchanged test type diagnostics
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.interpreter.outcome == 'success' }}
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path
          
          root = Path.cwd().resolve()
          expected_python = os.environ["TYPECHECK_PYTHON"]
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == expected_python
          assert importlib.metadata.version("basedpyright") == "1.39.8"
          command = [
              "uv", "run", "--no-sync", "basedpyright",
              "--pythonpath", ".venv/bin/python",
              "--pythonversion", expected_python,
              "--project", "basedpyright.native-managed-source.json",
              "tests/test_guard_command_queue.py",
              "tests/test_guard_runtime.py",
              "tests/test_paseo_adapter.py",
              "--outputjson",
          ]
          result = subprocess.run(command, capture_output=True, text=True, check=False)
          if result.stderr:
              print(result.stderr, file=sys.stderr, end="", flush=True)
          if result.returncode not in (0, 1):
              print(result.stdout, end="", flush=True)
              raise SystemExit(result.returncode)
          report = json.loads(result.stdout)
          diagnostics = report["generalDiagnostics"]
          errors = [item for item in diagnostics if item["severity"] == "error"]
          warnings = [item for item in diagnostics if item["severity"] == "warning"]
          assert len(errors) == report["summary"]["errorCount"]
          assert len(warnings) == report["summary"]["warningCount"]
          assert (result.returncode == 1) == bool(errors)
          for item in errors:
              item["file"] = Path(item["file"]).resolve().relative_to(root).as_posix()
          warning_files = Counter(
              Path(item["file"]).resolve().relative_to(root).as_posix()
              for item in warnings
          )
          evidence = {
              "schema": 1,
              "source_commit": "9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12",
              "source_tree": "8ca9c2df12566dc340a59f37f6e14ece267622fe",
              "python": expected_python,
              "basedpyright": importlib.metadata.version("basedpyright"),
              "command": command,
              "returncode": result.returncode,
              "summary": report["summary"],
              "error_diagnostics": errors,
              "warning_counts_by_file": dict(sorted(warning_files.items())),
              "complete_stdout_sha256": hashlib.sha256(result.stdout.encode()).hexdigest(),
          }
          print("BASELINE_TYPE_DIAGNOSTICS_BEGIN", flush=True)
          print(json.dumps(evidence, sort_keys=True, separators=(",", ":")), flush=True)
          print("BASELINE_TYPE_DIAGNOSTICS_END", flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = 9c2c7cf99ae9d9a40c29ec90367bccecf9efbd12
          test "$(git rev-parse 'HEAD^1^{tree}')" = 8ca9c2df12566dc340a59f37f6e14ece267622fe
          test "$(git hash-object .github/workflows/native-managed-source-contract.yml)" = cf1d3abfbcdd9250f4c99b966310c10de3cdc319
          test "$(git hash-object basedpyright.native-managed-source.json)" = 4b56aeeb41fa2af0129511bcd3f7da2f37669d39
          test "$(git hash-object conftest.py)" = 9e1408c12fe951ad2f1541b1c2c0508f3c35b41a
          test "$(git hash-object pyproject.toml)" = 64a0281ee6b4f57a74cab68ac992fec3d782a6bb
          test "$(git hash-object tests/conftest.py)" = 61e6d98609309fac99c9baae50fab5f47229fcde
          test "$(git hash-object tests/test_guard_command_queue.py)" = eeb4b0308d46a59ed3183a699f87e43440e8190a
          test "$(git hash-object tests/test_guard_runtime.py)" = d3d1259bb7017b3dc04afd85ae2ce79f1b072077
          test "$(git hash-object tests/test_paseo_adapter.py)" = 2b29b571c147fbd46b0720a1107545c275f8c6c1
          test "$(git hash-object uv.lock)" = 10e18a310e63ba3c5940e25b44269d48dfc7f2da
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/type-baseline-changed.txt"
          printf '%s\n' .github/workflows/ci.yml > "$RUNNER_TEMP/type-baseline-expected.txt"
          cmp "$RUNNER_TEMP/type-baseline-changed.txt" "$RUNNER_TEMP/type-baseline-expected.txt"
          echo 'TEST_TYPE_BASELINE_TRACKED_SOURCE_UNCHANGED=true'
