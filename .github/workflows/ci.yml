name: Native Python 3.10 compatibility baseline

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact reviewed diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact reviewed diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: python310-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-py310-compat'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_DIAGNOSTIC_SHA: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      PYTHONDONTWRITEBYTECODE: "1"
      GUARD_PY310_RECEIPT_DIR: ${{ runner.temp }}/guard-py310-compat
    steps:
      - name: Check out the exact test-only diagnostic
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reviewed driver and unchanged product before setup
        run: |
          python3 <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()
          commit, tree = os.environ["EXPECTED_DIAGNOSTIC_SHA"], os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          if not re.fullmatch("[0-9a-f]{40}", commit) or not re.fullmatch("[0-9a-f]{40}", tree):
              raise SystemExit("Exact diagnostic identities are required.")
          if commit != os.environ["GITHUB_SHA"] or git("rev-parse", "HEAD") != commit:
              raise SystemExit("Diagnostic commit mismatch.")
          if git("rev-parse", "HEAD^{tree}") != tree:
              raise SystemExit("Diagnostic tree mismatch.")
          if git("show", "-s", "--format=%P", "HEAD") != "bc0479bcab1cbc925421c9ebc7a7b926bccd131d":
              raise SystemExit("Unexpected diagnostic parent.")
          expected = {
              "scripts/ci/prove_python310_compatibility.py": "89e389ea9be5a7657b5aed3a9dd759731d9074ad",
              "tests/test_guard_bounded_http_exception_compatibility.py": "a0d8a20f4e17694feccacaa8a2cec3af0c8901ac",
              "tests/test_guard_daemon_lifecycle_transition.py": "05db6d62a4cf734c77370daa148cb90fc26149d7",
              "src/codex_plugin_scanner/guard/daemon/bounded_http.py": "96561ddfaa5b0edb50b3a21ecf3ee1a9eeca68b8",
              "pyproject.toml": "44250c39b253343dd95a24441850940d48581f8b",
              "uv.lock": "87a7e665302f34c6ae1100387425572bab6e7c51",
              "conftest.py": "9e1408c12fe951ad2f1541b1c2c0508f3c35b41a",
              "tests/conftest.py": "61e6d98609309fac99c9baae50fab5f47229fcde",
          }
          for path, sha in expected.items():
              data = Path(path).read_bytes()
              if hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() != sha:
                  raise SystemExit("Diagnostic source pin mismatch.")
          print("PYTHON310_DIAGNOSTIC_SOURCE_PINS_VERIFIED")
          PY
      - name: Set up native supported Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Install unchanged locked development dependencies
        run: uv sync --frozen --extra dev --python 3.10
      - name: Confirm native interpreter and secure only its executable
        run: |
          set -euo pipefail
          uv run --no-sync python -c 'import sys; assert sys.version_info[:2] == (3, 10); print(sys.version)'
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Observe exact collection and native Python 3.10 baseline
        run: uv run --no-sync python scripts/ci/prove_python310_compatibility.py
      - name: Retain only closed compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-python310-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guard-py310-compat/summary.json
          if-no-files-found: error
          retention-days: 7
