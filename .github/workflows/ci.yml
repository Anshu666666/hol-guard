name: Native capture baseline

on:
  workflow_dispatch:
    inputs:
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-capture-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-capture-baseline-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the unchanged product and the five-case overlay
        id: source_before
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          diagnostic_commit = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          diagnostic_tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (diagnostic_commit, diagnostic_tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-capture-baseline-20260919"
          assert os.environ["GITHUB_SHA"] == diagnostic_commit
          assert git("rev-parse", "HEAD") == diagnostic_commit
          assert git("rev-parse", "HEAD^{tree}") == diagnostic_tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [
              diagnostic_commit,
              "bf259b90f343fe27b7dd4cf3d5c98653f4a3ee96",
          ]
          assert git("rev-parse", "bf259b90f343fe27b7dd4cf3d5c98653f4a3ee96^{tree}") == "0da6f49e1ed9032baf5c1cd7135e6fd3587789ef"
          assert git("diff", "--name-status", "bf259b90f343fe27b7dd4cf3d5c98653f4a3ee96", "HEAD").splitlines() == [
              "M\t.github/workflows/ci.yml",
              "A\ttests/test_native_policy_snapshot_capture_retry.py",
          ]
          pins = [
              [
                  "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py",
                  "100644",
                  "a331ffb3e6275864618452e1adc57c01aaab5fa6"
              ],
              [
                  "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py",
                  "100644",
                  "0c741eff8d1dda464cf808e75e3efc36dc913a41"
              ],
              [
                  "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scheduling.py",
                  "100644",
                  "0a500224add718d93aa989258125a35790746400"
              ],
              [
                  "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_transport.py",
                  "100644",
                  "ab1c0572c0a6b8cbd3e22822388dce6df2fdb196"
              ],
              [
                  "src/codex_plugin_scanner/guard/native_policy_authority_read.py",
                  "100644",
                  "9dac9c06033f2c354a3fd0c174760006fa926a73"
              ],
              [
                  "src/codex_plugin_scanner/guard/store_sync_payload_mutations.py",
                  "100644",
                  "44319c8d3e2848456841d60933a5db64f4b9c8b3"
              ],
              [
                  "src/codex_plugin_scanner/guard/daemon/server.py",
                  "100644",
                  "2792f7cf919da55d02435b8fb3295ae2d514a6f5"
              ],
              [
                  "tests/test_native_policy_snapshot_reservation_capture.py",
                  "100644",
                  "a663d5014bc62822c0c86d970b0ce056f4e97cd3"
              ],
              [
                  "tests/native_policy_snapshot_test_fixtures.py",
                  "100644",
                  "e6809fc5e6b09590a63698e8d8bfef597252b9f4"
              ],
              [
                  ".github/workflows/native-managed-source-contract.yml",
                  "100644",
                  "ae8180cb4e6710902c6a5d699cd636c3988fcee2"
              ],
              [
                  "pyproject.toml",
                  "100644",
                  "64a0281ee6b4f57a74cab68ac992fec3d782a6bb"
              ],
              [
                  "uv.lock",
                  "100644",
                  "10e18a310e63ba3c5940e25b44269d48dfc7f2da"
              ],
              [
                  "conftest.py",
                  "100644",
                  "9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"
              ],
              [
                  "tests/conftest.py",
                  "100644",
                  "61e6d98609309fac99c9baae50fab5f47229fcde"
              ],
              [
                  "src/codex_plugin_scanner/guard/store_extension_control_authority.py",
                  "100644",
                  "39c5ff235685f3f2869155d1cf2d4d9097370967"
              ],
              [
                  "src/codex_plugin_scanner/guard/store_extension_control_authority_support.py",
                  "100644",
                  "c6177516cbb6150bff636ee7e2f3685e9b95f8b9"
              ],
              [
                  "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scoped.py",
                  "100644",
                  "9b59002f683443f190e6535bbdd66cddf525a1d0"
              ],
              [
                  "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_inputs.py",
                  "100644",
                  "5f88a6ecdacc7fb426d5d6306a8faa44602de3a4"
              ],
              [
                  "tests/test_native_policy_snapshot_capture_retry.py",
                  "100644",
                  "915b648d205aa205b7e6b303f37e504bd6b6f193"
              ]
          ]
          for path, mode, sha in pins:
              assert git("ls-tree", "HEAD", "--", path) == f"{mode} blob {sha}\t{path}"
              assert git("hash-object", "--", path) == sha
          assert not git("status", "--porcelain", "--untracked-files=no")
          print(json.dumps({"sourceGuard": "passed", "pins": len(pins), "testOnly": True}, sort_keys=True))
          PY

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Exercise all five capture cases
        id: capture_cases
        run: |
          uv run --no-sync pytest -q --tb=short --junitxml="$RUNNER_TEMP/native-capture-baseline-${{ matrix.python }}.xml" tests/test_native_policy_snapshot_capture_retry.py
      - name: Report the actual five-case outcomes
        if: ${{ always() && (steps.capture_cases.outcome == 'success' || steps.capture_cases.outcome == 'failure') }}
        run: |
          python -I - <<'PY'
          import collections
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          
          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("native-capture-baseline-" + os.environ["MATRIX_PYTHON"] + ".xml")
          cases = ET.parse(report).getroot().findall(".//testcase")
          expected = [
              "test_startup_status_commit_requires_a_fresh_stable_capture[one-startup-write]",
              "test_startup_status_commit_requires_a_fresh_stable_capture[repeated-startup-writes]",
              "test_startup_capture_retry_cannot_outlive_its_epoch[request]",
              "test_startup_capture_retry_cannot_outlive_its_epoch[close]",
              "test_capture_retry_never_replays_an_exception_after_yield"
          ]
          names = [case.attrib["name"] for case in cases]
          assert collections.Counter(names) == collections.Counter(expected), names
          results = []
          for case in cases:
              status = "passed"
              for tag in ("failure", "error", "skipped"):
                  if case.find(tag) is not None:
                      status = tag
                      break
              results.append({"case": case.attrib["name"], "status": status})
          print(json.dumps({"python": os.environ["MATRIX_PYTHON"], "collected": len(cases), "results": results}, sort_keys=True))
          assert not any(result["status"] == "skipped" for result in results)
          PY
      - name: Check focused test lint
        if: ${{ always() && (steps.capture_cases.outcome == 'success' || steps.capture_cases.outcome == 'failure') }}
        run: uv run --no-sync ruff check tests/test_native_policy_snapshot_capture_retry.py
      - name: Check focused test formatting
        if: ${{ always() && (steps.capture_cases.outcome == 'success' || steps.capture_cases.outcome == 'failure') }}
        run: uv run --no-sync ruff format --check tests/test_native_policy_snapshot_capture_retry.py
      - name: Verify the exact source after all checks
