name: Guard heredoc scan proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-heredoc-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    if: github.ref == 'refs/heads/hgp/diagnostic-heredoc-guard-75413'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout proof tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false

      - name: Checkout frozen corpus source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 75413dfc16cc63f4d9e298ae4ecf099b9419572c
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install frozen dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Secure managed interpreter permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Check proof output and observer controls
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: uv run --no-sync python ../diagnostic/scripts/ci/prove_heredoc_scan.py --self-test

      - name: Run original semantics and strict corpus acceptance
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HGP_HEREDOC_PYTHON: ${{ matrix.python-version }}
          HGP_HEREDOC_OUTPUT: ${{ runner.temp }}/guard-heredoc-${{ matrix.python-version }}
        run: uv run --no-sync python ../diagnostic/scripts/ci/prove_heredoc_scan.py

      - name: Retain closed proof and generated report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-heredoc-proof-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/guard-heredoc-${{ matrix.python-version }}/summary.json
            ${{ runner.temp }}/guard-heredoc-${{ matrix.python-version }}/generated-report.json
          if-no-files-found: error
          retention-days: 1
