name: Policy regression verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify isolated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 04bed715f38b04cb75651fafdf566e86e1112da1
          test "$(git rev-parse 04bed715f38b04cb75651fafdf566e86e1112da1^{tree})" = ba3b461422e79e18c8b051a4beaf5d02ef690f31
          python - <<'PY'
          import subprocess
          expected = {".github/workflows/ci.yml"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True).splitlines())
          assert actual == expected, "unexpected diagnostic source delta"
          parents = subprocess.check_output(["git", "show", "-s", "--format=%P", "HEAD"], text=True).split()
          assert parents == ["04bed715f38b04cb75651fafdf566e86e1112da1"], "unexpected diagnostic parent"
          PY
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            requirements.txt
          save-cache: false
      - name: Install locked test dependencies
        id: dependencies
        run: uv sync --frozen --extra dev --python 3.12
      - name: Secure the CI virtualenv interpreter
        id: secure
        shell: bash
        run: |
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))
      - name: Sensitive Read and original review regressions
        if: always() && steps.secure.outcome == 'success'
        run: |
          uv run --no-sync 'python' \
            '-m' \
            'pytest' \
            '-q' \
            'tests/test_sensitive_read_unenrolled_controls.py' \
            'tests/test_native_sensitive_read_managed_floors.py' \
            'tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_claude_hook_endpoint_returns_native_pretooluse_response' \
            'tests/test_guard_surface_server.py::TestGuardSurfaceServer::test_guard_daemon_claude_hook_endpoint_returns_notification_context_with_auth' \
            'tests/test_cline_completion_gates.py::test_real_guard_policy_requires_review_for_cline_env_read' \
            'tests/test_guard_phase04_harness_ux.py::test_gr082_claude_pretooluse_brands_native_prompt' \
            'tests/test_guard_phase04_harness_ux.py::test_gr083_claude_permission_request_routes_to_ask_user_question' \
            'tests/test_guard_phase04_harness_ux.py::test_gr084_claude_keep_blocked_persists_for_repeated_sensitive_read' \
            'tests/test_guard_phase04_harness_ux.py::test_gr085_claude_allow_once_cannot_lower_current_reapproval' \
            'tests/test_guard_phase04_harness_ux.py::test_gr086_claude_session_allow_cannot_lower_current_reapproval' \
            'tests/test_codex_live_decision_revalidation.py::test_first_exact_live_allow_revalidates_through_resident_worker' \
            'tests/test_guard_claude_adapter.py::test_claude_daemon_hook_command_falls_back_to_native_ask_on_daemon_miss' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[.terraform.tfvars]' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_uses_copilot_repo_hook_runtime_path' \
            'tests/test_guard_runtime.py::test_guard_hook_emits_claude_native_ask_for_sensitive_file_reads' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_normalizes_copilot_camel_case_payload' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_ask_user_question_spoofed_prompt_does_not_persist_approval' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_notification_notice_is_tool_scoped_and_retained_while_pending' \
            'tests/test_guard_runtime.py::test_guard_hook_emits_claude_native_pretooluse_notice_on_stderr' \
            'tests/test_guard_runtime.py::test_guard_hook_codex_falls_back_to_native_deny_after_daemon_request_failure[start_session]' \
            'tests/test_guard_runtime.py::test_guard_hook_emits_claude_native_ask_response' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[~/.kube/config]' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_stop_does_not_persist_denial_without_visible_prompt' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_notification_saved_allow_does_not_lower_current_reapproval' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[.pypirc]' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[~/.docker/config.json]' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[~/.gnupg/private-keys-v1.d/example.key]' \
            'tests/test_guard_runtime.py::test_guard_hook_emits_claude_native_ask_response_for_claude_alias' \
            'tests/test_guard_runtime.py::test_guard_hook_emits_claude_notification_notice_for_permission_prompt' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[~/.aws/credentials]' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_ask_user_question_allow_does_not_lower_current_reapproval' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[.npmrc]' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[~/.ssh/id_ed25519]' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_ask_user_question_without_answer_does_not_persist_block' \
            'tests/test_guard_runtime.py::test_guard_hook_emits_claude_permission_request_attribution_without_decision' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[.env]' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_ask_user_question_keep_blocked_persists_block' \
            'tests/test_guard_runtime.py::test_guard_hook_codex_falls_back_to_native_deny_after_daemon_request_failure[queue_blocked_operation]' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_alias_saved_allow_does_not_lower_canonical_reapproval' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_ask_user_question_multiple_questions_does_not_persist_approval' \
            'tests/test_guard_runtime.py::test_guard_hook_saved_file_read_allow_does_not_lower_current_reapproval' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_native_cancel_does_not_persist_flat_block' \
            'tests/test_guard_runtime.py::test_runtime_hook_saved_v1_allow_satisfies_exact_unchanged_current_review' \
            'tests/test_guard_runtime.py::TestGuardRuntime::test_guard_hook_asks_for_planned_secret_file_reads[~/.ssh/id_rsa]' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_notice_storage_failures_fall_back_to_generic_prompt' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_notification_stale_notice_falls_back_to_generic_context' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_stop_keeps_native_cancel_transient' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_native_approval_does_not_lower_current_reapproval' \
            'tests/test_guard_runtime.py::test_guard_hook_claude_repeated_notifications_keep_bound_question_without_lowering_reapproval' \
            'tests/test_guard_runtime.py::test_guard_hook_emits_codex_runtime_denial_with_guard_remediation' \
            'tests/test_pi_hook_latency.py::test_review_required_pi_hook_returns_before_worker_deadline' \
            '--tb=short'
      - name: Original failure privacy controls
        if: always() && steps.secure.outcome == 'success'
        run: |
          uv run --no-sync 'python' \
            '-m' \
            'pytest' \
            '-q' \
            'tests/test_claude_hook_failure_privacy.py' \
            '--tb=short'
      - name: Native application fixture regressions
        if: always() && steps.secure.outcome == 'success'
        run: |
          uv run --no-sync 'python' \
            '-m' \
            'pytest' \
            '-q' \
            'tests/test_generic_policy_native_application.py' \
            'tests/test_policy_telemetry_isolation.py' \
            'tests/test_policy_telemetry_transport.py' \
            'tests/test_policy_telemetry_review_failures.py' \
            'tests/test_policy_signer_rotation_runtime.py' \
            '--tb=short'
      - name: Continuity and acknowledgement regressions
        if: always() && steps.secure.outcome == 'success'
        run: |
          uv run --no-sync 'python' \
            '-m' \
            'pytest' \
            '-q' \
            'tests/test_policy_bundle_custom_extension_continuity.py' \
            'tests/test_policy_bundle_generic_acknowledgement.py' \
            'tests/test_policy_bundle_generic_ack_contract.py' \
            'tests/test_native_policy_bundle_ack.py' \
            'tests/test_guard_runtime.py::test_sync_receipts_rolls_back_to_last_good_bundle_on_canonical_compile_failure' \
            '--tb=short'
      - name: Check changed Python lint
        if: always() && steps.secure.outcome == 'success'
        run: uv run --no-sync ruff check 'src/codex_plugin_scanner/guard/config.py' 'src/codex_plugin_scanner/guard/policy_bundle_generic_ack.py' 'src/codex_plugin_scanner/guard/runtime/sensitive_read_controls.py' 'tests/claude_hook_diagnostics.py' 'tests/support/native_policy_application.py' 'tests/test_generic_policy_native_application.py' 'tests/test_guard_runtime.py' 'tests/test_native_managed_policy_resident.py' 'tests/test_policy_bundle_generic_ack_contract.py' 'tests/test_policy_signer_rotation_runtime.py' 'tests/test_policy_telemetry_isolation.py' 'tests/test_policy_telemetry_review_failures.py' 'tests/test_policy_telemetry_transport.py' 'tests/test_sensitive_read_unenrolled_controls.py'
      - name: Check changed Python formatting
        if: always() && steps.secure.outcome == 'success'
        run: uv run --no-sync ruff format --check 'src/codex_plugin_scanner/guard/config.py' 'src/codex_plugin_scanner/guard/policy_bundle_generic_ack.py' 'src/codex_plugin_scanner/guard/runtime/sensitive_read_controls.py' 'tests/claude_hook_diagnostics.py' 'tests/support/native_policy_application.py' 'tests/test_generic_policy_native_application.py' 'tests/test_guard_runtime.py' 'tests/test_native_managed_policy_resident.py' 'tests/test_policy_bundle_generic_ack_contract.py' 'tests/test_policy_signer_rotation_runtime.py' 'tests/test_policy_telemetry_isolation.py' 'tests/test_policy_telemetry_review_failures.py' 'tests/test_policy_telemetry_transport.py' 'tests/test_sensitive_read_unenrolled_controls.py'
      - name: Verify source remained unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
