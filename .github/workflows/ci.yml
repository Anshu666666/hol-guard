              "test_one_startup_commit_recovers_within_the_original_caller_deadline[after-confirmation]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[repeated-during-compile]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[repeated-after-confirmation]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[credential-change]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[credential-aba]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[config-change]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[config-aba]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[required-source]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[request]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[close]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[ack-mismatch]",
              "test_post_ack_recovery_retains_authority_and_budget_refusals[transport-deadline]"
          ]
          expected = [("tests.test_native_policy_snapshot_post_ack_retry", name) for name in expected]
          names = [(case.attrib.get("classname"), case.attrib["name"]) for case in cases]
          assert collections.Counter(names) == collections.Counter(expected), names
          results = []
          for case in cases:
              tags = [tag for tag in ("failure", "error", "skipped") if case.find(tag) is not None]
              results.append({"class": case.attrib.get("classname"), "case": case.attrib["name"], "statuses": tags or ["passed"]})
          print(json.dumps({"python": os.environ["MATRIX_PYTHON"], "collected": len(cases), "results": results}, sort_keys=True))
          assert all(case.find("skipped") is None for case in cases)
          PY
