name: CodeQL immutable snapshot SARIF diagnostic

on:
  pull_request:
    branches: [release/3.2]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-foundation-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: ${{ matrix.profile.label }} SARIF (${{ matrix.language }})
    if: >-
      github.repository == 'hashgraph-online/hol-guard' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.number == 2954 &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The pinned CodeQL action reads its workflow identity through the Actions API.
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile:
          - name: foundation-cdd
            label: Foundation cdd
            commit: cdd14176ef0e0a258d4655c64210524d7047a257
            artifact: codeql-foundation-cdd
          - name: implementation-d8
            label: Prepared implementation d8
            commit: d8bde000de992009be3b2ed009347d2b3707ef0d
            artifact: codeql-implementation-d8
        language: [actions, javascript-typescript, python]
    env:
      # Both fixed snapshots are independent of the executing PR2954 head.
      # Its diff must never filter either snapshot's findings. The observed cdd
      # run exceeded the diff cap; d8 has no original security-analysis run.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - name: Check out the diagnostic definition
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/hol-guard
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/codeql-foundation-diagnostic.yml
            /scripts/ci/codeql_foundation_diagnostic.py
      - name: Preserve the exact collector and workflow definition outside the source
        run: |
          python3 -I scripts/ci/codeql_foundation_diagnostic.py stage \
            --source-root . \
            --staging-root "$RUNNER_TEMP/codeql-diagnostic-definition" \
            --environment-file "$GITHUB_ENV"
      - name: Check out the immutable analyzed snapshot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/hol-guard
          ref: ${{ matrix.profile.commit }}
          # Python extraction uses GITHUB_WORKSPACE as its working directory.
          # This checkout replaces the sparse definition with the exact old tree.
          clean: true
          persist-credentials: false
      - name: Verify source identity and preserve the observed workspace alias
        env:
          DIAGNOSTIC_PROFILE: ${{ matrix.profile.name }}
        run: |
          printf '%s  %s\n' "$DIAGNOSTIC_COLLECTOR_SHA256" \
            "$RUNNER_TEMP/codeql-diagnostic-definition/codeql_foundation_diagnostic.py" | sha256sum --check --status
          python3 -I "$RUNNER_TEMP/codeql-diagnostic-definition/codeql_foundation_diagnostic.py" verify \
            --profile "$DIAGNOSTIC_PROFILE" --source-root . --enforce-layout
          LEGACY_ROOT="/home/runner/work/codex-plugin-scanner"
          mkdir -p "$LEGACY_ROOT"
          ln -sfn "$GITHUB_WORKSPACE" "$LEGACY_ROOT/codex-plugin-scanner"
      - name: Initialize the observed CodeQL bundle and query configuration
        id: init
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.0/codeql-bundle-linux64.tar.zst
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: .
          trap-caching: false
          dependency-caching: false
          config: |
            paths-ignore:
              - src/codex_plugin_scanner/guard/stable_digest.py
      - name: Generate SARIF without uploading security results or databases
        id: analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          category: /language:${{ matrix.language }}
          checkout_path: ${{ github.workspace }}
          output: ${{ runner.temp }}/codeql-foundation-results
          # In this pinned action, deprecated false means failure-only, not never.
          upload: never
          upload-database: false
          wait-for-processing: false
      - name: Retain completion state and exact SARIF hashes
        if: ${{ always() }}
        env:
          DIAGNOSTIC_PROFILE: ${{ matrix.profile.name }}
          DIAGNOSTIC_LANGUAGE: ${{ matrix.language }}
          OBSERVED_CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          printf '%s  %s\n' "$DIAGNOSTIC_COLLECTOR_SHA256" \
            "$RUNNER_TEMP/codeql-diagnostic-definition/codeql_foundation_diagnostic.py" | sha256sum --check --status
          python3 -I "$RUNNER_TEMP/codeql-diagnostic-definition/codeql_foundation_diagnostic.py" collect \
            --profile "$DIAGNOSTIC_PROFILE" \
            --source-root . --enforce-layout \
            --results-root "$RUNNER_TEMP/codeql-foundation-results" \
            --language "$DIAGNOSTIC_LANGUAGE" \
            --observed-version "$OBSERVED_CODEQL_VERSION" \
            --init-outcome "$INIT_OUTCOME" \
            --analyze-outcome "$ANALYZE_OUTCOME"
      - name: Retain the unmodified SARIF and diagnostic manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.profile.artifact }}-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-foundation-results/*.sarif
            ${{ runner.temp }}/codeql-foundation-results/diagnostic.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
