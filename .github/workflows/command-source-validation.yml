                  case_counts[name] = len(matches)
                  assert len(matches) == required_modules[name] and all(not any(child.tag in {"failure", "error", "skipped"} for child in case) for case in matches)
              nonce_cases = [
                  case for case in ET.parse(output / "source-08.xml").getroot().iter("testcase")
                  if case.attrib.get("classname", "").split(".")[-1] == "test_native_policy_snapshot_control"
                  and (case.attrib.get("name") == "test_external_challenge_nonce_is_authenticated_without_changing_deadline"
                       or case.attrib.get("name", "").startswith("test_external_invalid_challenge_nonce_refuses_before_transport["))
              ]
              nonce_count = len(nonce_cases)
              assert nonce_count == 7 and all(not any(child.tag in {"failure", "error", "skipped"} for child in case) for case in nonce_cases)
              required_code = 0
          except (OSError, ET.ParseError, AssertionError):
              required_code = 1
          results.append({"name": "required-new-source-cases", "exit": required_code})
          print(json.dumps({"publicValidation": "required-new-source-cases", "exit": required_code, "caseCounts": case_counts, "nonceControls": nonce_count}), flush=True)
          (output / "results.json").write_text(json.dumps(results, sort_keys=True) + "\n", encoding="utf-8")
          run("readiness-profile-source", ["uv", "run", "--no-sync", "pytest", "-q",
              "ci/native_runtime/test_installed_readiness_profile.py", "--tb=short",
              "--junitxml=" + str(output / "readiness-profile.xml")], timeout=180)
          profile_count = 0
          try:
              profile_cases = list(ET.parse(output / "readiness-profile.xml").getroot().iter("testcase"))
              profile_count = len(profile_cases)
              assert profile_count == 39
              assert all(case.attrib.get("classname", "").split(".")[-1] == "test_installed_readiness_profile"
                         and not any(child.tag in {"failure", "error", "skipped"} for child in case)
                         for case in profile_cases)
              profile_code = 0
          except (OSError, ET.ParseError, AssertionError):
              profile_code = 1
          results.append({"name": "required-profile-source-cases", "exit": profile_code})
          print(json.dumps({"publicValidation": "required-profile-source-cases", "exit": profile_code,
                            "caseCount": profile_count}), flush=True)
          (output / "results.json").write_text(json.dumps(results, sort_keys=True) + "\n", encoding="utf-8")
          gates = [
              ("authority-ownership", ["scripts/ci/rust_authority_ownership_gate.py", "--root", ".", "--base-ref", os.environ["PUBLIC_BASE_SHA"], "--json", str(output / "authority-ownership.json")]),
              ("io-ownership", ["scripts/ci/rust_io_ownership_gate.py", "--root", ".", "--json", str(output / "io-ownership.json")]),
              ("io-privacy", ["scripts/ci/rust_io_privacy_gate.py", "--root", ".", "--json", str(output / "io-privacy.json")]),
              ("native-approval", ["scripts/ci/native_approval_contract_gate.py", "--root", "."]),
              ("semantic-callgraph", ["scripts/ci/python_hook_semantic_callgraph_gate.py", "--root", "."]),
              ("native-receipt", ["scripts/ci/native_receipt_persistence_gate.py", "--root", ".", "--json", str(output / "native-receipt.json")]),
              ("capability-cleanup", ["scripts/ci/python_capability_cleanup_gate.py", "--root", ".", "--json", str(output / "capability-cleanup.json")]),
          ]
          for name, arguments in gates:
              run(name, [sys.executable, *arguments], timeout=180)
          run("decision-report-write", [sys.executable, "tests/guard_command_decision_diff.py", "--write"], timeout=300)
          run("decision-report-check", [sys.executable, "tests/guard_command_decision_diff.py", "--check"], timeout=300)
          try:
              regenerated_report = json.loads(report_path.read_text(encoding="utf-8"))
              original_report["bindings"].pop("sources_sha256")
              regenerated_report["bindings"].pop("sources_sha256")
              semantic_code = 0 if regenerated_report == original_report else 1
          except (KeyError, TypeError, ValueError):
              semantic_code = 1
          results.append({"name": "decision-report-semantic-preservation", "exit": semantic_code})
          print(json.dumps({"publicValidation": "decision-report-semantic-preservation", "exit": semantic_code, "sourceHead": source}), flush=True)
          (output / "results.json").write_text(json.dumps(results, sort_keys=True) + "\n", encoding="utf-8")
          main_tests = ["tests/test_cursor_frozen_hook_command.py","tests/test_cursor_hook_rebind.py","tests/test_cursor_hooks.py","tests/test_cursor_watch_hook_script.py","tests/test_guard_command_decision_diff.py","tests/test_guard_daemon_storage_liveness.py"]
          main_modules = {Path(path).stem for path in main_tests}
          assert len(main_tests) == 6 and len(main_modules) == 6
          assert all(path not in roots for path in main_tests)
          assert all(selector.split("::")[0] not in main_tests for group in configuration.groups for selector in group.selectors)
          main_exit = run("changed-main-tests", ["uv", "run", "--no-sync", "pytest", "-q", *main_tests, "--tb=short", "--junitxml=" + str(output / "changed-main-tests.xml")], timeout=900, record=False)
          main_counts = {}
          try:
              main_cases = list(ET.parse(output / "changed-main-tests.xml").getroot().iter("testcase"))
              for case in main_cases:
                  names = set(case.attrib.get("classname", "").split(".")) & main_modules
                  assert len(names) == 1
                  name = names.pop()
                  main_counts[name] = main_counts.get(name, 0) + 1
              assert set(main_counts) == main_modules and all(value > 0 for value in main_counts.values())
              assert all(not any(child.tag in {"failure", "error", "skipped"} for child in case) for case in main_cases)
          except (OSError, ET.ParseError, AssertionError):
              main_exit = 1
          results.append({"name": "changed-main-tests", "exit": main_exit})
          print(json.dumps({"publicValidation": "changed-main-tests", "exit": main_exit, "sourceHead": source, "caseCounts": main_counts, "explicitFiles": 6, "registeredTypeRootsAdded": 0}), flush=True)
          (output / "results.json").write_text(json.dumps(results, sort_keys=True) + "\n", encoding="utf-8")
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          raise SystemExit(1 if before_code or any(result["exit"] for result in results) else 0)
          PY
      - name: Preserve exact generated public bytes and finite check outcomes
        if: always()
        env:
          RESOURCE_OBSERVATION: ${{ steps.resources.outputs.observation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          
          root = Path.cwd().resolve()
          source = os.environ["PUBLIC_SOURCE_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          assert subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == os.environ["PUBLIC_SOURCE_TREE"]
          allowed = set(["src/codex_plugin_scanner/guard/policy_consumer_readiness_contract.py","src/codex_plugin_scanner/guard/native_policy_consumer_capture.py","src/codex_plugin_scanner/guard/policy_consumer_readiness_observation.py","src/codex_plugin_scanner/guard/policy_consumer_readiness_sync.py","tests/test_policy_consumer_readiness_contract.py","tests/test_native_policy_consumer_capture.py","tests/test_policy_consumer_readiness_observation.py","tests/test_policy_consumer_readiness_sync.py","ci/native_runtime/installed_consumer_readiness_fixture.py","ci/native_runtime/probe_installed_consumer_readiness.py","src/codex_plugin_scanner/guard/native_policy_snapshot.py","src/codex_plugin_scanner/guard/native_policy_snapshot_control.py","src/codex_plugin_scanner/guard/runtime/runner.py","tests/test_native_policy_snapshot_control.py","ci/native_runtime/installed_readiness_profile.py","ci/native_runtime/profile_installed_readiness.py","ci/native_runtime/test_installed_readiness_profile.py"])
          report_path = "tests/fixtures/guard-command-corpus/decision-diff-report.json"
          allowed.add(report_path)
          changed = subprocess.check_output(["git", "diff", "--name-only", "-z", "HEAD"]).decode("utf-8").split("\0")
          changed = [path for path in changed if path]
          assert set(changed).issubset(allowed), "Unexpected tracked mutation"
          output = Path(os.environ["RUNNER_TEMP"]) / ("public-consumer-validation-" + os.environ["PYTHON_VERSION"])
          output.mkdir(exist_ok=True)
          records = []
          for relative in sorted(set(changed) | {report_path}):
              path = root / relative
              assert path.is_file() and not path.is_symlink() and path.resolve().is_relative_to(root)
              data = path.read_bytes()
              text = data.decode("utf-8", errors="strict")
              assert len(data) <= 1048576
              original = subprocess.check_output(["git", "rev-parse", "HEAD:" + relative], text=True).strip()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              digest = hashlib.sha256(data).hexdigest()
              encoded = base64.b64encode(data).decode("ascii")
              pieces = [encoded[index:index + 6000] for index in range(0, len(encoded), 6000)] or [""]
              metadata = {"path": relative, "originalBlob": original, "gitBlob": blob, "bytes": len(data), "sha256": digest, "parts": len(pieces)}
              records.append(metadata)
              for index, piece in enumerate(pieces):
                  print(json.dumps({"kind": "public-source-chunk-v1", "sourceHead": source, "python": os.environ["PYTHON_VERSION"], **metadata, "index": index, "base64": piece}, separators=(",", ":")), flush=True)
          results_path = output / "results.json"
          results = json.loads(results_path.read_text()) if results_path.is_file() else []
          before = json.loads((output / "profiler-before.json").read_text(encoding="utf-8"))
          assert before["sourceHead"] == source and before["python"] == os.environ["PYTHON_VERSION"]
          before_ok = before.get("expectedFailureConfirmed") is True if os.environ["PYTHON_VERSION"] == "3.12" else before.get("required") is False
          resources = json.loads(os.environ["RESOURCE_OBSERVATION"])
          assert resources["schema"] == "source-validation-runner-resources.v1"
          receipt = {"kind": "public-consumer-validation-v1", "runnerResources": resources, "sourceHead": source, "sourceTree": os.environ["PUBLIC_SOURCE_TREE"], "python": os.environ["PYTHON_VERSION"], "formatter": "ruff 0.15.17", "sourceContractEnvironment": {"launcher": "uv run --no-sync", "bytecodeOverridePresent": "PYTHONDONTWRITEBYTECODE" in os.environ, "pythonPathOverridePresent": "PYTHONPATH" in os.environ, "dontWriteBytecode": sys.dont_write_bytecode}, "expectedRegisteredRoots": 362, "expectedPreservedGroups": 13, "executedGroups": ["source-06", "source-08"], "explicitProfileSourceCases": 39, "explicitChangedMainTestFiles": ["tests/test_cursor_frozen_hook_command.py","tests/test_cursor_hook_rebind.py","tests/test_cursor_hooks.py","tests/test_cursor_watch_hook_script.py","tests/test_guard_command_decision_diff.py","tests/test_guard_daemon_storage_liveness.py"], "changedMainTestsInRegisteredTypeRoots": False, "profilerBefore": before, "results": results, "publicFiles": records, "nativeExecuted": False, "passed": before_ok and len(results) == 23 and all(result["exit"] == 0 for result in results)}
          (output / "receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt, separators=(",", ":")), flush=True)
          PY
      - name: Preserve finite validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-consumer-source-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-consumer-validation-${{ matrix.python }}/*.json
          if-no-files-found: error
          retention-days: 7
