_(self):\n        self.phases = []\n        self.assertion_matches = False\n        self.calls = 0\n\n    def pytest_runtest_makereport(self, item, call):\n        if call.when != \"call\":\n            return\n        self.calls += 1\n        if item.name != selector or call.excinfo is None:\n            return\n        error = call.excinfo.value\n        last = error.__traceback__\n        while last is not None and last.tb_next is not None:\n            last = last.tb_next\n        self.assertion_matches = (\n            isinstance(error, AssertionError)\n            and last is not None\n            and last.tb_lineno == assertion_line\n            and Path(last.tb_frame.f_code.co_filename).resolve() == target\n        )\n\n    def pytest_runtest_logreport(self, report):\n        if report.when in {\"setup\", \"call\", \"teardown\"} and report.outcome in {\"passed\", \"failed\", \"skipped\"}:\n            self.phases.append({\"when\": report.when, \"outcome\": report.outcome})\n\nevidence = Evidence()\ncode = int(pytest.main([\"-q\", str(target) + \"::\" + selector, \"--tb=no\", \"-p\", \"no:cacheprovider\"], plugins=[evidence]))\nexpected_phases = [\n    {\"when\": \"setup\", \"outcome\": \"passed\"},\n    {\"when\": \"call\", \"outcome\": \"failed\"},\n    {\"when\": \"teardown\", \"outcome\": \"passed\"},\n]\nconfirmed = code == 1 and evidence.calls == 1 and evidence.assertion_matches and evidence.phases == expected_phases\nrecord = {\n    \"schema\": \"readiness-profiler-before.v1\", \"required\": True,\n    \"python\": \"3.12\", \"sourceHead\": os.environ[\"PUBLIC_SOURCE_SHA\"],\n    \"helperBlob\": \"bdfc2f1047c69cb3bdbe753ef9f137d94bce8a96\",\n    \"testBlob\": \"d21ba20e3986d62ddf2ccc08b03353e705812962\",\n    \"selector\": selector, \"pytestExit\": code,\n    \"callCount\": evidence.calls, \"phases\": evidence.phases,\n    \"failureAtOriginalAvailabilityAssertion\": evidence.assertion_matches,\n    \"expectedFailureConfirmed\": confirmed, \"nativeExecuted\": False,\n}\nPath(sys.argv[1]).write_text(json.dumps(record, sort_keys=True) + \"\\n\", encoding=\"utf-8\")\nprint(json.dumps({\"profilerBefore\": record}, sort_keys=True), flush=True)\nraise SystemExit(0 if confirmed else 1)\n", encoding="utf-8")
