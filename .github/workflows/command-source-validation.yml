name: Public consumer source validation

on:
  push:
    branches: [hgp/command-source-validation-20260920]
    paths: [.github/workflows/command-source-validation.yml]

permissions:
  contents: read

concurrency:
  group: public-consumer-source-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'hashgraph-online/hol-guard' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/hgp/command-source-validation-20260920' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.10", "3.12"]
    env:
      PUBLIC_SOURCE_SHA: 6b69ea0e4bdb12baf7e2fc321121235a0fe16eeb
      PUBLIC_SOURCE_TREE: 583036088ce954aa65ec320c326248c4e7c5c922
      PUBLIC_MERGE_SHA: 4e852e40765875470bb71a45c331efbbb8e3c124
      PUBLIC_PARENT_SHA: 1c746110920e528f70e5993714ac05451ee88aa0
      PUBLIC_MAIN_SHA: acdc8ecf848a6699db08e33a9e646477e8b2ce60
      PUBLIC_BASE_SHA: bfe9d3e1f1cdf8a29373484ca9d99a11ce2800e1
      PYTHON_VERSION: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
        working-directory: public-source
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hashgraph-online/hol-guard
          ref: ${{ github.sha }}
          path: public-source
          persist-credentials: false
          fetch-depth: 10
      - name: Bind the workflow and exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PUBLIC_SOURCE_SHA"
          test "$(git diff --name-only "$PUBLIC_SOURCE_SHA" HEAD)" = ".github/workflows/command-source-validation.yml"
          git checkout --detach "$PUBLIC_SOURCE_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare the original owned contract interpreter
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLIC_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_SOURCE_TREE"
          python -I scripts/ci/policy_contract_interpreter.py prepare
          uv sync --frozen --extra dev --python "$PYTHON_VERSION"
          python -I scripts/ci/policy_contract_interpreter.py verify
      - name: Observe runner resources
        id: resources
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          def bounded_text(path):
              try:
                  with Path(path).open(encoding="ascii") as handle:
                      value = handle.read(65).strip()
              except (OSError, UnicodeError):
                  return None
              return value if len(value) <= 64 else None

          quota = bounded_text("/sys/fs/cgroup/cpu.max")
          quota_us = period_us = None
          if quota is not None:
              parts = quota.split()
              if len(parts) == 2 and parts[1].isdigit() and int(parts[1]) > 0:
                  period_us = int(parts[1])
                  if parts[0].isdigit() and int(parts[0]) > 0:
                      quota_us = int(parts[0])
          memory = bounded_text("/sys/fs/cgroup/memory.max")
          memory_limit = int(memory) if memory is not None and memory.isdigit() and int(memory) > 0 else None
          observation = {
              "schema": "source-validation-runner-resources.v1",
              "cpuCount": os.cpu_count(),
              "affinityCount": len(os.sched_getaffinity(0)),
              "physicalMemoryBytes": os.sysconf("SC_PAGE_SIZE") * os.sysconf("SC_PHYS_PAGES"),
              "cgroupCpuQuotaUs": quota_us,
              "cgroupCpuPeriodUs": period_us,
              "cgroupMemoryLimitBytes": memory_limit,
          }
          encoded = json.dumps(observation, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("observation=" + encoded + "\n")
          print(encoded, flush=True)
          PY
      - name: Install the exact reviewed formatter
        run: |
          set -euo pipefail
          printf '%s\n' 'ruff==0.15.17 --hash=sha256:ecfc3c7878fff94633ab0348524e093f9ce3243080416dd7d14f8ba400174719' > "$RUNNER_TEMP/policy-formatter-requirements.txt"
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: --target "$RUNNER_TEMP/policy-formatter" -r "$RUNNER_TEMP/policy-formatter-requirements.txt"
          "$RUNNER_TEMP/policy-formatter/bin/ruff" --version
