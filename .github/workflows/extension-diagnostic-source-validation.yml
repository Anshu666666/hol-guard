name: Public extension diagnostic source validation

on:
  push:
    branches: [hgp/extension-diagnostic-subtest-validation-20260920]
    paths: [.github/workflows/extension-diagnostic-source-validation.yml]

permissions:
  contents: read

concurrency:
  group: public-extension-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'hashgraph-online/hol-guard' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/hgp/extension-diagnostic-subtest-validation-20260920' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.10", "3.12"]
    env:
      PUBLIC_SOURCE_SHA: de346908fd397e051acdebd812ef47c4fd05e755
      PUBLIC_SOURCE_TREE: e618214bdaae9d7993d1b5f12c2f6fc9ead3dd0d
      PUBLIC_PARENT_SHA: 39d3251194ee3fb2c4439f7c9544e60e0a913583
      PYTHON_VERSION: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
        working-directory: public-source
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: public-source
          persist-credentials: false
          fetch-depth: 3
      - name: Bind exact public source and single workflow child
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $PUBLIC_SOURCE_SHA"
          test "$(git diff --name-only "$PUBLIC_SOURCE_SHA" HEAD)" = ".github/workflows/extension-diagnostic-source-validation.yml"
          git checkout --detach "$PUBLIC_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^')" = "$PUBLIC_PARENT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare pinned dependencies and owned interpreter
        run: |
          set -euo pipefail
          python -I scripts/ci/policy_contract_interpreter.py prepare
          uv sync --frozen --extra dev --python "$PYTHON_VERSION"
          python -I scripts/ci/policy_contract_interpreter.py verify
      - name: Install the exact reviewed formatter
        run: |
          set -euo pipefail
          printf '%s\n' 'ruff==0.15.17 --hash=sha256:ecfc3c7878fff94633ab0348524e093f9ce3243080416dd7d14f8ba400174719' > "$RUNNER_TEMP/policy-formatter-requirements.txt"
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: --target "$RUNNER_TEMP/policy-formatter" -r "$RUNNER_TEMP/policy-formatter-requirements.txt"
          "$RUNNER_TEMP/policy-formatter/bin/ruff" --version
      - name: Materialize exact source and case admission
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/public-extension-source-$PYTHON_VERSION"
          mkdir -p "$target"
          cat > "$target/source-manifest.json" <<'JSON'
