          cat > "$target/group.py" <<'PY'
          if __name__ == "__main__":
              import hashlib
              import json
              import os
              from pathlib import Path
              import sys

              root = Path.cwd().resolve()
              sys.path.insert(0, str(root))
              import pytest
              from _pytest.reports import TestReport
              from _pytest.subtests import SubtestReport

              name, manifest_path, report_path = sys.argv[1:]
              manifest = json.loads(Path(manifest_path).read_text())
              expected = manifest["expected"][name]

              def digest(ids):
                  return hashlib.sha256(json.dumps(sorted(ids), separators=(",", ":")).encode()).hexdigest()

              class Evidence:
                  def __init__(self):
                      self.items = []
                      self.deselected = []
                      self.collection_verified = False
                      self.reports = []
                      self.subreports = []
                      self.unknown_reports = 0
                      self.collect_errors = 0

                  def pytest_deselected(self, items):
                      self.deselected.extend(item.nodeid for item in items)

                  def pytest_collectreport(self, report):
                      if report.failed:
                          self.collect_errors += 1

                  def pytest_collection_finish(self, session):
                      self.items = [item.nodeid for item in session.items]
                      self.collection_verified = (
                          len(self.items) == expected["count"]
                          and len(set(self.items)) == len(self.items)
                          and digest(self.items) == expected["nodeIdsSha256"]
                          and len(self.deselected) == expected["deselectedCount"]
                          and digest(self.deselected) == expected["deselectedSha256"]
                          and self.collect_errors == 0
                      )
                      if not self.collection_verified:
                          raise pytest.UsageError("source_recovery_collection_mismatch")

                  def pytest_runtest_logreport(self, report):
                      if type(report) is TestReport:
                          self.reports.append((report.nodeid, report.when, report.outcome, hasattr(report, "wasxfail")))
                      elif type(report) is SubtestReport:
                          self.subreports.append((report.nodeid, report.when, report.outcome, hasattr(report, "wasxfail")))
                      else:
                          self.unknown_reports += 1

              probe = Evidence()
              code = int(pytest.main(["-q", *manifest["selectors"][name], *manifest["extraArgs"].get(name, []), "--tb=short"], plugins=[probe]))
              allowed = set(probe.items)
              failures = sorted({node for node, phase, outcome, xfail in probe.reports + probe.subreports if outcome != "passed" or xfail})
              expected_subtests = expected.get("subtestCounts", {})
              subtest_parents = [
                  {"nodeId": node, "expected": count,
                   "observed": sum(item == node for item, _, _, _ in probe.subreports),
                   "passed": sum(item == node and phase == "call" and outcome == "passed" and not xfail
                                 for item, phase, outcome, xfail in probe.subreports)}
                  for node, count in sorted(expected_subtests.items())
              ]
              subtest_counts_ok = (
                  all(node in allowed and type(count) is int and count > 0 for node, count in expected_subtests.items())
                  and {node for node, _, _, _ in probe.subreports} == set(expected_subtests)
                  and all(row["observed"] == row["expected"] for row in subtest_parents)
              )
              subtest_ok = subtest_counts_ok and all(
                  node in allowed and phase == "call" and outcome == "passed" and not xfail
                  for node, phase, outcome, xfail in probe.subreports
              )
              phase_ok = all(
                  [(phase, outcome, xfail) for node, phase, outcome, xfail in probe.reports if node == item]
                  == [("setup", "passed", False), ("call", "passed", False), ("teardown", "passed", False)]
                  for item in probe.items
              )
              diagnostic_ids = [item for item in probe.items if item.startswith(manifest["diagnosticModule"] + "::")]
              diagnostic_ok = sorted(diagnostic_ids) == sorted(manifest["diagnosticNodeIds"])
              required_rows = [
                  {"nodeId": item, "phases": [
                      {"when": phase, "outcome": outcome, "xfail": xfail}
                      for node, phase, outcome, xfail in probe.reports if node == item
                  ]}
                  for item in manifest["requiredNodeIds"]
              ]
              required_ok = all(
                  row["phases"] == [
                      {"when": phase, "outcome": "passed", "xfail": False}
                      for phase in ("setup", "call", "teardown")
                  ] for row in required_rows
              )
              passed = (
                  code == 0 and probe.collection_verified and phase_ok
                  and len(probe.reports) == 3 * expected["count"]
                  and diagnostic_ok and required_ok and subtest_ok and probe.unknown_reports == 0
              )
              record = {
                  "schema": "public-extension-diagnostic-source-group.v1", "group": name,
                  "sourceHead": os.environ["PUBLIC_SOURCE_SHA"], "sourceTree": os.environ["PUBLIC_SOURCE_TREE"],
                  "python": os.environ["PYTHON_VERSION"], "pytestExit": code,
                  "expectedCount": expected["count"], "collectedCount": len(probe.items),
                  "nodeIdsSha256": digest(probe.items), "collectionVerified": probe.collection_verified,
                  "deselectedCount": len(probe.deselected), "deselectedSha256": digest(probe.deselected),
                  "passedCalls": sum(phase == "call" and outcome == "passed" and not xfail for _, phase, outcome, xfail in probe.reports),
                  "skippedPhases": sum(outcome == "skipped" for _, _, outcome, _ in probe.reports),
                  "failedPhases": sum(outcome == "failed" for _, _, outcome, _ in probe.reports),
                  "xfailPhases": sum(xfail for _, _, _, xfail in probe.reports),
                  "failedKnownNodeIds": [node for node in failures if node in allowed][:expected["count"]],
                  "allThreePhasesPassed": phase_ok, "passed": passed,
                  "subtestCount": len(probe.subreports),
                  "passedSubtests": sum(phase == "call" and outcome == "passed" and not xfail for _, phase, outcome, xfail in probe.subreports),
                  "failedSubtests": sum(outcome == "failed" for _, _, outcome, _ in probe.subreports),
                  "skippedSubtests": sum(outcome == "skipped" for _, _, outcome, _ in probe.subreports),
                  "xfailSubtests": sum(xfail for _, _, _, xfail in probe.subreports),
                  "subtestParents": subtest_parents, "subtestCountsVerified": subtest_counts_ok,
                  "allSubtestsPassed": subtest_ok, "unknownReportTypes": probe.unknown_reports,
                  "diagnosticCasesVerified": diagnostic_ok, "diagnosticCases": len(diagnostic_ids),
                  "existingDiagnosticCases": len(diagnostic_ids) - len(required_rows),
                  "requiredCases": required_rows, "requiredCasesPassed": required_ok,
                  "installedExecuted": False, "nativeExecuted": False,
              }
              Path(report_path).write_text(json.dumps(record, sort_keys=True) + "\n")
              print(json.dumps(record, sort_keys=True), flush=True)
              raise SystemExit(0 if passed else (code or 1))
          PY
      - name: Execute diagnostic style, configured types and source contracts
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import ast
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          root = Path.cwd().resolve()
          source = os.environ["PUBLIC_SOURCE_SHA"]
          output = Path(os.environ["RUNNER_TEMP"]) / ("public-extension-source-" + os.environ["PYTHON_VERSION"])
          manifest = json.loads((output / "source-manifest.json").read_text())
          results = []
          assert sys.version_info[:2] == tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))
          assert Path(sys.prefix).resolve() == root / ".venv"
          assert "PYTHONPATH" not in os.environ and "PYTHONDONTWRITEBYTECODE" not in os.environ
          assert sys.dont_write_bytecode is False

          def source_unchanged():
              return (
                  subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
                  and subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == os.environ["PUBLIC_SOURCE_TREE"]
                  and not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"], text=True)
              )

          assert source_unchanged()
          assert manifest["sourceHead"] == source and manifest["sourceTree"] == os.environ["PUBLIC_SOURCE_TREE"]
          assert manifest["sourceParent"] == os.environ["PUBLIC_PARENT_SHA"]
          assert subprocess.check_output(["git", "rev-list", "--parents", "-n", "1", source], text=True).strip() == source + " " + manifest["sourceParent"]
          changed = subprocess.check_output(["git", "diff", "--name-only", manifest["sourceParent"], source], text=True).splitlines()
          assert changed == manifest["changedPaths"]
          for item in manifest["files"]:
              path = root / item["path"]
              assert path.is_file() and not path.is_symlink()
              data = path.read_bytes()
              assert len(data) == item["bytes"]
              assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == item["gitBlob"]
          test_path = manifest["diagnosticModule"]
          before = ast.parse(subprocess.check_output(["git", "show", manifest["sourceParent"] + ":" + test_path]))
          after = ast.parse((root / test_path).read_text())
          after_functions = {node.name: node for node in after.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          for node in before.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  assert node.name in after_functions
                  assert ast.dump(node, include_attributes=False) == ast.dump(after_functions[node.name], include_attributes=False)
          spec = importlib.util.spec_from_file_location("source_contract", root / "scripts/ci/policy_source_contract.py")
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          configuration = module._configuration()
          roots = list(dict.fromkeys(configuration.original_roots + configuration.additional_roots))
          assert len(roots) == 366 and len(configuration.groups) == 13
          assert next(g for g in configuration.groups if g.name == "source-07").selectors == manifest["selectors"]["source-07"]
          additional_candidate_roots = [path for path in manifest["changedPaths"] if path not in roots]
          assert additional_candidate_roots == ["ci/native_runtime/probe_installed_native_extensions.py"]
          checked_roots = [*roots, *additional_candidate_roots]
          assert len(checked_roots) == 367 and all(path in checked_roots for path in manifest["changedPaths"])
          assert len(manifest["requiredNodeIds"]) == 4 and len(set(manifest["requiredNodeIds"])) == 4
          assert len(manifest["diagnosticNodeIds"]) == 22 and len(set(manifest["diagnosticNodeIds"])) == 22
          assert set(manifest["requiredNodeIds"]) < set(manifest["diagnosticNodeIds"])
          ruff = str(Path(os.environ["RUNNER_TEMP"]) / "policy-formatter/bin/ruff")

          def wait_owned_leader(process, timeout):
              deadline = time.monotonic() + timeout
              while True:
                  event = os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                  if event is not None:
                      return event.si_status if event.si_code == os.CLD_EXITED else -event.si_status
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise subprocess.TimeoutExpired(process.args, timeout)
                  time.sleep(min(0.05, remaining))

          def close_owned_group(process):
              deadline = time.monotonic() + 5.0
              # Verify it remains our waitable child before signaling its owned group.
              try:
                  os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
              except OSError:
                  return False
              # The leader is still live or unreaped, so its PID cannot be reused here.
              try:
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              except OSError:
                  return False
              while True:
                  process.poll()
                  try:
                      os.killpg(process.pid, 0)
                  except ProcessLookupError:
                      return process.returncode is not None
                  except OSError:
                      return False
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      return False
                  time.sleep(min(0.05, remaining))

          def run(name, argv, timeout=600, record=True):
              print(json.dumps({"publicValidation": name, "started": True, "sourceHead": source}), flush=True)
              process = None
              contained = True
              try:
                  process = subprocess.Popen(argv, cwd=root, start_new_session=True)
                  try:
                      code = wait_owned_leader(process, timeout)
                  except subprocess.TimeoutExpired:
                      code = 124
              except OSError:
                  code = 126
              finally:
                  if process is not None:
                      contained = close_owned_group(process)
              command_code = code
              if not contained:
                  code = 125
              if record:
                  results.append({"name": name, "exit": code})
              print(json.dumps({"publicValidation": name, "exit": code, "commandExit": command_code, "sourceHead": source, "ownedProcessGroupAbsent": contained}), flush=True)
              (output / "results.json").write_text(json.dumps(results, sort_keys=True) + "\n", encoding="utf-8")
              if not contained:
                  raise SystemExit(125)
              return code

          passed = False
          try:
              run("candidate-lint", [ruff, "check", *manifest["changedPaths"]])
              run("candidate-format", [ruff, "format", "--check", *manifest["changedPaths"]])
              run("registered-types", ["uv", "run", "--no-sync", "basedpyright", "--level", "error", "--pythonpath", str(root / ".venv/bin/python"), "--pythonversion", os.environ["PYTHON_VERSION"], *checked_roots], timeout=900)
              run("source-07", ["uv", "run", "--no-sync", "python", str(output / "group.py"), "source-07", str(output / "source-manifest.json"), str(output / "source-07.json")], timeout=900)
              passed = len(results) == 4 and all(row["exit"] == 0 for row in results)
          finally:
              unchanged = source_unchanged()
              record = {
                  "schema": "public-extension-diagnostic-source-receipt.v1",
                  "sourceHead": source, "sourceTree": os.environ["PUBLIC_SOURCE_TREE"],
                  "sourceParent": manifest["sourceParent"], "validationHead": os.environ["GITHUB_SHA"],
                  "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "python": os.environ["PYTHON_VERSION"], "formatter": "ruff 0.15.17",
                  "typeRoots": len(roots), "checkedTypeRoots": len(checked_roots),
                  "additionalCandidateTypeRoots": additional_candidate_roots,
                  "preservedSourceGroups": len(configuration.groups),
                  "executedSourceGroups": ["source-07"], "sourcePins": len(manifest["files"]),
                  "expectedSourceCases": 539, "explicitExtensionCases": 4,
                  "expectedDiagnosticCases": 22, "existingDiagnosticCases": 18,
                  "expectedSubtests": 31, "expectedSubtestParents": 3,
                  "sourceContractEnvironment": {"launcher": "uv run --no-sync", "bytecodeOverridePresent": "PYTHONDONTWRITEBYTECODE" in os.environ, "pythonPathOverridePresent": "PYTHONPATH" in os.environ, "dontWriteBytecode": sys.dont_write_bytecode},
                  "exactChangedPaths": changed, "productionSourceUnchangedFromParent": True,
                  "originalDiagnosticFunctionsUnchanged": True,
                  "priorFullSourcePairReexecutedOnThisHead": False,
                  "outcomes": results, "sourceUnchanged": unchanged, "passed": passed and unchanged,
                  "installedExecuted": False, "nativeExecuted": False,
              }
              (output / "receipt.json").write_text(json.dumps(record, sort_keys=True) + "\n")
              print(json.dumps(record, sort_keys=True), flush=True)
          raise SystemExit(0 if passed and unchanged else 1)
          PY
      - name: Preserve tracked source fence
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLIC_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-extension-source-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-extension-source-${{ matrix.python }}/receipt.json
            ${{ runner.temp }}/public-extension-source-${{ matrix.python }}/source-07.json
            ${{ runner.temp }}/public-extension-source-${{ matrix.python }}/source-manifest.json
            ${{ runner.temp }}/public-extension-source-${{ matrix.python }}/results.json
          if-no-files-found: error
          retention-days: 14
