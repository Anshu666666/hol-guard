name: Guard review regression baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-review-regressions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review-regression-baseline:
    if: github.ref == 'refs/heads/hgp/diagnostic-review-regressions-9a6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic tools and reviewed tests
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: diagnostic
          persist-credentials: false

      - name: Checkout frozen product source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 9a6e66718892bcbdb6b8bd98ecbdeeb1d79b1e47
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false

      - name: Install frozen dependencies
        working-directory: source
        run: uv sync --frozen --extra dev --python 3.12

      - name: Secure managed interpreter permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          target="$(realpath "$interpreter")"
          mode="$(stat -c '%a' "$target")"
          if (( (8#$mode & 2) != 0 )); then
            replacement="${interpreter}.guard-ci"
            cp --dereference "$target" "$replacement"
            chmod 0755 "$replacement"
            mv "$replacement" "$target"
          fi
          secured_mode="$(stat -c '%a' "$(realpath "$interpreter")")"
          (( (8#$secured_mode & 2) == 0 ))

      - name: Execute frozen review regression baseline
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          HGP_REVIEW_RECEIPT: ${{ runner.temp }}/guard-review-regressions/summary.json
        run: uv run --no-sync python ../diagnostic/scripts/guard-review-regression-diagnostic.py

      - name: Retain closed regression receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: guard-review-regression-baseline
          path: ${{ runner.temp }}/guard-review-regressions/summary.json
          if-no-files-found: error
          retention-days: 1
