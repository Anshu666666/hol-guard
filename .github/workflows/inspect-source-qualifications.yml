                      total += member.file_size
                      need(total <= 4 * MIB, "native_source_total_size")
                      data = zipped.read(member)
                      need(len(data) == member.file_size, "native_source_member_length")
                      contents[member.filename] = parse_json(data)
              return contents
          
          
          def inspect_receipt(row):
              need(type(row["jobId"]) is int and row["jobId"] > 0
                   and type(row["artifactId"]) is int and row["artifactId"] > 0
                   and type(row["bytes"]) is int and 0 < row["bytes"] <= 2 * MIB
                   and isinstance(row["sha256"], str) and re.fullmatch(r"[0-9a-f]{64}", row["sha256"]),
                   "native_source_receipt_pins")
              job = api("/actions/jobs/" + str(row["jobId"]))
              need(job["id"] == row["jobId"] and job["run_id"] == PINS["validationRun"]
                   and job["run_attempt"] == 1 and job["head_sha"] == PINS["validationHead"]
                   and job["name"] == "verify (" + row["python"] + ")"
                   and job["status"] == "completed" and job["conclusion"] == "success",
                   "native_source_job_not_admitted")
              artifact = api("/actions/artifacts/" + str(row["artifactId"]))
              need(artifact["id"] == row["artifactId"] and artifact["expired"] is False
                   and artifact["name"] == "public-runtime-report-" + row["python"]
                   and artifact["size_in_bytes"] == row["bytes"] and artifact["digest"] == "sha256:" + row["sha256"]
                   and artifact["workflow_run"]["id"] == PINS["validationRun"]
                   and artifact["workflow_run"]["head_sha"] == PINS["validationHead"],
                   "native_source_artifact_not_admitted")
              need(timestamp(job["started_at"]) <= timestamp(artifact["created_at"])
                   <= timestamp(job["completed_at"]), "native_source_artifact_time")
              archive = io.BytesIO()
              download(row["artifactId"], row["bytes"], row["sha256"], archive)
              record = inspect_contents(read_archive(archive), row["python"])
              record.update(jobId=row["jobId"], artifactId=row["artifactId"], archiveBytes=row["bytes"],
                            sha256=row["sha256"], allFourMemberCrcVerified=True)
              return record
          
          
          TREE_CACHE = {}
          
          def tree_entries(sha):
              if sha in TREE_CACHE:
                  return TREE_CACHE[sha]
              need(len(TREE_CACHE) < 96, "lineage_tree_limit")
              tree = api("/git/trees/" + sha)
              need(tree.get("sha") == sha and tree.get("truncated") is False, "lineage_tree_identity")
              rows = tree.get("tree")
              need(isinstance(rows, list) and len(rows) <= 4096, "lineage_tree_size")
              result = {}
              for row in rows:
                  need(isinstance(row, dict) and isinstance(row.get("path"), str)
                       and row["path"] not in result and "/" not in row["path"], "lineage_tree_entry")
                  result[row["path"]] = (row["mode"], row["type"], row["sha"])
              TREE_CACHE[sha] = result
              return result
          
          def exact_tree_delta(old_tree, new_tree, expected_rows):
              expected = {row["path"]: row for row in expected_rows}
              need(len(expected) == len(expected_rows), "lineage_expected_duplicate")
              observed = set()
          
              def walk(old_sha, new_sha, prefix, depth):
                  need(depth <= 8, "lineage_depth")
                  old, new = tree_entries(old_sha), tree_entries(new_sha)
                  for name in sorted(set(old) | set(new)):
                      before, after = old.get(name), new.get(name)
                      if before == after:
                          continue
                      path = prefix + name
                      if before is not None and after is not None and before[:2] == after[:2] == ("040000", "tree"):
                          need(any(item.startswith(path + "/") for item in expected), "lineage_unrelated_directory")
                          walk(before[2], after[2], path + "/", depth + 1)
                      else:
                          need(path in expected, "lineage_unrelated_file")
                          row = expected[path]
                          want_before = None if row["before"] is None else ("100644", "blob", row["before"])
                          need(before == want_before and after == ("100644", "blob", row["after"]),
                               "lineage_candidate_file")
                          observed.add(path)
          
              walk(old_tree, new_tree, "", 0)
              need(observed == set(expected), "lineage_missing_change")
              return len(observed)
          
          
          def verify_lineage():
              current = api("/git/commits/" + PINS["publicSource"])
              parent = api("/git/commits/" + PINS["sourceParent"])
              need(current["sha"] == PINS["publicSource"] and current["tree"]["sha"] == PINS["publicTree"]
                   and [row["sha"] for row in current["parents"]] == [PINS["sourceParent"]]
                   and parent["sha"] == PINS["sourceParent"] and parent["tree"]["sha"] == PINS["parentTree"],
                   "native_source_lineage_commit")
              count = exact_tree_delta(PINS["parentTree"], PINS["publicTree"], PINS["changedFiles"])
              need(count == 8, "native_source_change_count")
              return {"parentSource": PINS["sourceParent"], "qualifiedSource": PINS["publicSource"],
                      "qualifiedTree": PINS["publicTree"], "changedFiles": count,
                      "nativeExecutionSourceEqualsQualifiedSource": True,
                      "historicalSourceFamiliesReexecutedOnCurrentSource": False}
          
          
          def verify_inspector_source():
              need(os.environ.get("GITHUB_REPOSITORY") == REPO
                   and os.environ.get("GITHUB_EVENT_NAME") == "push"
                   and os.environ.get("GITHUB_REF") == "refs/heads/hgp/inspect-source-qualifications-20260920",
                   "inspector_context")
              sha = os.environ.get("GITHUB_SHA", "")
              need(re.fullmatch(r"[0-9a-f]{40}", sha) is not None, "inspector_head")
              current = api("/git/commits/" + sha)
              need(current["sha"] == sha and [row["sha"] for row in current["parents"]]
                   == ["f90c8727e7c66d5d0ce96552719b36f22c585ec7"], "inspector_parent")
              source = api("/git/commits/f90c8727e7c66d5d0ce96552719b36f22c585ec7")
              need(source["sha"] == "f90c8727e7c66d5d0ce96552719b36f22c585ec7"
                   and source["tree"]["sha"] == "c5fc4d76eb219253672d79be7f43fd20c9a36d2b", "inspector_parent_tree")
              delta = api("/compare/f90c8727e7c66d5d0ce96552719b36f22c585ec7..." + sha)
              need(delta["status"] == "ahead" and delta["ahead_by"] == 1 and delta["behind_by"] == 0
                   and delta["total_commits"] == 1 and len(delta["files"]) == 1
                   and delta["files"][0]["filename"] == ".github/workflows/inspect-source-qualifications.yml"
                   and delta["files"][0]["status"] == "added", "inspector_only_path")
          
          
          report = {
              "purpose": "original_source_archives_only", "sourceTestsExecuted": False,
              "schema": "guard.runtime-report-source-admission.v1", "passed": False,
              "qualifiedSource": PINS["publicSource"], "validationRun": PINS["validationRun"],
              "validationAttempt": 1, "nativeAcceptanceClaim": False, "interpreters": [], "lineage": None,
          }
          try:
              need(TOKEN and os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "admission_context")
              need([row["python"] for row in PINS["receipts"]] == ["3.10", "3.12"], "required_interpreters")
              need(type(PINS["validationRun"]) is int and PINS["validationRun"] > 0
                   and type(PINS["validationWorkflowId"]) is int and PINS["validationWorkflowId"] > 0
                   and isinstance(PINS["validationHead"], str)
                   and re.fullmatch(r"[0-9a-f]{40}", PINS["validationHead"]) is not None,
                   "native_source_validation_pins")
              verify_inspector_source()
              validate_run()
              report["lineage"] = verify_lineage()
              report["interpreters"] = [inspect_receipt(row) for row in PINS["receipts"]]
              validate_run()
              report["passed"] = True
          except Refusal as error:
              report["failure"] = str(error)
          except BaseException:
              report["failure"] = "admission_unavailable"
          Path("runtime-report-source-admission.json").write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, sort_keys=True))
          raise SystemExit(0 if report["passed"] else 1)
          FIXED_SOURCE_PART_1
      - name: Verify original source archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python report-source-inspector.py
