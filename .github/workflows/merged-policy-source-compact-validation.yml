            'policy_scoped_enforcement::generic_tests::actual_generic_origin_and_tool_vectors_reach_native_composition': 260,
            'policy_scoped_enforcement::tests::readiness_profile_stage_defaults_make_all_three_exact_rules_causal': 9,
            'policy_scoped_enforcement::tests::installed_review_probe_requires_a_rule_that_changes_the_current_action': 2,
            'policy_scoped_enforcement::tests::bare_default_review_keeps_verified_pwd_warn_without_causal_allow_credit': 2,
        }
        MAX_BYTES = 4 * 1024 * 1024

        def validate(output, exit_code, selector):
            if selector not in SELECTORS or type(exit_code) is not int or exit_code != 0:
                raise ValueError('native_test_not_passed')
            if type(output) is not bytes or len(output) > MAX_BYTES:
                raise ValueError('native_output_unavailable')
            try:
                text = output.decode('utf-8', errors='strict')
            except UnicodeDecodeError:
                raise ValueError('native_output_unavailable') from None
            if '\x1b' in text or '\x00' in text:
                raise ValueError('native_output_unavailable')
            lines = text.splitlines()
            running = [line for line in lines if re.fullmatch(r'running \d+ tests?', line)]
            results = [line for line in lines if line.startswith('test ') and not line.startswith('test result:')]
            summaries = [line for line in lines if line.startswith('test result:')]
            if running != ['running 1 test'] or results != [f'test {selector} ... ok'] or len(summaries) != 1:
                raise ValueError('native_test_identity_or_count')
            if re.fullmatch(r'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9]+(?:\.[0-9]+)?s', summaries[0]) is None:
                raise ValueError('native_test_summary')
            return {
                'schema': 'public-named-native-test.v1',
                'selector': selector, 'passedTests': 1, 'failedTests': 0, 'ignoredTests': 0,
                'sourceAssertedCaseCount': SELECTORS[selector],
                'countScope': 'finite cases asserted by the pinned test source',
                'passed': True, 'installedExecuted': False, 'timingAcceptanceClaim': False,
            }
        PY
    - name: Execute merged source and exact native composition controls
      run: |
        set -euo pipefail
        .venv/bin/python - <<'PY'
        import hashlib
        import importlib.util
        import json
        import os
        from pathlib import Path
        import signal
        import subprocess
        import sys
        import time

        root = Path.cwd().resolve()
        source = os.environ["PUBLIC_SOURCE_SHA"]
        output = Path(os.environ["RUNNER_TEMP"]) / ("public-merged-source-" + os.environ["PYTHON_VERSION"])
        output.mkdir(exist_ok=True)
        manifest_path = output / "manifest.json"
        manifest = json.loads(manifest_path.read_text())
        results = []
        assert sys.version_info[:2] == tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))
        assert Path(sys.prefix).resolve() == root / ".venv"
        assert "PYTHONPATH" not in os.environ and "PYTHONDONTWRITEBYTECODE" not in os.environ
        assert sys.dont_write_bytecode is False
        # Counts are common; exact per-interpreter identities and original skips are pinned.
        assert set(manifest["expectedByPython"]) == {"3.10", "3.12"}
        assert manifest["expectedByPython"]["3.12"] == manifest["expected"]
        for version_expected in manifest["expectedByPython"].values():
            assert set(version_expected) == set(manifest["expected"])
            for group_name, row in version_expected.items():
                for key in ("count", "deselectedCount", "deselectedSha256", "subtestCounts"):
                    assert row[key] == manifest["expected"][group_name][key]
        manifest["expected"] = manifest["expectedByPython"][os.environ["PYTHON_VERSION"]]
        manifest_path = output / "execution-manifest.json"
        manifest_path.write_text(json.dumps(manifest, sort_keys=True) + "\n")

        def source_unchanged():
            return (
                subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
                and subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == os.environ["PUBLIC_SOURCE_TREE"]
                and not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"], text=True)
            )

        assert source_unchanged()
        for item in manifest["files"]:
            p = root / item["path"]
            assert p.is_file() and not p.is_symlink()
            data = p.read_bytes()
            assert len(data) == item["bytes"]
            assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == item["gitBlob"]
        spec = importlib.util.spec_from_file_location("source_contract", root / "scripts/ci/policy_source_contract.py")
        assert spec is not None and spec.loader is not None
        module = importlib.util.module_from_spec(spec)
        sys.modules[spec.name] = module
        spec.loader.exec_module(module)
        configuration = module._configuration()
        roots = list(dict.fromkeys(configuration.original_roots + configuration.additional_roots))
        assert len(roots) == manifest["registeredRootCount"] and len(configuration.groups) == 13
        for group_name in manifest["configuredGroups"]:
            assert next(g for g in configuration.groups if g.name == group_name).selectors == manifest["selectors"][group_name]
        assert len(manifest["changedPython"]) == manifest["changedPythonCount"]
        additional_type_roots = manifest["additionalTypeRoots"]
        assert all(p not in roots for p in additional_type_roots)
        checked_roots = roots + additional_type_roots
        assert len(checked_roots) == manifest["checkedRootCount"]
        assert set(manifest["requiredChangedTypeRoots"]).issubset(checked_roots)
        assert set(manifest["changedPython"]) == set(manifest["requiredChangedTypeRoots"]) | set(manifest["disclosedUnregisteredChangedTests"])
        assert all(path.startswith(("tests/", "ci/")) for path in manifest["disclosedUnregisteredChangedTests"])
        expected_outcomes = ["changed-ruff-check", "changed-ruff-format", "registered-types", *manifest["pytestGroups"], "generated-program-current", *["native-composition-" + str(index + 1) for index in range(len(manifest["rustTests"]))]]
        assert manifest["expectedOutcomes"] == expected_outcomes and len(set(expected_outcomes)) == len(expected_outcomes)
        def wait_owned_leader(process, timeout):
            deadline = time.monotonic() + timeout
            while True:
                event = os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                if event is not None:
                    return event.si_status if event.si_code == os.CLD_EXITED else -event.si_status
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    raise subprocess.TimeoutExpired(process.args, timeout)
                time.sleep(min(0.05, remaining))

        def close_owned_group(process):
            deadline = time.monotonic() + 5.0
            # Verify it remains our waitable child before signaling its owned group.
            try:
                os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
            except OSError:
                return False
            # The leader is still live or unreaped, so its PID cannot be reused here.
            try:
                os.killpg(process.pid, signal.SIGKILL)
            except ProcessLookupError:
                pass
            except OSError:
                return False
            while True:
                process.poll()
                try:
                    os.killpg(process.pid, 0)
                except ProcessLookupError:
                    return process.returncode is not None
                except OSError:
                    return False
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    return False
                time.sleep(min(0.05, remaining))

        def run(name, argv, timeout=600, record=True):
            print(json.dumps({"publicValidation": name, "started": True, "sourceHead": source}), flush=True)
            process = None
            contained = True
            try:
                process = subprocess.Popen(argv, cwd=root, start_new_session=True)
                try:
                    code = wait_owned_leader(process, timeout)
                except subprocess.TimeoutExpired:
                    code = 124
            except OSError:
                code = 126
            finally:
                if process is not None:
                    contained = close_owned_group(process)
            command_code = code
            if not contained:
                code = 125
            if record:
                results.append({"name": name, "exit": code})
            print(json.dumps({"publicValidation": name, "exit": code, "commandExit": command_code, "sourceHead": source, "ownedProcessGroupAbsent": contained}), flush=True)
            (output / "results.json").write_text(json.dumps(results, sort_keys=True) + "\n", encoding="utf-8")
            if not contained:
                raise SystemExit(125)
            return code

        sys.path.insert(0, str(output))
        from rust_admission import SELECTORS, MAX_BYTES, validate
        assert manifest["rustTests"] == SELECTORS
        rust_records = []

        def run_rust(index, selector):
            name = "native-composition-" + str(index + 1)
            log = output / (name + ".log")
            argv = ["bash", "-c", 'set -o pipefail\ncargo test --color never --locked --manifest-path rust/Cargo.toml -p hol-guard-runtime --bin hol-guard-runtime "$1" -- --exact --nocapture 2>&1 | tee "$2"', "native-test", selector, str(log)]
            code = run(name, argv, timeout=300, record=False)
            try:
                if not log.is_file() or log.stat().st_size > MAX_BYTES:
                    raise ValueError("native_output_unavailable")
                row = validate(log.read_bytes(), code, selector)
            except (OSError, ValueError):
                row = {"schema":"public-named-native-test.v1", "selector":selector, "passed":False, "failure":"native_named_test_not_admitted", "installedExecuted":False}
                code = code or 1
            rust_records.append(row)
            results.append({"name":name, "exit":code})
            (output / "rust-tests.json").write_text(json.dumps({"sourceHead":source,"sourceTree":os.environ["PUBLIC_SOURCE_TREE"],"python":os.environ["PYTHON_VERSION"],"schema":"public-native-composition-tests.v1","tests":rust_records,"passed":len(rust_records)==len(manifest["rustTests"]) and all(r["passed"] for r in rust_records)},sort_keys=True)+"\n")
            print(json.dumps(row,sort_keys=True),flush=True)


        passed = False
        try:
            run("changed-ruff-check", ["uv", "run", "--no-sync", "ruff", "check", *manifest["changedPython"]], timeout=120)
            run("changed-ruff-format", ["uv", "run", "--no-sync", "ruff", "format", "--check", *manifest["changedPython"]], timeout=120)
            run("registered-types", ["uv", "run", "--no-sync", "basedpyright", "--level", "error", "--pythonpath", str(root / ".venv/bin/python"), "--pythonversion", os.environ["PYTHON_VERSION"], *checked_roots], timeout=900)
            for name in manifest["pytestGroups"]:
                run(name, [sys.executable, str(output / "group.py"), name, str(manifest_path), str(output / (name + ".json"))], timeout=manifest["groupTimeoutSeconds"][name])
            run("generated-program-current", [sys.executable, "scripts/build_native_command_program.py", "--check"], timeout=120)
            for index, selector in enumerate(manifest["rustTests"]):
                run_rust(index, selector)
            passed = [row["name"] for row in results] == expected_outcomes and all(row["exit"] == 0 for row in results)
        finally:
            unchanged = source_unchanged()
            record = {
                "schema": "public-merged-source-receipt.v1", "sourceHead": source,
                "sourceTree": os.environ["PUBLIC_SOURCE_TREE"], "validationHead": os.environ["GITHUB_SHA"],
                "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                "python": os.environ["PYTHON_VERSION"], "typeRoots": len(roots), "checkedTypeRoots": len(checked_roots), "additionalTypeRoots": additional_type_roots,
                "preservedSourceGroups": len(configuration.groups), "executedSourceGroups": manifest["configuredGroups"],
                "sourcePins": len(manifest["files"]), "expectedSourceCases": {name: manifest["expected"][name]["count"] for name in manifest["pytestGroups"]},
                "expectedNodeIdsSha256": {name: manifest["expected"][name]["nodeIdsSha256"] for name in manifest["pytestGroups"]},
                "interpreterNodeIdCorrespondence": manifest["interpreterNodeIdCorrespondence"],
                "expectedSetupSkips": {name: manifest["expected"][name].get("allowedSetupSkips", []) for name in manifest["pytestGroups"]}, "requiredFilePasses": {name: manifest["expected"][name].get("requiredFiles", {}) for name in manifest["pytestGroups"]},
                "expectedSourceSubtests": sum(sum(value.get("subtestCounts", {}).values()) for value in manifest["expected"].values()), "compilerControls": 8, "generatedArtifact": manifest["compilerArtifact"],
                "priorExecutionCreditTransferred": False,
                "outcomes": results, "sourceUnchanged": unchanged, "passed": passed and unchanged,
                "installedExecuted": False, "nativeApprovalAuthorityExecuted": False, "controlledResidentTestsAreInstalledEvidence": False, "compiledNativeCommitmentPassed": any(r["name"] == "slow-vector-commitment" and r["exit"] == 0 for r in results), "nativeEvaluationTestsPassed": sum(row.get("passed") is True for row in rust_records), "sourceAssertedVectorCases": 581, "source06Reexecuted": "source-06" in manifest["configuredGroups"],
                "nativeBoundaryComponentComparisonPassed": any(r["name"] == "slow-boundary-comparison" and r["exit"] == 0 for r in results),
                "fullPolicyParityProven": False, "contentHashNativeCapabilityUnavailable": True,
                "changedPythonCount": manifest["changedPythonCount"], "disclosedUnregisteredChangedTests": manifest["disclosedUnregisteredChangedTests"],
            }
            (output / "receipt.json").write_text(json.dumps(record, sort_keys=True) + "\n")
            print(json.dumps(record, sort_keys=True), flush=True)
        raise SystemExit(0 if passed and unchanged else 1)
        PY
    - name: Preserve tracked source fence
      if: always()
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$PUBLIC_SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_SOURCE_TREE"
        test -z "$(git status --porcelain --untracked-files=no)"
