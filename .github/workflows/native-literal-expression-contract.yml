name: Native literal expression contract

on:
  pull_request:
    paths:
      - "rust/crates/guard-policy-snapshot/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "spec/guard-policy/v1alpha1/native-command-expression-vectors.json"
      - ".github/workflows/native-literal-expression-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-literal-expression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
      - name: Test the real snapshot library and shared literal vectors
        run: cargo test --locked --manifest-path rust/Cargo.toml -p guard-policy-snapshot
      - name: Check all snapshot library targets
        if: always()
        run: cargo clippy --locked --manifest-path rust/Cargo.toml -p guard-policy-snapshot --all-targets -- -D warnings
      - name: Check changed Rust formatting
        if: always()
        run: rustfmt --edition 2021 --check --config skip_children=true rust/crates/guard-policy-snapshot/src/command_expression.rs rust/crates/guard-policy-snapshot/src/command_expression_tests.rs rust/crates/guard-policy-snapshot/src/lib.rs
