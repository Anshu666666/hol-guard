name: Native live continuation source validation
permissions:
  contents: read
concurrency:
  group: public-native-live-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'hashgraph-online/hol-guard' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/hgp/native-live-source-validation-20260920' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python:
        - '3.10'
        - '3.12'
    env:
      PUBLIC_SOURCE_SHA: 526cda062f02d021ad8e349cfa065e6eb65947fb
      PUBLIC_SOURCE_TREE: ef2da5ba035a941bd911de2aeab55391df8bb987
      PYTHON_VERSION: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
        working-directory: public-source
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
        path: public-source
        persist-credentials: false
        fetch-depth: 2
    - name: Bind exact public source and single workflow child
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $PUBLIC_SOURCE_SHA"
        test "$(git diff --name-only "$PUBLIC_SOURCE_SHA" HEAD)" = ".github/workflows/native-live-source-validation.yml"
        git checkout --detach "$PUBLIC_SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_SOURCE_TREE"
        test -z "$(git status --porcelain --untracked-files=no)"
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.26
        enable-cache: false
    - name: Prepare pinned dependencies and owned interpreter
      run: |
        set -euo pipefail
        python -I scripts/ci/policy_contract_interpreter.py prepare
        uv sync --frozen --extra dev --python "$PYTHON_VERSION"
        python -I scripts/ci/policy_contract_interpreter.py verify
    - name: Install pinned Rust for the existing slow commitment test
      run: |
        set -euo pipefail
        rustup toolchain install 1.88.0 --profile minimal
        rustup default 1.88.0
        rustc --version
        cargo --version
    - name: Materialize exact source selection 1 of 3
      run: |
        set -euo pipefail
        target="$RUNNER_TEMP/public-native-live-$PYTHON_VERSION"
        mkdir -p "$target"
        cat > "$target/manifest.json" <<'JSON'
        {
          "selectors": {
