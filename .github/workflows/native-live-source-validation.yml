    - name: Materialize finite case admission
      run: |
        set -euo pipefail
        target="$RUNNER_TEMP/public-native-live-$PYTHON_VERSION"
        cat > "$target/group.py" <<'PY'
        """Finite exact source-case admission; safe to import in spawned test workers."""
        import hashlib
        import json
        import os
        from pathlib import Path
        import sys

        import pytest
        from _pytest.reports import TestReport
        from _pytest.subtests import SubtestReport


        def digest(ids):
            return hashlib.sha256(json.dumps(sorted(ids), separators=(",", ":")).encode()).hexdigest()


        class Evidence:
            def __init__(self, expected):
                self.expected = expected
                self.items = []
                self.deselected = []
                self.collection_verified = False
                self.reports = []
                self.subtests = []
                self.unknown_reports = 0
                self.collect_errors = 0

            def pytest_deselected(self, items):
                self.deselected.extend(item.nodeid for item in items)

            def pytest_collectreport(self, report):
                if report.failed:
                    self.collect_errors += 1

            def pytest_collection_finish(self, session):
                self.items = [item.nodeid for item in session.items]
                e = self.expected
                self.collection_verified = (
                    len(self.items) == e["count"] and len(set(self.items)) == len(self.items)
                    and digest(self.items) == e["nodeIdsSha256"]
                    and len(self.deselected) == e["deselectedCount"]
                    and digest(self.deselected) == e["deselectedSha256"] and self.collect_errors == 0
                )
                if not self.collection_verified:
                    raise pytest.UsageError("runtime_union_collection_mismatch")

            def pytest_runtest_logreport(self, report):
                if type(report) is SubtestReport:
                    self.subtests.append((report.nodeid, report.when, report.outcome, hasattr(report, "wasxfail")))
                elif type(report) is TestReport and report.when in {"setup", "call", "teardown"}:
                    self.reports.append((report.nodeid, report.when, report.outcome, hasattr(report, "wasxfail")))
                else:
                    self.unknown_reports += 1


        def project(probe, code, name, manifest):
            expected = manifest["expected"][name]
            skips = expected.get("allowedSetupSkips", [])
            normal = [("setup", "passed", False), ("call", "passed", False), ("teardown", "passed", False)]
            skipped = [("setup", "skipped", False), ("teardown", "passed", False)]
            phase_ok = all(
                [(phase, outcome, xfail) for node, phase, outcome, xfail in probe.reports if node == item]
                == (skipped if item in skips else normal)
                for item in probe.items
            )
            required = expected.get("requiredFiles", {})
            required_counts = {path: sum(node.split("::", 1)[0] == path and phase == "call" and outcome == "passed" and not xfail
                                         for node, phase, outcome, xfail in probe.reports) for path in required}
            expected_subtests = expected.get("subtestCounts", {})
            subtest_parents = [
                {"nodeId": node, "expected": count,
                 "observed": sum(item == node for item, _, _, _ in probe.subtests),
                 "passed": sum(item == node and phase == "call" and outcome == "passed" and not xfail
                               for item, phase, outcome, xfail in probe.subtests)}
                for node, count in sorted(expected_subtests.items())
            ]
            subtest_counts_ok = (
                all(node in probe.items and type(count) is int and count > 0 for node, count in expected_subtests.items())
                and {node for node, _, _, _ in probe.subtests} == set(expected_subtests)
                and all(row["observed"] == row["expected"] for row in subtest_parents)
            )
            subtest_ok = subtest_counts_ok and all(
                node in probe.items and phase == "call" and outcome == "passed" and not xfail
                for node, phase, outcome, xfail in probe.subtests
            )
            passed = (code == 0 and probe.collection_verified and phase_ok
                      and len(probe.reports) == 3 * expected["count"] - len(skips)
                      and set(skips).issubset(probe.items) and len(skips) == len(set(skips))
                      and subtest_ok and probe.unknown_reports == 0 and required_counts == required)
            failures = {node for node, _, outcome, xfail in probe.reports if outcome == "failed" or xfail}
            return {
                "schema": "public-native-live-source-group.v1", "group": name,
                "sourceHead": os.environ["PUBLIC_SOURCE_SHA"], "sourceTree": os.environ["PUBLIC_SOURCE_TREE"],
                "python": os.environ["PYTHON_VERSION"], "pytestExit": code,
                "expectedCount": expected["count"], "collectedCount": len(probe.items),
                "nodeIdsSha256": digest(probe.items), "collectionVerified": probe.collection_verified,
                "deselectedCount": len(probe.deselected), "deselectedSha256": digest(probe.deselected),
                "passedCalls": sum(phase == "call" and outcome == "passed" and not xfail for _, phase, outcome, xfail in probe.reports),
                "skippedPhases": sum(outcome == "skipped" for _, _, outcome, _ in probe.reports),
                "failedPhases": sum(outcome == "failed" for _, _, outcome, _ in probe.reports),
                "xfailPhases": sum(xfail for _, _, _, xfail in probe.reports),
                "allowedSetupSkips": skips, "expectedSubtests": sum(expected_subtests.values()), "observedSubtests": len(probe.subtests),
                "subtestParents": subtest_parents, "subtestCountsVerified": subtest_counts_ok,
                "allSubtestsPassed": subtest_ok,
                "failedSubtests": sum(outcome == "failed" for _, _, outcome, _ in probe.subtests),
                "skippedSubtests": sum(outcome == "skipped" for _, _, outcome, _ in probe.subtests),
                "xfailSubtests": sum(xfail for _, _, _, xfail in probe.subtests),
                "unknownReports": probe.unknown_reports, "requiredFilePasses": required_counts,
                "failedKnownNodeIds": sorted(failures & set(probe.items))[:expected["count"]] if probe.collection_verified else [],
                "allExpectedPhasesPassed": phase_ok, "passed": passed, "installedExecuted": False,
                "compiledNativeCommitmentExecuted": name == "slow-vector-commitment" and passed,
            }


        def main():
            root = Path.cwd().resolve()
            sys.path.insert(0, str(root))
            name, manifest_path, report_path = sys.argv[1:]
            manifest = json.loads(Path(manifest_path).read_text())
            probe = Evidence(manifest["expected"][name])
            code = int(pytest.main(["-q", *manifest["selectors"][name], *manifest["extraArgs"].get(name, []), "--tb=short"], plugins=[probe]))
            record = project(probe, code, name, manifest)
            Path(report_path).write_text(json.dumps(record, sort_keys=True) + "\n")
            print(json.dumps(record, sort_keys=True), flush=True)
            return 0 if record["passed"] else (code or 1)


        if __name__ == "__main__":
            raise SystemExit(main())
        PY
    - name: Execute exact native and retained source controls
      run: |
        set -euo pipefail
        .venv/bin/python - <<'PY'
        import hashlib
        import importlib.util
        import json
        import os
        from pathlib import Path
        import signal
        import subprocess
        import sys
        import time

        root = Path.cwd().resolve()
        source = os.environ["PUBLIC_SOURCE_SHA"]
        output = Path(os.environ["RUNNER_TEMP"]) / ("public-native-live-" + os.environ["PYTHON_VERSION"])
        output.mkdir(exist_ok=True)
        manifest_path = output / "manifest.json"
        manifest = json.loads(manifest_path.read_text())
        results = []
        assert sys.version_info[:2] == tuple(map(int, os.environ["PYTHON_VERSION"].split(".")))
        assert Path(sys.prefix).resolve() == root / ".venv"
        assert "PYTHONPATH" not in os.environ and "PYTHONDONTWRITEBYTECODE" not in os.environ
        assert sys.dont_write_bytecode is False

        def source_unchanged():
            return (
                subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
                and subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == os.environ["PUBLIC_SOURCE_TREE"]
                and not subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"], text=True)
            )

        assert source_unchanged()
        for item in manifest["files"]:
            p = root / item["path"]
            assert p.is_file() and not p.is_symlink()
            data = p.read_bytes()
            assert len(data) == item["bytes"]
            assert hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest() == item["gitBlob"]
        spec = importlib.util.spec_from_file_location("source_contract", root / "scripts/ci/policy_source_contract.py")
        assert spec is not None and spec.loader is not None
        module = importlib.util.module_from_spec(spec)
        sys.modules[spec.name] = module
        spec.loader.exec_module(module)
        configuration = module._configuration()
        roots = list(dict.fromkeys(configuration.original_roots + configuration.additional_roots))
        assert len(roots) == 402 and len(configuration.groups) == 13
        for group_name in ("source-01", "source-06", "source-07", "source-09"):
            assert next(g for g in configuration.groups if g.name == group_name).selectors == manifest["selectors"][group_name]
        assert len(manifest["changedPython"]) == 33
        additional_type_roots = ["tests/test_guard_frozen_daemon_runtime.py"]
        assert all(p not in roots for p in additional_type_roots)
        checked_roots = roots + additional_type_roots
        assert len(checked_roots) == 403
        assert set(manifest["changedPython"]).issubset(checked_roots)
        def wait_owned_leader(process, timeout):
            deadline = time.monotonic() + timeout
            while True:
                event = os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
                if event is not None:
                    return event.si_status if event.si_code == os.CLD_EXITED else -event.si_status
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    raise subprocess.TimeoutExpired(process.args, timeout)
                time.sleep(min(0.05, remaining))

        def close_owned_group(process):
            deadline = time.monotonic() + 5.0
            # Verify it remains our waitable child before signaling its owned group.
            try:
                os.waitid(os.P_PID, process.pid, os.WEXITED | os.WNOHANG | os.WNOWAIT)
            except OSError:
                return False
            # The leader is still live or unreaped, so its PID cannot be reused here.
            try:
                os.killpg(process.pid, signal.SIGKILL)
            except ProcessLookupError:
                pass
            except OSError:
                return False
            while True:
                process.poll()
                try:
                    os.killpg(process.pid, 0)
                except ProcessLookupError:
                    return process.returncode is not None
                except OSError:
                    return False
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    return False
                time.sleep(min(0.05, remaining))

        def run(name, argv, timeout=600, record=True):
            print(json.dumps({"publicValidation": name, "started": True, "sourceHead": source}), flush=True)
            process = None
            contained = True
            try:
                process = subprocess.Popen(argv, cwd=root, start_new_session=True)
                try:
                    code = wait_owned_leader(process, timeout)
                except subprocess.TimeoutExpired:
                    code = 124
            except OSError:
                code = 126
            finally:
                if process is not None:
                    contained = close_owned_group(process)
            command_code = code
            if not contained:
                code = 125
            if record:
                results.append({"name": name, "exit": code})
            print(json.dumps({"publicValidation": name, "exit": code, "commandExit": command_code, "sourceHead": source, "ownedProcessGroupAbsent": contained}), flush=True)
            (output / "results.json").write_text(json.dumps(results, sort_keys=True) + "\n", encoding="utf-8")
            if not contained:
                raise SystemExit(125)
            return code

        passed = False
        try:
            run("changed-ruff-check", ["uv", "run", "--no-sync", "ruff", "check", *manifest["changedPython"]], timeout=120)
            run("changed-ruff-format", ["uv", "run", "--no-sync", "ruff", "format", "--check", *manifest["changedPython"]], timeout=120)
            run("registered-types", ["uv", "run", "--no-sync", "basedpyright", "--level", "error", "--pythonpath", str(root / ".venv/bin/python"), "--pythonversion", os.environ["PYTHON_VERSION"], *checked_roots], timeout=900)
            for name in ("source-01", "source-06", "source-07", "source-09", "focused-recovery", "slow-vector-commitment"):
                run(name, [sys.executable, str(output / "group.py"), name, str(manifest_path), str(output / (name + ".json"))], timeout=900)
            passed = len(results) == 9 and all(row["exit"] == 0 for row in results)
        finally:
            unchanged = source_unchanged()
            record = {
                "schema": "public-native-live-receipt.v1", "sourceHead": source,
                "sourceTree": os.environ["PUBLIC_SOURCE_TREE"], "validationHead": os.environ["GITHUB_SHA"],
                "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                "python": os.environ["PYTHON_VERSION"], "typeRoots": len(roots), "checkedTypeRoots": len(checked_roots), "additionalTypeRoots": additional_type_roots,
                "preservedSourceGroups": len(configuration.groups), "executedSourceGroups": ["source-01", "source-06", "source-07", "source-09"],
                "focusedFiles": len(manifest["selectors"]["focused-recovery"]), "sourcePins": len(manifest["files"]),
                "expectedSourceCases": {"source-01":504,"source-06":168,"source-07":571,"source-09":934}, "originalPlatformSkips":1, "newReadinessCases":11, "priorContinuationCases":21, "newNativeLiveCases":108, "expectedSourceSubtests":31, "expectedFocusedCases": 284, "existingSlowDeselected": 1,
                "separateSlowCommitmentCases": 1, "vectorCounts": {"ordinary": 133, "mixed": 188, "generic": 260},
                "outcomes": results, "sourceUnchanged": unchanged, "passed": passed and unchanged,
                "installedExecuted": False, "nativeApprovalAuthorityExecuted": False, "controlledResidentTestsAreInstalledEvidence": False, "compiledNativeCommitmentPassed": any(r["name"] == "slow-vector-commitment" and r["exit"] == 0 for r in results),
            }
            (output / "receipt.json").write_text(json.dumps(record, sort_keys=True) + "\n")
            print(json.dumps(record, sort_keys=True), flush=True)
        raise SystemExit(0 if passed and unchanged else 1)
        PY
    - name: Preserve tracked source fence
      if: always()
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$PUBLIC_SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_SOURCE_TREE"
        test -z "$(git status --porcelain --untracked-files=no)"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: public-native-live-${{ matrix.python }}
        path: |
          ${{ runner.temp }}/public-native-live-${{ matrix.python }}/receipt.json
          ${{ runner.temp }}/public-native-live-${{ matrix.python }}/source-01.json
          ${{ runner.temp }}/public-native-live-${{ matrix.python }}/source-06.json
          ${{ runner.temp }}/public-native-live-${{ matrix.python }}/source-07.json
          ${{ runner.temp }}/public-native-live-${{ matrix.python }}/source-09.json
          ${{ runner.temp }}/public-native-live-${{ matrix.python }}/focused-recovery.json
          ${{ runner.temp }}/public-native-live-${{ matrix.python }}/slow-vector-commitment.json
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - hgp/native-live-source-validation-20260920
