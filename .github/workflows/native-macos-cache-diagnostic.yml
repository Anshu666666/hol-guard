name: macOS resolver cache diagnostic
run-name: macOS resolver cache diagnostic smoke - d104ac3

on:
  push:
    branches: [codex/rsp-macos-cache-diagnostic-d104ac3]
    paths:
      - '.github/workflows/native-macos-cache-diagnostic.yml'
      - 'scripts/ci/record_native_macos_diagnostic_checkouts.py'
      - 'scripts/ci/native_macos_dtrace_availability.py'
      - 'scripts/ci/native_loopback_cache.py'
      - 'scripts/ci/native_loopback_resolver.py'
      - 'scripts/ci/native_loopback_lookup.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-macos-cache-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            prior_artifact_id: '10496030613'
            target: x86_64-apple-darwin
            platform_tag: macosx_13_0_x86_64
            deployment_target: '13.0'
          - runner: macos-15
            prior_artifact_id: '10496485020'
            target: aarch64-apple-darwin
            platform_tag: macosx_11_0_arm64
            deployment_target: '11.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Check out validation driver
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: validation-src
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate-src
          ref: d104ac325eba464bd82bd3fcae5c736de60fe1fb
          persist-credentials: false
      - name: Check out audited production baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: baseline-src
          ref: 2e672d2d950c6ec471005ddba46e49bba16dc23b
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Bind unchanged sources and reviewed environment driver
        env:
          VALIDATION_WORKFLOW_SHA: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          python validation-src/scripts/ci/record_native_macos_diagnostic_checkouts.py \
            --baseline baseline-src --candidate candidate-src \
            --phase before --output macos-cache-diagnostic-evidence/aggregate/checkouts-before.json
      - name: Retrieve immutable prior candidate wheel for rollback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        # The original mandatory transition CLI rejects absent or changed bytes;
        # an unavailable download must not erase the independent probes.
        continue-on-error: true
        with:
          artifact-ids: ${{ matrix.prior_artifact_id }}
          run-id: 35217841356
          repository: hashgraph-online/hol-guard
          github-token: ${{ github.token }}
          path: prior-candidate-artifact
      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 ${{ matrix.target }}
      - name: Record DTrace provider availability without enabling tracing
        shell: bash
        run: |
          python validation-src/scripts/ci/native_macos_dtrace_availability.py \
            --output macos-cache-diagnostic-evidence/aggregate/dtrace-availability.json
      - name: Run one cache experiment around the original paired smoke cohort
        env:
          QUALIFICATION_MODE: smoke
          QUALIFICATION_TARGET: ${{ matrix.target }}
          QUALIFICATION_PLATFORM: ${{ matrix.platform_tag }}
          QUALIFICATION_DEPLOYMENT: ${{ matrix.deployment_target }}
        shell: bash
        run: |
          python validation-src/scripts/ci/native_loopback_resolver.py \
            --refresh-native-cache \
            --output macos-cache-diagnostic-evidence/aggregate/runner-resolver.json -- \
            python candidate-src/scripts/build_native_qualification_artifacts.py \
            --baseline baseline-src --candidate candidate-src \
            --target "$QUALIFICATION_TARGET" --platform-tag "$QUALIFICATION_PLATFORM" \
            --deployment-target "$QUALIFICATION_DEPLOYMENT" \
            --prior-artifact-root prior-candidate-artifact \
            --mode "$QUALIFICATION_MODE" --output-dir macos-cache-diagnostic-evidence
      - name: Verify all source checkouts remain unchanged
        if: always()
        env:
          VALIDATION_WORKFLOW_SHA: ${{ github.sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          python validation-src/scripts/ci/record_native_macos_diagnostic_checkouts.py \
            --baseline baseline-src --candidate candidate-src \
            --phase after --output macos-cache-diagnostic-evidence/aggregate/checkouts-after.json
      - name: Retain aggregate evidence for this diagnostic cohort
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-cache-d104ac3-smoke-${{ matrix.target }}-driver-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            macos-cache-diagnostic-evidence/aggregate/*.json
            macos-cache-diagnostic-evidence/build-metadata.json
          if-no-files-found: warn
          retention-days: 30
