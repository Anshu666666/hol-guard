name: Read-only macOS resolver path diagnostic

on:
  push:
    branches: [codex/rsp-macos-resolver-path-diagnostic]
    paths:
      - '.github/workflows/native-macos-resolver-path.yml'
      - 'scripts/__init__.py'
      - 'scripts/ci/__init__.py'
      - 'scripts/ci/native_macos_resolver_*'
      - 'scripts/ci/native_macos_python_resolver_*'
      - 'scripts/ci/native_macos_dnssd_python_*'
      - 'scripts/ci/native_macos_xcode_selection.py'
      - 'scripts/ci/native_macos_service_identity.py'
      - 'tests/test_native_macos_resolver_*'
      - 'tests/test_native_macos_python_resolver.py'
      - 'tests/test_native_macos_python_resolver_binding.py'
      - 'tests/test_native_macos_dnssd_python*'
      - 'tests/test_native_macos_xcode_selection.py'

permissions:
  contents: read

concurrency:
  group: native-macos-resolver-path-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolver-path:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - name: Initialize retained outcome
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          for name in ('macos-resolver-path-report', 'macos-resolver-path-build'):
              (Path(os.environ['RUNNER_TEMP']) / name).mkdir(mode=0o700)
          report = {'workflow_commit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
                    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'not_run', 'qualification_pass': False}
          output = Path(os.environ['RUNNER_TEMP']) / 'macos-resolver-path-report/job-outcome.json'
          output.write_text(json.dumps(report, sort_keys=True) + '\n')
          PY
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install finite test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Validate finite parser and direct-child controls
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest --noconftest -c /dev/null -q
          tests/test_native_macos_resolver_evidence.py
          tests/test_native_macos_resolver_capture.py
          tests/test_native_macos_resolver_path.py
          tests/test_native_macos_resolver_tool_capture.py
          tests/test_native_macos_python_resolver.py
          tests/test_native_macos_python_resolver_binding.py
          tests/test_native_macos_dnssd_python.py
          tests/test_native_macos_dnssd_python_path.py
          tests/test_native_macos_xcode_selection.py
      - name: Bind actual source, SDK, compiler and Python runtime
        id: prepare
        run: >-
          python -I scripts/ci/native_macos_resolver_path.py --prepare
          --output "$RUNNER_TEMP/macos-resolver-path-report/prepared.json"
      - name: Compile fixed no-fork helper within workflow build boundary
        id: build
        timeout-minutes: 1
        shell: bash
        run: |
          /usr/bin/xcrun --sdk macosx clang -std=c11 -O0 -Wall -Wextra -Werror \
            scripts/ci/native_macos_resolver_probe.c \
            -o "$RUNNER_TEMP/macos-resolver-path-build/resolver-probe" \
            > "$RUNNER_TEMP/macos-resolver-path-build/compiler.stdout" \
            2> "$RUNNER_TEMP/macos-resolver-path-build/compiler.stderr"
      - name: Compare independently bounded lookup controls
        id: lookups
        run: >-
          python -I scripts/ci/native_macos_resolver_path.py
          --prepared "$RUNNER_TEMP/macos-resolver-path-report/prepared.json"
          --binary "$RUNNER_TEMP/macos-resolver-path-build/resolver-probe"
          --output "$RUNNER_TEMP/macos-resolver-path-report/resolver-path.json"
      - name: Require the original report and all original lookup children to finish
        id: python_admission
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: >-
          python -I scripts/ci/native_macos_python_resolver_path.py --admit-original
          --prepared "$RUNNER_TEMP/macos-resolver-path-report/prepared.json"
          --original-report "$RUNNER_TEMP/macos-resolver-path-report/resolver-path.json"
          --output "$RUNNER_TEMP/macos-resolver-path-report/python-admission.json"
      - name: Compile the source-identical C calls as a Python-loadable library
        id: bridge
        if: ${{ always() && steps.python_admission.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: |
          /usr/bin/xcrun --sdk macosx clang -std=c11 -O0 -Wall -Wextra -Werror -dynamiclib \
            scripts/ci/native_macos_python_resolver_bridge.c \
            -o "$RUNNER_TEMP/macos-resolver-path-build/resolver-bridge.dylib" \
            > "$RUNNER_TEMP/macos-resolver-path-build/bridge.stdout" \
            2> "$RUNNER_TEMP/macos-resolver-path-build/bridge.stderr"
      - name: Compare fixed Python calls with C calls in the same Python runtime
        id: python_lookups
        if: ${{ always() && steps.bridge.outcome == 'success' }}
        run: >-
          python -I scripts/ci/native_macos_python_resolver_path.py
          --prepared "$RUNNER_TEMP/macos-resolver-path-report/prepared.json"
          --original-report "$RUNNER_TEMP/macos-resolver-path-report/resolver-path.json"
          --bridge "$RUNNER_TEMP/macos-resolver-path-build/resolver-bridge.dylib"
          --output "$RUNNER_TEMP/macos-resolver-path-report/python-resolver-path.json"
      - name: Require both preceding reports and all nine lookup children to finish
        id: dnssd_admission
        if: ${{ always() && steps.bridge.outcome == 'success' }}
        run: >-
          python -I scripts/ci/native_macos_dnssd_python_path.py --admit-previous
          --prepared "$RUNNER_TEMP/macos-resolver-path-report/prepared.json"
          --original-report "$RUNNER_TEMP/macos-resolver-path-report/resolver-path.json"
          --python-report "$RUNNER_TEMP/macos-resolver-path-report/python-resolver-path.json"
          --output "$RUNNER_TEMP/macos-resolver-path-report/dnssd-admission.json"
      - name: Compile the unchanged DNS-SD queries as a separate Python-loadable library
        id: dnssd_bridge
        if: ${{ always() && steps.dnssd_admission.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: |
          /usr/bin/xcrun --sdk macosx clang -std=c11 -O0 -Wall -Wextra -Werror -dynamiclib \
            scripts/ci/native_macos_dnssd_python_bridge.c \
            -o "$RUNNER_TEMP/macos-resolver-path-build/dnssd-bridge.dylib" \
            > "$RUNNER_TEMP/macos-resolver-path-build/dnssd-bridge.stdout" \
            2> "$RUNNER_TEMP/macos-resolver-path-build/dnssd-bridge.stderr"
      - name: Compare the same simple and shared DNS-SD queries within Python
        id: dnssd_lookups
        if: ${{ always() && steps.dnssd_bridge.outcome == 'success' }}
        run: >-
          python -I scripts/ci/native_macos_dnssd_python_path.py
          --prepared "$RUNNER_TEMP/macos-resolver-path-report/prepared.json"
          --original-report "$RUNNER_TEMP/macos-resolver-path-report/resolver-path.json"
          --python-report "$RUNNER_TEMP/macos-resolver-path-report/python-resolver-path.json"
          --bridge "$RUNNER_TEMP/macos-resolver-path-build/dnssd-bridge.dylib"
          --output "$RUNNER_TEMP/macos-resolver-path-report/dnssd-python-path.json"
      - name: Observe Intel developer selection after the original SDK discovery failure
        id: xcode_selection
        if: ${{ always() && matrix.architecture == 'x86_64' && steps.prepare.outcome == 'failure' }}
        timeout-minutes: 1
        run: >-
          python -I scripts/ci/native_macos_xcode_selection.py
          --prepared "$RUNNER_TEMP/macos-resolver-path-report/prepared.json"
          --output "$RUNNER_TEMP/macos-resolver-path-report/xcode-selection.json"
      - name: Retain normalized job outcome after failure
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          LOOKUP_OUTCOME: ${{ steps.lookups.outcome }}
          BRIDGE_OUTCOME: ${{ steps.bridge.outcome }}
          PYTHON_ADMISSION_OUTCOME: ${{ steps.python_admission.outcome }}
          PYTHON_LOOKUP_OUTCOME: ${{ steps.python_lookups.outcome }}
          DNSSD_ADMISSION_OUTCOME: ${{ steps.dnssd_admission.outcome }}
          DNSSD_BRIDGE_OUTCOME: ${{ steps.dnssd_bridge.outcome }}
          DNSSD_LOOKUP_OUTCOME: ${{ steps.dnssd_lookups.outcome }}
          XCODE_SELECTION_OUTCOME: ${{ steps.xcode_selection.outcome }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          output = root / 'macos-resolver-path-report/job-outcome.json'
          report = json.loads(output.read_text())
          report.update(status='finished', build_outcome=os.environ['BUILD_OUTCOME'],
                        lookup_outcome=os.environ['LOOKUP_OUTCOME'],
                        bridge_outcome=os.environ['BRIDGE_OUTCOME'],
                        python_admission_outcome=os.environ['PYTHON_ADMISSION_OUTCOME'],
                        python_lookup_outcome=os.environ['PYTHON_LOOKUP_OUTCOME'],
                        dnssd_admission_outcome=os.environ['DNSSD_ADMISSION_OUTCOME'],
                        dnssd_bridge_outcome=os.environ['DNSSD_BRIDGE_OUTCOME'],
                        dnssd_lookup_outcome=os.environ['DNSSD_LOOKUP_OUTCOME'],
                        xcode_selection_outcome=os.environ['XCODE_SELECTION_OUTCOME'],
                        xcode_selection_boundary='post_failure_one_minute_workflow_step_five_second_direct_command',
                        compiler_boundary='one_minute_workflow_step_no_descendant_certificate',
                        bridge_boundary='one_minute_workflow_step_no_descendant_certificate',
                        dnssd_bridge_boundary='one_minute_workflow_step_no_descendant_certificate',
                        raw_compiler_output_exported=False)
          for channel in ('stdout', 'stderr'):
              source = root / ('macos-resolver-path-build/compiler.' + channel)
              if source.is_file():
                  data = source.read_bytes()
                  report['compiler_' + channel + '_bytes'] = len(data)
                  report['compiler_' + channel + '_sha256'] = hashlib.sha256(data).hexdigest()
                  if channel == 'stderr':
                      report['compiler_source_diagnostics'] = [
                          {'line': int(m[1]), 'column': int(m[2]), 'kind': m[3]}
                          for m in re.finditer(r'native_macos_resolver_probe\.c:(\d+):(\d+): (error|warning):', data.decode('utf-8', errors='replace'))
                      ][:32]
          for channel in ('stdout', 'stderr'):
              source = root / ('macos-resolver-path-build/bridge.' + channel)
              if source.is_file():
                  data = source.read_bytes()
                  report['bridge_' + channel + '_bytes'] = len(data)
                  report['bridge_' + channel + '_sha256'] = hashlib.sha256(data).hexdigest()
                  if channel == 'stderr':
                      report['bridge_source_diagnostics'] = [
                          {'line': int(m[1]), 'column': int(m[2]), 'kind': m[3]}
                          for m in re.finditer(r'native_macos_(?:python_resolver_bridge|resolver_probe)\.c:(\d+):(\d+): (error|warning):', data.decode('utf-8', errors='replace'))
                      ][:32]
          for channel in ('stdout', 'stderr'):
              source = root / ('macos-resolver-path-build/dnssd-bridge.' + channel)
              if source.is_file():
                  data = source.read_bytes()
                  report['dnssd_bridge_' + channel + '_bytes'] = len(data)
                  report['dnssd_bridge_' + channel + '_sha256'] = hashlib.sha256(data).hexdigest()
                  if channel == 'stderr':
                      report['dnssd_bridge_source_diagnostics'] = [
                          {'line': int(m[1]), 'column': int(m[2]), 'kind': m[3]}
                          for m in re.finditer(r'native_macos_(?:dnssd_python_bridge|python_resolver_bridge|resolver_probe)\.c:(\d+):(\d+): (error|warning):', data.decode('utf-8', errors='replace'))
                      ][:32]
          output.write_text(json.dumps(report, sort_keys=True, indent=2) + '\n')
          PY
      - name: Upload normalized reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-resolver-path-${{ matrix.architecture }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-resolver-path-report/*.json
          if-no-files-found: error
          retention-days: 30
