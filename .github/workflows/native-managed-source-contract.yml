              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == "6c6876e4110ca8f1167c7f7d6768c167092ff513"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-policy-reliability-preflight-686-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, "686d2a3c24c39cf55c52fb70b00bcec74becba90"]
          assert git("rev-parse", source + "^{tree}") == "8958b50087fe813e684f0d531ea3b731419b26f7"
          assert git("rev-parse", "686d2a3c24c39cf55c52fb70b00bcec74becba90^{tree}") == "cfd1451d79913a7d927acd15ddc723042e48d68c"
          anchor = "51d5684be15c03b979e145663e110ec5bfdc94ee"
          subprocess.run(["git", "merge-base", "--is-ancestor", anchor, source], check=True)
