name: Required command authority fence regression

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit under test
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-required-command-fence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  required-command-fence:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-required-command-fence-fixed-c73-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before regression
        id: source_guard
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == "81daded331438c69e0164e45d2e959392c696061"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-required-command-fence-fixed-c73-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, "9e371540e5d75656ef0edf09ba2ec950929514a3"]
          assert git("rev-parse", source + "^{tree}") == "a438ca7957156ce1f30ca8edc4f1c1d61e23b384"
          assert git("rev-parse", "9e371540e5d75656ef0edf09ba2ec950929514a3^{tree}") == "e61408f201e57af048020308d23fee0d5d4a634f"
          anchor = "51d5684be15c03b979e145663e110ec5bfdc94ee"
          assert re.fullmatch(r"[0-9a-f]{40}", anchor)
          subprocess.run(["git", "merge-base", "--is-ancestor", anchor, source], check=True)
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, "HEAD") == git("show", "-s", identity, source)
          assert git("show", "-s", identity, source) == git("show", "-s", identity, anchor)
          assert git("diff", "--name-status", "--no-renames", source, "HEAD").splitlines() == [
              "M\t.github/workflows/native-managed-source-contract.yml"
          ]
          pins = [
              ["conftest.py","100644","9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"],
              ["pyproject.toml","100644","876066431cbe958a77a85edddff95a829394cfbc"],
              ["tests/conftest.py","100644","61e6d98609309fac99c9baae50fab5f47229fcde"],
              ["tests/fixtures/guard-command-corpus/known-gaps.json","100644","6c6d7a820fe795252bcfc6d227cbb9f3788b2cb9"],
              ["tests/fixtures/guard-command-corpus/minimal-delta-pairs.json","100644","de808e793ee8f51eb5533850b4a9fbf221e6ba90"],
              ["tests/fixtures/guard-command-corpus/seed-manifest.json","100644","f26cda4652a06f51b412486721e2a615f0abdb98"],
              ["tests/guard_command_corpus.py","100644","ea46044f3d99c58bbdc51b95487b0464abc37a43"],
              ["tests/guard_command_corpus_diagnostics.py","100644","35d6318d3e863e7f8ad33a090328c53a0297664d"],
              ["tests/guard_command_corpus_oracle.py","100644","e3244452563a1a82ecd68aec0bc100ae91ac47ac"],
              ["tests/guard_command_corpus_oracle_adversarial.py","100644","98682a83f649b6b555c3fb69abca01a7bf6d36f1"],
              ["tests/guard_command_corpus_oracle_benign.py","100644","591a8e8f0e2a16c7f1f39f2f199c16a12dedd042"],
              ["tests/guard_command_corpus_oracle_loader.py","100644","62bc1a5a371b3646315f18e0db335f303d74f8de"],
              ["tests/guard_command_corpus_oracle_types.py","100644","b9c7ecb6d8f5ca06c50ac43c66dfb51a4b64b1a7"],
              ["tests/guard_command_corpus_runner.py","100644","2dc19323ea3fd7e4539f12ce770a0218b3c781ed"],
              ["tests/guard_command_decision_diff.py","100644","2150c9eb1da9371966b26cbfd1a8737fbf7e2e64"],
              ["tests/guard_command_decision_diff_runner.py","100644","3ff1e896e0c0b8a32c57988b7f5914b320b66ba3"],
              ["tests/test_guard_command_corpus.py","100644","21e8fec14255c5c367887b9e55d09570f452162e"],
              ["tests/test_guard_command_decision_diff.py","100644","8d5fa7b75cb70bfb607075834adc97e1fd46a717"],
              ["uv.lock","100644","45bf8a2dcf7b1f70c4387508a94348ba54f20022"],
          ]
          pins.extend([
              ["src/codex_plugin_scanner/guard/daemon/hook_worker_native.py","100644","4765e8a50720578698afcb0c936a3405d12a0d14"],
              ["src/codex_plugin_scanner/guard/daemon/hook_native_review_fence.py","100644","7a35bfc21097bfa96e6a560d9796a257669c6280"],
              ["src/codex_plugin_scanner/guard/daemon/hook_availability_policy.py","100644","ebde0f0da886266386cff7a7dd4afd463d7c3458"],
              ["src/codex_plugin_scanner/guard/daemon/hook_policy_authority.py","100644","e901c45aa56f465ddae647fba8c8d510414bb982"],
              ["src/codex_plugin_scanner/guard/daemon/hook_worker_responses.py","100644","414b2c4e077344f2fe64647588e923c9d25789b3"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py","100644","afb888ee46939730c04380142ea550c4b11fa74a"],
              ["src/codex_plugin_scanner/guard/daemon/hook_native_activity.py","100644","558ae4884bd2692d69fb0309810683e349ffa07b"],
              ["tests/test_native_required_command_fence.py","100644","a588effb4c8a27f55b43e7ce0e34e3a0cf058685"],
              [".github/workflows/ci.yml", "100644", "2c7b353bc21952db0adcb05ddcb8363d109e6883"],
              ["tests/fixtures/guard-command-corpus/decision-diff-report.json", "100644", "c88f90e80f9abb4fd00260fec8eef16fddd9950e"],
          ])
          allowed = {"tests/fixtures/guard-command-corpus/decision-diff-report.json"} if os.environ.get("GENERATED_REPORT_ALLOWED") == "1" else set()
          for path, mode, sha in pins:
              assert re.fullmatch(r"[0-9a-f]{40}", sha)
              expected = f"{mode} blob {sha}\t{path}"
              assert git("ls-tree", source, "--", path) == expected
              assert git("ls-tree", "HEAD", "--", path) == expected
              if path not in allowed:
                  assert git("hash-object", "--", path) == sha
          assert git("ls-tree", source, "--", ".github/workflows/native-managed-source-contract.yml") == (
              "100644 blob 5070c514d26e602ded2fe24125aca0d8f838ad77\t.github/workflows/native-managed-source-contract.yml"
          )
          subprocess.run(["git", "diff", "--cached", "--exit-code"], check=True)
          changes = git("diff", "--name-status", "--no-renames", "HEAD").splitlines()
          assert set(changes).issubset({"M\t" + path for path in allowed}), changes
          print(json.dumps({
              "record": "required-command-fence-source-guard",
              "source": source,
              "pins": len(pins),
              "ciUnchanged": True,
              "allowedGeneratedChanges": len(changes),
          }, sort_keys=True))
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Run required command authority fence regression
        id: fence_tests
        run: |
          uv run --no-sync python -m pytest -q --tb=short tests/test_native_required_command_fence.py \
            --junitxml="$RUNNER_TEMP/required-command-fence-${{ matrix.python }}.xml"
      - name: Record actual regression outcomes
        if: ${{ always() && steps.source_guard.outcome == 'success' }}
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ["RUNNER_TEMP"]) / ("required-command-fence-" + os.environ["MATRIX_PYTHON"] + ".xml")
          root = ET.parse(report).getroot()
          cases = list(root.iter('testcase'))
          results = []
          for case in cases:
              failures = list(case.findall('failure'))
              errors = list(case.findall('error'))
              skipped = list(case.findall('skipped'))
              results.append({
                  "name": case.get("name"), "classname": case.get("classname"),
                  "outcome": "failure" if failures else "error" if errors else "skipped" if skipped else "pass",
                  "messages": [node.get("message", "") for node in failures + errors + skipped],
              })
          print(json.dumps({"record": "required-command-fence-outcomes", "source": os.environ["EXPECTED_SOURCE_COMMIT"],
                            "python": os.environ["MATRIX_PYTHON"], "cases": results}, sort_keys=True))
          PY
