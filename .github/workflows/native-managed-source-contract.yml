      - "src/codex_plugin_scanner/guard/mdm/policy_composition.py"
      - "src/codex_plugin_scanner/guard/native_managed_capture.py"
      - "src/codex_plugin_scanner/guard/native_managed_configuration.py"
      - "src/codex_plugin_scanner/guard/native_policy_authority_contract.py"
      - "src/codex_plugin_scanner/guard/native_policy_authority_decode.py"
      - "src/codex_plugin_scanner/guard/native_policy_snapshot_contract.py"
