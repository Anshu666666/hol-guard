      - "tests/test_native_sensitive_read_mixed_origin_vectors.py"
      - "tests/test_native_sensitive_read_policy_vectors.py"
      - "tests/test_native_sensitive_read_runtime_policy.py"
      - "tests/test_native_sensitive_read_sources.py"
      - "src/codex_plugin_scanner/guard/native_scoped_result.py"
      - "src/codex_plugin_scanner/guard/native_hook_edge.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_worker_native.py"
      - "src/codex_plugin_scanner/guard/daemon/hook_worker_responses.py"
      - "tests/test_native_defaults_edge.py"
      - "tests/test_native_scoped_worker_fence.py"
      - "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py"
      - "src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py"
      - "tests/test_native_policy_source_selection.py"
      - "src/codex_plugin_scanner/guard/native_policy_application.py"
      - "src/codex_plugin_scanner/guard/policy_canonical_rollout.py"
      - "src/codex_plugin_scanner/guard/runtime/policy_runtime_posture.py"
      - "tests/test_current_native_policy_posture.py"
      - "tests/test_native_managed_cache_publication.py"
      - "src/codex_plugin_scanner/guard/native_policy_snapshot_v3_renewal.py"
      - "tests/test_native_source_free_renewal.py"
      - "tests/test_native_policy_snapshot_v3_publisher.py"
      - "tests/test_native_policy_snapshot_publisher.py"
      - "tests/test_native_policy_snapshot_persistence.py"
      - "tests/test_policy_sync_truth.py"
      - "tests/test_policy_bundle_validity_and_rollout.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-managed-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Lint and typecheck the actual source closure
        run: |
          source_paths="$(uv run --no-sync python -c 'import json; print("\n".join(json.load(open("basedpyright.native-managed-source.json"))["include"]))')"
          mapfile -t source_roots <<< "$source_paths"
          uv run --no-sync ruff check "${source_roots[@]}"
          uv run --no-sync ruff format --check "${source_roots[@]}"
          uv run --no-sync basedpyright --pythonpath .venv/bin/python --pythonversion ${{ matrix.python }} --project basedpyright.native-managed-source.json
          uv run --no-sync python -c "from codex_plugin_scanner.guard import native_policy_authority_managed, native_policy_authority_read, native_policy_authority_sources"
      - name: Verify signed and local source reconstruction
        run: |
          uv run --no-sync pytest -q tests/test_native_policy_authority_managed_read.py tests/test_native_policy_authority_compile.py tests/test_native_policy_authority_exact_sources.py tests/test_native_policy_authority_orphan_sources.py tests/test_native_policy_authority_read.py tests/test_native_policy_snapshot_v4_barrier.py tests/test_native_managed_catalog_capability.py tests/test_runtime_lane_session_observation.py tests/test_native_approval_envelope_identity.py tests/test_native_approval_session_detachment.py tests/test_native_approval_v4_transport.py tests/test_native_typed_artifact_sources.py tests/test_native_scoped_alias_sources.py tests/test_guard_native_runtime.py tests/test_native_policy_authority_expressions.py tests/test_native_policy_authority_command_source.py tests/test_native_command_row_association.py tests/test_policy_command_projection.py tests/test_native_command_expression.py tests/test_native_policy_snapshot_v4_contract.py tests/test_native_policy_snapshot_v4_publication.py tests/test_policy_bundle_materialization_publication.py tests/test_policy_bundle_source_materialization.py tests/test_native_expression_policy_resident.py::test_expression_resident_source_preflight_is_signed_complete_and_expiry_bound
      - name: Verify ordinary staging and native acknowledgement fences
        run: uv run --no-sync pytest -q tests/test_native_policy_bundle_ack.py tests/test_generic_policy_native_application.py tests/test_policy_bundle_sync_outcomes.py tests/test_policy_bundle_v2_runtime_admission.py tests/test_native_policy_config_mutation.py tests/test_policy_bundle_staging.py tests/test_policy_bundle_v2.py tests/test_canonical_policy_row_authority.py tests/test_guard_settings_sync_preservation.py tests/test_native_policy_row_sort.py tests/test_native_expression_sync.py tests/test_native_expression_policy_resident.py::test_expression_resident_baseline_config_is_explicit_and_retains_risk_floors tests/test_native_expression_sync_resident.py::test_signed_sync_fixture_leaves_target_policy_unstaged
      - name: Verify sensitive reads and independent configuration origins
        run: uv run --no-sync pytest -q tests/test_managed_action_origin.py tests/test_managed_action_representation.py tests/test_managed_local_origin.py tests/test_native_managed_capture.py tests/test_native_managed_configuration.py tests/test_native_managed_configuration_wire.py tests/test_native_sensitive_read_managed_floors.py tests/test_native_sensitive_read_mixed_origin_vectors.py tests/test_native_sensitive_read_policy_vectors.py tests/test_native_sensitive_read_runtime_policy.py tests/test_native_sensitive_read_sources.py tests/test_guard_mdm_policy.py tests/test_guard_protection_posture.py tests/test_guard_approval_context.py
      - name: Verify complete source selection and hook response fences
        run: uv run --no-sync pytest -q tests/test_native_policy_source_selection.py tests/test_native_defaults_edge.py tests/test_native_scoped_worker_fence.py tests/test_hook_worker_native_post_tool_watch.py
      - name: Verify configured selection and current native application
        run: uv run --no-sync pytest -q tests/test_native_managed_cache_publication.py tests/test_current_native_policy_posture.py tests/test_policy_sync_truth.py tests/test_policy_bundle_validity_and_rollout.py
      - name: Verify source-free lease renewal and resident transitions
        run: uv run --no-sync pytest -q tests/test_native_source_free_renewal.py tests/test_native_policy_snapshot_v3_publisher.py
      - name: Preserve authority and I/O ownership
        run: |
          uv run --no-sync python scripts/ci/rust_authority_ownership_gate.py --root .
          uv run --no-sync python scripts/ci/rust_io_ownership_gate.py --root .
