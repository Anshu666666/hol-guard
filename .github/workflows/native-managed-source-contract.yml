          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == SOURCE
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-initial-retry-priority-f064-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", head).split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, BASE]
          assert git("rev-list", "--parents", "-n", "1", BASE).split() == [
              BASE, "88dd45eae28bc1b7710f96c93d9f3178b700766d"
          ]
          assert git("rev-parse", source + "^{tree}") == SOURCE_TREE
          assert git("rev-parse", BASE + "^{tree}") == BASE_TREE
          assert git("diff", "--name-status", "--no-renames", BASE, source).splitlines() == ["A\t" + TEST]
          assert git("diff", "--name-status", "--no-renames", source, head).splitlines() == ["A\t" + WORKFLOW]
          assert git("ls-tree", BASE, "--", TEST) == ""
          assert git("ls-tree", source, "--", WORKFLOW) == ""
          anchor = "51d5684be15c03b979e145663e110ec5bfdc94ee"
