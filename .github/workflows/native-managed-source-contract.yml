name: Diagnose current authority baseline

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact test-only source commit
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-authority-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-refresh-shared-reader-baseline-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact test-only source before execution
        id: source_guard
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess

          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()

          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == "c9aa05547b7d1a6058955c72950d1c42b19fe561"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-refresh-shared-reader-baseline-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [head, source]
          parent = "36c15f07d47cc431bd69884a62028b58a7408628"
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, parent]
          assert git("rev-parse", source + "^{tree}") == "a18df41b0d68eb332bc201f1919c5f7e4b06aea9"
          assert git("rev-parse", parent + "^{tree}") == "00da983ef0b708f39243fa06c6200fcf609b8a60"
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, "HEAD") == git("show", "-s", identity, source)
          tests = {
              "tests/test_daemon_extension_control_refresh_leases.py",
              "tests/test_native_policy_snapshot_default_capture_worker.py",
          }
          workflow = ".github/workflows/native-managed-source-contract.yml"
          assert set(git("diff", "--name-status", "--no-renames", parent, source).splitlines()) == {
              "A\t" + path for path in tests
          }
          for path in tests:
              assert git("ls-tree", parent, "--", path) == ""
          assert git("diff", "--name-status", "--no-renames", source, "HEAD").splitlines() == ["A\t" + workflow]
          assert git("ls-tree", source, "--", workflow) == ""
          assert git("ls-tree", parent, "--", workflow) == ""
          pins = [
              [".github/workflows/ci.yml","100644","2c7b353bc21952db0adcb05ddcb8363d109e6883"],
              ["ci/native_runtime/probe_installed_native_extensions.py","100644","aa1d544ba1569e49b1dd2554f43faf7a90c0f246"],
              ["conftest.py","100644","9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"],
              ["pyproject.toml","100644","876066431cbe958a77a85edddff95a829394cfbc"],
              ["rust/crates/guard-runtime/src/policy_store_command_authority.rs","100644","3a0c76fa872b48137dd1cda0780cf9328b07cf6b"],
              ["src/codex_plugin_scanner/guard/daemon/server.py","100644","2792f7cf919da55d02435b8fb3295ae2d514a6f5"],
              ["src/codex_plugin_scanner/guard/native_command_control_authority_io.py","100644","2cac3afea3edde0ae906c83668c20fda99636c74"],
              ["src/codex_plugin_scanner/guard/native_command_control_authority_store.py","100644","49a7b169419838bf60c84e4d17a94c0dc6befea0"],
              ["src/codex_plugin_scanner/guard/native_command_control_authority.py","100644","7f7aa8dd4d27931b8cce50a748a9b4eed4f16e61"],
              ["src/codex_plugin_scanner/guard/native_policy_authority_managed.py","100644","0db51ba94840286f266c8459088b05b68bba9cfc"],
              ["src/codex_plugin_scanner/guard/native_policy_authority_read.py","100644","daed1462f4494ef49d523333c4c7236126ea6969"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py","100644","afb888ee46939730c04380142ea550c4b11fa74a"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_generation.py","100644","d132b361c3b718deb5cf3bbee34af03893dbba07"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py","100644","2037838cc13a03c807038d64c4c0752e02c2bb3a"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_inputs.py","100644","3d1282e0fb0d187d76a5a454097bd08c3290a310"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_scheduling.py","100644","0a500224add718d93aa989258125a35790746400"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_transport.py","100644","5cb393fba684873addfcaa97e4342a404fb317c0"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","100644","753417df5724a88db5359aa58236981f87ddd88e"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_source_requirement.py","100644","417c3066e8e413eecab52d9e989b01e37854baaa"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_storage.py","100644","e68f5a3f534f9677a05b8590d3fd4e74f2b1d092"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_v3_renewal.py","100644","65df0c5b6da3cfa19856cc3a7423c6bc0feb71d6"],
              ["src/codex_plugin_scanner/guard/runtime/extension_control_runtime.py","100644","618e4d87b771afd475fe91912352025def78ca3d"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority_schema.py","100644","99d1a5dd9d62f4ace3d241a09b0dfbc1c8a53e40"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority_support.py","100644","92584abb06e39e636a7d59b9354aaa80cb995431"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority_transitions.py","100644","ce13704ebbe013f41022b53faa37bdd25042f6e7"],
              ["src/codex_plugin_scanner/guard/store_extension_control_authority.py","100644","e8087b79e944bce60e15d399db174686360ffa7d"],
              ["src/codex_plugin_scanner/guard/store_sync_payload_mutations.py","100644","4cba562fb67a2fe20ee741cd0ec8b903efef02d8"],
              ["tests/conftest.py","100644","61e6d98609309fac99c9baae50fab5f47229fcde"],
              ["tests/native_policy_snapshot_test_fixtures.py","100644","831e1e9dfa438241720a973fa6308bfaaa7093a5"],
              ["tests/test_daemon_extension_control_refresh_leases.py","100644","3141cae08877a1b2fa6fdf37c2026ca575615ead"],
              ["tests/test_guard_extension_control_authority.py","100644","dd62103f2d9267cc29fa32fb44929a031a701092"],
              ["tests/test_native_policy_authority_read.py","100644","afcb4618f05b0b987b9fa685b44f6609d71110db"],
              ["tests/test_native_policy_snapshot_capture_retry.py","100644","915b648d205aa205b7e6b303f37e504bd6b6f193"],
              ["tests/test_native_policy_snapshot_default_capture_worker.py","100644","447531327220b05b8ae0d995fbe41cbd64187149"],
              ["tests/test_native_policy_snapshot_publisher.py","100644","c4ad2122cc3aa021ee9ae836f119e2c24bc12ad6"],
              ["tests/test_native_policy_snapshot_reservation_capture.py","100644","a663d5014bc62822c0c86d970b0ce056f4e97cd3"],
              ["uv.lock","100644","45bf8a2dcf7b1f70c4387508a94348ba54f20022"],
          ]
          for path, mode, sha in pins:
              assert re.fullmatch(r"[0-9a-f]{40}", sha)
              expected = f"{mode} blob {sha}\t{path}"
              assert git("ls-tree", source, "--", path) == expected
              assert git("ls-tree", "HEAD", "--", path) == expected
              assert git("hash-object", "--", path) == sha
              if path not in tests:
                  assert git("ls-tree", parent, "--", path) == expected
          assert len(git("ls-tree", "-r", "--name-only", parent).splitlines()) == 4433
          assert len(git("ls-tree", "-r", "--name-only", source).splitlines()) == 4435
          assert len(git("ls-tree", "-r", "--name-only", "HEAD").splitlines()) == 4436
          subprocess.run(["git", "diff", "--cached", "--exit-code"], check=True)
          subprocess.run(["git", "diff", "--exit-code", "HEAD"], check=True)
          print(json.dumps({
              "record": "native-baseline-source-guard",
              "source": source,
              "pins": len(pins),
              "testOnlySource": True,
              "workflowOnlyDiagnostic": True,
              "productionUnchanged": True,
          }, sort_keys=True))
