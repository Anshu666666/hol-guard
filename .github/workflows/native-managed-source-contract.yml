      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Run the complete four-case ordering regression
        id: initial_retry_tests
        run: |
          uv run --no-sync python -m pytest -q --tb=short -o addopts=--strict-markers \
            tests/test_native_policy_initial_retry_priority.py \
            --junitxml="$RUNNER_TEMP/initial-retry-priority-${{ matrix.python }}.xml"
      - name: Record exact baseline outcomes
        if: ${{ always() && steps.source_guard.outcome == 'success' && (steps.initial_retry_tests.outcome == 'success' || steps.initial_retry_tests.outcome == 'failure') }}
        run: |
          python -I - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          
          report = Path(os.environ["RUNNER_TEMP"]) / ("initial-retry-priority-" + os.environ["MATRIX_PYTHON"] + ".xml")
          assert report.is_file() and not report.is_symlink()
          assert report.stat().st_size <= 2 * 1024 * 1024
          root = ET.parse(report).getroot()
          cases = list(root.iter("testcase"))
          classname = "tests.test_native_policy_initial_retry_priority"
          prefix = "test_due_retry_preserves_fresh_authority_and_following_observation"
          parameters = ["steady", "configuration", "unsigned-source", "new-request"]
          expected = Counter((classname, prefix + "[" + value + "]") for value in parameters)
          actual = Counter((case.get("classname"), case.get("name")) for case in cases)
          rows = []
          for case in cases:
              tags = {tag: len(case.findall(tag)) for tag in ("failure", "error", "skipped")}
              rows.append({"classname": case.get("classname"), "name": case.get("name"),
                           "status": "pass" if not any(tags.values()) else "nonpass", **tags})
          steady = [case for case in cases if case.get("name") == prefix + "[steady]"]
          controls = [case for case in cases if case.get("name") != prefix + "[steady]"]
          identity_ok = actual == expected
          no_errors_or_skips = not list(root.iter("error")) and not list(root.iter("skipped"))
          control_passes = len(controls) == 3 and all(
              not any(case.findall(tag) for tag in ("failure", "error", "skipped")) for case in controls
          )
          failures = list(root.iter("failure"))
          steady_failures = [] if len(steady) != 1 else steady[0].findall("failure")
          location_ok = False
          predicate_ok = False
          if len(steady_failures) == 1:
              failure = steady_failures[0]
              body = failure.text or ""
              location_ok = bool(re.search(
                  r"(?m)^tests/test_native_policy_initial_retry_priority\.py:196:(?: in | AssertionError)", body
              ))
              predicate_ok = (
                  "due retry performed duplicate observation before fresh publication" in body
                  and "due retry performed duplicate observation before fresh publication" in failure.get("message", "")
              )
          meaningful_red = identity_ok and no_errors_or_skips and control_passes and (
              len(failures) == 1 and len(steady_failures) == 1 and location_ok and predicate_ok
          )
          print(json.dumps({"record": "initial-retry-priority-outcomes",
                            "source": os.environ["EXPECTED_SOURCE_COMMIT"],
                            "python": os.environ["MATRIX_PYTHON"], "count": len(cases), "cases": rows,
                            "exactIdentities": identity_ok, "noErrorsOrSkips": no_errors_or_skips,
                            "threeControlsPassed": control_passes, "exactOrderingLocation": location_ok,
                            "exactOrderingPredicate": predicate_ok, "meaningfulBaselineRed": meaningful_red}, sort_keys=True))
          assert identity_ok, "unexpected JUnit identities"
          assert no_errors_or_skips, "errors or skipped cases are not ordering evidence"
          assert control_passes, "the three authority controls must pass"
          assert meaningful_red, "expected ordering assertion was not established"
          PY
      - name: Check the new test source
        if: ${{ always() && steps.source_guard.outcome == 'success' && (steps.initial_retry_tests.outcome == 'success' || steps.initial_retry_tests.outcome == 'failure') }}
        run: uv run --no-sync ruff check tests/test_native_policy_initial_retry_priority.py
      - name: Check the new test formatting
