name: Generate and validate current decision report

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact final source commit
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-decision-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decision-report:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-decision-report-6c-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify final source before report generation
        id: source_guard
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == "6c6876e4110ca8f1167c7f7d6768c167092ff513"
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-decision-report-6c-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", "HEAD").split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, "686d2a3c24c39cf55c52fb70b00bcec74becba90"]
          assert git("rev-parse", source + "^{tree}") == "8958b50087fe813e684f0d531ea3b731419b26f7"
          assert git("rev-parse", "686d2a3c24c39cf55c52fb70b00bcec74becba90^{tree}") == "cfd1451d79913a7d927acd15ddc723042e48d68c"
          anchor = "51d5684be15c03b979e145663e110ec5bfdc94ee"
          assert re.fullmatch(r"[0-9a-f]{40}", anchor)
          subprocess.run(["git", "merge-base", "--is-ancestor", anchor, source], check=True)
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, "HEAD") == git("show", "-s", identity, source)
          assert git("show", "-s", identity, source) == git("show", "-s", identity, anchor)
          assert git("diff", "--name-status", "--no-renames", source, "HEAD").splitlines() == [
              "M\t.github/workflows/native-managed-source-contract.yml"
          ]
          pins = [
              ["conftest.py","100644","9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"],
              ["pyproject.toml","100644","876066431cbe958a77a85edddff95a829394cfbc"],
              ["tests/conftest.py","100644","61e6d98609309fac99c9baae50fab5f47229fcde"],
              ["tests/fixtures/guard-command-corpus/known-gaps.json","100644","6c6d7a820fe795252bcfc6d227cbb9f3788b2cb9"],
              ["tests/fixtures/guard-command-corpus/minimal-delta-pairs.json","100644","de808e793ee8f51eb5533850b4a9fbf221e6ba90"],
              ["tests/fixtures/guard-command-corpus/seed-manifest.json","100644","f26cda4652a06f51b412486721e2a615f0abdb98"],
              ["tests/guard_command_corpus.py","100644","ea46044f3d99c58bbdc51b95487b0464abc37a43"],
              ["tests/guard_command_corpus_diagnostics.py","100644","35d6318d3e863e7f8ad33a090328c53a0297664d"],
              ["tests/guard_command_corpus_oracle.py","100644","e3244452563a1a82ecd68aec0bc100ae91ac47ac"],
              ["tests/guard_command_corpus_oracle_adversarial.py","100644","98682a83f649b6b555c3fb69abca01a7bf6d36f1"],
              ["tests/guard_command_corpus_oracle_benign.py","100644","591a8e8f0e2a16c7f1f39f2f199c16a12dedd042"],
              ["tests/guard_command_corpus_oracle_loader.py","100644","62bc1a5a371b3646315f18e0db335f303d74f8de"],
              ["tests/guard_command_corpus_oracle_types.py","100644","b9c7ecb6d8f5ca06c50ac43c66dfb51a4b64b1a7"],
              ["tests/guard_command_corpus_runner.py","100644","2dc19323ea3fd7e4539f12ce770a0218b3c781ed"],
              ["tests/guard_command_decision_diff.py","100644","2150c9eb1da9371966b26cbfd1a8737fbf7e2e64"],
              ["tests/guard_command_decision_diff_runner.py","100644","3ff1e896e0c0b8a32c57988b7f5914b320b66ba3"],
              ["tests/test_guard_command_corpus.py","100644","21e8fec14255c5c367887b9e55d09570f452162e"],
              ["tests/test_guard_command_decision_diff.py","100644","8d5fa7b75cb70bfb607075834adc97e1fd46a717"],
              ["uv.lock","100644","45bf8a2dcf7b1f70c4387508a94348ba54f20022"],
          ]
          pins.extend([
              [".github/workflows/ci.yml", "100644", "2c7b353bc21952db0adcb05ddcb8363d109e6883"],
              ["tests/fixtures/guard-command-corpus/decision-diff-report.json", "100644", "c88f90e80f9abb4fd00260fec8eef16fddd9950e"],
          ])
          allowed = {"tests/fixtures/guard-command-corpus/decision-diff-report.json"} if os.environ.get("GENERATED_REPORT_ALLOWED") == "1" else set()
          for path, mode, sha in pins:
              assert re.fullmatch(r"[0-9a-f]{40}", sha)
              expected = f"{mode} blob {sha}\t{path}"
              assert git("ls-tree", source, "--", path) == expected
              assert git("ls-tree", "HEAD", "--", path) == expected
              if path not in allowed:
                  assert git("hash-object", "--", path) == sha
          assert git("ls-tree", source, "--", ".github/workflows/native-managed-source-contract.yml") == (
              "100644 blob 414e6f90a82e09d5625ad54a8569d20c90640b6d\t.github/workflows/native-managed-source-contract.yml"
          )
          subprocess.run(["git", "diff", "--cached", "--exit-code"], check=True)
          changes = git("diff", "--name-status", "--no-renames", "HEAD").splitlines()
          assert set(changes).issubset({"M\t" + path for path in allowed}), changes
          print(json.dumps({
              "record": "decision-report-source-guard",
              "source": source,
              "pins": len(pins),
              "ciUnchanged": True,
              "allowedGeneratedChanges": len(changes),
          }, sort_keys=True))
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Generate report with the existing complete evaluator
        id: generation
        run: uv run --no-sync python tests/guard_command_decision_diff.py --write
      - name: Check actual generated report with the existing evaluator
        run: uv run --no-sync python tests/guard_command_decision_diff.py --check
      - name: Run unchanged decision report contracts
        id: report_tests
        run: |
          uv run --no-sync python -m pytest -q --tb=short tests/test_guard_command_decision_diff.py \
            --junitxml="$RUNNER_TEMP/decision-report-${{ matrix.python }}.xml"
      - name: Report all six original report contract outcomes
        if: ${{ always() && steps.report_tests.outcome != 'skipped' }}
        run: |
          uv run --no-sync python - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          path = Path(os.environ["RUNNER_TEMP"]) / ("decision-report-" + os.environ["MATRIX_PYTHON"] + ".xml")
          root = ET.parse(path).getroot()
          cases = list(root.iter("testcase"))
          expected = Counter(
              ("tests.test_guard_command_decision_diff", name)
              for name in ["test_decision_diff_import_does_not_shadow_scanner_package_exports","test_decision_diff_import_restores_preloaded_package_bindings","test_report_is_exactly_reproducible_and_source_bound","test_report_reconciles_every_case_without_lowering_or_widening_gaps","test_report_contains_only_privacy_safe_deterministic_evidence","test_fresh_process_report_is_environment_independent_and_bounded"]
          )
          actual = Counter((case.attrib.get("classname"), case.attrib.get("name")) for case in cases)
          all_tags = []
          for case in cases:
              tags = [tag for tag in ("failure", "error", "skipped") if case.find(tag) is not None]
              all_tags.extend(tags)
              print(json.dumps({
                  "record": "decision-report-test",
                  "classname": case.attrib.get("classname"),
                  "name": case.attrib.get("name"),
                  "tags": tags,
                  "pytestSeconds": case.attrib.get("time"),
              }, sort_keys=True))
          assert actual == expected, (actual, expected)
          assert not all_tags
          assert not list(root.iter("skipped"))
          assert not list(root.iter("failure"))
          assert not list(root.iter("error"))
          print(json.dumps({"record": "decision-report-tests", "passed": len(cases)}, sort_keys=True))
          PY
      - name: Validate source-only differences and emit complete generated bytes
        run: |
          uv run --no-sync python - <<'PY'
          import base64
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          
          from tests import guard_command_decision_diff as generator
          
          SOURCE = "6c6876e4110ca8f1167c7f7d6768c167092ff513"
          REPORT = "tests/fixtures/guard-command-corpus/decision-diff-report.json"
          EXPECTED_BEFORE = "c88f90e80f9abb4fd00260fec8eef16fddd9950e"
          
          def git_bytes(*arguments):
              return subprocess.check_output(["git", *arguments])
          
          def blob_sha(raw):
              return hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()
          
          before = git_bytes("show", SOURCE + ":" + REPORT)
          assert blob_sha(before) == EXPECTED_BEFORE
          metadata = Path(REPORT).lstat()
          assert stat.S_ISREG(metadata.st_mode) and not Path(REPORT).is_symlink()
          assert metadata.st_mode & 0o111 == 0
          raw = Path(REPORT).read_bytes()
          assert 0 < len(raw) <= 262144
          report = json.loads(raw)
          original = json.loads(before)
          assert raw == generator.canonical_json_bytes(report)
          def without_source_bindings(value):
              result = copy.deepcopy(value)
              assert isinstance(result["bindings"]["sources_sha256"], dict)
              del result["bindings"]["sources_sha256"]
              return result
          assert without_source_bindings(report) == without_source_bindings(original)
          bindings = report["bindings"]["sources_sha256"]
          assert bindings == generator._source_bindings()
          repository = generator.REPO_ROOT.resolve()
          assert generator.REPORT_PATH.resolve() == (repository / REPORT).resolve()
          tracked = {}
          for record in git_bytes("ls-tree", "-r", "-z", SOURCE).split(b"\0"):
              if record:
                  attributes, name = record.split(b"\t", 1)
                  mode, kind, sha = attributes.decode("ascii").split()
                  tracked[name.decode("utf-8")] = (mode, kind, sha)
          selected = sorted({path.resolve() for path in generator._EVIDENCE_SOURCE_PATHS})
          selected_ids = set()
          for path in selected:
              relative = path.relative_to(repository).as_posix()
              mode, kind, sha = tracked[relative]
              assert mode == "100644" and kind == "blob"
              source_bytes = path.read_bytes()
              assert blob_sha(source_bytes) == sha
              key = generator.source_binding_id(relative)
              assert key not in selected_ids
              selected_ids.add(key)
              assert bindings[key] == hashlib.sha256(source_bytes).hexdigest()
          assert set(bindings) == selected_ids
          assert report["corpus"]["total_count"] == 51000
          assert report["current_vs_proposed"]["lowered_count"] == 0
          assert report["current_vs_proposed"]["disposition_changed_count"] == 0
          assert report["legacy_to_current"]["lowered_count"] == 0
          assert report["oracle_reconciliation"]["known_gap_equality"] is True
          assert report["oracle_reconciliation"]["unreconciled_count"] == 0
          assert report["privacy"] == {
              "case_material": "opaque-case-identifiers-only",
              "commands_included": False,
              "local_paths_included": False,
              "resource_measurements_included": False,
          }
          changes = git_bytes("diff", "--name-status", "--no-renames", "HEAD").decode().splitlines()
          assert changes == (["M\t" + REPORT] if raw != before else [])
          subprocess.run(["git", "diff", "--cached", "--exit-code"], check=True)
          encoded = base64.b64encode(raw).decode("ascii")
          chunks = [encoded[offset:offset + 4096] for offset in range(0, len(encoded), 4096)]
          after = blob_sha(raw)
          print(json.dumps({
              "record": "generated-decision-report",
              "source": SOURCE,
              "python": os.environ["MATRIX_PYTHON"],
              "path": REPORT,
              "before": EXPECTED_BEFORE,
              "after": after,
              "sha256": hashlib.sha256(raw).hexdigest(),
              "framedSha256": generator.report_framed_sha256(report),
              "bytes": len(raw),
              "mode": "100644",
              "sourceBindings": len(bindings),
              "corpusCases": report["corpus"]["total_count"],
              "changed": raw != before,
              "chunkCount": len(chunks),
              "sourceBindingsOnly": True,
              "allOtherTrackedFilesUnchanged": True,
              "commitAttestationCreated": False,
          }, sort_keys=True))
          for index, chunk in enumerate(chunks):
              print(json.dumps({
                  "record": "generated-decision-report-chunk",
                  "path": REPORT,
                  "after": after,
                  "index": index,
                  "count": len(chunks),
                  "base64": chunk,
              }, sort_keys=True))
          PY
      - name: Verify final source after report validation
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          GENERATED_REPORT_ALLOWED: "1"
        run: |
          python -I - <<'PY'
