      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Prepare an owned interpreter for installation fixtures
        run: |
          python -I - <<'PY'
          import pathlib
          import venv

          environment = pathlib.Path(".venv")
          assert not environment.exists() and not environment.is_symlink()
          venv.EnvBuilder(with_pip=False, symlinks=False).create(environment)
          PY
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Verify installation fixture interpreter provenance
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys

          selected = pathlib.Path(sys.executable).resolve(strict=True)
          expected = hashlib.sha256(selected.read_bytes()).hexdigest()
          environment = pathlib.Path(".venv").resolve(strict=True)
          interpreters = ("python", "python3", f"python{sys.version_info.major}.{sys.version_info.minor}")
          for name in interpreters:
              interpreter = environment / "bin" / name
              metadata = interpreter.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not interpreter.is_symlink()
              assert metadata.st_uid == os.getuid()
              assert metadata.st_mode & 0o022 == 0 and metadata.st_mode & stat.S_IXUSR
              assert hashlib.sha256(interpreter.read_bytes()).hexdigest() == expected
          probe = subprocess.check_output(
              [str(environment / "bin/python"), "-I", "-c",
               "import json,sys; print(json.dumps([sys.prefix, list(sys.version_info[:3])]))"],
              text=True,
          )
          prefix, version = json.loads(probe)
          assert pathlib.Path(prefix).resolve(strict=True) == environment
          assert version == list(sys.version_info[:3])
          print(json.dumps({"ownedInterpreterVerified": True, "version": version, "sha256": expected}))
          PY
      - name: Run complete refresh and signed mutation controls
        id: refresh_tests
        run: |
          uv run --no-sync python -m pytest -q --tb=short --strict-markers -o addopts= \
            tests/test_daemon_extension_control_refresh_leases.py \
            --junitxml="$RUNNER_TEMP/refresh-lease-${{ matrix.python }}.xml"
      - name: Run complete default capture characterization
        id: capture_tests
        if: ${{ always() && steps.refresh_tests.outcome != 'skipped' }}
        run: |
          uv run --no-sync python -m pytest -q --tb=short --strict-markers -o addopts= \
            tests/test_native_policy_snapshot_default_capture_worker.py \
            --junitxml="$RUNNER_TEMP/default-capture-${{ matrix.python }}.xml"
      - name: Report exact refresh baseline outcomes
        if: ${{ always() && steps.refresh_tests.outcome != 'skipped' }}
        run: |
          python -I - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          report = Path(os.environ["RUNNER_TEMP"]) / ("refresh-lease-" + os.environ["MATRIX_PYTHON"] + ".xml")
          root = ET.parse(report).getroot()
          cases = list(root.iter("testcase"))
          module = "tests.test_daemon_extension_control_refresh_leases"
          positive = "test_unchanged_daemon_refresh_admits_independent_native_reader"
          control = "test_signed_control_mutation_still_excludes_independent_native_reader"
          expected = Counter((module, name) for name in (positive, control))
          actual = Counter((case.get("classname"), case.get("name")) for case in cases)
          observed = {}
          for case in cases:
              name = case.get("name")
              known = case.get("classname") == module and name in (positive, control)
              tags = [tag for tag in ("failure", "error", "skipped") for _ in case.findall(tag)]
              lines = set()
              for failure in case.findall("failure"):
                  for value in re.findall(
                      r"(?:tests/)?test_daemon_extension_control_refresh_leases\.py:(\d+):",
                      failure.text or "",
                  ):
                      number = int(value)
                      if 1 <= number <= 131:
                          lines.add(number)
              print(json.dumps({
                  "record": "refresh-lease-case",
                  "case": name if known else "unexpected",
                  "knownIdentity": known,
                  "tags": tags,
                  "testFailureLines": sorted(lines),
                  "intendedRefreshBoundary": known and name == positive and 104 in lines,
              }, sort_keys=True))
              if known:
                  observed[name] = (tags, lines)
          assert actual == expected
          assert not list(root.iter("skipped"))
          assert not list(root.iter("error"))
          assert len(list(root.iter("failure"))) == 1
          assert observed[positive] == (["failure"], {104})
          assert observed[control] == ([], set())
          print(json.dumps({
              "record": "refresh-lease-baseline",
              "cases": 2,
              "intendedFailures": 1,
              "passingMutationControls": 1,
              "pytestExitPreserved": True,
          }, sort_keys=True))
          PY
      - name: Report all default capture observations
        if: ${{ always() && steps.capture_tests.outcome != 'skipped' }}
        run: |
          python -I - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          report = Path(os.environ["RUNNER_TEMP"]) / ("default-capture-" + os.environ["MATRIX_PYTHON"] + ".xml")
          root = ET.parse(report).getroot()
          cases = list(root.iter("testcase"))
          module = "tests.test_native_policy_snapshot_default_capture_worker"
          function = "test_default_worker_admits_workspace_after_startup_status_writes"
          names = {function + "[" + suffix + "]" for suffix in ("none", "twice", "continuous")}
          expected = Counter((module, name) for name in names)
          actual = Counter((case.get("classname"), case.get("name")) for case in cases)
          observed = {}
          for case in cases:
              name = case.get("name")
              known = case.get("classname") == module and name in names
              tags = [tag for tag in ("failure", "error", "skipped") for _ in case.findall(tag)]
              lines = set()
              for failure in case.findall("failure"):
                  for value in re.findall(
                      r"(?:tests/)?test_native_policy_snapshot_default_capture_worker\.py:(\d+):",
                      failure.text or "",
                  ):
                      number = int(value)
                      if 1 <= number <= 159:
                          lines.add(number)
              print(json.dumps({
                  "record": "default-capture-case",
                  "case": name if known else "unexpected",
                  "knownIdentity": known,
                  "tags": tags,
                  "testFailureLines": sorted(lines),
                  "readinessBoundary": known and 156 in lines,
                  "deadlineBoundary": known and 157 in lines,
              }, sort_keys=True))
              if known:
                  observed[name] = tags
          assert actual == expected
          assert not list(root.iter("skipped"))
          assert not list(root.iter("error"))
          assert observed[function + "[none]"] == []
          assert observed[function + "[continuous]"] == []
          assert observed[function + "[twice]"] in ([], ["failure"])
          print(json.dumps({
              "record": "default-capture-characterization",
              "cases": 3,
              "failedCases": len(list(root.iter("failure"))),
              "passingCases": sum(not tags for tags in observed.values()),
              "pytestExitPreserved": True,
              "productionRepairProven": False,
              "specificWriterIdentified": False,
          }, sort_keys=True))
          PY
