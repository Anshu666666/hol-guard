name: Reviewed policy source preflight

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed source commit
        required: true
        type: string
      diagnostic_commit:
        description: Exact isolated workflow commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact isolated workflow tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: policy-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-policy-reliability-preflight-686-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before preflight
        id: source_guard
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import stat
          import subprocess
          from pathlib import Path
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
