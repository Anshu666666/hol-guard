              assert git("ls-tree", head, "--", path) == expected
              file = Path(path)
              metadata = file.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not file.is_symlink()
              assert bool(metadata.st_mode & 0o111) == (mode == "100755")
