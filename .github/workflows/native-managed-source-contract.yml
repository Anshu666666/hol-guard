          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          
          SOURCE = "77e2c027a4b5bd6f3c2369eec88ae4a68dc951bf"
          SOURCE_TREE = "75ba05e40579e8bfddc6ed5f0fbb833017bd3075"
          PARENT = "c63e7c6e85ec062a0ea617dccce7df3355a38711"
          PARENT_TREE = "6096dc6d7ffc383110330b1843d529929add41a7"
          WORKFLOW = ".github/workflows/native-managed-source-contract.yml"
          PINS = [["pyproject.toml","100644","876066431cbe958a77a85edddff95a829394cfbc"],["uv.lock","100644","45bf8a2dcf7b1f70c4387508a94348ba54f20022"],["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","100644","2da19b0d66af030cec5bcb3f9af88c66cdc007d8"],["scripts/ci/native_managed_resident_evidence.py","100644","c353e213d84000d61b2192c7c9e6888107f52fbd"],["scripts/ci/native_origin_resident_evidence.py","100644","7c3e40fb44ca8170b64de766169fe9f90506c856"],["scripts/ci/native_retirement_resident_evidence.py","100644","c7add13807544b952856147c4929b7d5055dc4fd"],["scripts/ci/policy_source_contract.py","100644","1df9950e323f2fcfdc04f38ab99b33c84098f279"],["tests/test_native_policy_vector_source_parity.py","100644","7ec9407e784eb5ac93753e930457a777b2f94401"]]
          OUTPUTS = ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher.py","scripts/ci/native_managed_resident_evidence.py","scripts/ci/native_origin_resident_evidence.py","scripts/ci/native_retirement_resident_evidence.py","scripts/ci/policy_source_contract.py","tests/test_native_policy_vector_source_parity.py"]
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == SOURCE
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-policy-format-77-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", head).split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, PARENT]
          assert git("rev-parse", source + "^{tree}") == SOURCE_TREE
          assert git("rev-parse", PARENT + "^{tree}") == PARENT_TREE
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, head) == git("show", "-s", identity, source)
          assert git("show", "-s", identity, source) == git(
