          import hashlib
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          
          modules = ["tests/test_native_required_command_fence.py","tests/test_receipt_signed_redaction_default.py","tests/test_receipt_redaction_local_floors.py","tests/test_receipt_signed_redaction_commit.py","tests/test_sqlite_deadline_control_cursor.py","tests/test_native_policy_bundle_ack.py","tests/test_native_expression_sync.py","tests/test_native_policy_publication_late_error.py","tests/test_native_policy_context_epoch.py","tests/test_native_source_authority_fence.py","tests/test_native_policy_decision_context.py","tests/test_native_defaults_edge.py","tests/test_native_managed_catalog_capability.py","tests/test_native_policy_config_mutation.py","tests/test_native_cloud_policy_fences.py","tests/test_extension_control_recovery_composition.py","tests/test_python_capability_cleanup_gate.py","tests/test_rust_io_ownership_gate.py","tests/test_rust_io_privacy_gate.py"]
          directory = Path(os.environ["RUNNER_TEMP"]) / ("policy-preflight-" + os.environ["MATRIX_PYTHON"])
          directory.mkdir(exist_ok=False)
          failed = False
          total = {"cases": 0, "passed": 0, "failures": 0, "errors": 0, "skipped": 0}
          for index, module in enumerate(modules):
              report = directory / (str(index) + ".xml")
              with (directory / (str(index) + ".log")).open("wb") as stream:
                  completed = subprocess.run(
                      ["uv", "run", "--no-sync", "python", "-m", "pytest", "-q", "--tb=short", "-o", "addopts=--strict-markers", module, "--junitxml=" + str(report)],
                      stdout=stream, stderr=subprocess.STDOUT, check=False,
                      env={**os.environ, "PYTEST_ADDOPTS": ""},
                  )
              print(json.dumps({"record": "policy-preflight-pytest-exit", "module": module, "exit": completed.returncode}), flush=True)
              failed |= completed.returncode != 0
              expected_class = module[:-3].replace("/", ".")
              counts = {"cases": 0, "passed": 0, "failures": 0, "errors": 0, "skipped": 0}
              results = []
              invalid_report = False
              try:
                  assert report.stat().st_size <= 32 * 1024 * 1024
                  cases = list(ET.parse(report).getroot().iter("testcase"))
                  assert 0 < len(cases) <= 10000
                  for case in cases:
                      classname, name = case.get("classname", ""), case.get("name", "")
                      function = name.partition("[")[0]
                      assert classname == expected_class or (
                          classname.startswith(expected_class + ".")
                          and re.fullmatch(r"(?:[A-Za-z_][A-Za-z0-9_]*\.)*[A-Za-z_][A-Za-z0-9_]*", classname)
                      )
                      assert re.fullmatch(r"test_[A-Za-z0-9_]+", function)
                      statuses = [tag for tag in ("failure", "error", "skipped") if case.findall(tag)]
                      counts["cases"] += 1
                      counts["passed"] += not statuses
                      counts["failures"] += "failure" in statuses
                      counts["errors"] += "error" in statuses
                      counts["skipped"] += "skipped" in statuses
                      results.append({
                          "classname": classname,
                          "name": function,
                          "caseId": hashlib.sha256((classname + "\0" + name).encode()).hexdigest(),
                          "parameterized": "[" in name,
                          "status": statuses or ["pass"],
                      })
              except Exception:
                  invalid_report = True
              for key, value in counts.items():
                  total[key] += value
              failed |= invalid_report or any(counts[key] for key in ("failures", "errors", "skipped"))
              print(json.dumps({
                  "record": "policy-preflight-junit",
                  "source": os.environ["EXPECTED_SOURCE_COMMIT"],
                  "derivedProgramGitSha": os.environ["DERIVED_PROGRAM_SHA"],
                  "python": os.environ["MATRIX_PYTHON"],
                  "module": module,
                  "pytestExit": completed.returncode,
                  "invalidReport": invalid_report,
                  "counts": counts,
                  "cases": results,
              }, sort_keys=True), flush=True)
          print(json.dumps({
              "record": "policy-preflight-total",
              "source": os.environ["EXPECTED_SOURCE_COMMIT"],
              "derivedProgramGitSha": os.environ["DERIVED_PROGRAM_SHA"],
              "python": os.environ["MATRIX_PYTHON"],
              "modules": len(modules),
              "counts": total,
              "failed": failed,
          }, sort_keys=True), flush=True)
          raise SystemExit(1 if failed else 0)
          PY
