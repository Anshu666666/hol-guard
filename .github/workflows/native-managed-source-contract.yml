              ["tests/test_native_policy_capture_retry_origin.py","100644","3e91e737c975f259d6d08fb81759a367f730daf8"],
              ["tests/test_native_policy_initial_retry_priority.py","100644","93cdd98f4e268f9a6d824ffe89f057b3025e8f68"],
              ["tests/test_native_policy_postack_capture_retry.py","100644","2db79ab391c014023f0661fd33f1574ff344600e"],
              ["tests/test_native_policy_snapshot_capture_retry.py","100644","da017b74b5bfc7ee4effb46f19618dab366f1e94"],
              ["tests/test_native_policy_snapshot_default_capture_worker.py","100644","dd5fc085b379830ab7b90725da2c9dd4d19789c0"],
              ["tests/test_native_policy_snapshot_reservation_capture.py","100644","131c4f51c26c71cb563bdcc62cbc56ab3672cb4c"],
              ["tests/test_native_policy_snapshot_v4_barrier.py","100644","348c2dcd04b04191325cb5ea0eb08a0a8a077d62"],
              ["tests/test_native_policy_source_selection.py","100644","c11d2df2817e383d0ddc279f7cdf523ede4428c6"],
              ["tests/test_native_source_free_renewal.py","100644","433d59d0a74d0d04be3cf4659df858a2ddd513ff"],
              ["uv.lock","100644","45bf8a2dcf7b1f70c4387508a94348ba54f20022"],
          ]
          
          def git(*arguments):
              return subprocess.check_output(["git", *arguments], text=True).strip()
          
          source = os.environ["EXPECTED_SOURCE_COMMIT"]
          head = os.environ["EXPECTED_DIAGNOSTIC_COMMIT"]
          tree = os.environ["EXPECTED_DIAGNOSTIC_TREE"]
          for value in (source, head, tree):
              assert re.fullmatch(r"[0-9a-f]{40}", value)
          assert source == SOURCE
          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert os.environ["GITHUB_REF"] == "refs/heads/hgp/diagnostic-initial-retry-priority-f064-20260919"
          assert os.environ["GITHUB_SHA"] == head == git("rev-parse", "HEAD")
          assert git("rev-parse", "HEAD^{tree}") == tree
          assert git("rev-list", "--parents", "-n", "1", head).split() == [head, source]
          assert git("rev-list", "--parents", "-n", "1", source).split() == [source, BASE]
          assert git("rev-list", "--parents", "-n", "1", BASE).split() == [
              BASE, "88dd45eae28bc1b7710f96c93d9f3178b700766d"
          ]
          assert git("rev-parse", source + "^{tree}") == SOURCE_TREE
          assert git("rev-parse", BASE + "^{tree}") == BASE_TREE
          assert git("diff", "--name-status", "--no-renames", BASE, source).splitlines() == ["A\t" + TEST]
          assert git("diff", "--name-status", "--no-renames", source, head).splitlines() == ["A\t" + WORKFLOW]
          assert git("ls-tree", BASE, "--", TEST) == ""
          assert git("ls-tree", source, "--", WORKFLOW) == ""
          anchor = "51d5684be15c03b979e145663e110ec5bfdc94ee"
          subprocess.run(["git", "merge-base", "--is-ancestor", anchor, source], check=True)
          identity = "--format=%an%n%ae%n%cn%n%ce"
          assert git("show", "-s", identity, head) == git("show", "-s", identity, source)
          assert git("show", "-s", identity, source) == git("show", "-s", identity, anchor)
          for path, mode, sha in PINS:
              assert re.fullmatch(r"[0-9a-f]{40}", sha)
              expected = f"{mode} blob {sha}\t{path}"
              assert git("ls-tree", source, "--", path) == expected
              assert git("ls-tree", head, "--", path) == expected
              file = Path(path)
              metadata = file.lstat()
              assert stat.S_ISREG(metadata.st_mode) and not file.is_symlink()
              assert bool(metadata.st_mode & 0o111) == (mode == "100755")
              assert git("hash-object", "--", path) == sha
          subprocess.run(["git", "diff", "--cached", "--quiet"], check=True)
          subprocess.run(["git", "diff", "--quiet", "HEAD", "--"], check=True)
          print(json.dumps({"record": "initial-retry-priority-source-guard",
