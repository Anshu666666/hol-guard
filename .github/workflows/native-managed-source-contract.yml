name: Initial publication retry ordering baseline

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact tests-only source commit
        required: true
        type: string
      diagnostic_commit:
        description: Exact diagnostic commit
        required: true
        type: string
      diagnostic_tree:
        description: Exact diagnostic tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: initial-retry-priority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  initial-retry-priority:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-initial-retry-priority-f064-20260919' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DIAGNOSTIC_COMMIT: ${{ inputs.diagnostic_commit }}
      EXPECTED_DIAGNOSTIC_TREE: ${{ inputs.diagnostic_tree }}
      MATRIX_PYTHON: ${{ matrix.python }}
      PYTEST_ADDOPTS: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source before regression
        id: source_guard
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          
          SOURCE = "f983575d6ae80d89ff1c44f3cdd987f44521529b"
          SOURCE_TREE = "12f6d2a1ca28611c90cc8b7656cac137003f657c"
          BASE = "f064a4b63aee59cb6e88e717e777f8fd85162158"
          BASE_TREE = "0dbb18e0e3bdd8fe057774f53ef2d8c15e634edb"
          TEST = "tests/test_native_policy_initial_retry_priority.py"
          WORKFLOW = ".github/workflows/native-managed-source-contract.yml"
          PINS = [
              [".github/workflows/ci.yml","100644","2c7b353bc21952db0adcb05ddcb8363d109e6883"],
              ["conftest.py","100644","9e1408c12fe951ad2f1541b1c2c0508f3c35b41a"],
              ["pyproject.toml","100644","876066431cbe958a77a85edddff95a829394cfbc"],
              ["src/codex_plugin_scanner/guard/native_command_control_binding.py","100644","2054cad886715d67e97586a38542dbd825f1c785"],
              ["src/codex_plugin_scanner/guard/native_command_control_projection.py","100644","fa5366372b43367e8864af63c7b16f00c2ceb2b5"],
              ["src/codex_plugin_scanner/guard/native_managed_capture.py","100644","cbefb015f7bd1ca9b117fff641acf041ca2e10cc"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_constants.py","100644","afb888ee46939730c04380142ea550c4b11fa74a"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_attempt.py","100644","9b5b470f013ac9724dbe6b7958ffc494010a15a8"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_context.py","100644","863969c225850342d508a253b592c62f5f6417cd"],
              ["src/codex_plugin_scanner/guard/native_policy_snapshot_publisher_inputs.py","100644","3d1282e0fb0d187d76a5a454097bd08c3290a310"],
