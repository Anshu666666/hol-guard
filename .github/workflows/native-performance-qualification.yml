name: Native performance qualification

on:
  pull_request:
    branches: [main, release/3.2]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/native-performance-qualification.yml'
      - '.github/workflows/native-surface-tail-pair.yml'
      - 'scripts/*native*.py'
      - 'scripts/native_slo*.py'
      - 'scripts/ci/*native*.py'
      - 'scripts/ci/*transition*.py'
      - 'tests/test_installed*transition*.py'
      - 'scripts/bench_guard*.py'
      - 'scripts/profile_guard*.py'
      - 'tests/*native*.py'
      - 'tests/test_bench_guard*.py'
      - 'tests/test_guard_supply_chain*.py'
      - 'tests/fixtures/guard-native-qualification/**'
      - 'src/codex_plugin_scanner/guard/**'
      - 'docs/guard/rust-performance/qualification-recipient.pem'
      - 'contracts/extensions/**'
      - 'contributions/extensions/**'
      - 'rust/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Smoke exercises the runner; qualification meets the paired sample minima.'
        required: true
        type: choice
        options: [smoke, qualification]
        default: qualification
      nonpriority_route:
        description: 'Opt-in nonpriority route ID, all for the 320-job full plan, or none. Smoke requires one route.'
        required: true
        type: string
        default: none
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  # A skipped label event or a later source push must not cancel retained offers.
  group: native-performance-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'rust-performance-qualification' ||
      github.event.label.name == 'rust-nonpriority-tails' ||
      github.event.label.name == 'rust-nonpriority-tail-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
      runs: ${{ steps.plan.outputs.runs }}
      platforms: ${{ steps.plan.outputs.platforms }}
      pairs: ${{ steps.plan.outputs.pairs }}
      tails_enabled: ${{ steps.tails.outputs.enabled }}
      tails_mode: ${{ steps.tails.outputs.mode }}
      tails_selection: ${{ steps.tails.outputs.selection }}
      tails_first_enabled: ${{ steps.tails.outputs.first_enabled }}
      tails_second_enabled: ${{ steps.tails.outputs.second_enabled }}
      tails_first: ${{ steps.tails.outputs.first }}
      tails_second: ${{ steps.tails.outputs.second }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate-src
          ref: ${{ github.event_name == 'schedule' && 'release/3.2' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: plan
        env:
          QUALIFICATION_MODE: >-
            ${{ github.event_name == 'pull_request' &&
                (github.event.pull_request.head.repo.full_name == github.repository &&
                 contains(github.event.pull_request.labels.*.name, 'rust-performance-qualification') &&
                 'qualification' || 'smoke') || inputs.mode || 'qualification' }}
        shell: bash
        run: |
          candidate_sha="$(git -C candidate-src rev-parse --verify HEAD)"
          python candidate-src/scripts/native_slo_pair_plan.py --mode "$QUALIFICATION_MODE" \
            --candidate-sha "$candidate_sha" --output "$GITHUB_OUTPUT"
      - id: tails
        env:
          TAIL_MODE: ${{ steps.plan.outputs.mode }}
          TAIL_SELECTION: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.nonpriority_route || 'none' }}
          TAIL_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TAIL_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          python candidate-src/scripts/native_slo_surface_tail_plan.py --mode "$TAIL_MODE" \
            --selection "$TAIL_SELECTION" --output "$GITHUB_OUTPUT" \
            --event-name "$GITHUB_EVENT_NAME" --repository "$GITHUB_REPOSITORY" \
            --head-repository "$TAIL_HEAD_REPOSITORY" --pr-labels-json "$TAIL_PR_LABELS"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate-src
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: baseline-src
          ref: 2e672d2d950c6ec471005ddba46e49bba16dc23b
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Install pinned Rust target
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 ${{ matrix.target }}
      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build both immutable wheels once per platform
        timeout-minutes: 75
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-controller-environment
          QUALIFICATION_TARGET: ${{ matrix.target }}
          QUALIFICATION_PLATFORM: ${{ matrix.platform_tag }}
          QUALIFICATION_DEPLOYMENT: ${{ matrix.deployment_target }}
        run: |
          uv sync --frozen --no-dev --project candidate-src
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/build_native_qualification_artifacts.py \
            --baseline baseline-src --candidate candidate-src --build-only \
            --target "$QUALIFICATION_TARGET" --platform-tag "$QUALIFICATION_PLATFORM" \
            --deployment-target "$QUALIFICATION_DEPLOYMENT" --output-dir qualification-build
      - name: Retain compiler and interpreter build provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-provenance-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-build/build-metadata.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain immutable wheel and locked dependency bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qualification-build/bundle/
          if-no-files-found: error
          retention-days: 30

  pairs:
    needs: [plan, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.pairs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        timeout-minutes: 5
        with:
          path: candidate-src
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        timeout-minutes: 5
        with:
          version: '0.9.26'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          name: wheels-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheel-bundle
      - name: Verify and install both exact artifacts outside the checkout
        timeout-minutes: 20
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-controller-environment
        run: |
          uv sync --frozen --no-dev --project candidate-src
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/native_slo_pair_install.py --action install \
            --bundle wheel-bundle --environments "$RUNNER_TEMP/pair-environments" \
            --target '${{ matrix.target }}' --candidate-sha '${{ needs.plan.outputs.sha }}'
      - name: Collect one indexed baseline and candidate pair
        timeout-minutes: 125
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-controller-environment
        run: |
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/native_slo_pair_install.py --action pair \
            --bundle wheel-bundle --environments "$RUNNER_TEMP/pair-environments" \
            --target '${{ matrix.target }}' --candidate-sha '${{ needs.plan.outputs.sha }}' \
            --mode '${{ needs.plan.outputs.mode }}' --pair-index '${{ matrix.pair_index }}' \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --output qualification-evidence
      - name: Encrypt every completed or interrupted pair
        if: always()
        id: private-evidence
        timeout-minutes: 15
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-archive-environment
          QUALIFICATION_RECIPIENT: d06561fc3cfc12925ed72bbe6967ff681c3a14b869f35debf540b43a26ff21eb
        run: |
          receipt="$GITHUB_WORKSPACE/qualification-evidence/archive-receipt.json"
          if ! (uv sync --frozen --no-dev --project candidate-src && \
            uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/native_slo_pair_archive.py \
            --bundle wheel-bundle --pair-root qualification-evidence \
            --candidate-sha '${{ needs.plan.outputs.sha }}' --target '${{ matrix.target }}' \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --pair-index '${{ matrix.pair_index }}' --runs '${{ needs.plan.outputs.runs }}' \
            --mode '${{ needs.plan.outputs.mode }}' \
            --public-key candidate-src/docs/guard/rust-performance/qualification-recipient.pem \
            --recipient-id "$QUALIFICATION_RECIPIENT"); then
            if [ ! -e "$receipt" ]; then
              python -I -S candidate-src/scripts/native_slo_evidence_archive.py failure-receipt --receipt "$receipt" || true
            fi
            exit 1
          fi
      - name: Retain public pair evidence and encrypted observations
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pair-${{ matrix.target }}-${{ matrix.pair_index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-evidence/aggregate/*.json
            qualification-evidence/archive-receipt.json
            qualification-evidence/encrypted/*.hge
          if-no-files-found: error
          retention-days: 30

  candidate-scenarios:
    needs: [plan, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate-src
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheels-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheel-bundle
      - name: Install verified bundle for independent installed lifecycle checks
        timeout-minutes: 20
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-controller-environment
        run: |
          uv sync --frozen --no-dev --project candidate-src
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/native_slo_pair_install.py --action install \
            --bundle wheel-bundle --environments "$RUNNER_TEMP/scenario-environments" \
            --target '${{ matrix.target }}' --candidate-sha '${{ needs.plan.outputs.sha }}'
      - name: Installed Ollama and Builder controls
        timeout-minutes: 25
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/qualification-controller-environment
        run: |
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/native_slo_pair_install.py --action ollama \
            --bundle wheel-bundle --environments "$RUNNER_TEMP/scenario-environments" \
            --target '${{ matrix.target }}' --candidate-sha '${{ needs.plan.outputs.sha }}' --output scenario-evidence
      - name: Retain installed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-scenarios-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: scenario-evidence/aggregate/*.json
          if-no-files-found: error
          retention-days: 30

  artifact-transitions:
    needs: [plan, build]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'rust-performance-qualification')))
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        timeout-minutes: 3
        with:
          path: candidate-src
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        timeout-minutes: 3
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        timeout-minutes: 3
        with:
          version: '0.9.26'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          name: wheels-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheel-bundle
      - name: Prepare isolated transition controller
        timeout-minutes: 5
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/transition-controller-environment
        run: uv sync --frozen --no-dev --project candidate-src
      - name: Verify stopped artifact replacements in a separate installation
        id: scenario
        timeout-minutes: 65
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/transition-controller-environment
        run: |
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/ci/installed_transition_ci.py \
            --action run --bundle wheel-bundle --dependency-root candidate-src --output transition-evidence \
            --source-sha '${{ needs.plan.outputs.sha }}' --target '${{ matrix.target }}' \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Seal completed failed or interrupted transition checkpoints
        id: seal
        if: always()
        timeout-minutes: 10
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/transition-archive-environment
        run: |
          receipt="$GITHUB_WORKSPACE/transition-evidence/archive-receipt.json"
          if ! (uv sync --frozen --no-dev --project candidate-src && \
            uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/ci/installed_transition_ci.py \
            --action archive --output transition-evidence \
            --source-sha '${{ needs.plan.outputs.sha }}' --target '${{ matrix.target }}' \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --public-key candidate-src/docs/guard/rust-performance/qualification-recipient.pem); then
            if [ ! -e "$receipt" ]; then
              python -I -S candidate-src/scripts/native_slo_evidence_archive.py failure-receipt --receipt "$receipt" || true
            fi
            exit 1
          fi
      - name: Retain public transition scope and outcomes
        id: public
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-transitions-public-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            transition-evidence/aggregate/*.json
            transition-evidence/archive-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain only encrypted transition checkpoints
        id: encrypted
        if: always()
        timeout-minutes: 4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-transitions-private-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: transition-evidence/encrypted/*.hge
          if-no-files-found: error
          retention-days: 30
      - name: Require scenario and both retained evidence artifacts
        if: always()
        timeout-minutes: 3
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/transition-archive-environment
          SCENARIO: ${{ steps.scenario.outcome }}
          SEALED: ${{ steps.seal.outcome }}
          PUBLIC: ${{ steps.public.outcome }}
          ENCRYPTED: ${{ steps.encrypted.outcome }}
          PUBLIC_ID: ${{ steps.public.outputs.artifact-id }}
          ENCRYPTED_ID: ${{ steps.encrypted.outputs.artifact-id }}
        run: |
          test "$SCENARIO" = success
          test "$SEALED" = success
          test "$PUBLIC" = success
          test "$ENCRYPTED" = success
          [[ "$PUBLIC_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ENCRYPTED_ID" =~ ^[1-9][0-9]*$ ]]
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/ci/installed_transition_ci.py \
            --action retention --output transition-evidence \
            --source-sha '${{ needs.plan.outputs.sha }}' --target '${{ matrix.target }}' \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

  nonpriority-tails-first:
    name: Nonpriority route pairs (${{ needs.plan.outputs.tails_mode }}, first group)
    needs: [plan, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tails_first_enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tails_first) }}
    uses: ./.github/workflows/native-surface-tail-pair.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      candidate-sha: ${{ needs.plan.outputs.sha }}
      route: ${{ matrix.route }}
      mode: ${{ needs.plan.outputs.tails_mode }}
      pair-index: ${{ matrix.pair_index }}

  nonpriority-tails-second:
    name: Nonpriority route pairs (${{ needs.plan.outputs.tails_mode }}, second group)
    needs: [plan, build]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tails_second_enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tails_second) }}
    uses: ./.github/workflows/native-surface-tail-pair.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      candidate-sha: ${{ needs.plan.outputs.sha }}
      route: ${{ matrix.route }}
      mode: ${{ needs.plan.outputs.tails_mode }}
      pair-index: ${{ matrix.pair_index }}

  nonpriority-tail-aggregation:
    name: Nonpriority route aggregation (${{ needs.plan.outputs.tails_mode }})
    needs: [plan, build, nonpriority-tails-first, nonpriority-tails-second]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tails_enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate-src
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheels-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheel-bundle
      - name: Fetch every expected route pair without merging artifact roots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: surface-tail-${{ matrix.target }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: tail-pairs
          merge-multiple: false
      - name: Validate companion identities, archives, counts and scoped tails
        timeout-minutes: 30
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/tail-aggregation-environment
          TAIL_TARGET: ${{ matrix.target }}
          TAIL_SHA: ${{ needs.plan.outputs.sha }}
          TAIL_SELECTION: ${{ needs.plan.outputs.tails_selection }}
          TAIL_MODE: ${{ needs.plan.outputs.tails_mode }}
        run: |
          uv sync --frozen --no-dev --project candidate-src
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/native_slo_surface_tail_aggregate.py \
            --pairs tail-pairs --bundle wheel-bundle --output tail-summary --target "$TAIL_TARGET" \
            --candidate-sha "$TAIL_SHA" --selection "$TAIL_SELECTION" --mode "$TAIL_MODE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain separate per-registration tail conclusions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nonpriority-tail-summary-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tail-summary/*.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [plan, build, pairs]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: candidate-src
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheels-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheel-bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: always()
        with:
          pattern: pair-${{ matrix.target }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained-pairs
          merge-multiple: false
      - name: Require all global pairs and unchanged acceptance gates
        if: always()
        timeout-minutes: 15
        shell: bash
        run: |
          uv sync --frozen --no-dev --project candidate-src
          uv run --frozen --no-sync --project candidate-src python candidate-src/scripts/native_slo_pair_aggregate.py \
            --pairs retained-pairs --bundle wheel-bundle --output aggregate/qualification.json \
            --candidate-sha '${{ needs.plan.outputs.sha }}' --target '${{ matrix.target }}' \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --mode '${{ needs.plan.outputs.mode }}'
      - name: Retain complete or failed aggregation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-performance-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate/*.json
          if-no-files-found: error
          retention-days: 30
