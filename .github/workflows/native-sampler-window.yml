                          location = response.headers.get("Location", "")
                          need(0 < len(location) <= 16384, "redirect_location")
                          url = urllib.parse.urljoin(url, location)
                          continue
                      need(index > 0 and response.status == 200, "archive_status")
                      length = response.headers.get("Content-Length")
                      need(length is None or (length.isdigit() and int(length) == size), "archive_length")
                      actual = 0
                      checksum = hashlib.sha256()
                      while True:
                          tick()
                          chunk = response.read(min(65536, size + 1 - actual))
                          if not chunk:
