name: Policy lane contract

on:
  pull_request:
    paths:
      - "src/codex_plugin_scanner/guard/policy_*.py"
      - "src/codex_plugin_scanner/guard/cli/commands_*policy*.py"
      - "src/codex_plugin_scanner/guard/native_command_expression.py"
      - "tests/test_native_command_expression.py"
      - "spec/guard-policy/v1alpha1/native-command-expression-vectors.json"
      - "tests/test_policy_command_projection.py"
      - "tests/test_policy_capability_inventory.py"
      - "tests/test_policy_lane_capabilities.py"
      - "tests/test_policy_lane_profiles.py"
      - "tests/test_policy_lane_cli.py"
      - "tests/test_policy_document_cli.py"
      - "basedpyright.policy-lanes.json"
      - "tests/test_policy_matcher_capability.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/policy-lane-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-lane-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Verify published combinations against the actual compiler
        run: uv run --no-sync pytest --noconftest tests/test_policy_capability_inventory.py tests/test_policy_lane_capabilities.py tests/test_policy_lane_profiles.py tests/test_policy_lane_cli.py tests/test_policy_matcher_capability.py tests/test_policy_document_cli.py tests/test_policy_command_projection.py tests/test_native_command_expression.py -q
      - name: Check changed Python style
        if: always()
        run: |
          uv run --no-sync ruff check src/codex_plugin_scanner/guard/policy_capability_inventory.py src/codex_plugin_scanner/guard/policy_matcher_capability.py src/codex_plugin_scanner/guard/policy_lane_capabilities.py src/codex_plugin_scanner/guard/cli/commands_dispatch_policy_document.py src/codex_plugin_scanner/guard/cli/commands_parser_policy.py tests/test_policy_lane_profiles.py tests/test_policy_lane_cli.py tests/test_policy_lane_capabilities.py src/codex_plugin_scanner/guard/policy_command_projection.py tests/test_policy_command_projection.py src/codex_plugin_scanner/guard/native_command_expression.py tests/test_native_command_expression.py
          uv run --no-sync ruff format --check src/codex_plugin_scanner/guard/policy_capability_inventory.py src/codex_plugin_scanner/guard/policy_matcher_capability.py src/codex_plugin_scanner/guard/policy_lane_capabilities.py src/codex_plugin_scanner/guard/cli/commands_dispatch_policy_document.py src/codex_plugin_scanner/guard/cli/commands_parser_policy.py tests/test_policy_lane_profiles.py tests/test_policy_lane_cli.py tests/test_policy_lane_capabilities.py src/codex_plugin_scanner/guard/policy_command_projection.py tests/test_policy_command_projection.py src/codex_plugin_scanner/guard/native_command_expression.py tests/test_native_command_expression.py
      - name: Check selected roots and actual imports
        if: always()
        run: uv run --no-sync basedpyright --project basedpyright.policy-lanes.json
