name: PR 2870 repair evidence

on:
  push:
    branches: [fix/secret-read-floors-and-contained-vitest]
    paths: [.github/workflows/pr2870-finalize-transport.yml]

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Export exact source snapshots and locked offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr2870-evidence"
          mkdir -p "$out/wheels"
          main=57c99baac955152383f3c6a9606b0f046957b172
          git archive --format=tar.gz HEAD > "$out/head.tar.gz"
          git archive --format=tar.gz "$main" > "$out/main.tar.gz"
          printf 'head=%s\nmain=%s\n' "$(git rev-parse HEAD)" "$main" > "$out/refs.txt"
          uv export --frozen --extra dev --no-emit-project --no-hashes --format requirements-txt > "$out/requirements.txt"
          python -m pip download --only-binary=:all: --dest "$out/wheels" -r "$out/requirements.txt"
          python -m pip download --only-binary=:all: --dest "$out/wheels" 'hatchling<1.31' editables importlib-metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr2870-current-source-evidence
          path: ${{ runner.temp }}/pr2870-evidence
          if-no-files-found: error
          retention-days: 3
