name: PR 2870 native integration tools

on:
  push:
    branches: [fix/secret-read-floors-and-contained-vitest]
    paths: [.github/workflows/pr2870-native-tools.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Download pinned public integration tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr2870-tools"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          root = Path(os.environ['RUNNER_TEMP']) / 'pr2870-tools'
          records = []
          for repo, tag, name, expected_sha256 in (
              ('openai/codex', 'rust-v0.154.0', 'codex-x86_64-unknown-linux-musl.tar.gz', 'd7e18b2597ae8f242f5f31ee9e90deef48dbc9edd634d9868fb6435d08c07f02'),
              ('openai/codex', 'rust-v0.154.0', 'bwrap-x86_64-unknown-linux-musl.tar.gz', '1e6a0f2802c4199f81e1d3d9a962d64dc274693d8391f02d1f4ab457e57c4c38'),
              ('oven-sh/bun', 'bun-v1.2.22', 'bun-linux-x64.zip', '4c446af1a01d7b40e1e11baebc352f9b2bfd12887e51b97dd3b59879cee2743a'),
          ):
              url = f'https://github.com/{repo}/releases/download/{tag}/{name}'
              with urlopen(url, timeout=120) as response:
                  content = response.read()
              actual_sha256 = hashlib.sha256(content).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise RuntimeError(
                      f'SHA-256 mismatch for {repo}@{tag}/{name}: '
                      f'expected {expected_sha256}, got {actual_sha256}'
                  )
              (root / name).write_bytes(content)
              records.append({
                  'repo': repo,
                  'tag': tag,
                  'name': name,
                  'sha256': actual_sha256,
                  'expected_sha256': expected_sha256,
              })
          (root / 'tool-identities.json').write_text(json.dumps(records, indent=2))
          print(json.dumps(records, indent=2))
          PY
      - name: Export local Node test fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/pr2870-node-fixture"
          mkdir -p "$fixture"
          cd "$fixture"
          printf '%s\n' '{"name":"guard-containment-integration","private":true,"type":"module","devDependencies":{"vitest":"3.2.4","typescript":"5.8.3"}}' > package.json
          npm install --ignore-scripts --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/pr2870-tools/node-fixture.tar.gz" package.json package-lock.json node_modules
      - name: Export offline Rust build inputs
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          cargo +1.88.0 vendor --manifest-path rust/Cargo.toml --locked "$RUNNER_TEMP/pr2870-vendor" > "$RUNNER_TEMP/pr2870-tools/cargo-vendor-config.toml"
          tar -czf "$RUNNER_TEMP/pr2870-tools/rust-vendor.tar.gz" -C "$RUNNER_TEMP/pr2870-vendor" .
          tar -czf "$RUNNER_TEMP/pr2870-tools/rust-toolchain.tar.gz" -C "$HOME/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu" bin lib libexec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr2870-native-integration-tools
          path: ${{ runner.temp }}/pr2870-tools
          if-no-files-found: error
          retention-days: 3
