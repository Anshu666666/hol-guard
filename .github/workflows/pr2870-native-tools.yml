name: PR 2870 native integration tools

on:
  push:
    branches: [fix/secret-read-floors-and-contained-vitest]
    paths: [.github/workflows/pr2870-native-tools.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Download pinned public integration tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr2870-tools"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path(os.environ['RUNNER_TEMP']) / 'pr2870-tools'
          records = []
          for repo, tag, names in (
              ('openai/codex', 'rust-v0.154.0', ('codex-x86_64-unknown-linux-musl.tar.gz',)),
              ('openai/codex', 'rust-v0.154.0', ('bwrap-x86_64-unknown-linux-musl', 'bwrap-x86_64-unknown-linux-musl.tar.gz')),
              ('oven-sh/bun', 'bun-v1.2.22', ('bun-linux-x64.zip',)),
          ):
              request = Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}', headers={'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=60) as response:
                  release = json.load(response)
              matches = [asset for asset in release['assets'] if asset['name'] in names]
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one asset from {repo}@{tag}: {names}')
              asset = matches[0]
              with urlopen(asset['browser_download_url'], timeout=120) as response:
                  content = response.read()
              digest = 'sha256:' + hashlib.sha256(content).hexdigest()
              if asset.get('digest') and asset['digest'] != digest:
                  raise RuntimeError('Release asset digest mismatch')
              (root / asset['name']).write_bytes(content)
              records.append({'repo': repo, 'tag': tag, 'name': asset['name'], 'digest': digest, 'release_digest': asset.get('digest')})
          (root / 'tool-identities.json').write_text(json.dumps(records, indent=2))
          print(json.dumps(records, indent=2))
          PY
      - name: Export local Node test fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/pr2870-node-fixture"
          mkdir -p "$fixture"
          cd "$fixture"
          printf '%s\n' '{"name":"guard-containment-integration","private":true,"type":"module","devDependencies":{"vitest":"3.2.4","typescript":"5.8.3"}}' > package.json
          npm install --ignore-scripts --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/pr2870-tools/node-fixture.tar.gz" package.json package-lock.json node_modules
      - name: Export offline Rust build inputs
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          cargo +1.88.0 vendor --manifest-path rust/Cargo.toml --locked "$RUNNER_TEMP/pr2870-vendor" > "$RUNNER_TEMP/pr2870-tools/cargo-vendor-config.toml"
          tar -czf "$RUNNER_TEMP/pr2870-tools/rust-vendor.tar.gz" -C "$RUNNER_TEMP/pr2870-vendor" .
          tar -czf "$RUNNER_TEMP/pr2870-tools/rust-toolchain.tar.gz" -C "$HOME/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu" bin lib libexec
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr2870-native-integration-tools
          path: ${{ runner.temp }}/pr2870-tools
          if-no-files-found: error
          retention-days: 3
