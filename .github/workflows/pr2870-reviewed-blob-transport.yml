name: PR 2870 reviewed blob transport

on:
  push:
    branches: [fix/secret-read-floors-and-contained-vitest]
    paths: [.github/workflows/pr2870-reviewed-blob-transport.yml]

permissions:
  contents: read

jobs:
  blobs-only:
    if: github.repository == 'hashgraph-online/hol-guard'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify fixed patch bytes and create immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import hashlib
          import json
          import os
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          ROOT = 'https://api.github.com/repos/hashgraph-online/hol-guard/'
          PATCH_COMMIT = '6e52d09ef6d4c9ace4508e5ece20501321c0a348'
          BASE = 'f5bc261b5321feb025501e29a1786f63e66d0c93'

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect)

          def api(path, payload=None):
              if not (path.startswith('git/blobs') or path.startswith('contents/.github/pr2870-')):
                  raise ValueError('Only immutable blob transport endpoints are permitted')
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = Request(ROOT + path, data=data, headers={
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with opener.open(request, timeout=30) as response:
                  return json.loads(response.read())

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          source = api('contents/.github/pr2870-reviewed-blob-patches.json?ref=' + PATCH_COMMIT)
          spec = json.loads(base64.b64decode(source['content']))
          if spec.get('base') != BASE or len(spec.get('files', [])) != 17:
              raise ValueError('Unexpected reviewed patch manifest')
          prepared = []
          seen = set()
          for item in spec['files']:
              path = item['path']
              if path in seen or not path.startswith(('src/', 'tests/')) or '..' in path.split('/'):
                  raise ValueError('Invalid reviewed file path')
              seen.add(path)
              if item['before'] is None:
                  content = item['content']
              else:
                  original = api('git/blobs/' + item['before'])
                  raw = base64.b64decode(original['content'])
                  if blob_sha(raw) != item['before']:
                      raise ValueError('Original blob identity mismatch: ' + path)
                  lines = raw.decode('utf-8').splitlines(keepends=True)
                  previous_start = len(lines) + 1
                  for start, end, replacement in reversed(item['edits']):
                      if not 0 <= start <= end < previous_start or end > len(lines):
                          raise ValueError('Invalid or overlapping reviewed edit')
                      lines[start:end] = [replacement]
                      previous_start = start
                  content = ''.join(lines)
              if blob_sha(content.encode('utf-8')) != item['after']:
                  raise ValueError('Reviewed result hash mismatch: ' + path)
              prepared.append((path, item['after'], content))
          for path, expected_sha, content in prepared:
              result = api('git/blobs', {'content': content, 'encoding': 'utf-8'})
              if result['sha'] != expected_sha:
                  raise ValueError('Published blob identity mismatch: ' + path)
              print(json.dumps({'path': path, 'sha': expected_sha}), flush=True)
          print('Verified 17 immutable blobs. No commits, trees, refs, pull requests or test results were modified.')
