name: PR 2870 source validation export
on:
  push:
    branches: [fix/secret-read-floors-and-contained-vitest]
    paths: [.github/workflows/pr2870-source-validation-export.yml]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Export tracked source and immutable identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr2870-export
          git archive --format=tar HEAD | gzip > /tmp/pr2870-export/head.tar.gz
          git rev-parse HEAD > /tmp/pr2870-export/head.txt
          git rev-parse HEAD^{tree} > /tmp/pr2870-export/tree.txt
          git ls-tree -r HEAD > /tmp/pr2870-export/tree-manifest.txt
      - name: Export failed job diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate 'repos/hashgraph-online/hol-guard/actions/runs/35122954707/jobs?per_page=100' --jq '.jobs[] | select(.conclusion == "failure") | [.id,.name] | @tsv' > /tmp/pr2870-export/failed-jobs.tsv
          while IFS=$'\t' read -r id name; do
            test -n "$id" || continue
            gh api "repos/hashgraph-online/hol-guard/actions/jobs/$id/logs" > "/tmp/pr2870-export/job-$id.log"
          done < /tmp/pr2870-export/failed-jobs.tsv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2870-validation-source
          path: /tmp/pr2870-export
          retention-days: 1
