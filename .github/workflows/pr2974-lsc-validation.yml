name: PR2974 local supply chain partition validation

on:
  push:
    branches: [codex/pr2974-lsc-validation-82c78d0b]
    paths:
      - '.github/workflows/pr2974-lsc-validation.yml'
      - 'ci/pr2974_lsc_validation/**'

permissions:
  contents: read

concurrency:
  group: pr2974-lsc-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  VALIDATION_HARNESS: ${{ github.workspace }}/harness
  VALIDATION_SOURCE: ${{ github.workspace }}/source
  VALIDATION_BASELINE: ${{ github.workspace }}/baseline
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source-and-finite:
    name: Bind original source and run affected local supply chain controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Initialize retained outcome
        env:
          VALIDATION_REPORT: ${{ runner.temp }}/pr2974-lsc-validation-report
          VALIDATION_SCRATCH: /tmp/pr2974-lsc-validation-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["VALIDATION_REPORT"])
          scratch = Path(os.environ["VALIDATION_SCRATCH"])
          report.mkdir(mode=0o700)
          assert scratch.parent.resolve() == Path("/tmp").resolve()
          assert not scratch.resolve().is_relative_to(Path.home().resolve())
          scratch.mkdir(mode=0o700)
          (report / "job-outcome.json").write_text(json.dumps({
              "passed": False, "status": "not_run", "qualification_complete": False,
              "source_sha": "82c78d0b609b380781528498a9c81c987e868a3e",
              "harness_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write("VALIDATION_REPORT=" + str(report) + "\n")
              stream.write("VALIDATION_SCRATCH=" + str(scratch) + "\n")
          PY
      - name: Checkout exact observer harness
        id: harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable partition candidate
        id: source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: '82c78d0b609b380781528498a9c81c987e868a3e'
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable original source
        id: baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: '44353b20262f1ca56b56204f4c764b047710454f'
          path: baseline
          fetch-depth: 2
          persist-credentials: false
      - name: Set up exact Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Set up pinned environment installer
        id: uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Run exact-source finite and clean package validation
        id: validation
        shell: bash
        run: |
          export VALIDATION_UV="$(command -v uv)"
          python3 -I -B "$VALIDATION_HARNESS/ci/pr2974_lsc_validation/finite.py"
      - name: Project bounded exact reports after any outcome
        id: projection
        if: always()
        shell: bash
        run: python3 -I -B "$VALIDATION_HARNESS/ci/pr2974_lsc_validation/project_reports.py"
      - name: Retain complete sources, collection, phase, environment and package receipts
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2974-lsc-validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr2974-lsc-validation-report/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual validation status
        if: always()
        env:
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          UV_OUTCOME: ${{ steps.uv.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["VALIDATION_REPORT"]) / "job-outcome.json"
          report = json.loads(path.read_text()) if path.is_file() else {"passed": False}
          names = ("HARNESS_OUTCOME", "SOURCE_OUTCOME", "BASELINE_OUTCOME", "PYTHON_OUTCOME",
                   "UV_OUTCOME", "VALIDATION_OUTCOME", "PROJECTION_OUTCOME", "UPLOAD_OUTCOME")
          outcomes = {name: os.environ[name] for name in names}
          passed = report.get("passed") is True and all(value == "success" for value in outcomes.values())
          print(json.dumps({"local_supply_chain_validation_passed": passed,
                            "step_outcomes": outcomes, "qualification_complete": False}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
