name: PR2974 package evaluator formatter harvest

on:
  push:
    branches: [codex/pr2974-package-eval-format-20260919]
    paths:
      - '.github/workflows/pr2974-package-eval-format.yml'
      - 'ci/pr2974_package_eval_format/**'

permissions:
  contents: read

concurrency:
  group: pr2974-package-eval-format-${{ github.ref }}
  cancel-in-progress: false

env:
  VALIDATION_SOURCE: ${{ github.workspace }}/source
  VALIDATION_HARNESS: ${{ github.workspace }}/harness
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  formatter-harvest:
    name: Retain source-only formatter output and semantic bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize retained outcome
        env:
          VALIDATION_REPORT: ${{ runner.temp }}/pr2974-package-eval-format/report
          VALIDATION_SCRATCH: ${{ runner.temp }}/pr2974-package-eval-format/scratch
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['VALIDATION_REPORT'])
          report.mkdir(parents=True, exist_ok=True)
          Path(os.environ['VALIDATION_SCRATCH']).mkdir(mode=0o700, parents=True, exist_ok=True)
          receipt = {'source_sha': 'f011fe44ab1985797b281d4bfcae2189b72264a6',
                     'source_tree': '161c098f857340d9ff5c2b2c33d49b399cb539f1',
                     'harness_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'not_run',
                     'passed': False, 'qualification_complete': False,
                     'fresh_immutable_formatted_commit_and_validation_required': True}
          (report / 'job-outcome.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('VALIDATION_REPORT=' + str(report) + '\n')
              stream.write('VALIDATION_SCRATCH=' + os.environ['VALIDATION_SCRATCH'] + '\n')
          PY
      - name: Checkout immutable formatter harness
        id: harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable unformatted source
        id: source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 'f011fe44ab1985797b281d4bfcae2189b72264a6'
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Set up the exact parser Python
        id: tool_setup
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Set up the exact hash-locked installer
        id: tool_install
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Format the separate tracked copy and retain all evidence
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          export VALIDATION_UV="$(command -v uv)"
          python3 -I -B "$VALIDATION_HARNESS/ci/pr2974_package_eval_format/format.py"
      - name: Preserve terminal workflow outcome
        if: always()
        env:
          HARNESS_CHECKOUT: ${{ steps.harness.outcome }}
          SOURCE_CHECKOUT: ${{ steps.source.outcome }}
          TOOL_SETUP: ${{ steps.tool_setup.outcome }}
          TOOL_INSTALL: ${{ steps.tool_install.outcome }}
          DRIVER_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['VALIDATION_REPORT'])
          path = report / 'job-outcome.json'
          value = json.loads(path.read_text()) if path.is_file() else {'passed': False, 'status': 'missing'}
          value['workflow_step_outcomes'] = {name: os.environ[name] for name in (
              'HARNESS_CHECKOUT', 'SOURCE_CHECKOUT', 'TOOL_SETUP', 'TOOL_INSTALL', 'DRIVER_OUTCOME')}
          value['qualification_complete'] = False
          value['fresh_immutable_formatted_commit_and_validation_required'] = True
          passed = value.get('passed') is True and all(
              outcome == 'success' for outcome in value['workflow_step_outcomes'].values())
          value['workflow_gate_passed'] = passed
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'workflow_gate_passed': passed, 'status': value.get('status'),
                            'workflow_step_outcomes': value['workflow_step_outcomes']}))
          raise SystemExit(0 if passed else 1)
          PY
      - name: Upload complete before and after payloads, bridges and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2974-package-eval-format-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr2974-package-eval-format/report/
          if-no-files-found: error
          retention-days: 30
