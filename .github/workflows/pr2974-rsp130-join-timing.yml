name: PR2974 RSP130 five-pair isolated join diagnosis

on:
  push:
    branches: [codex/pr2974-rsp130-join-timing-20260919]
    paths:
      - '.github/workflows/pr2974-rsp130-join-timing.yml'
      - 'ci/pr2974_rsp130_join_timing/**'

permissions:
  contents: read

concurrency:
  group: pr2974-rsp130-join-timing-${{ github.ref }}
  cancel-in-progress: false

env:
  VALIDATION_HARNESS: ${{ github.workspace }}/harness
  VALIDATION_SOURCE: ${{ github.workspace }}/source
  VALIDATION_BASELINE: ${{ github.workspace }}/baseline
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  join-timing:
    name: Measure five paired join arms and separate container observations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Initialize retained outcome
        env:
          VALIDATION_REPORT: ${{ runner.temp }}/pr2974-rsp130-join-timing-report
          VALIDATION_SCRATCH: /tmp/pr2974-rsp130-join-timing-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ["VALIDATION_REPORT"])
          scratch = Path(os.environ["VALIDATION_SCRATCH"])
          report.mkdir(mode=0o700)
          assert scratch.parent.resolve() == Path("/tmp").resolve()
          assert not scratch.resolve().is_relative_to(Path.home().resolve())
          scratch.mkdir(mode=0o700)
          (report / "job-outcome.json").write_text(json.dumps({
              "passed": False, "status": "not_run", "qualification_complete": False,
              "source_sha": "f247649b98aef1ac3b56109b65d27618a384624d",
              "harness_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write("VALIDATION_REPORT=" + str(report) + "\n")
              stream.write("VALIDATION_SCRATCH=" + str(scratch) + "\n")
          PY
      - name: Checkout exact observer harness
        id: harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable formatted prototype source
        id: source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 'f247649b98aef1ac3b56109b65d27618a384624d'
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable original source
        id: baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: '0dd6f65c01609ddb0cdd6a32675ddf8e73ae5f73'
          path: baseline
          fetch-depth: 2
          persist-credentials: false
      - name: Set up exact Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Set up pinned environment installer
        id: uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Admit actual45 and six cells before five uninstrumented pairs
        id: validation
        shell: bash
        run: |
          export VALIDATION_UV="$(command -v uv)"
          python3 -I -B "$VALIDATION_HARNESS/ci/pr2974_rsp130_join_timing/driver.py"
      - name: Project bounded exact reports after any outcome
        id: projection
        if: always()
        shell: bash
        run: python3 -I -B "$VALIDATION_HARNESS/ci/pr2974_rsp130_join_timing/project_reports.py"
      - name: Retain every raw timing sample, failure and source/environment witness
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2974-rsp130-join-timing-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr2974-rsp130-join-timing-report/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual validation status
        if: always()
        env:
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          UV_OUTCOME: ${{ steps.uv.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["VALIDATION_REPORT"]) / "job-outcome.json"
          report = json.loads(path.read_text()) if path.is_file() else {"passed": False}
          names = ("HARNESS_OUTCOME", "SOURCE_OUTCOME", "BASELINE_OUTCOME", "PYTHON_OUTCOME",
                   "UV_OUTCOME", "VALIDATION_OUTCOME", "PROJECTION_OUTCOME", "UPLOAD_OUTCOME")
          outcomes = {name: os.environ[name] for name in names}
          passed = report.get("passed") is True and all(value == "success" for value in outcomes.values())
          print(json.dumps({"rsp130_join_diagnosis_passed": passed,
                            "step_outcomes": outcomes, "qualification_complete": False}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
