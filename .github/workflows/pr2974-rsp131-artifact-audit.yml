name: PR2974 original RSP-131 artifact audit

on:
  push:
    branches: [codex/pr2974-rsp131-artifact-audit-35436919027]
    paths:
      - '.github/workflows/pr2974-rsp131-artifact-audit.yml'
      - 'ci/pr2974_rsp131_artifact_audit/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: pr2974-rsp131-artifact-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  AUDIT_HARNESS: ${{ github.workspace }}/harness
  AUDIT_SOURCE: ${{ github.workspace }}/source
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  original-rsp131-artifact:
    name: Read original RSP-131 counts and refusal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Initialize retained RSP-131 readout
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/pr2974-rsp131-original-artifact
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ["AUDIT_OUTPUT"])
          report = output / "audit"
          report.mkdir(parents=True, exist_ok=True)
          (report / "readout-outcome.json").write_text(json.dumps({
              "audit_passed": False, "status": "not_run", "qualification_complete": False,
              "new_workload_execution": False, "original_workflow_outcome": "failure",
              "original_run_id": 35436919027, "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "harness_sha": os.environ["GITHUB_SHA"]}) + "\n")
          with Path(os.environ["GITHUB_ENV"]).open("a") as stream:
              stream.write("AUDIT_OUTPUT=" + str(output) + "\n")
          PY
      - name: Checkout separate observer harness
        id: harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout exact RSP-131 source without executing it
        id: source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: '7355c6ad4d09ab31ddc6deef31d2dd8bbb561735'
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Set up exact reader Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Verify the original failed-run reports and emit complete frames
        id: audit
        env:
          AUDIT_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -I -B "$AUDIT_HARNESS/ci/pr2974_rsp131_artifact_audit/readout.py"
      - name: Retain original RSP-131 ZIP and all readout evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2974-rsp131-original-artifact-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr2974-rsp131-original-artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve actual RSP-131 readout status
        if: always()
        env:
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["AUDIT_OUTPUT"]) / "audit/readout-outcome.json"
          result = json.loads(path.read_text()) if path.is_file() else {"audit_passed": False}
          names = ("HARNESS_OUTCOME", "SOURCE_OUTCOME", "PYTHON_OUTCOME", "AUDIT_OUTCOME", "UPLOAD_OUTCOME")
          outcomes = {name: os.environ[name] for name in names}
          passed = result.get("audit_passed") is True and all(value == "success" for value in outcomes.values())
          print(json.dumps({"rsp131_original_artifact_readout": passed, "step_outcomes": outcomes,
                            "original_workflow_outcome": "failure", "qualification_complete": False,
                            "new_workload_execution": False}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
