name: PR2974 SQLite and queue observer finite validation

on:
  push:
    branches: [codex/pr2974-rsp131-sqlite-queue-finite-20260919]
    paths:
      - '.github/workflows/pr2974-rsp131-sqlite-queue-finite.yml'
      - 'ci/pr2974_rsp131_sqlite_queue_finite/**'

permissions:
  contents: read

concurrency:
  group: pr2974-rsp131-sqlite-queue-finite-${{ github.ref }}
  cancel-in-progress: false

env:
  VALIDATION_SOURCE: ${{ github.workspace }}/source
  VALIDATION_HARNESS: ${{ github.workspace }}/harness
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finite-validation:
    name: Validate the exact optional SQLite and queue observer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Initialize retained outcome
        env:
          VALIDATION_REPORT: ${{ runner.temp }}/pr2974-rsp131-sqlite-queue-finite/report
          VALIDATION_SCRATCH: ${{ runner.temp }}/pr2974-rsp131-sqlite-queue-finite/scratch
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['VALIDATION_REPORT'])
          report.mkdir(parents=True, exist_ok=True)
          Path(os.environ['VALIDATION_SCRATCH']).mkdir(mode=0o700, parents=True, exist_ok=True)
          receipt = {'source_sha': '4ca5b2f0562b3f6f1829d0e531399ffc06790c9c',
                     'source_tree': '9ac7e6caac4438b5a7c61178ea182c843eca1289',
                     'harness_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'not_run',
                     'passed': False, 'qualification_complete': False,
                     'finite_validation_only': True}
          (report / 'job-outcome.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('VALIDATION_REPORT=' + str(report) + '\n')
              stream.write('VALIDATION_SCRATCH=' + os.environ['VALIDATION_SCRATCH'] + '\n')
          PY
      - name: Checkout immutable finite harness
        id: harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout exact source with corrected capability counts
        id: source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: '4ca5b2f0562b3f6f1829d0e531399ffc06790c9c'
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Set up the exact validation Python
        id: tool_setup
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Set up the exact frozen-lock installer
        id: tool_install
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Run the bounded finite validation once
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          export VALIDATION_UV="$(command -v uv)"
          python3 -I -B "$VALIDATION_HARNESS/ci/pr2974_rsp131_sqlite_queue_finite/driver.py"
      - name: Preserve terminal workflow outcome
        if: always()
        env:
          HARNESS_CHECKOUT: ${{ steps.harness.outcome }}
          SOURCE_CHECKOUT: ${{ steps.source.outcome }}
          TOOL_SETUP: ${{ steps.tool_setup.outcome }}
          TOOL_INSTALL: ${{ steps.tool_install.outcome }}
          DRIVER_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['VALIDATION_REPORT'])
          path = report / 'job-outcome.json'
          value = json.loads(path.read_text()) if path.is_file() else {'passed': False, 'status': 'missing'}
          value['workflow_step_outcomes'] = {name: os.environ[name] for name in (
              'HARNESS_CHECKOUT', 'SOURCE_CHECKOUT', 'TOOL_SETUP', 'TOOL_INSTALL', 'DRIVER_OUTCOME')}
          value['qualification_complete'] = False
          value['finite_validation_only'] = True
          passed = value.get('passed') is True and all(
              outcome == 'success' for outcome in value['workflow_step_outcomes'].values())
          value['workflow_gate_passed'] = passed
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
          print(json.dumps({'workflow_gate_passed': passed, 'status': value.get('status'),
                            'workflow_step_outcomes': value['workflow_step_outcomes']}))
          raise SystemExit(0 if passed else 1)
          PY
      - name: Project complete bounded finite evidence
        id: projection
        if: always() && steps.harness.outcome == 'success'
        shell: bash
        run: |
          python3 -I -B "$VALIDATION_HARNESS/ci/pr2974_rsp131_sqlite_queue_finite/report_projection.py"
      - name: Upload complete finite, compiler and failure evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr2974-rsp131-sqlite-queue-finite-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr2974-rsp131-sqlite-queue-finite/report/
          if-no-files-found: error
          retention-days: 30

      - name: Require original validation and evidence retention
        if: always()
        env:
          DRIVER_OUTCOME: ${{ steps.validation.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          python3 -I -B - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['VALIDATION_REPORT'])
          original = json.loads((report / 'job-outcome.json').read_text())
          framing = json.loads((report / 'report-framing.json').read_text())
          statuses = {name: os.environ[name] for name in (
              'DRIVER_OUTCOME', 'PROJECTION_OUTCOME', 'UPLOAD_OUTCOME')}
          passed = (original.get('workflow_gate_passed') is True and framing.get('passed') is True
                    and all(value == 'success' for value in statuses.values()))
          print(json.dumps({'passed': passed, 'step_outcomes': statuses,
                            'original_workload_passed': original.get('passed'),
                            'evidence_projection_passed': framing.get('passed'),
                            'qualification_complete': False}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
