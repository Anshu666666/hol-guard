name: Bounded priority launcher child attribution

on:
  push:
    branches: [codex/pr2974-priority-child-attribution-v2-20260920-6fee5ac6]
    paths: [.github/workflows/priority-launcher-child-diagnostic.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: priority-child-installed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      SOURCE_SHA: 753850955c33eb15f992d1fe7ca375dd26c3a070
      SOURCE_TREE: 341d2c02c79b0c510544df5297600d5a3a47f211
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: driver
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: false
      - name: Download the exact existing normal ARM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hol-guard-native-wheel-aarch64-apple-darwin
          run-id: 35517566371
          github-token: ${{ github.token }}
          path: retained-artifact
      - name: Bind exact source, observer and all retained artifact members
        shell: bash
        run: |
          mkdir child-evidence
          cp driver/scripts/ci/priority_launcher_child_install/input-contract.json child-evidence/
          cp driver/scripts/ci/priority_launcher_child_install/run-source-bindings.json child-evidence/
          python driver/scripts/ci/priority_launcher_child_install/verify_inputs.py before \
            --source "$GITHUB_WORKSPACE/source" --driver "$GITHUB_WORKSPACE/driver" \
            --artifact "$GITHUB_WORKSPACE/retained-artifact" --output "$GITHUB_WORKSPACE/child-evidence"
      - name: Install frozen dependencies without a source project install
        working-directory: source
        run: uv sync --frozen --extra dev --no-install-project --python 3.12
      - name: Install only the verified existing default native wheel
        shell: bash
        run: |
          uv pip install --python "$GITHUB_WORKSPACE/source/.venv/bin/python" --no-index --no-deps --force-reinstall \
            "$GITHUB_WORKSPACE/retained-artifact/native-dist/hol_guard-3.0.1-py3-none-macosx_11_0_arm64.whl"
      - name: Run the new untimed child observer controls and type gate
        working-directory: driver
        shell: bash
        run: |
          PYTHON="$GITHUB_WORKSPACE/source/.venv/bin/python"
          "$PYTHON" -m pytest -q tests/test_priority_child_startup.py tests/test_priority_child_profile_bounds.py tests/test_priority_child_reader.py tests/test_priority_child_subset.py tests/test_priority_child_sidecar_join.py tests/test_priority_child_invocation.py --junitxml="$GITHUB_WORKSPACE/child-evidence/child-controls.xml"
          "$GITHUB_WORKSPACE/source/.venv/bin/basedpyright" --pythonpath "$PYTHON" scripts/ci/priority_launcher_child scripts/ci/priority_launcher_child_diagnostic.py tests/test_priority_child_startup.py tests/test_priority_child_profile_bounds.py tests/test_priority_child_reader.py tests/test_priority_child_subset.py tests/test_priority_child_sidecar_join.py tests/test_priority_child_invocation.py tests/priority_child_fixtures.py --outputjson > "$GITHUB_WORKSPACE/child-evidence/child-types.json"
          "$PYTHON" scripts/ci/priority_launcher_child_install/verify_inputs.py controls \
            --source "$GITHUB_WORKSPACE/source" --driver "$GITHUB_WORKSPACE/driver" \
            --artifact "$GITHUB_WORKSPACE/retained-artifact" --output "$GITHUB_WORKSPACE/child-evidence"
      - name: Prepare the exact owned interpreter with the existing installed integrity gate
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/source/.venv/bin/python" -I "$GITHUB_WORKSPACE/driver/scripts/ci/priority_launcher_child_install/verify_inputs.py" provision \
            --source "$GITHUB_WORKSPACE/source" --driver "$GITHUB_WORKSPACE/driver" \
            --artifact "$GITHUB_WORKSPACE/retained-artifact" --output "$GITHUB_WORKSPACE/child-evidence"
      - name: Execute at most 24 original calls once with explicit startup profiling
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/source/.venv/bin/python" -I "$GITHUB_WORKSPACE/driver/scripts/ci/priority_launcher_child_diagnostic.py" \
            --source-root "$GITHUB_WORKSPACE/source" --expected-source-sha "$SOURCE_SHA" \
            --expected-source-tree "$SOURCE_TREE" --driver-root "$GITHUB_WORKSPACE/driver" \
            --expected-driver-sha "$GITHUB_SHA" \
            --bindings "$GITHUB_WORKSPACE/driver/scripts/ci/priority_launcher_child_install/run-source-bindings.json" \
            --wheel "$GITHUB_WORKSPACE/retained-artifact/native-dist/hol_guard-3.0.1-py3-none-macosx_11_0_arm64.whl" \
            --output "$GITHUB_WORKSPACE/child-evidence/observation.json"
      - name: Preserve after bindings even on original failure
        if: always()
        shell: bash
        run: |
          mkdir -p child-evidence
          python driver/scripts/ci/priority_launcher_child_install/verify_inputs.py after \
            --source "$GITHUB_WORKSPACE/source" --driver "$GITHUB_WORKSPACE/driver" \
            --artifact "$GITHUB_WORKSPACE/retained-artifact" --output "$GITHUB_WORKSPACE/child-evidence"
      - name: Preserve complete observations and original failure or cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: priority-child-installed-${{ github.run_id }}
          path: child-evidence/
          if-no-files-found: error
          retention-days: 30
