name: Repair PR 2797 reconciliation artifacts

on:
  push:
    branches:
      - automation/reconcile-pr-2797-20260917

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reconciled result branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/reconcile-pr-2797-result
          fetch-depth: 0
          persist-credentials: true

      - name: Restore current-main dashboard update-channel wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("dashboard/src/approval-center-layout.tsx")
          text = path.read_text()

          old_destructure = "    onUpdateGuard,\n    onReinstallGuard,\n  } = useGuardUpdate("
          new_destructure = "    onUpdateGuard,\n    onReinstallGuard,\n    onSetUpdateChannel,\n  } = useGuardUpdate("
          old_prop = "        onUpdateGuard={onUpdateGuard}\n        onReinstallGuard={onReinstallGuard}\n        approvalGate="
          new_prop = "        onUpdateGuard={onUpdateGuard}\n        onReinstallGuard={onReinstallGuard}\n        onSetUpdateChannel={onSetUpdateChannel}\n        approvalGate="

          if old_destructure not in text:
              raise SystemExit("Expected useGuardUpdate destructuring shape not found")
          if old_prop not in text:
              raise SystemExit("Expected ShellNavigation prop shape not found")

          text = text.replace(old_destructure, new_destructure, 1)
          text = text.replace(old_prop, new_prop, 1)
          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/src/approval-center-layout.tsx
          git diff --cached --check
          git commit -m "fix: restore dashboard update-channel wiring"
          git push origin HEAD:automation/reconcile-pr-2797-result
