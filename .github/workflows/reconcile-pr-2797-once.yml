name: Repair PR 2797 reconciliation artifacts

on:
  push:
    branches:
      - automation/reconcile-pr-2797-20260917

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reconciled result branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/reconcile-pr-2797-result
          fetch-depth: 0
          persist-credentials: true

      - name: Remove stale review presentation merge fragment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("dashboard/src/review-states.tsx")
          text = path.read_text()

          text = text.replace("  GuardPresentationMode,\n", "", 1)

          start = text.index("function TechnicalStoppedAction(")
          end = text.index("export function buildWhatWouldHappen(")
          replacement = '''export function PrimaryActionCard({ item }: { item: GuardApprovalRequest }) {
  const action = buildPrimaryReviewAction(item);
  const workingDirectory = resolveRequestWorkingDirectory(item);

  return (
    <div className="mt-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <SectionLabel>What was stopped</SectionLabel>
          {action.detail !== null && (
            <p className="mt-1 text-sm text-brand-dark/70">
              {action.detail}
            </p>
          )}
        </div>
        <span className="rounded-full border border-brand-blue/15 bg-brand-blue/[0.04] px-3 py-1 font-mono text-[11px] font-semibold uppercase tracking-[0.16em] text-brand-blue">
          {action.label}
        </span>
      </div>
      <div className="mt-3">
        <LoggedActionPanel
          key={item.request_id}
          label={action.label}
          text={action.text}
          copyAriaLabel="Copy full stopped action to clipboard"
          expandAriaLabel="Expand full stopped action"
          collapseAriaLabel="Collapse full stopped action"
        />
        {workingDirectory !== null && (
          <div className="mt-3 flex min-w-0 items-start gap-2 text-xs text-muted-foreground">
            <HiMiniFolder className="mt-0.5 h-4 w-4 shrink-0 text-brand-blue" aria-hidden="true" />
            <span className="shrink-0 font-medium text-brand-dark/70">Working directory</span>
            <code className="min-w-0 break-all font-mono text-brand-dark" title={workingDirectory}>
              {workingDirectory}
            </code>
          </div>
        )}
      </div>
    </div>
  );
}

'''
          text = text[:start] + replacement + text[end:]

          forbidden = (
              "useActionExplanation",
              "usePresentationMode",
              "ActionExplanationSummary",
              "GuardTechnicalDisclosure",
              "GuardPresentationMode",
          )
          leftovers = [name for name in forbidden if name in text]
          if leftovers:
              raise SystemExit(f"Stale review presentation symbols remain: {leftovers}")

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/src/review-states.tsx
          git diff --cached --check
          git commit -m "fix: remove stale review presentation merge fragment"
          git push origin HEAD:automation/reconcile-pr-2797-result
