name: Repair PR 2797 reconciliation artifacts

on:
  push:
    branches:
      - automation/reconcile-pr-2797-20260917

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reconciled result branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: automation/reconcile-pr-2797-result
          fetch-depth: 0
          persist-credentials: true

      - name: Remove stale settings serialization merge artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/codex_plugin_scanner/guard/config.py")
          text = path.read_text()

          replacements = {
              "\n@serialize_guard_settings\ndef update_guard_update_channel(": "\ndef update_guard_update_channel(",
              "\n@serialize_guard_settings\ndef reset_guard_settings(": "\ndef reset_guard_settings(",
              '    next_payload["presentation_revision"] = next_presentation_revision(\n        load_guard_config(guard_home).presentation_revision\n    )\n': "",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected stale merge artifact not found: {old!r}")
              text = text.replace(old, new, 1)

          if "@serialize_guard_settings" in text:
              raise SystemExit("Unexpected serialize_guard_settings reference remains")

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/codex_plugin_scanner/guard/config.py
          git diff --cached --check
          git commit -m "fix: reconcile settings mutations with main"
          git push origin HEAD:automation/reconcile-pr-2797-result
