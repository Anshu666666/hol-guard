name: Runtime readiness and continuation source validation
permissions:
  contents: read
concurrency:
  group: public-runtime-union-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'hashgraph-online/hol-guard' && github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/hgp/runtime-continuation-source-validation-20260920' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python:
        - '3.10'
        - '3.12'
    env:
      PUBLIC_SOURCE_SHA: a3d3467e9cf511cafef49f5bae174bb91b599d53
      PUBLIC_SOURCE_TREE: ab29a21a085557ef47bd2c1752c14a79f598d36d
      PYTHON_VERSION: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
        working-directory: public-source
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        ref: ${{ github.sha }}
        path: public-source
        persist-credentials: false
        fetch-depth: 2
    - name: Bind exact public source and single workflow child
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $PUBLIC_SOURCE_SHA"
        test "$(git diff --name-only "$PUBLIC_SOURCE_SHA" HEAD)" = ".github/workflows/runtime-continuation-source-validation.yml"
        git checkout --detach "$PUBLIC_SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_SOURCE_TREE"
        test -z "$(git status --porcelain --untracked-files=no)"
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: ${{ matrix.python }}
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: 0.9.26
        enable-cache: false
    - name: Prepare pinned dependencies and owned interpreter
      run: |
        set -euo pipefail
        python -I scripts/ci/policy_contract_interpreter.py prepare
        uv sync --frozen --extra dev --python "$PYTHON_VERSION"
        python -I scripts/ci/policy_contract_interpreter.py verify
    - name: Install pinned Rust for the existing slow commitment test
      run: |
        set -euo pipefail
        rustup toolchain install 1.88.0 --profile minimal
        rustup default 1.88.0
        rustc --version
        cargo --version
    - name: Materialize fixed source selection
      run: |
        set -euo pipefail
        target="$RUNNER_TEMP/public-runtime-union-$PYTHON_VERSION"
