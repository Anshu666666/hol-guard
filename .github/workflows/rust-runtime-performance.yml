name: Native fresh-byte hash verification

on:
  workflow_dispatch:
    inputs:
      diagnostic_sha:
        required: true
        type: string
      diagnostic_tree:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rust-runtime-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    env:
      EXPECTED_SHA: ${{ inputs.diagnostic_sha }}
      EXPECTED_TREE: ${{ inputs.diagnostic_tree }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.diagnostic_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = 04bed715f38b04cb75651fafdf566e86e1112da1
          test "$(git rev-parse HEAD:src/codex_plugin_scanner/guard/native_runtime.py)" = 33d2acfcdd31d7f8c7bf2546bae8e01664074fab
          test "$(git rev-parse HEAD:src/codex_plugin_scanner/guard/native_runtime_binary.py)" = bb0ce6fba5bca8406915578ef237b3ce26a36921
          test "$(git rev-parse HEAD:tests/test_native_runtime_binary_identity.py)" = b6f86a35dbe69113a2bd63fa4aa05c2ed96cbe9e
          test "$(git rev-parse HEAD:scripts/ci/rust_io_ownership_gate.py)" = 4239590f78e427703e3be316ff6120d684382a3a
          test "$(git rev-parse HEAD:tests/test_rust_io_ownership_gate.py)" = 6d59081bc42716d945641f68c0bbfd453e7b96c6
          test "$(git rev-parse HEAD:docs/guard/contracts/python-capability-ownership.v1.json)" = 2f1468e7558e355a4e9966cd3bd44e50d6b00ead
          test "$(git rev-parse HEAD:tests/test_python_capability_cleanup_gate.py)" = f927b25397382da1502afe803c708d6ddc37562c
          test "$(git rev-parse HEAD:docs/guard/contracts/hook-data-plane-ownership.v2.json)" = 7ce44f182a67a4ea875478810ed6d6cd4442e6fd
          test "$(git rev-parse HEAD:scripts/bench_guard_native_phase_diagnostic.py)" = 055cb4e0e6c6264e358bfdc6f3b72315e4e5e2bc
          test "$(git rev-parse HEAD:tests/test_native_performance_phase_diagnostic.py)" = e54d80d8fa64b10eb06506c4a3cb96e9331e325e
          git diff --exit-code
          git diff --cached --exit-code
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/hash-changed.txt"
          printf '%s\n' .github/workflows/rust-runtime-performance.yml docs/guard/contracts/hook-data-plane-ownership.v2.json docs/guard/contracts/python-capability-ownership.v1.json scripts/bench_guard_native_phase_diagnostic.py scripts/ci/rust_io_ownership_gate.py src/codex_plugin_scanner/guard/native_runtime.py src/codex_plugin_scanner/guard/native_runtime_binary.py tests/test_native_performance_phase_diagnostic.py tests/test_native_runtime_binary_identity.py tests/test_python_capability_cleanup_gate.py tests/test_rust_io_ownership_gate.py > "$RUNNER_TEMP/hash-expected.txt"
          cmp "$RUNNER_TEMP/hash-changed.txt" "$RUNNER_TEMP/hash-expected.txt"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Build version-matched runtime
        env:
          HOL_GUARD_BUILD_SHA: ${{ github.sha }}
        run: |
          VERSION=$(uv run --no-sync python scripts/sync_repo_version.py --check)
          export HOL_GUARD_PACKAGE_VERSION="$VERSION"
          cargo build --manifest-path rust/Cargo.toml --locked --release -p hol-guard-runtime
          rust/target/release/hol-guard-runtime self-test --json
      - name: Verify full-byte identity and ownership controls
        run: |
          uv run --no-sync ruff check \
            src/codex_plugin_scanner/guard/native_runtime.py \
            src/codex_plugin_scanner/guard/native_runtime_binary.py \
            tests/test_native_runtime_binary_identity.py \
            scripts/ci/rust_io_ownership_gate.py \
            tests/test_rust_io_ownership_gate.py \
            tests/test_python_capability_cleanup_gate.py \
            scripts/bench_guard_native_phase_diagnostic.py \
            tests/test_native_performance_phase_diagnostic.py
          uv run --no-sync ruff format --check \
            src/codex_plugin_scanner/guard/native_runtime.py \
            src/codex_plugin_scanner/guard/native_runtime_binary.py \
            tests/test_native_runtime_binary_identity.py \
            scripts/ci/rust_io_ownership_gate.py \
            tests/test_rust_io_ownership_gate.py \
            tests/test_python_capability_cleanup_gate.py
          uv run --no-sync basedpyright --pythonversion 3.10 \
            src/codex_plugin_scanner/guard/native_runtime.py \
            src/codex_plugin_scanner/guard/native_runtime_binary.py
          uv run --no-sync pytest --tb=short \
            tests/test_native_runtime_binary_identity.py tests/test_rust_io_ownership_gate.py \
            tests/test_python_capability_cleanup_gate.py tests/test_guard_native_runtime.py \
            tests/test_hook_data_plane_ownership_gate.py \
            ci/native_runtime/test_native_runtime_manifest.py \
            tests/test_guard_native_release_gate_benchmark.py tests/test_native_performance_phase_diagnostic.py
      - name: Enforce native performance gates
        env:
          HOL_GUARD_NATIVE: force
          HOL_GUARD_NATIVE_BINARY: ${{ github.workspace }}/rust/target/release/hol-guard-runtime
        run: |
          uv run --no-sync python scripts/bench_guard_native_phase_diagnostic.py \
            --runtime "$HOL_GUARD_NATIVE_BINARY" \
            --warm-iterations 100 \
            --cold-iterations 3 \
            --json native-performance.json \
            --enforce
      - name: Publish aggregate benchmark evidence
        if: always()
        run: test ! -f native-performance.json || cat native-performance.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hol-guard-native-performance
          path: native-performance.json
          if-no-files-found: warn
      - name: Verify tracked source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          echo 'FRESH_HASH_TRACKED_SOURCE_UNCHANGED=true'
