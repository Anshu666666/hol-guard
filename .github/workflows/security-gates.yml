name: Temporary source scanner diagnostic
run-name: Exact-source scanner diagnostic on f5913d0
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-scanner-diagnostic:
    name: Closed finding metadata for one exact source scan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/hgp/diagnostic-scanner-findings-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.23"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install the unchanged pinned scanner
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Preserve diagnostic helper outside the scanned checkout
        run: cp scripts/ci/diagnose_gitleaks_findings.py "$RUNNER_TEMP/diagnose_gitleaks_findings.py"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: f5913d07652fb687dbac258bb5ee1200d26e5dee
          persist-credentials: false
          clean: true
      - name: Scan exact source and retain its exit status
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/bin/gitleaks
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: python "$RUNNER_TEMP/diagnose_gitleaks_findings.py"
