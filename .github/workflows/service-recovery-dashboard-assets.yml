name: Service recovery dashboard assets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/service-recovery-dashboard-assets.yml
      - dashboard/**
  push:
    branches:
      - feat/service-recovery

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: service-recovery-dashboard-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact pushed source commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Merge exact PR base sources for generated assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          PR_BASE_SHA="$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:feat/service-recovery" \
            --jq '.[].base.sha')"
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the exact open PR base SHA." >&2
            exit 1
          fi
          echo "PR_HEAD_SHA=$PR_HEAD_SHA" >> "$GITHUB_ENV"
          echo "PR_BASE_SHA=$PR_BASE_SHA" >> "$GITHUB_ENV"
          git fetch --no-tags origin "$PR_BASE_SHA"
          if git merge --no-commit --no-ff "$PR_BASE_SHA"; then
            echo "PR source merge completed without conflicts"
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            test -n "$conflicts"
            while IFS= read -r path; do
              case "$path" in
                src/codex_plugin_scanner/guard/daemon/static/assets/*) ;;
                *)
                  echo "Unexpected merge conflict outside generated assets: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
            echo "Only generated assets conflicted; the hosted build will regenerate them"
          fi
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install locked Dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and verify packaged Dashboard assets
        working-directory: dashboard
        shell: bash
        run: |
          set -euo pipefail
          bun run build
          assets=../src/codex_plugin_scanner/guard/daemon/static/assets
          test -s "$assets/guard-dashboard.js"
          test -s "$assets/chunks/home-dashboard.js"
          rg -q 'Open recovery' "$assets/chunks/home-dashboard.js"
          if rg -n '^(<<<<<<<|=======|>>>>>>>)' "$assets"; then
            echo "Generated Dashboard assets contain merge markers" >&2
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" add src/codex_plugin_scanner/guard/daemon/static/assets
          test -z "$(git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=U)"
          source_tree_sha="$(git -C "$GITHUB_WORKSPACE" write-tree)"
          test -n "$source_tree_sha"
          python3 -I - "$RUNNER_TEMP/service-recovery-dashboard-assets-metadata.json" \
            "$source_tree_sha" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata_path = Path(sys.argv[1])
          metadata_path.write_text(
              json.dumps(
                  {
                      "schema": "hol-guard-service-recovery-dashboard-assets.v1",
                      "prHeadSha": os.environ["PR_HEAD_SHA"],
                      "prBaseSha": os.environ["PR_BASE_SHA"],
                      "sourceTreeSha": sys.argv[2],
                      "dashboardLockfile": "dashboard/bun.lock",
                      "assetsPath": "src/codex_plugin_scanner/guard/daemon/static/assets",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          test -s "$RUNNER_TEMP/service-recovery-dashboard-assets-metadata.json"

      - name: Upload exact generated assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: service-recovery-dashboard-assets-${{ github.sha }}
          path: |
            src/codex_plugin_scanner/guard/daemon/static/assets/
            ${{ runner.temp }}/service-recovery-dashboard-assets-metadata.json
          if-no-files-found: error
          retention-days: 14
