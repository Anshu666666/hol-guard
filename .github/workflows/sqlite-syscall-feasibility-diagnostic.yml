name: Disposable SQLite syscall feasibility diagnostic

on:
  push:
    branches: [codex/rsp-sqlite-syscall-diagnostic]
    paths:
      - '.github/workflows/sqlite-syscall-feasibility-diagnostic.yml'
      - 'scripts/ci/run_sqlite_syscall_diagnostic.py'
      - 'scripts/probe_sqlite_syscall_observation.py'
      - 'scripts/sqlite_syscall_probe_child.py'
      - 'scripts/sqlite_syscall_probe_supervision.py'
      - 'scripts/sqlite_syscall_trace_diagnostics.py'
      - 'tests/test_sqlite_syscall_probe_parser.py'
      - 'tests/test_sqlite_syscall_hosted_diagnostic.py'
      - 'tests/test_sqlite_syscall_trace_diagnostics.py'

permissions:
  contents: read

concurrency:
  group: sqlite-syscall-feasibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Initialize retained diagnostic outcome
        shell: bash
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
          DIAGNOSTIC_RUN: ${{ github.run_id }}
          DIAGNOSTIC_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "sqlite-syscall-diagnostic"
          root.mkdir(mode=0o700)
          report = {"schema": "guard.sqlite-syscall-hosted-job.v1", "status": "not_run",
                    "cohort": "fresh_ubuntu_hosted_disposable", "rsp131_qualified": False,
                    "source_commit": os.environ["DIAGNOSTIC_SHA"],
                    "run_id": os.environ["DIAGNOSTIC_RUN"], "attempt": os.environ["DIAGNOSTIC_ATTEMPT"]}
          (root / "job-outcome.json").write_text(json.dumps(report, sort_keys=True) + "\n")
          PY
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install only the finite test runner
        run: python -m pip install --disable-pip-version-check pytest==9.0.3
      - name: Replay frozen parser and hosted boundary controls
        id: controls
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest --noconftest -p no:cacheprovider -c /dev/null -q
          tests/test_sqlite_syscall_probe_parser.py tests/test_sqlite_syscall_hosted_diagnostic.py
          tests/test_sqlite_syscall_trace_diagnostics.py
      - name: Run bounded unprivileged disposable probe
        id: diagnostic
        if: always()
        env:
          DIAGNOSTIC_SHA: ${{ github.sha }}
          FINITE_CONTROLS_STATUS: ${{ steps.controls.outcome }}
        run: >-
          python scripts/ci/run_sqlite_syscall_diagnostic.py
          --commit "$DIAGNOSTIC_SHA" --controls-status "$FINITE_CONTROLS_STATUS"
          --report "$RUNNER_TEMP/sqlite-syscall-diagnostic/diagnostic.json"
      - name: Retain finite job outcome even if setup or tracing fails
        if: always()
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
          FINITE_CONTROLS_STATUS: ${{ steps.controls.outcome }}
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "sqlite-syscall-diagnostic"
          path = root / "job-outcome.json"
          report = json.loads(path.read_text())
          report.update(status="finished", diagnostic_step=os.environ["DIAGNOSTIC_OUTCOME"],
                        finite_controls=os.environ["FINITE_CONTROLS_STATUS"],
                        normalized_probe_report_present=(root / "diagnostic.json").is_file())
          path.write_text(json.dumps(report, sort_keys=True) + "\n")
          PY
      - name: Upload normalized outcome only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sqlite-syscall-disposable-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-syscall-diagnostic/*.json
          if-no-files-found: error
          retention-days: 30
