name: PR2974 isolated RSP024 delivery contracts

on:
  push:
    branches: [codex/pr2974-rsp024-delivery-validation-20260920-v2]

permissions:
  contents: read

jobs:
  renderer-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Set evidence path after runner allocation
        run: echo "RSP024_EVIDENCE_DIR=$RUNNER_TEMP/rsp024-evidence" >> "$GITHUB_ENV"
      - name: Preserve raw Git bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.26"
      - name: Verify exact source and driver ancestry
        run: python scripts/ci/validate_pr2974_rsp024_delivery.py --bind-only
      - name: Install frozen development dependencies
        timeout-minutes: 10
        run: uv sync --frozen --extra dev --python 3.12
      - name: Run original renderer and contract controls
        run: .venv/bin/python scripts/ci/validate_pr2974_rsp024_delivery.py
      - name: Preserve original logs and JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rsp024-delivery-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rsp024-evidence
          if-no-files-found: error
          retention-days: 30
